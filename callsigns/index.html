<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0a0e27">
<title>Callsigns</title>
<style>
/* ============================================================
   CALLSIGNS — radio tycoon
   Palette shared with the station scene art:
   night #0a0e27/#1a1040 · amber #fbbf24 · magenta #ec4899 · cyan #22d3ee
   ============================================================ */
:root{
  --night:#0a0e27; --night2:#141a3a; --panel:#171d40; --panel2:#1e2550;
  --border:#2c3468; --border-lit:#3d4795;
  --amber:#fbbf24; --amber-dk:#f59e0b;
  --magenta:#ec4899; --cyan:#22d3ee; --green:#34d399; --red:#f87171;
  /* --dim used to be #5d6598, which measured ~3.0:1 on --panel and ~2.6:1 on
     --panel2 — under WCAG AA for the 9-12px labels it is used on, including
     the only "tap a slot" instruction in the game. This clears 4.5:1.
     Second pass, measured rather than eyeballed: #7b83b4 clears AA on --night
     (5.20:1) and on --panel (4.47:1 — already short) but only reaches 4.00:1
     on --panel2, which is the background of every .row, .slot and .seg-btn in
     the game. #868ec0 measures 6.01:1 on --night, 5.17:1 on --panel and
     4.63:1 on --panel2, so the worst case in the game now passes. The 9px
     type it was being used at was the other half of the problem — see the
     size bumps on .slot-meta/.slot-dj/.log-day/.pill/.delta below. */
  /* Voice-tracking's own hue, and it is deliberately NOT one of the four
     already in use. Green/amber/red carry coverage (is anybody on this slot)
     and cyan carries the host name; how the slot AIRS is a different question
     and needs a different channel, or a tracked-and-covered slot has to fight
     a tracked-and-exposed one for the same colour.
     Measured, not eyeballed: --magenta #ec4899 is the palette's nearest hue
     and lands at 4.15:1 on --panel2 (#1e2550), which is under AA for the 10-11
     px labels this is used on. #c4b5fd measures 10.29:1 on --night, 8.84:1 on
     --panel and 7.92:1 on --panel2, so it clears AA at every size it appears
     at, including the 10px .slot-mode pill. */
  --violet:#c4b5fd;
  --text:#e8ecff; --muted:#8b93c4; --dim:#868ec0;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  --r:14px; --r-sm:9px;
  --safe-b:env(safe-area-inset-bottom,0px);
  /* Explicit stacking layers. Every overlay in this file names one of these
     and nothing else sets a bare z-index, because the alternative is DOM
     order silently deciding which of two open overlays the player can see —
     the failure mode where a Help sheet opens *behind* a pause sheet,
     survives Resume and becomes a full-screen click trap over a running
     clock. There is deliberately only ONE modal host (#modal-back) and a
     queue behind it (see openModal), so two modals cannot be open at once at
     all; if a second host is ever added it takes its own --z var here. */
  --z-scene:0; --z-screen:1; --z-chrome:5; --z-modal:50; --z-toast:70;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--night); color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:15px; line-height:1.45; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:var(--z-scene);
  background:
    radial-gradient(ellipse 70% 50% at 15% 0%,rgba(236,72,153,.10),transparent 60%),
    radial-gradient(ellipse 70% 50% at 85% 100%,rgba(34,211,238,.09),transparent 60%);
}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;cursor:pointer;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- screen router ---------- */
.screen{position:fixed;inset:0;z-index:var(--z-screen);display:none;flex-direction:column;}
.screen.active{display:flex;}

/* ---------- main menu ---------- */
#screen-menu{align-items:center;justify-content:center;padding:24px;overflow-y:auto;}
.menu-box{width:100%;max-width:420px;text-align:center;padding:20px 0;position:relative;z-index:1;}
/* The menu shows the game's own station art behind the logo — boot() injects
   the tier the save is sitting on (or the Broadcast Tower for a fresh start).
   Purely decorative, so it never takes a pointer event or a focus stop. */
.menu-scene{
  position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  z-index:0;pointer-events:none;
}
.menu-scene-art{opacity:.35;}
.menu-scene::after{
  content:'';position:absolute;inset:-2px;
  background:radial-gradient(ellipse 72% 82% at 50% 50%,rgba(10,14,39,0) 22%,var(--night) 84%);
}
.logo-mark{
  font-size:11px;letter-spacing:5px;color:var(--cyan);text-transform:uppercase;
  margin-bottom:6px;font-weight:700;
}
.logo{
  font-size:clamp(44px,13vw,68px);font-weight:900;letter-spacing:-2px;line-height:1;
  background:linear-gradient(135deg,var(--amber),var(--magenta) 55%,var(--cyan));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:10px;
}
.tagline{color:var(--muted);font-size:13px;margin-bottom:8px;}
.onair-badge{
  display:inline-flex;align-items:center;gap:7px;margin-bottom:28px;
  border:1px solid rgba(251,191,36,.4);background:rgba(251,191,36,.08);
  color:var(--amber);border-radius:20px;padding:5px 14px;
  font-size:10px;font-weight:800;letter-spacing:2px;
}
.onair-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);}
@media (prefers-reduced-motion:no-preference){
  .onair-dot{animation:pulseDot 1.8s ease-in-out infinite;}
  @keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
}
.menu-btns{display:flex;flex-direction:column;gap:11px;}
.mbtn{
  width:100%;padding:16px;border-radius:var(--r);font-weight:700;font-size:16px;
  background:var(--panel);border:1px solid var(--border);color:var(--text);
  transition:transform .12s,border-color .18s,background .18s;
  min-height:54px;
}
.mbtn:hover:not(:disabled),.mbtn:active:not(:disabled){background:var(--panel2);border-color:var(--border-lit);}
.mbtn:active:not(:disabled){transform:scale(.98);}
.mbtn:disabled{opacity:.35;cursor:not-allowed;}
.mbtn.primary{
  background:linear-gradient(135deg,var(--amber-dk),var(--magenta));
  border-color:transparent;color:#fff;
  box-shadow:0 6px 22px rgba(236,72,153,.28);
}
.mbtn.primary:hover,.mbtn.primary:active{filter:brightness(1.1);}
.menu-foot{margin-top:22px;font-size:11px;color:var(--dim);}

/* ---------- top HUD ---------- */
.hud{
  flex-shrink:0;background:rgba(10,14,39,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding-top:env(safe-area-inset-top,0px);
}
.hud-row{display:flex;align-items:center;gap:10px;padding:7px 12px;}
/* 38x38 shipped here and 38 is not a touch target — the ☰ button is the ONLY
   pointer route to Save / Settings / Main Menu, so it was the single most
   expensive under-sized control in the game. 44x44 exactly, which is also the
   height of the station chips beside it. */
.hud-btn{
  flex-shrink:0;width:44px;height:44px;border-radius:11px;
  background:var(--panel);border:1px solid var(--border);
  display:grid;place-items:center;font-size:18px;
  transition:background .15s,border-color .15s;
}
.hud-btn:hover,.hud-btn:active{background:var(--panel2);border-color:var(--border-lit);}
.station-id{flex:1;min-width:0;}
.station-call{
  font-weight:900;font-size:17px;letter-spacing:1px;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.station-sub{font-size:10px;color:var(--muted);letter-spacing:.5px;}
.day-chip{
  flex-shrink:0;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--cyan);
  background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.3);
  border-radius:8px;padding:4px 9px;text-transform:uppercase;
}
.pause-chip{
  flex-shrink:0;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--amber);
  background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);
  border-radius:8px;padding:4px 9px;
}
/* ---------- station switcher ----------
   The empire caps at 4 stations (DESIGN.md, owner scope: DEEP), so this is a
   fixed strip rather than a dropdown: a picker that hides three of four
   callsigns behind a tap would bury the thing the whole overhaul is about.
   It still scrolls horizontally, because the "+ Found" chip makes five boxes
   at 320px and a scroll is better than four illegible ones.
   The exposure badge is the point of the strip — a live count of uncovered
   slots per station, in colour, so "which station is bleeding" is answered
   without switching to it. Text alone would make the player read four chips
   instead of glancing at one. */
.st-bar{
  display:flex;gap:6px;padding:0 10px 8px;overflow-x:auto;overscroll-behavior-x:contain;
  scrollbar-width:none;-ms-overflow-style:none;
}
.st-bar::-webkit-scrollbar{display:none;}
.st-bar:empty{display:none;}
.st-chip{
  flex:1 0 auto;min-width:74px;min-height:44px;padding:5px 10px;border-radius:11px;
  background:var(--panel);border:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  position:relative;transition:border-color .15s,background .15s;
}
.st-chip.on{background:var(--panel2);border-color:var(--amber);}
.st-chip-call{font-size:13px;font-weight:900;letter-spacing:.6px;line-height:1.1;}
.st-chip.on .st-chip-call{color:var(--amber);}
.st-chip-sub{font-size:10px;color:var(--dim);line-height:1.1;}
.st-chip-dot{
  position:absolute;top:4px;right:5px;min-width:16px;height:16px;padding:0 4px;
  border-radius:9px;font-size:10px;font-weight:800;line-height:16px;text-align:center;
}
.st-chip-dot.exposed{background:var(--red);color:#2a0808;}
.st-chip-dot.risk{background:var(--amber);color:#2a1c00;}
.st-chip-dot.ok{background:var(--green);color:#062018;}
.st-chip.add{border-style:dashed;min-width:62px;color:var(--cyan);}
.st-chip.add .st-chip-call{color:var(--cyan);font-size:17px;}

/* ---------- pre-cliff warning bar ----------
   "Am I about to run out of money" and "what is blocking me" are the two
   questions this game's player actually has, and both used to be answered by
   11px prose one scroll down inside the Studio tab. This lives in the HUD,
   above the fold, on every tab, and it fires on RUNWAY — days of cash left at
   the current burn — not on the sign of the balance. A readout that turns red
   once cash is already negative is reporting a decision the player can no
   longer make. */
/* It is a button — it jumps to the tab that answers it — so it is 44px like
   every other control, not the 38px strip it looked like it wanted to be. */
.hud-warn{
  display:flex;align-items:center;gap:8px;padding:7px 12px;
  border-top:1px solid var(--border);font-size:12px;font-weight:700;
  text-align:left;width:100%;min-height:44px;
}
.hud-warn[hidden]{display:none;}
.hud-warn.warn{background:rgba(251,191,36,.11);color:var(--amber);}
.hud-warn.bad{background:rgba(248,113,113,.13);color:var(--red);}
.hud-warn .hw-ico{font-size:14px;flex-shrink:0;}
.hud-warn .hw-txt{flex:1;min-width:0;}

.stats-strip{display:flex;border-top:1px solid var(--border);}
.stat{
  flex:1;min-width:0;padding:8px 6px;text-align:center;
  border-right:1px solid var(--border);
}
.stat:last-child{border-right:none;}
.stat-val{
  display:block;font-size:16px;font-weight:800;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:tabular-nums;
}
.stat-lbl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.9px;margin-top:1px;}
.stat.cash .stat-val{color:var(--green);}
.stat.listeners .stat-val{color:var(--cyan);}
.stat.rep .stat-val{color:var(--amber);}
/* Cash is the number the player is actually asking about, so it is the only
   stat that gets a second line: how many days of it are left. The colour is
   driven by runway, not by sign. */
.stat.cash .stat-val.warn{color:var(--amber);}
.stat.cash .stat-val.bad{color:var(--red);}
.stat-lbl .runway{font-weight:800;letter-spacing:.4px;}
.stat-lbl .runway.warn{color:var(--amber);}
.stat-lbl .runway.bad{color:var(--red);}
/* 9px was under every readable floor for a two-character number with a sign
   glyph in front of it. */
.delta{font-size:10px;font-weight:700;margin-left:3px;}
.delta.up{color:var(--green);} .delta.down{color:var(--red);}

/* ---------- content area ---------- */
.content{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 12px 20px;}
.tabpane{display:none;} .tabpane.active{display:block;}
.wrap{max-width:940px;margin:0 auto;}

/* ---------- cards ---------- */
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r);
  padding:14px;margin-bottom:12px;
}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px;}
.card-title{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);}
.card-note{font-size:11px;color:var(--dim);}

/* ---------- scene banner ---------- */
.scene-wrap{margin-bottom:12px;position:relative;}
.scene-caption{
  position:absolute;left:10px;bottom:10px;z-index:5;
  background:rgba(10,14,39,.8);backdrop-filter:blur(6px);
  border:1px solid var(--border-lit);border-radius:8px;padding:5px 11px;
  font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--amber);
}
.scene-fallback{
  width:100%;aspect-ratio:16/5;border-radius:12px;
  background:linear-gradient(160deg,#0a0e27,#1a1040);
  border:1px solid var(--border);display:grid;place-items:center;
  color:var(--dim);font-size:12px;
}

/* ---------- schedule grid ---------- */
.sched{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
@media (max-width:560px){.sched{grid-template-columns:repeat(2,1fr);}}
/* .slot and .row are <button> elements so the schedule — the core mechanic —
   is reachable by keyboard; the font/width/align resets keep them looking
   exactly like the divs they used to be. */
.slot{
  background:var(--panel2);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:10px 8px;text-align:center;transition:border-color .18s,transform .12s;
  min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  width:100%;font:inherit;color:inherit;
}
.slot:hover,.slot:active{border-color:var(--border-lit);}
.slot:active{transform:scale(.98);}
/* Slot state is a border colour and a corner badge as well as words. Four
   toasts with different border colours is the player reading; a slot that is
   visibly red because nobody is in the booth is the player playing. */
.slot.exposed{border-color:rgba(248,113,113,.55);background:rgba(248,113,113,.06);}
.slot.risky{border-color:rgba(251,191,36,.5);}
.slot-part{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-weight:700;}
.slot-icon{font-size:24px;line-height:1;}
.slot-show{font-size:12px;font-weight:800;}
/* 9px on --muted was the smallest information text in the game and it carried
   the DJ name. 11px; the colour was never the problem here. */
.slot-meta{font-size:11px;color:var(--muted);line-height:1.25;}
.slot-dj{font-size:11px;color:var(--cyan);line-height:1.25;}
.slot-load{
  font-size:10px;font-weight:800;letter-spacing:.4px;
  display:inline-flex;align-items:center;gap:4px;
}
.slot-load.ok{color:var(--green);} .slot-load.warn{color:var(--amber);} .slot-load.bad{color:var(--red);}
.slot-badge{
  position:absolute;top:6px;right:6px;font-size:11px;line-height:1;
}
.slot{position:relative;}
/* Voice-tracked, on the tile. Three signals at once and none of them is the
   coverage colour: a dashed edge (shape), violet (colour) and a labelled pill
   (word). A player with four stations reads their whole board off this grid,
   so a mode visible only inside the editor would be sixteen sheets of audit. */
.slot.tracked{border-style:dashed;border-color:rgba(196,181,253,.6);}
.slot-mode{
  font-size:10px;font-weight:800;letter-spacing:.6px;color:var(--violet);
  border:1px solid rgba(196,181,253,.35);border-radius:6px;padding:1px 6px;
  text-transform:uppercase;line-height:1.4;
}

/* ---------- empire coverage matrix ----------
   The core decision surface, and the reason the switcher above is not enough:
   morning drive happens at 6 AM on every station at once, so "who is exposed
   right now" is a question about a grid, not about the station you happen to
   be looking at. Rows are stations, columns are dayparts, one glance. Every
   cell is a button that jumps straight into that slot's editor, so the
   overview is also the control surface.
   Cells are 44px tall; at 4 stations x 4 dayparts that is 176px of grid,
   which is the whole point of the 4-station cap. */
.cov{display:grid;gap:4px;}
.cov-head{
  display:grid;gap:4px;grid-template-columns:52px repeat(4,1fr);
  font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;font-weight:700;
}
.cov-head span{text-align:center;padding-bottom:2px;}
.cov-head span:first-child{text-align:left;}
.cov-row{display:grid;gap:4px;grid-template-columns:52px repeat(4,1fr);align-items:stretch;}
.cov-call{
  display:flex;align-items:center;font-size:11px;font-weight:900;letter-spacing:.4px;
  color:var(--muted);white-space:nowrap;overflow:hidden;
}
.cov-row.on .cov-call{color:var(--amber);}
.cov-cell{
  min-height:44px;border-radius:8px;border:1px solid var(--border);
  background:var(--panel2);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;
  font:inherit;color:inherit;padding:2px;
}
.cov-cell .cc-ico{font-size:14px;line-height:1;}
.cov-cell .cc-sub{font-size:9px;font-weight:800;letter-spacing:.3px;line-height:1;}
.cov-cell.covered{border-color:rgba(52,211,153,.45);}
.cov-cell.covered .cc-sub{color:var(--green);}
.cov-cell.risky{border-color:rgba(251,191,36,.55);background:rgba(251,191,36,.08);}
.cov-cell.risky .cc-sub{color:var(--amber);}
.cov-cell.exposed{border-color:rgba(248,113,113,.55);background:rgba(248,113,113,.09);}
.cov-cell.exposed .cc-sub{color:var(--red);}
/* Tracked rides on top of whichever coverage state the cell is in, because the
   two are independent: a tracked slot can be covered, risky or exposed and the
   grid has to be able to say both at once. Dashed edge + corner glyph, so it
   never has to take the border colour away from the coverage state. The cell
   keeps its 44px floor — position:relative is the only geometry change. */
.cov-cell{position:relative;}
.cov-cell.tracked{border-style:dashed;border-color:rgba(196,181,253,.65);}
.cc-mode{position:absolute;top:2px;right:3px;font-size:9px;line-height:1;opacity:.95;}
.cov-legend{
  display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:11px;color:var(--muted);
}
.cov-legend i{
  display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px;
}
.cov-legend i.covered{background:var(--green);}
.cov-legend i.risky{background:var(--amber);}
.cov-legend i.exposed{background:var(--red);}
/* Not a coverage state — a mode. Drawn as an outline rather than a fill so the
   legend says the same thing the cell does: this rides on top of the three
   above, it does not replace them. */
.cov-legend i.tracked{background:transparent;border:1px dashed var(--violet);width:11px;height:11px;}
/* The fourth state the bay matrix has, which coverage does not: a room with
   people in it that is measured at $0/day. Grey, because it is not a fault —
   it is a room doing exactly what it can do, which happens to be nothing. */
.cov-legend i.inert{background:var(--dim);}

/* ---------- building programme: the bay strip ----------
   §7 readout #1: ONE grid, never six per-bay panels. Rows are bays — the thing
   you buy and pay a rising lease on — and the cell IS the room in it.

   THE CALLSIGN COLUMNS ARE GONE (rooms v3). Every room is sited in the
   BUILDING now: one chief engineer covers every rack, one traffic desk builds
   one log for the group, and production capacity is pooled across the signals
   by headroom. A grid with a room sitting under exactly one callsign was
   drawing a claim the simulation had stopped making — and content.js says so
   on the card itself ("Nothing in here belongs to a single callsign").

   RE-MEASURED IN A HEADLESS BROWSER at four callsigns, four bays, three rooms:

     320px viewport — cell 225.00 x 48.00, grid 220.50 tall, overflowX 0
     390px viewport — cell 268.00 x 48.00, grid 224.50 tall, overflowX 0

   against 54.00 x 48.00 for the same card before this pass. Nothing on the tab
   measures under 44px on either axis at either width (checked by walking every
   button in #pane-build, not by eye). The width is what bought the row: the old
   54px cell could hold an icon and one number, and which room it was and what
   it returned were reachable only through the aria-label or by opening the
   sheet. 225px carries the name, the meter, the points against the ceiling and
   the measured return, at 48px, on one line each.

   HEIGHT: 220.50 at four bays, so a row pitch of 51 (48 + 3px gap) and about
   325px at the six-bay cap — the same order as the four-column version it
   replaces (322.5 at six rows), on a 760px phone that also carries a HUD and a
   tab bar. Rows are exactly the bays, and no row can appear without a lease
   beside it.

   There are no non-control spans left in the grid at all: the "this bay is not
   pointed at this callsign" cell was the only one, and it went with the
   columns. Every cell in the strip is a button. */
/* ---------- the cutaway: marks, figures, and the motion budget ----------
   Canon: DESIGN_PROOF_ROOMS_VISUAL.md §5. Built by art-and-feel against the
   SVG factory in js/fx.js; the SVGs carry a viewBox and currentColor and
   deliberately carry NO width, height or colour of their own, so everything
   that decides how big and what hue they are is in this block.

   The whole motion budget: transform and opacity only, 2.4-3.2s cycles,
   under 3px of travel, staggered per seat off --seat-i, a hard ceiling of 18
   moving elements, and every animation inside
   @media (prefers-reduced-motion: no-preference). */

/* ---- sizing ---- */
.cut-mark{flex:none;width:22px;height:22px;line-height:0;color:var(--muted);}
.cut-mark>svg{display:block;width:100%;height:100%;}
/* The mark stays --muted in every state ON PURPOSE. A room's type is a
   constant and its state is not; painting the Rack Room's mark red on the
   floor that is over its ceiling means the same room appears in two colours
   down one strip and the player has to re-identify it. The border, the wash,
   the figures and the ⚠ carry `over` four times over already. The one
   exception is the empty bay, which is cyan because the whole control is. */
.cut-cell.open .cut-mark{color:var(--cyan);}

.cut-seats{display:flex;align-items:flex-end;gap:3px;flex:none;line-height:0;}
.cut-fig{display:block;flex:none;width:16px;height:22px;line-height:0;
  color:var(--green);transform-origin:50% 100%;}
.cut-fig>svg{display:block;width:100%;height:100%;}

/* The four cell states own the figure's hue exactly as they already own the
   border, so the picture restates nothing and invents nothing. Colour is
   never alone: idle keeps its border and its ⚠, and an empty seat is a
   different SHAPE — hollow and dashed where every staffed figure is a solid
   mass — so the floor still reads with the hue thrown away.

   MEASURED, not eyeballed (canon §6). On --panel2 the figures land at
   green 7.61:1, amber-on-its-own-wash 7.66:1, red-on-its-own-wash 4.68:1,
   zeroed grey 4.63:1 and the mark's --muted at 4.92:1 — all clear of the
   3:1 a graphical object needs. The ghost was the one that failed: --dim at
   70% opacity measured exactly 3.00:1, which is the boundary and therefore
   not a pass. It is 85% (3.74:1) for that reason and no other. */
.cut-cell.filled.idle   .cut-fig{color:var(--amber);}
.cut-cell.filled.over   .cut-fig{color:var(--red);}
.cut-cell.filled.zeroed .cut-fig{color:var(--dim);}
.cut-cell .cut-fig.ghost{color:var(--dim);opacity:.85;}
/* A GHOST IS AN EMPTY CHAIR AND IT IS NEVER THE COMPLAINT. The three state
   rules above are (0,4,0) and the bare ghost rule is (0,3,0), so `over` and
   `zeroed` were painting their vacant seats in the working figures' colour —
   alarm-red on an over-ceiling floor, which reads as "this empty chair is what
   is wrong" when an empty chair is the one thing on that floor that is not.
   Idle keeps amber on purpose: there, the empty chairs ARE the state. */
.cut-cell.filled.idle   .cut-fig.ghost{color:var(--amber);opacity:.85;}
.cut-cell.filled.over   .cut-fig.ghost{color:var(--dim);opacity:.85;}
.cut-cell.filled.zeroed .cut-fig.ghost{color:var(--dim);opacity:.85;}

/* ---- the motion ----
   MOTION IS THE STATE: a staffed floor's figures work, an unstaffed floor is
   perfectly still. It is never the ONLY carrier of that state (canon §5) —
   an idle floor keeps its amber border, its ⚠ and its three dashed ghosts,
   all of which survive `reduce`, a screenshot, and a colourblind player.

   Three cycles, not one, because three seats running the same curve at three
   delays still read as a chorus line. 2.4s / 2.8s / 3.2s share no short
   common multiple, so a floor's seats drift apart and stay apart.

   Every keyframe touches transform ONLY. Peak travel is 1.9px of lift plus
   1.9deg of sway about the feet, which at a 22px lever adds 0.73px at the
   head — 2.6px worst case, inside the 3px budget. */
@media (prefers-reduced-motion: no-preference){
  @keyframes cutWork{
    0%,100%{transform:translateY(0) rotate(0deg);}
    38%{transform:translateY(-1.4px) rotate(-1.6deg);}
    72%{transform:translateY(-0.5px) rotate(1.1deg);}
  }
  @keyframes cutWork2{
    0%,100%{transform:translateY(0) rotate(0.9deg);}
    44%{transform:translateY(-1.1px) rotate(-1.9deg);}
    76%{transform:translateY(-1.8px) rotate(0.4deg);}
  }
  @keyframes cutWork3{
    0%,100%{transform:translateY(-0.3px) rotate(-1.1deg);}
    33%{transform:translateY(-1.9px) rotate(1.4deg);}
    68%{transform:translateY(-0.7px) rotate(-0.6deg);}
  }
  /* A NEGATIVE delay, so the stagger is already in effect on the first
     painted frame. A positive one would show three synchronised figures for
     up to a second and a half every time the tab re-renders. */
  .cut-cell.filled .cut-fig:not(.ghost){
    animation:cutWork 2.8s ease-in-out infinite;
    animation-delay:calc(var(--seat-i,0) * -0.73s);
  }
  .cut-cell.filled .cut-fig:not(.ghost):nth-child(2){animation-name:cutWork2;animation-duration:3.2s;}
  .cut-cell.filled .cut-fig:not(.ghost):nth-child(3){animation-name:cutWork3;animation-duration:2.4s;}

  /* DESYNC BETWEEN FLOORS, off a real index rather than nth-child parity.
     The first version keyed on :nth-child(even) and was written as
     "best-effort, may match nothing". Measured, it was worse than nothing: a
     .fold is interleaved after every floor that HOLDS a room, so parity
     tracked "has a room" rather than position, every animating floor matched,
     all four took the same -0.41s, and the building stayed in exact lockstep
     column by column. ui.js now emits --floor-i (the bay number) on each
     .cut-floor, which is the one value that cannot drift with the folds.

     AND THE SELECTOR WEIGHT IS AGAIN THE WHOLE RULE. Written first as
     `.cut-cell .cut-fig:not(.ghost)` — (0,3,0) — it lost silently to the
     (0,4,0) base rule above and the floor term never applied at all: measured,
     every floor still read 0s / -0.73s / -1.46s. Same trap, same block, second
     time in one pass. This matches the base rule's weight exactly and sits
     after it, which is the only arrangement that actually wins. */
  .cut-cell.filled .cut-fig:not(.ghost){
    animation-delay:calc(var(--seat-i,0) * -0.73s + var(--floor-i,0) * -0.19s);
  }

  /* THE CEILING, ENFORCED IN CSS RATHER THAN TRUSTED. 6 bays x ROOM_SEATS 3
     is 18, and 18 is the budget. If ROOM_SEATS is ever raised, the extra
     seats render and hold still instead of quietly doubling the compositor
     load on a phone.

     THE SELECTOR WEIGHT IS THE WHOLE RULE, and the first draft got it wrong:
     `.cut-fig:nth-child(n+4)` is (0,2,0) and loses to the (0,4,0) of
     `.cut-cell.filled .cut-fig:not(.ghost)` — :not() contributes its
     argument's specificity. A five-seat floor animated all five and nothing
     said so. Broken deliberately and re-measured (vault rule 5): five seats
     rendered, three animating. Do not lower these selectors. */
  .cut-cell.filled .cut-fig:not(.ghost):nth-child(n+4){animation:none;}

  /* Stillness is the signal for idle, and a ghost is never working. Both
     stated at a weight that beats the rule above, so neither can be switched
     back on by an ordering accident later. */
  .cut-cell.filled.idle .cut-fig:not(.ghost){animation:none;}
  .cut-cell.filled .cut-fig.ghost{animation:none;}
  /* ZEROED HOLDS STILL TOO, and this rule is half of a pair — ui.js sends
     roleFigure() the 'still' pose for exactly this class. People are present
     and the room returns $0/day, so the figures stand there; that is a third
     legible state rather than a fourth colour. An OVER-ceiling floor is NOT
     this: its people are working flat out, which is WHY the points spill. */
  .cut-cell.filled.zeroed .cut-fig:not(.ghost){animation:none;}

  /* OPTIONAL, and easy to drop: 140ms of settle on the tap. An instant state
     change reads as cheap; this is the only non-idle motion in the block and
     it is still transform-only. */
  .cut-cell{transition:transform .14s cubic-bezier(.2,.8,.3,1.2);}
  .cut-cell:active{transform:scale(.975);}
}

/* ============================================================
   THE CUTAWAY ELEVATION — the building programme, drawn
   ============================================================
   Replaced the .bay-grid / .bay-row / .bay-lbl / .bay-cell ledger block, which
   is deleted — as are its overrides in the 320 and landscape queries. The six
   .bc-* rules that block also carried are repeated at the bottom of this one,
   which is now their only declaration.

   WHAT THE PICTURE PROMISES (canon §1): floors stacked in one building, in
   the order they were bought. Not a floorplan — no adjacency, because the
   simulation has none. Bay 1 is the ground floor and the DOM is reversed by
   ui.js, never here: `column-reverse` would flip the paint and leave focus
   order and screen-reader order running up the building while the eye runs
   down it.

   MEASURED IN HEADLESS CHROME, worst case (4 callsigns, 5 rooms, 6 bays, a
   mid-game $12,480 in every cell so the money column is at full width):

     390px  floor cell 276.00 x 48.00   pitch 51   six-floor stack 318.00
     320px  floor cell 230.00 x 48.00   pitch 51   six-floor stack 318.00
     landscape 760x360  cell 652.00 x 44.00  pitch 47  stack 294.00

   overflowX 0 at all three, and nothing on #pane-build measures under 44px on
   either axis (checked by walking every visible button, not by eye). The old
   strip measured 328.00 at 390 and, at 320, produced a 239.20px cell inside a
   225px track — it overflowed its own grid column. This one is exact.        */

:root{
  /* 56 -> 48 (46 -> 40 at 320). The gutter carries a floor number over a
     lease and nothing else; the width it gives back goes to the room's name,
     which is the one string in the cell that says which room this is. */
  --bay-gutter:48px;
  /* THE THREE CROSS-BUILDER BUDGETS. art-and-feel sizes .cut-mark and
     .cut-fig FROM THESE, not from literals, because the floor pitch is 48px
     and it is these two boxes that decide whether it stays 48. --seat-w is
     derived from the figure's own 16x22 viewBox (8/11). It is a belt-and-braces
     width, NOT the thing that keeps a seat square: measured by forcing it
     invalid, the figure stays 14.53px either way, because --seat-h plus the
     SVG's intrinsic ratio already does that job. Keep it, do not rely on it. */
  --mark-sz:22px;
  --seat-h:20px;
  --seat-w:calc(var(--seat-h) * 8 / 11);
  /* --dim, lifted, for ONE use: see .bc-val.zero below. Measured on every bed
     it can land on — 5.95:1 on --panel2, 5.20:1 on the idle wash, 5.27:1 on
     the over wash, 6.64:1 on --panel — against --dim #868ec0's 4.05:1 and
     4.10:1 on those same two washes, which is under the 4.5:1 AA floor for
     an 11px figure. */
  --dim-lit:#9aa3d2;
}

.cutaway{display:grid;gap:3px;}
/* A rate card opens between two floors, in the same single-column grid, which
   already supplies the 3px gap. */
.cutaway>.fold{margin-top:0;}
.cut-floor{display:grid;gap:4px;align-items:stretch;}

/* The gutter: the floor number over what that floor costs to keep. Same two
   values and the same two type sizes as the bay index it replaces. 10px, not
   9, for the lease: --dim on --panel measures 5.17:1, which passes AA at this
   size. */
.cut-num{display:flex;flex-direction:column;justify-content:center;line-height:1.1;overflow:hidden;}
.cut-num b{font-size:13px;font-weight:900;color:var(--muted);}
.cut-num i{font-size:10px;font-style:normal;color:var(--dim);font-variant-numeric:tabular-nums;}

/* ---- the floor itself ----
   .cut-slab IS THIS RULE'S border-bottom, and it is deliberately not an
   element: a 2px div between two buttons is one more node for a screen reader
   to step over and one more thing for a hit test to miss. Thickened to 2px in
   the cell's own state colour, so the slab doubles the weight of whichever of
   the four states this floor is in rather than introducing a fifth line the
   player has to learn. */
.cut-cell{
  position:relative;min-height:48px;overflow:hidden;
  border:1px solid var(--border);border-bottom-width:2px;border-radius:8px;
  background:var(--panel2);
  display:flex;flex-direction:row;align-items:stretch;justify-content:flex-start;
  gap:6px;padding:4px 8px 5px;text-align:left;
  font:inherit;color:inherit;
}
/* THE FOUR STATES, UNCHANGED — same selectors, same rgba, same thresholds.
   Green is a working room, AMBER is a room with nobody in it, GREY is a room
   with people in it measured at $0/day, RED is a room throwing points away.
   The legend under the stack matches these exactly and must keep matching. */
.cut-cell.filled{border-color:rgba(52,211,153,.45);}
.cut-cell.filled.idle{border-color:rgba(251,191,36,.55);background:rgba(251,191,36,.07);}
.cut-cell.filled.over{border-color:rgba(248,113,113,.6);background:rgba(248,113,113,.09);}
.cut-cell.filled.zeroed{border-color:rgba(134,142,192,.45);}
.cut-cell.filled.zeroed .bc-meter i{background:var(--dim);}
.cut-cell.filled.idle  .bc-meter i{background:var(--amber);}
/* A bay with no room in it: a bare slab, leased and standing. */
.cut-cell.open{
  border-style:dashed;border-color:rgba(34,211,238,.42);color:var(--cyan);
  font-size:18px;font-weight:800;background:transparent;
  align-items:center;padding:6px 9px;gap:8px;
}
.cut-cell.open .bc-name{color:var(--cyan);font-weight:700;white-space:normal;}

/* ---- what stands on the floor ----
   mark bottom-left, name filling the middle, money over the people on the
   right, all three sitting on the slab. PLACEMENT ONLY on .cut-mark: its
   paint, its stroke and its motion are art-and-feel's. */
/* BOX ONLY — art-and-feel owns everything drawn inside it. The size is here
   because the 48px pitch depends on it and because the emoji fallback (a
   build served without fx.js) needs a font-size, which is not a paint rule. */
.cut-mark{
  display:block;flex:none;width:var(--mark-sz);height:var(--mark-sz);
  font-size:15px;line-height:var(--mark-sz);
}
.cut-cell>.cut-mark{align-self:flex-end;}
.cut-cell>.bc-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;}
.cut-cell>.bc-side{
  flex:none;align-self:stretch;display:flex;flex-direction:column;
  align-items:flex-end;justify-content:center;gap:2px;
}
/* CONTRAST, MEASURED, NOT NUDGED. --muted #8b93c4 is 4.92:1 on --panel2 and
   passes — but the idle and over cells wash --panel2 with amber .07 and red
   .09, which composite to #2d304d and #322c53, and --muted lands at 4.31:1
   and 4.36:1 there. 12px at weight 800 is not WCAG "large text" (that starts
   at 18.66px bold), so the floor is 4.5:1 and both fail. The room's name is
   the one string that says which room this is, so it goes to --text #e8ecff:
   12.45:1 on --panel2, 10.89:1 on the idle wash, 11.03:1 on the over wash.
   The colour changed because the colour was the problem; the SIZE is fine. */
.cut-cell .bc-name{color:var(--text);}
.cut-cell .bc-val{line-height:1.15;}
/* Same arithmetic, one line down: --dim at 4.05:1 / 4.10:1 on those two
   washes, and a room CAN be over-ceiling and worth $0 at once (a Rack Room on
   a Part 15 rig is exactly that), so this pairing is reachable. --dim-lit
   keeps the grey channel and clears AA — see :root. */
.cut-cell .bc-val.zero{color:var(--dim-lit);}
/* The seat cluster. margin-top:auto puts the figures on the slab with the
   money above them whatever else is in the column, including nothing (a build
   with no fx.js emits no cluster at all and the money simply centres). The
   fixed height is the pitch guard: a figure taller than the budget overflows
   upward instead of growing the row to 50px and breaking the stack. */
.cut-seats{display:flex;align-items:flex-end;gap:1px;height:var(--seat-h);margin-top:auto;}
.cut-seats>*{flex:none;width:var(--seat-w);height:var(--seat-h);}
.cut-seats svg,.cut-mark svg{display:block;width:100%;height:100%;}
/* THE ⚠ IS ABSOLUTE, AND THAT IS A MEASUREMENT. In the right-hand column it
   cost the room's name 54px at 320 — "Production Room — WZOD" needs 139px and
   had 81. Up here it costs nothing, it lands in the empty space above the
   bottom-aligned mark, and it is in the same place on every floor, which is
   what lets the eye scan a stack for it instead of hunting each cell. */
.cut-cell>.bc-flag{position:absolute;top:2px;left:8px;line-height:1;pointer-events:none;}
.cut-cell.filled.over>.bc-flag{color:var(--red);}
/* The fill meter is the floor of the cell: full width, on the slab, under
   everyone's feet. Same green/amber/red/grey it always had. */
.cut-cell>.bc-meter{position:absolute;left:0;right:0;bottom:0;width:auto;height:3px;border-radius:0;}

/* ---- marks OUTSIDE the cutaway ----
   ui.js now routes roomMark() into three more HTML-rendering surfaces (the
   rate-card art, the coach card and the room picker). fx's SVG carries no
   width/height by design, so both containers have to size it or a 22x22 mark
   fills the box: .rcard-art rendered it at 46x46 and pushed .rcard-body from
   46px to 66px until this rule existed. The three toast() call sites and the
   Daily Brief chip keep the EMOJI and must not be routed — see the header on
   uiRoomIcon() in js/ui.js. */
.rcard-art svg{display:block;width:30px;height:30px;margin:0 auto;}
.row-icon svg{display:block;width:22px;height:22px;}

/* ---- carried over from the deleted .bay-* block, unchanged ----
   These six are not bay-scoped and the cutaway still emits every one of them.
   Include them only if you delete the old block; they are byte-identical. */
.bc-name{
  font-size:12px;font-weight:800;line-height:1.15;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.bc-side{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none;}
.bc-val{font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;}
.bc-val.up{color:var(--green);} .bc-val.down{color:var(--red);} .bc-val.zero{color:var(--dim);}
.bc-ico{font-size:15px;line-height:1;}
.bc-meter{width:100%;height:4px;border-radius:2px;background:rgba(0,0,0,.4);display:flex;overflow:hidden;}
.bc-meter i{display:block;height:100%;background:var(--green);}
.bc-meter b{display:block;height:100%;background:var(--red);}
.bc-flag{font-size:11px;line-height:1;color:var(--amber);}

/* ---- 320px ---- */
@media (max-width:359px){
  :root{ --bay-gutter:40px; --mark-sz:20px; }
  .cut-cell{padding:4px 6px 5px;gap:3px;}
  .cut-cell.open{padding:6px 7px;gap:6px;}
  .cut-cell>.bc-flag{left:5px;}
  .cut-num b{font-size:12px;}
  .bc-name{font-size:11px;}
}
/* ---- landscape ----
   44px is the floor and the padding gives, not the target. Measured 45.64px
   before .bc-side's gap went to 0; it is 44.00 now. */
@media (max-height:520px) and (orientation:landscape){
  .cut-cell{min-height:44px;padding:3px 8px 4px;}
  .cut-cell>.bc-side{gap:0;}
}

/* ---------- what each room returned (§10 item 7) ----------
   Three rows, three dollar figures, always all three — a room earning nothing
   has to be visibly different from a room earning, and the only way to show
   that is to put them next to each other. A type with no room in a bay is
   dimmed rather than dropped, because "you do not have one" and "you have one
   and it returned nothing" are different answers and the card is read for
   exactly that difference. */
.yield-row{
  display:flex;align-items:center;gap:9px;padding:7px 0;
  border-bottom:1px solid rgba(44,52,104,.45);
}
.yield-row:last-of-type{border-bottom:0;}
.yield-row.off{opacity:.55;}
.yield-ico{font-size:17px;line-height:1;flex:none;width:22px;text-align:center;}
.yield-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.yield-name{font-size:12px;font-weight:800;color:var(--muted);}
/* 11px, not 10, and the reason is size rather than colour: --dim (#868ec0) on
   --panel (#171d40) measures 5.17:1, comfortably past the 4.5:1 AA floor for
   body text — but this line carries a whole SENTENCE of explanation, and a
   sentence at 10px is a texture. Measured, not guessed: --muted is 5.50:1 and
   --dim 5.17:1 on --panel; the same two on --panel2 are 4.92:1 and 4.63:1. */
.yield-note{font-size:11px;color:var(--dim);line-height:1.35;}
/* The compact form, in the Daily Brief: three chips, one per room, so the
   split is visible every single day on the tab the player lives on without
   spending five lines of a card that is already full. */
.yield-strip{
  display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:5px;
  font-size:11px;color:var(--dim);
}
.yield-chip{white-space:nowrap;}
.yield-chip.off{opacity:.5;}
.yield-chip b{font-variant-numeric:tabular-nums;}
.yield-chip b.up{color:var(--green);} .yield-chip b.down{color:var(--red);} .yield-chip b.zero{color:var(--dim);}

/* Local trade: two bands in one meter — what a phone call already closes, and
   the part a production room can still win. The second band IS the headroom,
   so the bar and the figure beside it are the same fact. */
.meter.local{display:flex;}
.meter-fill.dim{background:rgba(134,142,192,.45);}

/* Readout #3, the one this whole tab is built around: points above the
   ceiling are struck through and counted, because they are worth exactly
   nothing while the salary is still due. */
.struck{text-decoration:line-through;text-decoration-thickness:2px;opacity:.75;}
.pts-line{font-variant-numeric:tabular-nums;}
.pts-line.bad{color:var(--red);}
/* WHAT SET THE CEILING, riding on the same line as the figure it explains:
   "7.0 / 3.0 pts — 4.0 wasted · ceiling set by one talk or news slot".

   Since v2 the ceiling is 3.0 points per SERVED DAYPART, so the wasted number
   is a statement about the SCHEDULE and is misread as a statement about the
   payroll unless its cause is attached to it. It is deliberately quieter than
   the figure — 12px/600 against the figure's 13px/800 — because it is the
   subordinate clause, not the number.

   Contrast, measured rather than asserted: --dim #868ec0 on --panel2 #1e2550
   is 4.63:1, and on --panel #171d40 (the room card behind the picker rows) it
   is 5.17:1. WCAG AA for body text is 4.5:1, so both pass, and 12px keeps it
   above this tab's 11px floor — the failure mode here is never the hue, it is
   putting a load-bearing sentence at 9px. */
.cap-cause{font-size:12px;font-weight:600;color:var(--dim);}
/* Readout #4. 11px, not 10: this is the line that says what a seat COSTS, and
   it is the difference between a room built out of surplus and a room built by
   robbing the air. */
.seat-line{font-size:11px;line-height:1.35;margin-top:2px;}
.seat-line b{color:var(--text);font-weight:700;}

/* ---------- generic list rows ---------- */
.row{
  display:flex;align-items:center;gap:11px;padding:11px;
  background:var(--panel2);border:1px solid var(--border);border-radius:var(--r-sm);
  margin-bottom:8px;
  width:100%;text-align:inherit;font:inherit;color:inherit;
}
.row:last-child{margin-bottom:0;}
.row-icon{
  flex-shrink:0;width:42px;height:42px;border-radius:10px;
  display:grid;place-items:center;font-size:20px;
  background:rgba(255,255,255,.05);border:1px solid var(--border);
}
.row-body{flex:1;min-width:0;}
/* overflow-wrap, measured not guessed: at 320px the icon (42) + gap + the
   fixed .row-act column squeeze .row-body to ~59px, and single tokens like
   "$520/day," or "permanently" are wider than that on their own. min-width:0
   is already set, so this is not the flexbox default — it is one unbreakable
   word. Without this the text spilled its box by 7-11px (Gear's "+$40/day
   lease, permanently", Build's "Buy bay 5 — $520/day, from tomorrow on").
   Wrapping mid-token is ugly; ellipsis would have been worse, because the word
   it eats is "permanently" — the one that tells you the lease never ends. */
.row-title{font-weight:700;font-size:14px;overflow-wrap:anywhere;}
.row-sub{font-size:11px;color:var(--muted);overflow-wrap:anywhere;}
/* 10px, not 5px: Train and the destructive Fire stack here, and a 5px gap
   between a 40px-tall pair is a mis-tap waiting to happen. */
.row-act{flex-shrink:0;display:flex;flex-direction:column;gap:10px;align-items:stretch;}

/* 36px was under the floor and .btn is the most-used control class in the
   file — Upgrade, Hire, Train, Fire, every modal action. 44px, and .btn.sm is
   44px too: "sm" now means narrower and quieter, never shorter. */
.btn{
  padding:9px 13px;border-radius:8px;font-size:12px;font-weight:700;
  background:var(--panel);border:1px solid var(--border-lit);color:var(--text);
  white-space:nowrap;transition:filter .15s,transform .1s;min-height:44px;
  display:inline-flex;align-items:center;justify-content:center;
}
.btn:active:not(:disabled){transform:scale(.96);}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn.buy{background:linear-gradient(135deg,var(--amber-dk),var(--magenta));border-color:transparent;color:#fff;}
.btn.buy:hover:not(:disabled){filter:brightness(1.12);}
.btn.danger{border-color:rgba(248,113,113,.45);color:var(--red);}
.btn.ghost{background:transparent;}
.btn.sm{padding:5px 10px;font-size:11px;min-height:44px;}
/* The only place density genuinely forbids a 44px box: the ± stepper beside a
   co-host's name inside the crew list, where two of them sit 10px apart in a
   56px row. The painted box stays 34px and an ::after pushes the hit area out
   to 44 — 5px of overhang per side, against a 10px gap, so the two targets
   still cannot collide. Nothing else in the file uses this. */
.btn.icon{
  width:34px;min-width:34px;height:34px;min-height:34px;padding:0;
  font-size:16px;position:relative;
}
.btn.icon::after{content:'';position:absolute;left:-5px;right:-5px;top:-5px;bottom:-5px;}

/* ---------- meters ---------- */
.meter{height:6px;background:rgba(0,0,0,.35);border-radius:3px;overflow:hidden;margin-top:5px;}
.meter-fill{height:100%;border-radius:3px;transition:width .5s ease;}
.meter-fill.amber{background:linear-gradient(90deg,var(--amber-dk),var(--amber));}
.meter-fill.cyan{background:linear-gradient(90deg,#0891b2,var(--cyan));}
.meter-fill.magenta{background:linear-gradient(90deg,#be185d,var(--magenta));}

/* 9px uppercase with .8px tracking is a texture, not a word. 10px. */
.pill{
  display:inline-block;font-size:10px;font-weight:800;letter-spacing:.8px;
  padding:3px 8px;border-radius:20px;text-transform:uppercase;
}
.pill.locked{background:rgba(248,113,113,.14);color:var(--red);border:1px solid rgba(248,113,113,.3);}
.pill.max{background:rgba(52,211,153,.14);color:var(--green);border:1px solid rgba(52,211,153,.3);}
.pill.new{background:rgba(34,211,238,.14);color:var(--cyan);border:1px solid rgba(34,211,238,.3);}
.pill.warn{background:rgba(251,191,36,.14);color:var(--amber);border:1px solid rgba(251,191,36,.32);}
.pill.lead{background:rgba(34,211,238,.14);color:var(--cyan);border:1px solid rgba(34,211,238,.3);}

/* ---------- log ---------- */
.log-item{
  padding:9px 11px;border-left:2px solid var(--border-lit);
  background:var(--panel2);border-radius:0 var(--r-sm) var(--r-sm) 0;
  margin-bottom:7px;font-size:12px;
}
.log-item.good{border-left-color:var(--green);}
.log-item.bad{border-left-color:var(--red);}
.log-item.big{border-left-color:var(--amber);}
.log-day{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-weight:700;}

/* ---------- bottom tab bar ---------- */
.tabbar{
  flex-shrink:0;display:flex;background:rgba(10,14,39,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);padding-bottom:var(--safe-b);
}
.tab{
  flex:1;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--dim);transition:color .18s;position:relative;min-height:56px;justify-content:center;
}
.tab.active{color:var(--amber);}
.tab.active::before{
  content:'';position:absolute;top:0;left:22%;right:22%;height:2px;
  background:var(--amber);border-radius:0 0 3px 3px;
}
.tab-icon{font-size:19px;line-height:1;}
.tab-lbl{font-size:10px;font-weight:700;letter-spacing:.3px;}
/* The badge is a class toggle rather than an injected span, so render() can
   update the tab bar without rebuilding it (and restarting its transitions). */
.tab.has-badge::after{
  content:'';position:absolute;top:6px;right:50%;margin-right:-20px;
  width:7px;height:7px;border-radius:50%;background:var(--magenta);
}

/* ---------- modal ---------- */
.modal-back{
  position:fixed;inset:0;z-index:var(--z-modal);background:rgba(5,7,20,.78);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:18px;
}
.modal-back.open{display:flex;}
.modal{
  width:100%;max-width:440px;max-height:86vh;overflow-y:auto;overscroll-behavior:contain;
  background:var(--panel);border:1px solid var(--border-lit);border-radius:var(--r);
  /* No bottom padding: the sticky action bar below supplies it. The sheet used
     to carry 18px here and the bar compensated with `bottom:-18px`, which is
     sticky for "park 18px BELOW the scrollport" — so the bottom of Close/Done
     sat off-screen on a short viewport. Measured at 320x760: actions clipped.
     bottom:0 and no padding is the same look and actually stays on screen. */
  padding:0 18px 0;
  display:flex;flex-direction:column;
}
/* The slot editor is a scroller with its actions at the bottom, which is the
   exact shape that loses its buttons in landscape — 360px of viewport, a
   four-show picker plus a crew list plus an engineer list above them. Both
   ends are sticky instead: the title stays so you always know which station's
   morning drive you are editing, and Close/Done is always one thumb away.
   The negative margins put the sticky bars edge-to-edge inside the padded
   sheet so nothing shows through beside them while scrolling. */
.modal-title{
  font-size:18px;font-weight:800;padding:16px 0 5px;
  position:sticky;top:0;z-index:2;background:var(--panel);
  margin:0 -18px;padding-left:18px;padding-right:18px;
}
.modal-sub{
  font-size:12px;color:var(--muted);margin:0 -18px 13px;padding:0 18px 10px;
  position:sticky;top:44px;z-index:2;background:var(--panel);
  border-bottom:1px solid var(--border);
}
.modal-btns{
  display:flex;gap:9px;margin:16px -18px 0;padding:12px 18px calc(14px + var(--safe-b));
  flex-wrap:wrap;position:sticky;bottom:0;z-index:2;
  background:var(--panel);border-top:1px solid var(--border);
}
.modal-btns .btn{flex:1;min-width:110px;justify-content:center;}
@media (prefers-reduced-motion:no-preference){
  .modal-back.open .modal{animation:modalIn .22s cubic-bezier(.2,.9,.3,1.2);}
  @keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
}
/* Phone portrait: the sheet is the screen, docked to the bottom where thumbs
   are, rather than a floating card with 18px of dead backdrop around it. */
@media (max-width:560px){
  .modal-back{padding:0;align-items:flex-end;}
  .modal{max-width:none;max-height:92vh;border-radius:var(--r) var(--r) 0 0;border-bottom:none;}
}

/* ---------- live readout (slot editor) ----------
   Outputs ABOVE controls, and sticky, because the controls under it are the
   thing the player is dragging their thumb over. A load/risk readout printed
   below the crew list would be covered by the hand changing the crew — which
   is exactly the number they changed the crew to watch. */
.readout{
  position:sticky;top:78px;z-index:1;
  background:var(--panel2);border:1px solid var(--border-lit);border-radius:var(--r-sm);
  padding:10px;margin-bottom:12px;
}
.readout-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.ro{text-align:center;}
.ro-val{font-size:16px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;}
.ro-lbl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;margin-top:1px;}
.ro.ok .ro-val{color:var(--green);} .ro.warn .ro-val{color:var(--amber);} .ro.bad .ro-val{color:var(--red);}
.ro.neutral .ro-val{color:var(--cyan);}
.readout-note{
  margin-top:9px;padding-top:8px;border-top:1px solid var(--border);
  font-size:11px;color:var(--muted);line-height:1.4;
}
.readout-note b{color:var(--amber);}
/* The load bar is the crossover made visible: L* = 1.616 is where the
   engineer stops being worth more on the big-revenue slot and starts being
   worth more here. DESIGN.md calls the crossover "discoverable, not hidden
   math", and a tick mark on a bar is the cheapest honest way to say it. */
.loadbar{position:relative;height:8px;border-radius:4px;background:rgba(0,0,0,.4);margin-top:9px;overflow:visible;}
.loadbar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--green),var(--amber) 62%,var(--red));}
.loadbar-mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--cyan);border-radius:1px;}
.loadbar-lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-top:4px;}

/* ---------- voice-tracking panel (slot editor) ----------
   §6 of docs/DESIGN_PROOF_VOICETRACK.md. Outputs first, control last, same
   rule as .readout above and for the same reason — the two mode buttons are
   where the thumb lands, so the four cost rows cannot be underneath them.

   Row order is the proof's: attention and the settling point FIRST (it is the
   cost that arrives ~46 days late and is the one the tap cannot make you
   feel), then person-hours, then localism, then the booth. */
.vt{
  border:1px solid var(--border);border-left:3px solid rgba(196,181,253,.45);
  border-radius:var(--r-sm);background:var(--panel2);
  padding:10px 11px;margin-bottom:10px;
}
/* Already tracked: the panel takes the same violet edge the grid tile has, so
   the sheet and the board agree at a glance about which state this slot is in. */
.vt.on{border-color:rgba(196,181,253,.45);border-left-color:var(--violet);}
.vt-row{padding:8px 0;border-top:1px solid var(--border);}
.vt-row:first-child{padding-top:0;border-top:none;}
.vt-row:last-child{padding-bottom:0;}
.vt-lbl{
  font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;
  font-weight:700;margin-bottom:3px;
}
/* 11px on --muted (4.92:1 on --panel2) for the prose, 12px on --text for the
   line carrying the number. The hierarchy here is deliberate: every row has
   exactly one figure the decision turns on and it is the biggest thing in the
   row. Nothing in this panel is below 11px. */
.vt-txt{font-size:11px;color:var(--muted);line-height:1.45;}
.vt-txt.vt-key{
  font-size:12px;color:var(--text);font-weight:700;
  font-variant-numeric:tabular-nums;margin-bottom:2px;
}
/* A number that MOVES with the mode. Amber says "this is the figure that
   changes", not "do this" — there is no recommended mode anywhere in this
   panel and a colour is not allowed to smuggle one in. 8.76:1 on --panel2. */
.vt-txt.vt-move{color:var(--amber);}
/* The control. Two buttons rather than a switch, because a switch has one
   label and has to be read twice to find out which state it is in.
   Measured at 320px: the sheet is 320 - 36px of padding = 284px of content,
   so each button is (284 - 8)/2 = 138px wide and 76px tall. Both axes clear
   the 44px floor with room to spare; they only stack if the viewport goes
   under 260px, which is not a phone. */
.vt-modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px;}
.vt-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-height:76px;padding:9px 7px;text-align:center;
  background:var(--panel2);border:1px solid var(--border);border-radius:var(--r-sm);
  font:inherit;color:inherit;transition:border-color .16s,transform .12s;
}
.vt-btn:hover{border-color:var(--border-lit);}
.vt-btn:active{transform:scale(.98);}
/* The CURRENT mode, not the recommended one. It is marked in three ways — the
   violet edge, the tick in the label and the "on air" pill — because "which of
   these two am I looking at" is the question a player asks first and a single
   subtle border is not an answer on a phone in daylight. */
.vt-btn.on{border-color:var(--violet);background:rgba(196,181,253,.08);}
.vt-ico{font-size:19px;line-height:1;}
.vt-name{font-size:13px;font-weight:800;}
.vt-desc{font-size:11px;color:var(--muted);line-height:1.3;}
.vt-btn.on .vt-name{color:var(--violet);}
.vt-tag{
  font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
  color:var(--violet);
}
/* The one-line state at the top of the sticky readout, and the reason the
   fault figure two tiles left is where it is. */
.readout-note.vt-note{color:var(--text);}
.readout-note.vt-note b{color:var(--violet);}
/* A section that is present, explained and not available. Greyed, never
   hidden: the bench disappearing at the exact moment the player is deciding
   about it is a defect this file has already fixed once. */
.pick-sub.vt-blocked{color:var(--violet);}
.eng-off{opacity:.5;}
.eng-off .row{cursor:default;}

/* ---------- crew / engineer pickers ---------- */
.pick-head{
  font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-weight:700;
  margin:16px 0 4px;
}
.pick-sub{font-size:11px;color:var(--muted);margin:0 0 8px;line-height:1.4;}
.row.on{border-color:var(--amber);}
.row.warnrow{border-color:rgba(251,191,36,.5);}
.delta-tag{font-size:11px;font-weight:800;white-space:nowrap;}
.delta-tag.up{color:var(--green);} .delta-tag.down{color:var(--red);}
/* A measured ZERO. Every one of the three rooms is worth exactly nothing in a
   state a player reaches without noticing — a Newsroom on a board with no talk
   hour, a Record Library on a board with no music hour, a Maintenance Bay with
   no plant to protect — and "+$0" in the green style reads as a small win while
   an omitted tag reads as "not measured". This is neither.
   --dim (#868ec0) on --panel2 (#1e2550) measures 4.63:1, and at 11px/800 that
   clears AA; it is deliberately NOT --red, because a room returning nothing is
   not the same fault as a room returning less than nothing. */
.delta-tag.zero{color:var(--dim);}

/* ---------- founding flow ---------- */
.seg-grid{display:grid;gap:8px;}
.seg-card{
  background:var(--panel2);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:11px;text-align:left;width:100%;font:inherit;color:inherit;min-height:44px;
}
.seg-card.on{border-color:var(--amber);}
.seg-card-top{display:flex;align-items:center;gap:9px;}
.seg-card-name{font-weight:800;font-size:14px;flex:1;min-width:0;}
.seg-pops{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px;}
.seg-pop{text-align:center;}
.seg-pop-bar{height:26px;display:flex;align-items:flex-end;justify-content:center;}
.seg-pop-bar i{display:block;width:14px;border-radius:2px 2px 0 0;background:var(--cyan);opacity:.8;}
.seg-pop-lbl{font-size:10px;color:var(--dim);margin-top:2px;}
/* The lease commitment, spelled out before the money leaves. A $120,000
   buildout used to be a single button; the recurring bill it signs you up for
   was invisible until it started arriving. */
.commit{
  background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3);
  border-radius:var(--r-sm);padding:11px;margin-top:12px;
}
.commit-row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:12px;}
.commit-row span:first-child{color:var(--muted);}
.commit-row span:last-child{font-weight:800;font-variant-numeric:tabular-nums;}
.commit-row.total{border-top:1px solid rgba(248,113,113,.3);margin-top:5px;padding-top:8px;}

/* ---------- first-days coach ----------
   NOT a modal. The three-paragraph intro wall it replaces stopped the clock,
   said everything at once on the one day the player had no context for any of
   it, and was never seen again. This sits in the content flow above the
   schedule, says exactly one thing, and its button performs the decision it
   is talking about. It advances when the player does the thing, so reading it
   is optional and doing it is the tutorial. */
.coach{
  display:flex;gap:11px;align-items:flex-start;
  background:linear-gradient(135deg,rgba(251,191,36,.10),rgba(236,72,153,.07));
  border:1px solid rgba(251,191,36,.34);border-radius:var(--r);
  padding:12px;margin-bottom:12px;
}
.coach-ico{font-size:22px;line-height:1.1;flex-shrink:0;}
.coach-body{flex:1;min-width:0;}
.coach-step{font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--amber);}
.coach-txt{font-size:13px;line-height:1.45;margin-top:3px;}
.coach-btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.coach-btns .btn{flex:1 1 auto;min-width:96px;}

/* ---------- toast ----------
   Two hosts, deliberately. #toasts is the floating one and is only ever used
   off the game screen (save failures on the menu, "no save found"), where
   there is nothing behind it to occlude.
   In game, toasts go into #toasts-game, which is a flex child between the
   content area and the tab bar — IN FLOW, so a full stack shrinks the content
   instead of covering it. The old floating stack was fine at 1x and a
   permanent 120px blindfold at 3x: a day passes every 1.4 seconds there,
   toasts live 3.4 seconds, and a breakdown plus an event plus an autosave
   notice means the queue never drains. What it covered was the bottom of the
   schedule grid — the controls.
   Capped in CSS as well as in JS: 33vh is the most of the screen a run of bad
   news is allowed to take, and the rail scrolls past that. */
.toasts{
  position:fixed;z-index:var(--z-toast);left:50%;transform:translateX(-50%);
  bottom:calc(20px + var(--safe-b));display:flex;flex-direction:column;gap:7px;
  pointer-events:none;width:calc(100% - 28px);max-width:400px;
}
.toast-rail{
  flex-shrink:0;display:flex;flex-direction:column;gap:6px;
  padding:0 12px;max-height:33vh;overflow-y:auto;overscroll-behavior:contain;
  pointer-events:none;
}
.toast-rail:empty{display:none;}
.toast-rail .toast{width:100%;max-width:940px;margin:0 auto;}
.toast-rail > :first-child{margin-top:8px;}
.toast-rail > :last-child{margin-bottom:2px;}
.toast{
  background:var(--panel2);border:1px solid var(--border-lit);border-radius:10px;
  padding:9px 13px;font-size:12px;font-weight:600;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
}
.toast.good{border-color:rgba(52,211,153,.5);}
.toast.bad{border-color:rgba(248,113,113,.5);}
/* The third kind, and the Traffic Desk is what it exists for: nothing has gone
   wrong, and there is still a decision to make. Red would read as a fault the
   player caused; green would read as "carry on". Amber is neither. */
.toast.warn{border-color:rgba(251,191,36,.55);}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:toastIn .25s ease;}
  @keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
}

/* ---------- options ---------- */
.opt-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 0;border-bottom:1px solid var(--border);
}
.opt-row:last-child{border-bottom:none;}
.opt-lbl{font-size:14px;font-weight:600;}
.opt-desc{font-size:11px;color:var(--dim);margin-top:1px;}
/* 44px tall for the touch target, but the visible pill stays 28px: the
   transparent 8px padding is excluded from the painted area by
   background-clip:content-box. */
.switch{
  flex-shrink:0;width:48px;height:44px;border-radius:22px;border:none;
  padding:8px 0;background:var(--border-lit);background-clip:content-box;
  position:relative;transition:background .2s;
}
.switch.on{background:var(--amber-dk);background-clip:content-box;}
.switch::after{
  content:'';position:absolute;top:11px;left:3px;width:22px;height:22px;
  border-radius:50%;background:#fff;transition:transform .2s;
}
.switch.on::after{transform:translateX(20px);}
.seg{display:flex;gap:8px;flex-shrink:0;}
/* min-height was already 44 and min-width was not: "1×" at 12px inside 12px
   of side padding is a 38px-wide box. A target is two dimensions. */
.seg-btn{
  padding:6px 12px;border-radius:8px;font-size:13px;font-weight:700;
  background:var(--panel2);border:1px solid var(--border);
  min-height:44px;min-width:48px;
}
.seg-btn.on{background:var(--amber-dk);border-color:transparent;color:#fff;}

/* ---------- keyboard focus ----------
   The file shipped without a single :focus rule, so tabbing through the UI
   was invisible. :focus-visible keeps it off mouse/touch activation. */
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:8px;}

/* ---------- gamepad focus cursor ---------- */
.gp-focus{
  outline:2px solid var(--cyan) !important;
  outline-offset:2px;
  box-shadow:0 0 0 4px rgba(34,211,238,.18),0 0 18px rgba(34,211,238,.35) !important;
  border-radius:8px;
}
.pad-hint{
  display:none;gap:14px;justify-content:center;flex-wrap:wrap;
  padding:7px 10px;border-top:1px solid var(--border);
  background:rgba(34,211,238,.05);font-size:10px;color:var(--muted);
}
body.pad-on .pad-hint{display:flex;}
.pad-hint b{color:var(--cyan);font-weight:800;}

.empty{text-align:center;padding:26px 14px;color:var(--dim);font-size:12px;}
.hint{
  font-size:11px;color:var(--muted);background:rgba(34,211,238,.06);
  border:1px solid rgba(34,211,238,.18);border-radius:var(--r-sm);
  padding:9px 11px;margin-bottom:12px;
}
.locked-panel{text-align:center;padding:30px 16px;}
.locked-icon{font-size:40px;margin-bottom:10px;opacity:.5;}

/* ---------- tap to expand ----------
   One control shape for "there is more here", on every tab.

   44px minimum on the button and it is FULL WIDTH — this is the one control in
   the file that had no density argument for being small, so it does not get to
   be. Nothing sits beside it, so nothing can collide with its hit area.

   The body is display:none when closed (via [hidden]) rather than clipped to
   zero height. That is deliberate and load-bearing: focusables() rejects
   elements whose offsetParent is null, and only display:none produces that.
   A max-height collapse leaves every control inside a closed panel pad-
   focusable and invisible at the same time.

   Colour maths, measured not guessed: --muted #8b93c4 on the button's own
   background (rgba(255,255,255,.03) over --panel #171d40, composited #1e2446)
   is 5.06:1, and --text on the same ground is 12.7:1 — both clear AA 4.5:1 at
   the 11px this renders at. The chevron is --cyan at 8.3:1. */
.fold{margin-top:9px;}
.fold-btn{
  width:100%;min-height:44px;display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:9px 11px;border-radius:var(--r-sm);text-align:left;
  background:rgba(255,255,255,.03);border:1px solid var(--border);
  color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.3px;
}
.fold-btn:active{transform:scale(.985);}
/* Keyed off aria-expanded rather than the wrapper's .open class, because
   foldToggle() renders a fold with NO wrapper — the button is the whole
   control. One selector covers both shapes, and it cannot drift out of step
   with the state a screen reader is being told. */
.fold-btn[aria-expanded="true"]{color:var(--text);border-color:var(--border-lit);background:rgba(34,211,238,.06);}
.fold-lbl{min-width:0;}
.fold-sub{display:block;font-style:normal;font-weight:600;color:var(--dim);margin-top:1px;}
.fold-chev{flex-shrink:0;color:var(--cyan);font-size:13px;line-height:1;}
@media (prefers-reduced-motion:no-preference){
  .fold-chev{transition:transform .18s ease;}
}
.fold-btn[aria-expanded="true"] .fold-chev{transform:rotate(180deg);}
.fold-body{padding:10px 2px 2px;}
/* [hidden] has to out-rank any display the body's own classes carry. */
.fold-body[hidden]{display:none !important;}
@media (prefers-reduced-motion:no-preference){
  .fold-body:not([hidden]){animation:foldIn .18s ease both;}
}
@keyframes foldIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
/* A fold sitting inside a .row (the per-person and per-room rows) spans the
   row's full width rather than squeezing beside the action buttons. */
/* THE TAPPABLE ROW. On a list — the roster, the hire board, the station
   list — the row IS the expand control, so there is no separate "Details"
   button repeated fourteen times down a payroll.

   It sits in a wrapping .row beside the row's own action column (Hire,
   Switch), which stays a SIBLING: a button cannot contain a button, and
   "read this candidate" must not be one mis-tap from "pay for this
   candidate". The revealed body then takes a wrapped line of its own at
   flex:1 0 100%, so the rate card gets the row's full width instead of being
   indented past the icon and cut short by the buttons — which at 320px cost
   it about 100px for nothing. Nothing else in the file starts wrapping,
   because .row-body is flex:1 and the act column is flex:none. */
.row{flex-wrap:wrap;}
.row>.fold{flex:1 0 100%;margin-top:9px;}
.row-tap{
  flex:1 1 auto;min-width:0;min-height:44px;
  display:flex;align-items:center;gap:11px;
  text-align:left;font:inherit;color:inherit;padding:0;
}
.row-tap:active{opacity:.85;}
.row-tap>.fold-chev{margin-left:auto;}
/* .row-icon / .row-body / .row-title / .row-sub / .meter are divs at every
   other call site; inside this <button> they are spans, so they are
   re-blockified here rather than the markup being quietly invalid. */
.row-tap .row-icon{display:grid;}
.row-tap .row-body,
.row-tap .row-title,
.row-tap .row-sub,
.row-tap .meter,
.row-tap .meter-fill{display:block;}
.row-tap .row-body{flex:1;min-width:0;}
.row-tap .row-title .pill{display:inline-block;}
.row>.fold-body{flex:1 0 100%;padding:10px 0 0;}
.row>.fold-body[hidden]{display:none !important;}
@media (prefers-reduced-motion:no-preference){
  .row>.fold-body:not([hidden]){animation:foldIn .18s ease both;}
}
.fold-body .row{padding-left:0;padding-right:0;}
.card>.fold:first-child{margin-top:0;}
/* A whole .card handed to a fold body (the coverage grid, the local-trade
   list) flattens rather than drawing a second border inside the first. */
.fold-body>.card{background:transparent;border:0;padding:0;margin-bottom:0;}

/* ---------- the rate card ----------
   The expanded state, and a real radio artifact: the sheet a station hands an
   agency, with the callsign at the top, the coverage it claims, a stat block
   and the terms underneath.

   MEASURED AT 320px, which is where a fixed-format container either works or
   does not. .content is 8px padding a side, .card 11px, .fold-body 2px, so the
   card gets 320 − 16 − 22 − 4 = 278px, and its own 11px padding leaves 256px
   of content. The body grid is 46px of art + 10px gap + 200px of hero, and the
   hero renders at 26px/900 — "−$1,234" is 7 glyphs of tabular numerals at
   ~15px advance = 105px, so it does not wrap until five figures and a sign,
   which cannot happen on a per-day figure in this economy.
   The stat block is a two-column dl: the key wraps, the value never does
   (white-space:nowrap + tabular-nums), because a wrapped number is a number
   you cannot compare down a column. At 256px a 15-character key like
   "Ceiling set by" and a 10-character value both fit on one line.

   Contrast, measured on --panel2 #1e2550 (the card ground):
     --text  #e8ecff  11.9:1   id, hero
     --muted #8b93c4   4.53:1  keys and the note, at 11px — AA
     --dim   #868ec0   4.63:1  the chip, at 10px/800 — AA for bold small text
   Nothing on this card renders below 10px, and nothing below 11px is prose. */
.rcard{
  background:var(--panel2);border:1px solid var(--border-lit);border-radius:12px;
  padding:11px;margin-bottom:8px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
.rcard:last-child{margin-bottom:0;}
.rcard-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  border-bottom:1px solid var(--border);padding-bottom:7px;margin-bottom:9px;
}
.rcard-id{
  font-size:13px;font-weight:900;letter-spacing:.4px;color:var(--text);
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.rcard-chip{
  flex:none;font-size:10px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;
  color:var(--dim);border:1px solid var(--border);border-radius:20px;padding:2px 8px;
}
.rcard-body{display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:center;margin-bottom:9px;}
.rcard-art{
  font-size:30px;line-height:1;text-align:center;
  background:rgba(255,255,255,.04);border-radius:10px;padding:8px 0;
}
.rcard-hero{display:flex;flex-direction:column;min-width:0;}
.rcard-hero b{
  font-size:26px;font-weight:900;line-height:1.05;color:var(--text);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.rcard-hero b.up{color:var(--green);} .rcard-hero b.down{color:var(--red);}
.rcard-hero b.zero{color:var(--dim);} .rcard-hero b.warn{color:var(--amber);}
.rcard-hero b.cyan{color:var(--cyan);}
.rcard-hero i{font-size:11px;font-style:normal;color:var(--muted);margin-top:2px;}
.rcard-stats{display:flex;flex-direction:column;gap:0;}
.rcard-stats>div{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:5px 0;border-bottom:1px dashed rgba(44,52,104,.8);
}
.rcard-stats>div:last-child{border-bottom:0;}
.rcard-stats dt{font-size:11px;color:var(--muted);min-width:0;}
.rcard-stats dd{
  font-size:12px;font-weight:800;color:var(--text);flex:none;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.rcard-stats dd.up{color:var(--green);} .rcard-stats dd.down{color:var(--red);}
.rcard-stats dd.zero{color:var(--dim);} .rcard-stats dd.warn{color:var(--amber);}
.rcard-stats dd.cyan{color:var(--cyan);}
.rcard-rows{margin-top:8px;display:flex;flex-direction:column;gap:3px;}
/* The controls that belong to a card sit under it, full width, 44px, at a 10px
   gap — the same spacing .row-act uses, and for the same reason: Train and the
   destructive Fire stack here and a tight gap between them is a mis-tap. */
.rcard-acts{display:flex;gap:10px;margin-top:9px;}
.rcard-acts .btn{flex:1;justify-content:center;}
.rcard-acts .pill{display:inline-flex;align-items:center;}
.rcard-rows .row-sub{font-size:11px;}
.rcard-note{font-size:11px;color:var(--muted);margin-top:9px;line-height:1.5;}
.rcard-foot{
  font-size:11px;color:var(--dim);margin-top:8px;padding-top:8px;
  border-top:1px solid var(--border);line-height:1.5;
}
.rcard-foot.warn{color:var(--amber);}
.rcard-foot.bad{color:var(--red);}
@media (max-width:359px){
  .rcard{padding:10px;}
  .rcard-body{grid-template-columns:42px 1fr;gap:9px;}
  .rcard-art{font-size:26px;}
  .rcard-hero b{font-size:23px;}
}

/* ---------- desktop ---------- */
@media (min-width:900px){
  .content{padding:18px 20px 26px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;}
  .two-col .card{margin-bottom:0;}
  .cov-head,.cov-row{grid-template-columns:88px repeat(4,1fr);}
  :root{ --bay-gutter:88px; }
}

/* ---------- 320px ----------
   The narrowest phone still in circulation, and the width where a four-chip
   station switcher, a 52px coverage gutter and a 2-up schedule grid all want
   the same pixels. Everything here shrinks type or gutters; nothing here
   shrinks a touch target. */
@media (max-width:359px){
  .content{padding:12px 8px 18px;}
  .hud-row{gap:8px;padding:6px 8px;}
  .st-bar{padding:0 8px 7px;gap:5px;}
  .st-chip{min-width:66px;padding:5px 7px;}
  .st-chip-call{font-size:12px;}
  .card{padding:12px 10px;}
  .cov-head,.cov-row{grid-template-columns:42px repeat(4,1fr);gap:3px;}
  .cov-call{font-size:10px;}
  /* The cutaway carries its own 320 rules (gutter 40, mark 20, 11px name) up
     beside the block it belongs to, so nothing bay-shaped is overridden from
     down here any more. Six tabs still share 320px: labels are 10px and the
     widest is "Studio", so nothing wraps. */
  .tab{padding:8px 2px;}
  .slot{padding:9px 5px;min-height:104px;}
  .stat-val{font-size:15px;}
  .readout-grid{gap:4px;}
  .ro-val{font-size:15px;}
  /* Two 110px buttons plus a 9px gap is 229px inside a 320px sheet with
     36px of padding — it fits, but only just, and a third action wraps. Let
     it wrap onto full-width rows rather than squeezing below 44px. */
  .modal-btns .btn{min-width:100%;}
}

/* ---------- landscape / short viewports ----------
   640x360 is the reference. The HUD is four stacked strips (row, switcher,
   warning, stats) and the tab bar is 56 more, which leaves ~150px of content
   if nothing gives. The scene banner is the first thing to go — it is
   decoration and it is 16:5 of pure height — then every vertical padding
   halves. The schedule goes 4-across so the grid stays one screen. */
@media (max-height:520px) and (orientation:landscape){
  /* 360px of height against four stacked HUD strips, a toast rail and a tab
     bar. Every number below was measured at 640x360 with four stations and a
     warning showing — the worst case — and the budget is: nothing that is a
     touch target shrinks, everything that is padding does.
       hud-row 54 -> 50   (the 44px ☰ is the floor; the padding went)
       st-bar  48 -> 46
       stats   50 -> 36   (labels stay: the cash runway lives in one)
       rail    47 -> 44   (and the JS stack caps at 1 here, see toast())
       tabbar  47 -> 45
     which buys back ~65px of content. */
  .hud-row{padding:3px 12px;}
  .station-sub{display:none;}
  .station-call{font-size:15px;}
  .st-bar{padding:0 10px 4px;}
  .stat{padding:3px 6px;}
  .stat-val{font-size:13px;}
  /* The padding goes, the 44px does not — this is the one control that tells
     a landscape player the run is about to end. */
  .hud-warn{padding:4px 12px;font-size:11px;}
  .st-chip{min-height:44px;padding:3px 9px;}
  .st-chip-sub{display:none;}
  .toast{padding:6px 11px;font-size:11px;}
  .content{padding:10px 12px 14px;}
  .scene-wrap{display:none;}
  .sched{grid-template-columns:repeat(4,1fr);}
  .slot{min-height:96px;padding:8px 5px;}
  .slot-icon{font-size:20px;}
  .card{padding:11px;margin-bottom:9px;}
  .bc-ico{font-size:14px;}
  .tab{min-height:46px;padding:5px 4px;}
  .tab-icon{font-size:16px;}
  .modal-back{padding:0;align-items:stretch;}
  .modal{max-height:100vh;max-width:none;border-radius:0;}
  .modal-title{padding-top:10px;font-size:16px;}
  .modal-sub{top:36px;}
  .readout{top:66px;}
