<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0a0e27">
<title>Callsigns</title>
<style>
/* ============================================================
   CALLSIGNS — radio tycoon
   Palette shared with the station scene art:
   night #0a0e27/#1a1040 · amber #fbbf24 · magenta #ec4899 · cyan #22d3ee
   ============================================================ */
:root{
  --night:#0a0e27; --night2:#141a3a; --panel:#171d40; --panel2:#1e2550;
  --border:#2c3468; --border-lit:#3d4795;
  --amber:#fbbf24; --amber-dk:#f59e0b;
  --magenta:#ec4899; --cyan:#22d3ee; --green:#34d399; --red:#f87171;
  /* --dim used to be #5d6598, which measured ~3.0:1 on --panel and ~2.6:1 on
     --panel2 — under WCAG AA for the 9-12px labels it is used on, including
     the only "tap a slot" instruction in the game. This clears 4.5:1. */
  --text:#e8ecff; --muted:#8b93c4; --dim:#7b83b4;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  --r:14px; --r-sm:9px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--night); color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:15px; line-height:1.45; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 70% 50% at 15% 0%,rgba(236,72,153,.10),transparent 60%),
    radial-gradient(ellipse 70% 50% at 85% 100%,rgba(34,211,238,.09),transparent 60%);
}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;cursor:pointer;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- screen router ---------- */
.screen{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;}
.screen.active{display:flex;}

/* ---------- main menu ---------- */
#screen-menu{align-items:center;justify-content:center;padding:24px;overflow-y:auto;}
.menu-box{width:100%;max-width:420px;text-align:center;padding:20px 0;position:relative;z-index:1;}
/* The menu shows the game's own station art behind the logo — boot() injects
   the tier the save is sitting on (or the Broadcast Tower for a fresh start).
   Purely decorative, so it never takes a pointer event or a focus stop. */
.menu-scene{
  position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  z-index:0;pointer-events:none;
}
.menu-scene-art{opacity:.35;}
.menu-scene::after{
  content:'';position:absolute;inset:-2px;
  background:radial-gradient(ellipse 72% 82% at 50% 50%,rgba(10,14,39,0) 22%,var(--night) 84%);
}
.logo-mark{
  font-size:11px;letter-spacing:5px;color:var(--cyan);text-transform:uppercase;
  margin-bottom:6px;font-weight:700;
}
.logo{
  font-size:clamp(44px,13vw,68px);font-weight:900;letter-spacing:-2px;line-height:1;
  background:linear-gradient(135deg,var(--amber),var(--magenta) 55%,var(--cyan));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:10px;
}
.tagline{color:var(--muted);font-size:13px;margin-bottom:8px;}
.onair-badge{
  display:inline-flex;align-items:center;gap:7px;margin-bottom:28px;
  border:1px solid rgba(251,191,36,.4);background:rgba(251,191,36,.08);
  color:var(--amber);border-radius:20px;padding:5px 14px;
  font-size:10px;font-weight:800;letter-spacing:2px;
}
.onair-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);}
@media (prefers-reduced-motion:no-preference){
  .onair-dot{animation:pulseDot 1.8s ease-in-out infinite;}
  @keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
}
.menu-btns{display:flex;flex-direction:column;gap:11px;}
.mbtn{
  width:100%;padding:16px;border-radius:var(--r);font-weight:700;font-size:16px;
  background:var(--panel);border:1px solid var(--border);color:var(--text);
  transition:transform .12s,border-color .18s,background .18s;
  min-height:54px;
}
.mbtn:hover:not(:disabled),.mbtn:active:not(:disabled){background:var(--panel2);border-color:var(--border-lit);}
.mbtn:active:not(:disabled){transform:scale(.98);}
.mbtn:disabled{opacity:.35;cursor:not-allowed;}
.mbtn.primary{
  background:linear-gradient(135deg,var(--amber-dk),var(--magenta));
  border-color:transparent;color:#fff;
  box-shadow:0 6px 22px rgba(236,72,153,.28);
}
.mbtn.primary:hover,.mbtn.primary:active{filter:brightness(1.1);}
.menu-foot{margin-top:22px;font-size:11px;color:var(--dim);}

/* ---------- top HUD ---------- */
.hud{
  flex-shrink:0;background:rgba(10,14,39,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding-top:env(safe-area-inset-top,0px);
}
.hud-row{display:flex;align-items:center;gap:10px;padding:9px 12px;}
.hud-btn{
  flex-shrink:0;width:38px;height:38px;border-radius:10px;
  background:var(--panel);border:1px solid var(--border);
  display:grid;place-items:center;font-size:17px;
  transition:background .15s,border-color .15s;
}
.hud-btn:hover,.hud-btn:active{background:var(--panel2);border-color:var(--border-lit);}
.station-id{flex:1;min-width:0;}
.station-call{
  font-weight:900;font-size:17px;letter-spacing:1px;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.station-sub{font-size:10px;color:var(--muted);letter-spacing:.5px;}
.day-chip{
  flex-shrink:0;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--cyan);
  background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.3);
  border-radius:8px;padding:4px 9px;text-transform:uppercase;
}
.pause-chip{
  flex-shrink:0;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--amber);
  background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);
  border-radius:8px;padding:4px 9px;
}
.stats-strip{display:flex;border-top:1px solid var(--border);}
.stat{
  flex:1;min-width:0;padding:8px 6px;text-align:center;
  border-right:1px solid var(--border);
}
.stat:last-child{border-right:none;}
.stat-val{
  display:block;font-size:16px;font-weight:800;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:tabular-nums;
}
.stat-lbl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.9px;margin-top:1px;}
.stat.cash .stat-val{color:var(--green);}
.stat.listeners .stat-val{color:var(--cyan);}
.stat.rep .stat-val{color:var(--amber);}
.delta{font-size:9px;font-weight:700;margin-left:3px;}
.delta.up{color:var(--green);} .delta.down{color:var(--red);}

/* ---------- content area ---------- */
.content{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 12px 20px;}
.tabpane{display:none;} .tabpane.active{display:block;}
.wrap{max-width:940px;margin:0 auto;}

/* ---------- cards ---------- */
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r);
  padding:14px;margin-bottom:12px;
}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px;}
.card-title{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);}
.card-note{font-size:11px;color:var(--dim);}

/* ---------- scene banner ---------- */
.scene-wrap{margin-bottom:12px;position:relative;}
.scene-caption{
  position:absolute;left:10px;bottom:10px;z-index:5;
  background:rgba(10,14,39,.8);backdrop-filter:blur(6px);
  border:1px solid var(--border-lit);border-radius:8px;padding:5px 11px;
  font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--amber);
}
.scene-fallback{
  width:100%;aspect-ratio:16/5;border-radius:12px;
  background:linear-gradient(160deg,#0a0e27,#1a1040);
  border:1px solid var(--border);display:grid;place-items:center;
  color:var(--dim);font-size:12px;
}

/* ---------- schedule grid ---------- */
.sched{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
@media (max-width:560px){.sched{grid-template-columns:repeat(2,1fr);}}
/* .slot and .row are <button> elements so the schedule — the core mechanic —
   is reachable by keyboard; the font/width/align resets keep them looking
   exactly like the divs they used to be. */
.slot{
  background:var(--panel2);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:10px 8px;text-align:center;transition:border-color .18s,transform .12s;
  min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  width:100%;font:inherit;color:inherit;
}
.slot:hover,.slot:active{border-color:var(--border-lit);}
.slot:active{transform:scale(.98);}
.slot-part{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-weight:700;}
.slot-icon{font-size:26px;line-height:1;}
.slot-show{font-size:12px;font-weight:800;}
.slot-meta{font-size:9px;color:var(--muted);}
.slot-dj{font-size:9px;color:var(--cyan);}

/* ---------- generic list rows ---------- */
.row{
  display:flex;align-items:center;gap:11px;padding:11px;
  background:var(--panel2);border:1px solid var(--border);border-radius:var(--r-sm);
  margin-bottom:8px;
  width:100%;text-align:inherit;font:inherit;color:inherit;
}
.row:last-child{margin-bottom:0;}
.row-icon{
  flex-shrink:0;width:42px;height:42px;border-radius:10px;
  display:grid;place-items:center;font-size:20px;
  background:rgba(255,255,255,.05);border:1px solid var(--border);
}
.row-body{flex:1;min-width:0;}
.row-title{font-weight:700;font-size:14px;}
.row-sub{font-size:11px;color:var(--muted);}
/* 10px, not 5px: Train and the destructive Fire stack here, and a 5px gap
   between a 40px-tall pair is a mis-tap waiting to happen. */
.row-act{flex-shrink:0;display:flex;flex-direction:column;gap:10px;align-items:stretch;}

.btn{
  padding:8px 13px;border-radius:8px;font-size:12px;font-weight:700;
  background:var(--panel);border:1px solid var(--border-lit);color:var(--text);
  white-space:nowrap;transition:filter .15s,transform .1s;min-height:36px;
}
.btn:active:not(:disabled){transform:scale(.96);}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn.buy{background:linear-gradient(135deg,var(--amber-dk),var(--magenta));border-color:transparent;color:#fff;}
.btn.buy:hover:not(:disabled){filter:brightness(1.12);}
.btn.danger{border-color:rgba(248,113,113,.45);color:var(--red);}
.btn.ghost{background:transparent;}
.btn.sm{padding:5px 10px;font-size:11px;min-height:40px;}

/* ---------- meters ---------- */
.meter{height:6px;background:rgba(0,0,0,.35);border-radius:3px;overflow:hidden;margin-top:5px;}
.meter-fill{height:100%;border-radius:3px;transition:width .5s ease;}
.meter-fill.amber{background:linear-gradient(90deg,var(--amber-dk),var(--amber));}
.meter-fill.cyan{background:linear-gradient(90deg,#0891b2,var(--cyan));}
.meter-fill.magenta{background:linear-gradient(90deg,#be185d,var(--magenta));}

.pill{
  display:inline-block;font-size:9px;font-weight:800;letter-spacing:.8px;
  padding:2px 7px;border-radius:20px;text-transform:uppercase;
}
.pill.locked{background:rgba(248,113,113,.14);color:var(--red);border:1px solid rgba(248,113,113,.3);}
.pill.max{background:rgba(52,211,153,.14);color:var(--green);border:1px solid rgba(52,211,153,.3);}
.pill.new{background:rgba(34,211,238,.14);color:var(--cyan);border:1px solid rgba(34,211,238,.3);}

/* ---------- log ---------- */
.log-item{
  padding:9px 11px;border-left:2px solid var(--border-lit);
  background:var(--panel2);border-radius:0 var(--r-sm) var(--r-sm) 0;
  margin-bottom:7px;font-size:12px;
}
.log-item.good{border-left-color:var(--green);}
.log-item.bad{border-left-color:var(--red);}
.log-item.big{border-left-color:var(--amber);}
.log-day{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-weight:700;}

/* ---------- bottom tab bar ---------- */
.tabbar{
  flex-shrink:0;display:flex;background:rgba(10,14,39,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);padding-bottom:var(--safe-b);
}
.tab{
  flex:1;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--dim);transition:color .18s;position:relative;min-height:56px;justify-content:center;
}
.tab.active{color:var(--amber);}
.tab.active::before{
  content:'';position:absolute;top:0;left:22%;right:22%;height:2px;
  background:var(--amber);border-radius:0 0 3px 3px;
}
.tab-icon{font-size:19px;line-height:1;}
.tab-lbl{font-size:9px;font-weight:700;letter-spacing:.5px;}
/* The badge is a class toggle rather than an injected span, so render() can
   update the tab bar without rebuilding it (and restarting its transitions). */
.tab.has-badge::after{
  content:'';position:absolute;top:6px;right:50%;margin-right:-20px;
  width:7px;height:7px;border-radius:50%;background:var(--magenta);
}

/* ---------- modal ---------- */
.modal-back{
  position:fixed;inset:0;z-index:50;background:rgba(5,7,20,.78);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:18px;
}
.modal-back.open{display:flex;}
.modal{
  width:100%;max-width:440px;max-height:86vh;overflow-y:auto;
  background:var(--panel);border:1px solid var(--border-lit);border-radius:var(--r);
  padding:18px;
}
.modal-title{font-size:18px;font-weight:800;margin-bottom:5px;}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:15px;}
.modal-btns{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap;}
.modal-btns .btn{flex:1;min-width:110px;justify-content:center;}
@media (prefers-reduced-motion:no-preference){
  .modal-back.open .modal{animation:modalIn .22s cubic-bezier(.2,.9,.3,1.2);}
  @keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
}

/* ---------- toast ---------- */
/* The 74px lift exists to clear the tab bar, which only exists in-game — on
   the menu and Settings screens it left toasts floating in mid-air. */
.toasts{
  position:fixed;z-index:60;left:50%;transform:translateX(-50%);
  bottom:calc(20px + var(--safe-b));display:flex;flex-direction:column;gap:7px;
  pointer-events:none;width:calc(100% - 28px);max-width:400px;
}
body.in-game .toasts{bottom:calc(74px + var(--safe-b));}
.toast{
  background:var(--panel2);border:1px solid var(--border-lit);border-radius:10px;
  padding:9px 13px;font-size:12px;font-weight:600;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
}
.toast.good{border-color:rgba(52,211,153,.5);}
.toast.bad{border-color:rgba(248,113,113,.5);}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:toastIn .25s ease;}
  @keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
}

/* ---------- options ---------- */
.opt-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 0;border-bottom:1px solid var(--border);
}
.opt-row:last-child{border-bottom:none;}
.opt-lbl{font-size:14px;font-weight:600;}
.opt-desc{font-size:11px;color:var(--dim);margin-top:1px;}
/* 44px tall for the touch target, but the visible pill stays 28px: the
   transparent 8px padding is excluded from the painted area by
   background-clip:content-box. */
.switch{
  flex-shrink:0;width:48px;height:44px;border-radius:22px;border:none;
  padding:8px 0;background:var(--border-lit);background-clip:content-box;
  position:relative;transition:background .2s;
}
.switch.on{background:var(--amber-dk);background-clip:content-box;}
.switch::after{
  content:'';position:absolute;top:11px;left:3px;width:22px;height:22px;
  border-radius:50%;background:#fff;transition:transform .2s;
}
.switch.on::after{transform:translateX(20px);}
.seg{display:flex;gap:5px;flex-shrink:0;}
.seg-btn{
  padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;
  background:var(--panel2);border:1px solid var(--border);min-height:44px;
}
.seg-btn.on{background:var(--amber-dk);border-color:transparent;color:#fff;}

/* ---------- keyboard focus ----------
   The file shipped without a single :focus rule, so tabbing through the UI
   was invisible. :focus-visible keeps it off mouse/touch activation. */
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:8px;}

/* ---------- gamepad focus cursor ---------- */
.gp-focus{
  outline:2px solid var(--cyan) !important;
  outline-offset:2px;
  box-shadow:0 0 0 4px rgba(34,211,238,.18),0 0 18px rgba(34,211,238,.35) !important;
  border-radius:8px;
}
.pad-hint{
  display:none;gap:14px;justify-content:center;flex-wrap:wrap;
  padding:7px 10px;border-top:1px solid var(--border);
  background:rgba(34,211,238,.05);font-size:10px;color:var(--muted);
}
body.pad-on .pad-hint{display:flex;}
.pad-hint b{color:var(--cyan);font-weight:800;}

.empty{text-align:center;padding:26px 14px;color:var(--dim);font-size:12px;}
.hint{
  font-size:11px;color:var(--muted);background:rgba(34,211,238,.06);
  border:1px solid rgba(34,211,238,.18);border-radius:var(--r-sm);
  padding:9px 11px;margin-bottom:12px;
}
.locked-panel{text-align:center;padding:30px 16px;}
.locked-icon{font-size:40px;margin-bottom:10px;opacity:.5;}

/* ---------- desktop ---------- */
@media (min-width:900px){
  .content{padding:18px 20px 26px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;}
  .two-col .card{margin-bottom:0;}
}

/* ---------- reduced motion (in-game toggle) ----------
   The @media (prefers-reduced-motion) blocks above only answer to the OS.
   This class is what the Settings switch drives, and it has to out-rank the
   SCENE_CSS block that boot() injects into <head> after this stylesheet. */
body.no-motion *,
body.no-motion *::before,
body.no-motion *::after{
  animation:none !important;
  transition:none !important;
}
</style>
</head>
<body>

<!-- ============ MAIN MENU ============ -->
<div class="screen active" id="screen-menu">
  <div class="menu-box">
    <div class="logo-mark" id="menu-mark">ON THE DIAL</div>
    <h1 class="logo">CALLSIGNS</h1>
    <p class="tagline" id="menu-tagline"></p>
    <div class="onair-badge"><span class="onair-dot"></span><span id="menu-badge">ON AIR</span></div>
    <div class="menu-btns">
      <button class="mbtn primary" id="btn-new"></button>
      <button class="mbtn" id="btn-continue"></button>
      <button class="mbtn" id="btn-options"></button>
      <button class="mbtn" id="btn-quit"></button>
    </div>
    <p class="menu-foot" id="menu-foot"></p>
  </div>
</div>

<!-- ============ GAME ============ -->
<div class="screen" id="screen-game">
  <div class="hud">
    <div class="hud-row">
      <button class="hud-btn" id="btn-pause" aria-label="Menu">☰</button>
      <div class="station-id">
        <div class="station-call" id="hud-call">KXXX</div>
        <div class="station-sub" id="hud-sub"></div>
      </div>
      <span class="pause-chip" id="hud-paused" hidden>⏸ PAUSED</span>
      <div class="day-chip" id="hud-day">DAY 1</div>
    </div>
    <div class="stats-strip">
      <div class="stat cash"><span class="stat-val" id="stat-cash">$0</span><span class="stat-lbl" id="lbl-cash"></span></div>
      <div class="stat listeners"><span class="stat-val" id="stat-listeners">0</span><span class="stat-lbl" id="lbl-listeners"></span></div>
      <div class="stat rep"><span class="stat-val" id="stat-rep">0</span><span class="stat-lbl" id="lbl-rep"></span></div>
    </div>
  </div>

  <div class="content" id="game-content">
    <div class="wrap">
      <!-- The scene is its own host so render() can leave it alone: rebuilding
           it every tick restarted all twelve of its infinite animations. -->
      <div class="tabpane active" id="pane-studio"><div id="scene-host"></div><div id="studio-body"></div></div>
      <div class="tabpane" id="pane-gear"></div>
      <div class="tabpane" id="pane-staff"></div>
      <div class="tabpane" id="pane-empire"></div>
      <div class="tabpane" id="pane-log"></div>
    </div>
  </div>

  <div class="pad-hint">
    <span><b>A</b> Select</span><span><b>B</b> Back</span>
    <span><b>X</b> Pause</span><span><b>Y</b> Save</span>
    <span><b>LB/RB</b> Tabs</span><span><b>☰</b> Menu</span>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<!-- ============ OPTIONS ============ -->
<div class="screen" id="screen-options">
  <div class="hud">
    <div class="hud-row">
      <button class="hud-btn" id="btn-opt-back" aria-label="Back">←</button>
      <div class="station-id"><div class="station-call" id="opt-title"></div></div>
