<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0a0e27">
<title>Callsigns</title>
<style>
/* ============================================================
   CALLSIGNS — radio tycoon
   Palette shared with the station scene art:
   night #0a0e27/#1a1040 · amber #fbbf24 · magenta #ec4899 · cyan #22d3ee
   ============================================================ */
:root{
  --night:#0a0e27; --night2:#141a3a; --panel:#171d40; --panel2:#1e2550;
  --border:#2c3468; --border-lit:#3d4795;
  --amber:#fbbf24; --amber-dk:#f59e0b;
  --magenta:#ec4899; --cyan:#22d3ee; --green:#34d399; --red:#f87171;
  --text:#e8ecff; --muted:#8b93c4; --dim:#5d6598;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  --r:14px; --r-sm:9px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--night); color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:15px; line-height:1.45; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 70% 50% at 15% 0%,rgba(236,72,153,.10),transparent 60%),
    radial-gradient(ellipse 70% 50% at 85% 100%,rgba(34,211,238,.09),transparent 60%);
}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;cursor:pointer;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- screen router ---------- */
.screen{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;}
.screen.active{display:flex;}

/* ---------- main menu ---------- */
#screen-menu{align-items:center;justify-content:center;padding:24px;overflow-y:auto;}
.menu-box{width:100%;max-width:420px;text-align:center;padding:20px 0;}
.logo-mark{
  font-size:11px;letter-spacing:5px;color:var(--cyan);text-transform:uppercase;
  margin-bottom:6px;font-weight:700;
}
.logo{
  font-size:clamp(44px,13vw,68px);font-weight:900;letter-spacing:-2px;line-height:1;
  background:linear-gradient(135deg,var(--amber),var(--magenta) 55%,var(--cyan));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:10px;
}
.tagline{color:var(--muted);font-size:13px;margin-bottom:8px;}
.onair-badge{
  display:inline-flex;align-items:center;gap:7px;margin-bottom:28px;
  border:1px solid rgba(251,191,36,.4);background:rgba(251,191,36,.08);
  color:var(--amber);border-radius:20px;padding:5px 14px;
  font-size:10px;font-weight:800;letter-spacing:2px;
}
.onair-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);}
@media (prefers-reduced-motion:no-preference){
  .onair-dot{animation:pulseDot 1.8s ease-in-out infinite;}
  @keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
}
.menu-btns{display:flex;flex-direction:column;gap:11px;}
.mbtn{
  width:100%;padding:16px;border-radius:var(--r);font-weight:700;font-size:16px;
  background:var(--panel);border:1px solid var(--border);color:var(--text);
  transition:transform .12s,border-color .18s,background .18s;
  min-height:54px;
}
.mbtn:hover:not(:disabled),.mbtn:active:not(:disabled){background:var(--panel2);border-color:var(--border-lit);}
.mbtn:active:not(:disabled){transform:scale(.98);}
.mbtn:disabled{opacity:.35;cursor:not-allowed;}
.mbtn.primary{
  background:linear-gradient(135deg,var(--amber-dk),var(--magenta));
  border-color:transparent;color:#fff;
  box-shadow:0 6px 22px rgba(236,72,153,.28);
}
.mbtn.primary:hover,.mbtn.primary:active{filter:brightness(1.1);}
.menu-foot{margin-top:22px;font-size:11px;color:var(--dim);}

/* ---------- top HUD ---------- */
.hud{
  flex-shrink:0;background:rgba(10,14,39,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding-top:env(safe-area-inset-top,0px);
}
.hud-row{display:flex;align-items:center;gap:10px;padding:9px 12px;}
.hud-btn{
  flex-shrink:0;width:38px;height:38px;border-radius:10px;
  background:var(--panel);border:1px solid var(--border);
  display:grid;place-items:center;font-size:17px;
  transition:background .15s,border-color .15s;
}
.hud-btn:hover,.hud-btn:active{background:var(--panel2);border-color:var(--border-lit);}
.station-id{flex:1;min-width:0;}
.station-call{
  font-weight:900;font-size:17px;letter-spacing:1px;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.station-sub{font-size:10px;color:var(--muted);letter-spacing:.5px;}
.day-chip{
  flex-shrink:0;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--cyan);
  background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.3);
  border-radius:8px;padding:4px 9px;text-transform:uppercase;
}
.stats-strip{display:flex;border-top:1px solid var(--border);}
.stat{
  flex:1;min-width:0;padding:8px 6px;text-align:center;
  border-right:1px solid var(--border);
}
.stat:last-child{border-right:none;}
.stat-val{
  display:block;font-size:16px;font-weight:800;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:tabular-nums;
}
.stat-lbl{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.9px;margin-top:1px;}
.stat.cash .stat-val{color:var(--green);}
.stat.listeners .stat-val{color:var(--cyan);}
.stat.rep .stat-val{color:var(--amber);}
.delta{font-size:9px;font-weight:700;margin-left:3px;}
.delta.up{color:var(--green);} .delta.down{color:var(--red);}

/* ---------- content area ---------- */
.content{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 12px 20px;}
.tabpane{display:none;} .tabpane.active{display:block;}
.wrap{max-width:940px;margin:0 auto;}

/* ---------- cards ---------- */
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r);
  padding:14px;margin-bottom:12px;
}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px;}
.card-title{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);}
.card-note{font-size:11px;color:var(--dim);}

/* ---------- scene banner ---------- */
.scene-wrap{margin-bottom:12px;position:relative;}
.scene-caption{
  position:absolute;left:10px;bottom:10px;z-index:5;
  background:rgba(10,14,39,.8);backdrop-filter:blur(6px);
  border:1px solid var(--border-lit);border-radius:8px;padding:5px 11px;
  font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--amber);
}
.scene-fallback{
  width:100%;aspect-ratio:16/5;border-radius:12px;
  background:linear-gradient(160deg,#0a0e27,#1a1040);
  border:1px solid var(--border);display:grid;place-items:center;
  color:var(--dim);font-size:12px;
}

/* ---------- schedule grid ---------- */
.sched{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
@media (max-width:560px){.sched{grid-template-columns:repeat(2,1fr);}}
.slot{
  background:var(--panel2);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:10px 8px;text-align:center;transition:border-color .18s,transform .12s;
  min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
}
.slot:hover,.slot:active{border-color:var(--border-lit);}
.slot:active{transform:scale(.98);}
.slot-part{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-weight:700;}
.slot-icon{font-size:26px;line-height:1;}
.slot-show{font-size:12px;font-weight:800;}
.slot-meta{font-size:9px;color:var(--muted);}
.slot-dj{font-size:9px;color:var(--cyan);}

/* ---------- generic list rows ---------- */
.row{
  display:flex;align-items:center;gap:11px;padding:11px;
  background:var(--panel2);border:1px solid var(--border);border-radius:var(--r-sm);
  margin-bottom:8px;
}
.row:last-child{margin-bottom:0;}
.row-icon{
  flex-shrink:0;width:42px;height:42px;border-radius:10px;
  display:grid;place-items:center;font-size:20px;
  background:rgba(255,255,255,.05);border:1px solid var(--border);
}
.row-body{flex:1;min-width:0;}
.row-title{font-weight:700;font-size:14px;}
.row-sub{font-size:11px;color:var(--muted);}
.row-act{flex-shrink:0;display:flex;flex-direction:column;gap:5px;align-items:stretch;}

.btn{
  padding:8px 13px;border-radius:8px;font-size:12px;font-weight:700;
  background:var(--panel);border:1px solid var(--border-lit);color:var(--text);
  white-space:nowrap;transition:filter .15s,transform .1s;min-height:36px;
}
.btn:active:not(:disabled){transform:scale(.96);}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn.buy{background:linear-gradient(135deg,var(--amber-dk),var(--magenta));border-color:transparent;color:#fff;}
.btn.buy:hover:not(:disabled){filter:brightness(1.12);}
.btn.danger{border-color:rgba(248,113,113,.45);color:var(--red);}
.btn.ghost{background:transparent;}
.btn.sm{padding:5px 10px;font-size:11px;min-height:30px;}

/* ---------- meters ---------- */
.meter{height:6px;background:rgba(0,0,0,.35);border-radius:3px;overflow:hidden;margin-top:5px;}
.meter-fill{height:100%;border-radius:3px;transition:width .5s ease;}
.meter-fill.amber{background:linear-gradient(90deg,var(--amber-dk),var(--amber));}
.meter-fill.cyan{background:linear-gradient(90deg,#0891b2,var(--cyan));}
.meter-fill.magenta{background:linear-gradient(90deg,#be185d,var(--magenta));}

.pill{
  display:inline-block;font-size:9px;font-weight:800;letter-spacing:.8px;
  padding:2px 7px;border-radius:20px;text-transform:uppercase;
}
.pill.locked{background:rgba(248,113,113,.14);color:var(--red);border:1px solid rgba(248,113,113,.3);}
.pill.max{background:rgba(52,211,153,.14);color:var(--green);border:1px solid rgba(52,211,153,.3);}
.pill.new{background:rgba(34,211,238,.14);color:var(--cyan);border:1px solid rgba(34,211,238,.3);}

/* ---------- log ---------- */
.log-item{
  padding:9px 11px;border-left:2px solid var(--border-lit);
  background:var(--panel2);border-radius:0 var(--r-sm) var(--r-sm) 0;
  margin-bottom:7px;font-size:12px;
}
.log-item.good{border-left-color:var(--green);}
.log-item.bad{border-left-color:var(--red);}
.log-item.big{border-left-color:var(--amber);}
.log-day{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-weight:700;}

/* ---------- bottom tab bar ---------- */
.tabbar{
  flex-shrink:0;display:flex;background:rgba(10,14,39,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);padding-bottom:var(--safe-b);
}
.tab{
  flex:1;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--dim);transition:color .18s;position:relative;min-height:56px;justify-content:center;
}
.tab.active{color:var(--amber);}
.tab.active::before{
  content:'';position:absolute;top:0;left:22%;right:22%;height:2px;
  background:var(--amber);border-radius:0 0 3px 3px;
}
.tab-icon{font-size:19px;line-height:1;}
.tab-lbl{font-size:9px;font-weight:700;letter-spacing:.5px;}
.tab-badge{
  position:absolute;top:6px;right:50%;margin-right:-20px;
  width:7px;height:7px;border-radius:50%;background:var(--magenta);
}

/* ---------- modal ---------- */
.modal-back{
  position:fixed;inset:0;z-index:50;background:rgba(5,7,20,.78);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:18px;
}
.modal-back.open{display:flex;}
.modal{
  width:100%;max-width:440px;max-height:86vh;overflow-y:auto;
  background:var(--panel);border:1px solid var(--border-lit);border-radius:var(--r);
  padding:18px;
}
.modal-title{font-size:18px;font-weight:800;margin-bottom:5px;}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:15px;}
.modal-btns{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap;}
.modal-btns .btn{flex:1;min-width:110px;justify-content:center;}
@media (prefers-reduced-motion:no-preference){
  .modal-back.open .modal{animation:modalIn .22s cubic-bezier(.2,.9,.3,1.2);}
  @keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
}

/* ---------- toast ---------- */
.toasts{
  position:fixed;z-index:60;left:50%;transform:translateX(-50%);
  bottom:calc(74px + var(--safe-b));display:flex;flex-direction:column;gap:7px;
  pointer-events:none;width:calc(100% - 28px);max-width:400px;
}
.toast{
  background:var(--panel2);border:1px solid var(--border-lit);border-radius:10px;
  padding:9px 13px;font-size:12px;font-weight:600;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
}
.toast.good{border-color:rgba(52,211,153,.5);}
.toast.bad{border-color:rgba(248,113,113,.5);}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:toastIn .25s ease;}
  @keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
}

/* ---------- options ---------- */
.opt-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 0;border-bottom:1px solid var(--border);
}
.opt-row:last-child{border-bottom:none;}
.opt-lbl{font-size:14px;font-weight:600;}
.opt-desc{font-size:11px;color:var(--dim);margin-top:1px;}
.switch{
  flex-shrink:0;width:48px;height:28px;border-radius:14px;
  background:var(--border);border:1px solid var(--border-lit);
  position:relative;transition:background .2s;
}
.switch.on{background:var(--amber-dk);}
.switch::after{
  content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;
  border-radius:50%;background:#fff;transition:transform .2s;
}
.switch.on::after{transform:translateX(20px);}
.seg{display:flex;gap:5px;flex-shrink:0;}
.seg-btn{
  padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;
  background:var(--panel2);border:1px solid var(--border);min-height:34px;
}
.seg-btn.on{background:var(--amber-dk);border-color:transparent;color:#fff;}

/* ---------- gamepad focus cursor ---------- */
.gp-focus{
  outline:2px solid var(--cyan) !important;
  outline-offset:2px;
  box-shadow:0 0 0 4px rgba(34,211,238,.18),0 0 18px rgba(34,211,238,.35) !important;
  border-radius:8px;
}
.pad-hint{
  display:none;gap:14px;justify-content:center;flex-wrap:wrap;
  padding:7px 10px;border-top:1px solid var(--border);
  background:rgba(34,211,238,.05);font-size:10px;color:var(--muted);
}
body.pad-on .pad-hint{display:flex;}
.pad-hint b{color:var(--cyan);font-weight:800;}

.empty{text-align:center;padding:26px 14px;color:var(--dim);font-size:12px;}
.hint{
  font-size:11px;color:var(--muted);background:rgba(34,211,238,.06);
  border:1px solid rgba(34,211,238,.18);border-radius:var(--r-sm);
  padding:9px 11px;margin-bottom:12px;
}
.locked-panel{text-align:center;padding:30px 16px;}
.locked-icon{font-size:40px;margin-bottom:10px;opacity:.5;}

/* ---------- desktop ---------- */
@media (min-width:900px){
  .content{padding:18px 20px 26px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;}
  .two-col .card{margin-bottom:0;}
}
</style>
</head>
<body>

<!-- ============ MAIN MENU ============ -->
<div class="screen active" id="screen-menu">
  <div class="menu-box">
    <div class="logo-mark" id="menu-mark">ON THE DIAL</div>
    <h1 class="logo">CALLSIGNS</h1>
    <p class="tagline" id="menu-tagline"></p>
    <div class="onair-badge"><span class="onair-dot"></span><span id="menu-badge">ON AIR</span></div>
    <div class="menu-btns">
      <button class="mbtn primary" id="btn-new"></button>
      <button class="mbtn" id="btn-continue"></button>
      <button class="mbtn" id="btn-options"></button>
      <button class="mbtn" id="btn-quit"></button>
    </div>
    <p class="menu-foot" id="menu-foot"></p>
  </div>
</div>

<!-- ============ GAME ============ -->
<div class="screen" id="screen-game">
  <div class="hud">
    <div class="hud-row">
      <button class="hud-btn" id="btn-pause" aria-label="Menu">☰</button>
      <div class="station-id">
        <div class="station-call" id="hud-call">KXXX</div>
        <div class="station-sub" id="hud-sub"></div>
      </div>
      <div class="day-chip" id="hud-day">DAY 1</div>
    </div>
    <div class="stats-strip">
      <div class="stat cash"><span class="stat-val" id="stat-cash">$0</span><span class="stat-lbl" id="lbl-cash"></span></div>
      <div class="stat listeners"><span class="stat-val" id="stat-listeners">0</span><span class="stat-lbl" id="lbl-listeners"></span></div>
      <div class="stat rep"><span class="stat-val" id="stat-rep">0</span><span class="stat-lbl" id="lbl-rep"></span></div>
    </div>
  </div>

  <div class="content" id="game-content">
    <div class="wrap">
      <div class="tabpane active" id="pane-studio"></div>
      <div class="tabpane" id="pane-gear"></div>
      <div class="tabpane" id="pane-staff"></div>
      <div class="tabpane" id="pane-empire"></div>
      <div class="tabpane" id="pane-log"></div>
    </div>
  </div>

  <div class="pad-hint">
    <span><b>A</b> Select</span><span><b>B</b> Back</span>
    <span><b>X</b> Pause</span><span><b>Y</b> Save</span>
    <span><b>LB/RB</b> Tabs</span><span><b>☰</b> Menu</span>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<!-- ============ OPTIONS ============ -->
<div class="screen" id="screen-options">
  <div class="hud">
    <div class="hud-row">
      <button class="hud-btn" id="btn-opt-back" aria-label="Back">←</button>
      <div class="station-id"><div class="station-call" id="opt-title"></div></div>
    </div>
  </div>
  <div class="content">
    <div class="wrap"><div class="card" id="options-body"></div></div>
  </div>
</div>

<div class="modal-back" id="modal-back"><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts"></div>

<script>
/* Callsigns — pure-CSS station scene system.
   Two top-level consts: SCENE_CSS (all styles) and SCENE_TIERS (6 tiers).
   No canvas, no images, no external assets. All classes prefixed sc-. */

const SCENE_CSS = `
.sc-stage,.sc-stage *{box-sizing:border-box}
.sc-stage{position:relative;width:100%;aspect-ratio:16/5;overflow:hidden;border-radius:12px;
container-type:inline-size;line-height:1;isolation:isolate;
font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
font-size:11px;font-size:max(7px,1.45cqw);
background:linear-gradient(180deg,#070a1e 0%,#0f0c2e 58%,#1a1040 100%);
box-shadow:inset 0 0 0 1px rgba(148,163,255,.14)}
.sc-t1{background:linear-gradient(180deg,#070a1e 0%,#0f0c2e 58%,#1a1040 100%)}
.sc-t2{background:linear-gradient(180deg,#080b21 0%,#120e32 58%,#1a1040 100%)}
.sc-t3{background:linear-gradient(180deg,#0a0e27 0%,#161038 55%,#241452 100%)}
.sc-t4{background:linear-gradient(180deg,#0a0e27 0%,#1a1040 50%,#331a5e 100%)}
.sc-t5{background:linear-gradient(180deg,#0a0e27 0%,#1d1147 48%,#431a63 100%)}
.sc-t6{background:linear-gradient(180deg,#080b24 0%,#1a1040 42%,#5a1c66 100%)}

/* --- sky layers --- */
.sc-stars{position:absolute;inset:0 0 22% 0;z-index:0;opacity:.9;
background-image:radial-gradient(1px 1px at 22% 28%,#fff,transparent),radial-gradient(1px 1px at 68% 62%,rgba(255,255,255,.7),transparent),radial-gradient(1px 1px at 44% 84%,rgba(199,210,254,.55),transparent);
background-size:23% 41%,31% 57%,17% 33%}
.sc-t4 .sc-stars{opacity:.65}.sc-t5 .sc-stars{opacity:.5}.sc-t6 .sc-stars{opacity:.45}
.sc-glow{position:absolute;left:0;right:0;bottom:12%;height:52%;z-index:1;pointer-events:none;
background:radial-gradient(62% 100% at 50% 100%,rgba(236,72,153,.26),rgba(34,211,238,.11) 46%,transparent 74%)}
.sc-g-lo{opacity:.3}.sc-g-md{opacity:.6}.sc-g-hi{opacity:1}
.sc-g-max{opacity:1;background:radial-gradient(70% 100% at 50% 100%,rgba(251,191,36,.22),rgba(236,72,153,.3) 34%,rgba(34,211,238,.14) 60%,transparent 80%)}

/* --- ground / street --- */

const DAYPARTS = [

const SHOWS = {

const ROLES = {

const FIRST = ['Ray','Dot','Cleo','Miles','Junie','Hollis','Sable','Ike','Marnie','Cass','Ozzie','Wren',
  'Deke','Lula','Frankie','Nova','Bud','Reva','Sonny','Tess','Arlo','Vega','Moe','Birdie','Rex','Opal'];
const LAST = ['Vance','Okoye','Ramirez','Kwan','Delacroix','Boone','Ferraro','Njoku','Sharpe','Ellis',
  'Bright','Castellano','Mbeki','Duvall','Tran','Sorrentino','Fairbanks','Achebe','Lyle','Moreau'];

const EVENTS = [
  { id:'viral',    minDay:4,  w:10, type:'good',
    msg:'A clip from your {part} show is everywhere online. New listeners pour in.',
    apply:s=>{ s.listeners=Math.round(s.listeners*1.28)+40; s.rep=clamp(s.rep+3,0,100); } },
  { id:'sponsor',  minDay:6,  w:9,  type:'good',
    msg:'A local sponsor loved what they heard and paid up front.',
    apply:s=>{ s.cash+=Math.round(120+s.rep*22); } },
  { id:'guest',    minDay:10, w:7,  type:'good',
    msg:'A touring act dropped by the studio unannounced. The phones lit up.',
    apply:s=>{ s.rep=clamp(s.rep+4,0,100); s.listeners=Math.round(s.listeners*1.12)+20; } },
  { id:'offnight', minDay:5,  w:9,  type:'bad',
    msg:'{name} had a rough night on air. Dead air, twice.',
    apply:s=>{ s.rep=clamp(s.rep-2.5,0,100); s.listeners=Math.round(s.listeners*0.93); } },
  { id:'storm',    minDay:8,  w:7,  type:'bad',
    msg:'Weather knocked the signal down for part of the day.',
    apply:s=>{ s.listeners=Math.round(s.listeners*0.85); } },
  { id:'poached',  minDay:14, w:5,  type:'bad',
    msg:'A rival station has been calling your people. Morale dipped.',
    apply:s=>{ s.rep=clamp(s.rep-2,0,100); } },
  { id:'ratings',  minDay:12, w:8,  type:'good',
    msg:'The new ratings book came in better than anyone expected.',
    apply:s=>{ s.rep=clamp(s.rep+3.5,0,100); } },
  { id:'fine',     minDay:16, w:4,  type:'bad',
    msg:'A regulator took issue with an ad read. Small fine.',
    apply:s=>{ s.cash-=Math.round(80+s.rep*14); } }
];

// Economy scale. LISTENER_BASE sets how many people one "reach unit" of a
// perfect slot pulls; AD_VALUE is revenue per listener per ad-rate point.
// These two dominate balance — retune here, not in the formula.
const LISTENER_BASE = 260;
const AD_VALUE      = 0.42;

const UNLOCK_CASH = 150000;
const UNLOCK_REP  = 70;
const SAVE_KEY    = 'callsigns.save';
const SAVE_VER    = 1;
const SPEEDS      = { 1: 5000, 2: 2600, 3: 1400 };

/* ---------------- helpers ---------------- */

const $  = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const pick  = a => a[Math.floor(Math.random()*a.length)];
const randInt = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function money(n){
  const neg = n < 0; n = Math.abs(Math.round(n));
  let s;
  if (n >= 1e6) s = '$' + (n/1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M';
  else if (n >= 1e4) s = '$' + (n/1e3).toFixed(0) + 'k';
  else s = '$' + n.toLocaleString('en-US');
  return (neg ? '-' : '') + s;
}
function num(n){
  n = Math.round(n);
  if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if (n >= 1e4) return (n/1e3).toFixed(1) + 'k';
  return n.toLocaleString('en-US');
}
function randomCall(){
  const L = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  return pick(['K','W']) + pick(L.split('')) + pick(L.split('')) + pick(L.split(''));
}
/** Salary must stay well under the revenue a hire unlocks, or hiring is a
    trap and the whole staff pillar is dead weight. Tuned against balance.js. */
function salaryFor(role, skill){
  return Math.round(ROLES[role].baseSalary * (0.50 + skill * 0.18));
}
function hireFee(p){ return p.salary * 8; }
function trainCostFor(skill){ return Math.round(160 * Math.pow(1.5, skill)); }

function makePerson(role, repLevel){
  const spread = 2 + Math.floor(repLevel / 22);
  const skill = clamp(randInt(1, 3 + spread), 1, 10);
  return {
    id: 'p' + Math.random().toString(36).slice(2, 9),
    name: pick(FIRST) + ' ' + pick(LAST),
    role, skill,
    salary: salaryFor(role, skill)
  };
}

/* ---------------- state ---------------- */

let S = null;
let timer = null;
let candidates = [];

function newState(call){
  return {
    v: SAVE_VER,
    call: call || randomCall(),
    freq: (87.9 + Math.round(Math.random() * 60) * 0.2).toFixed(1),
    day: 1,
    cash: 800,
    listeners: 40,
    rep: 5,
    tx: 0, ant: 0,
    schedule: {
      morning: { show: 'music', dj: null },
      midday:  { show: 'music', dj: null },
      evening: { show: 'talk',  dj: null },
      night:   { show: 'music', dj: null }
    },
    staff: [],
    log: [],
    unlockedExpansion: false,
    lastDay: { listeners: 0, revenue: 0, costs: 0, net: 0, quality: 0 },
    opts: { speed: 1, autosave: true, eventPopups: true, reducedMotion: false },
    stats: { totalEarned: 0, peakListeners: 40, daysOnAir: 0 }
  };
}

/* ---------------- simulation ---------------- */

function staffOf(role){ return S.staff.filter(p => p.role === role); }
function bestSkill(role){
  const list = staffOf(role);
  return list.length ? Math.max(...list.map(p => p.skill)) : 0;
}
/** Best hire leads; each additional one in the role adds sharply less.
    Without this, a second engineer is pure salary with zero benefit. */
function roleStrength(role){
  return staffOf(role)
    .map(p => p.skill).sort((a, b) => b - a)
    .reduce((sum, s, i) => sum + s * Math.pow(0.40, i), 0);
}
function engBonus(){ return Math.min(0.42, roleStrength('eng') * 0.035); }
function salesFill(){ return clamp(0.30 + roleStrength('sales') * 0.062, 0.30, 0.98); }
function salesPrice(){ return 1 + roleStrength('sales') * 0.050; }

/** How many slots a DJ is booked on — working the whole day wears them down. */
function djLoad(id){
  return DAYPARTS.reduce((n, p) => n + (S.schedule[p.id].dj === id ? 1 : 0), 0);
}
function djFatigue(id){ return clamp(1 - 0.18 * (djLoad(id) - 1), 0.40, 1); }

function reachValue(){ return TX[S.tx].reach * (1 + engBonus() * 0.5); }
function fidelityValue(){ return ANT[S.ant].fid * (1 + engBonus()); }

function djFor(slot){
  if (!slot.dj) return null;
  return S.staff.find(p => p.id === slot.dj) || null;
}

/** One broadcast day. Returns a report object. */
function simulateDay(){
  const fid = fidelityValue();
  const reach = reachValue();
  const retention = clamp(fid * 0.78, 0.5, 1.65);
  const fill = salesFill();
  const price = salesPrice();

  let totalListeners = 0, revenue = 0, qualitySum = 0, repPressure = 0;

  for (const part of DAYPARTS) {
    const slot = S.schedule[part.id];
    const show = SHOWS[slot.show];
    const dj = djFor(slot);
    // Fatigue makes four dedicated DJs beat one host pulling a double shift.
    const djSkill = dj ? dj.skill * djFatigue(dj.id) : 0;
    // No DJ is a real penalty, not a zero — automation still airs something.
    const quality = show.appeal * (dj ? 0.58 + djSkill * 0.052 : 0.32);

    const potential = LISTENER_BASE * reach * part.weight * (1 + S.rep / 62);
    const slotListeners = potential * quality * retention;

    totalListeners += slotListeners;
    qualitySum += quality;
    repPressure += show.rep * (dj ? 1 + djSkill * 0.05 : 0.6);
    revenue += slotListeners * show.adRate * AD_VALUE * fill * price * (1 + S.rep / 140);
  }

  const avgListeners = totalListeners / DAYPARTS.length;
  const avgQuality = qualitySum / DAYPARTS.length;

  // Equipment hiccup — engineer both lowers the odds and can catch it.
  let breakdown = null;
  const breakRisk = clamp(0.055 - engBonus() * 0.09, 0.006, 0.055);
  if (Math.random() < breakRisk) {
    const caught = Math.random() < bestSkill('eng') * 0.07;
    if (caught) breakdown = { caught: true };
    else {
      breakdown = { caught: false, gear: Math.random() < 0.5 ? TX[S.tx].name : ANT[S.ant].name };
      revenue *= 0.7;
    }
  }

  const costs = S.staff.reduce((a, p) => a + p.salary, 0);
  const net = revenue - costs;

  S.cash += net;
  S.listeners = Math.round(avgListeners * (breakdown && !breakdown.caught ? 0.82 : 1));
  // Reputation drifts toward what you actually put on air — no free upward
  // creep, or an unstaffed all-music station would coast into every rep gate.
  const avgPressure = repPressure / DAYPARTS.length;
  const repTarget = clamp(avgQuality * 78 + avgPressure * 14, 0, 100);
  S.rep = clamp(S.rep + (repTarget - S.rep) * 0.05, 0, 100);
  S.day++;
  S.stats.daysOnAir++;
  if (revenue > 0) S.stats.totalEarned += revenue;
  S.stats.peakListeners = Math.max(S.stats.peakListeners, S.listeners);
  S.lastDay = { listeners: S.listeners, revenue, costs, net, quality: avgQuality };

  return { breakdown, net, revenue, costs };
}

function rollEvent(){
  if (S.day < 4 || Math.random() > 0.17) return null;
  const pool = EVENTS.filter(e => S.day >= e.minDay);
  if (!pool.length) return null;
  const total = pool.reduce((a, e) => a + e.w, 0);
  let r = Math.random() * total;
  const ev = pool.find(e => (r -= e.w) <= 0) || pool[0];

  const djs = staffOf('dj');
  const vars = {
    part: t('part' + pick(DAYPARTS).id.replace(/^./, c => c.toUpperCase())),
    name: djs.length ? pick(djs).name : 'Your overnight host'
  };
  ev.apply(S);
  return { id: ev.id, type: ev.type, msg: t2(ev.msg, vars) };
}
// Event copy is inline (not in STR) so it stays adjacent to its effect;
// still routed through a formatter so a localization pass has one seam.
function t2(str, vars){
  for (const k in vars) str = str.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]);
  return str;
}

function addLog(msg, kind){
  S.log.unshift({ day: S.day, msg, kind: kind || '' });
  if (S.log.length > 60) S.log.length = 60;
}

function checkUnlock(){
  if (!S.unlockedExpansion && S.cash >= UNLOCK_CASH && S.rep >= UNLOCK_REP) {
    S.unlockedExpansion = true;
    addLog('Expansion unlocked — you can found a second station.', 'big');
    toast('🏆 ' + t('unlockedTitle'), 'good');
    openModal(
      t('unlockedTitle'),
      t('unlockedSub'),
      '<p style="font-size:13px;color:var(--muted);margin-top:10px">' + esc(t('comingSoonNote')) + '</p>',
      [{ label: t('close'), cls: 'buy', act: closeModal }]
    );
    pauseTick();
    return true;
  }
  return false;
}

/* ---------------- game loop ---------------- */

let running = false;

function tick(){
  const rep = simulateDay();

  if (rep.breakdown) {
    if (rep.breakdown.caught) addLog(t('breakdownFixed'), 'good');
    else { addLog(t('breakdownMsg', { gear: rep.breakdown.gear }), 'bad'); toast('⚠️ ' + t('breakdownMsg', { gear: rep.breakdown.gear }), 'bad'); }
  }

  const ev = rollEvent();
  if (ev) {
    addLog(ev.msg, ev.type);
    if (S.opts.eventPopups) {
      pauseTick();
      openModal(
        ev.type === 'good' ? '📻 Good news' : '📻 Trouble',
        ev.msg, '',
        [{ label: t('resume'), cls: 'buy', act: () => { closeModal(); resumeTick(); } }]
      );
    } else {
      toast((ev.type === 'good' ? '📈 ' : '📉 ') + ev.msg, ev.type);
    }
  }

  if (S.day % 7 === 0) refreshCandidates();
  if (S.opts.autosave && S.day % 5 === 0) saveGame(true);
  checkUnlock();
  render();
}

function startTick(){
  stopTick();
  running = true;
  timer = setInterval(tick, SPEEDS[S.opts.speed] || SPEEDS[1]);
}
function stopTick(){ if (timer) clearInterval(timer); timer = null; }
function pauseTick(){ running = false; stopTick(); }
function resumeTick(){ if (!running) startTick(); }

/* ---------------- save / load ---------------- */

function saveGame(silent){
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(S));
    if (!silent) toast('💾 ' + t('saved'), 'good');
    return true;
  } catch (e) { toast('Save failed: ' + e.message, 'bad'); return false; }
}
function loadGame(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || typeof data !== 'object') return null;
    return migrate(data);
  } catch (e) { return null; }
}
function migrate(data){
  // Fill anything a newer version added so old saves keep loading.
  const base = newState(data.call);
  const merged = Object.assign(base, data);
  merged.opts = Object.assign(base.opts, data.opts || {});
  merged.stats = Object.assign(base.stats, data.stats || {});
  merged.schedule = Object.assign(base.schedule, data.schedule || {});
  merged.v = SAVE_VER;
  return merged;
}
function hasSave(){ try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
function wipeSave(){ try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

/* ---------------- scene ---------------- */

function sceneTier(){
  // Progression reads off the whole picture, not one stat.
  const invested = TX.slice(0, S.tx + 1).reduce((a,x)=>a+x.cost,0) + ANT.slice(0, S.ant + 1).reduce((a,x)=>a+x.cost,0);
  const score = (S.tx + S.ant) * 12 + S.rep * 0.9 + Math.log10(Math.max(10, S.listeners)) * 14 + Math.log10(Math.max(10, invested + 1)) * 5;
  if (S.unlockedExpansion || score >= 118) return 5;
  if (score >= 96) return 4;
  if (score >= 74) return 3;
  if (score >= 52) return 2;
  if (score >= 32) return 1;
  return 0;
}

function renderScene(){
  const tier = sceneTier();
  const have = typeof SCENE_TIERS !== 'undefined' && SCENE_TIERS && SCENE_TIERS[tier];
  if (!have) return '<div class="scene-wrap"><div class="scene-fallback">📡</div></div>';
  // The art ships with placeholder branding baked into the billboards and
  // vehicle wraps — swap in this station's identity so the city advertises YOU.
  const art = SCENE_TIERS[tier].html
    .replace(/CALLSIGNS/g, esc(S.call))
    .replace(/98\.6 FM/g, esc(S.freq + ' FM'))
    .replace(/98\.6/g, esc(S.freq));
  const name = t('scenes.' + SCENE_TIERS[tier].id);
  return '<div class="scene-wrap">' + art +
    '<div class="scene-caption">' + esc(name) + '</div></div>';
}

/* ---------------- UI: shell ---------------- */

const TABS = [
  { id: 'studio', icon: '🎚️', lbl: 'tabStudio' },
  { id: 'gear',   icon: '📡', lbl: 'tabGear' },
  { id: 'staff',  icon: '👥', lbl: 'tabStaff' },
  { id: 'empire', icon: '🏙️', lbl: 'tabEmpire' },
  { id: 'log',    icon: '📋', lbl: 'tabLog' }
];
let activeTab = 'studio';

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === 'screen-' + id));
}

function buildTabs(){
  $('tabbar').innerHTML = TABS.map(tb =>
    '<button class="tab' + (tb.id === activeTab ? ' active' : '') + '" data-tab="' + tb.id + '">' +
      '<span class="tab-icon">' + tb.icon + '</span>' +
      '<span class="tab-lbl">' + esc(t(tb.lbl)) + '</span>' +
      (tb.id === 'empire' && S && S.unlockedExpansion ? '<span class="tab-badge"></span>' : '') +
    '</button>'
  ).join('');
}

function setTab(id){
  activeTab = id;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.tabpane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + id));
  $('game-content').scrollTop = 0;
  render();
}

/* ---------------- UI: render ---------------- */

function render(){
  if (!S) return;
  $('hud-call').textContent = S.call;
  $('hud-sub').textContent = TX[S.tx].spec + ' · ' + ANT[S.ant].name;
  $('hud-day').textContent = t('dayShort', { n: S.day });
  $('stat-cash').textContent = money(S.cash);
  $('stat-listeners').textContent = num(S.listeners);
  $('stat-rep').textContent = Math.round(S.rep);

  if (activeTab === 'studio') $('pane-studio').innerHTML = viewStudio();
  if (activeTab === 'gear')   $('pane-gear').innerHTML   = viewGear();
  if (activeTab === 'staff')  $('pane-staff').innerHTML  = viewStaff();
  if (activeTab === 'empire') $('pane-empire').innerHTML = viewEmpire();
  if (activeTab === 'log')    $('pane-log').innerHTML    = viewLog();
  buildTabs();
}

function gearCard(key, arr, idx, title, icon, statKey){
  const cur = arr[idx];
  const next = arr[idx + 1];
  const maxed = !next;
  const affordable = next && S.cash >= next.cost;
  const repOk = next && S.rep >= next.rep;

  let h = '<div class="card"><div class="card-head">' +
    '<span class="card-title">' + icon + ' ' + esc(title) + '</span>' +
    '<span class="card-note">' + esc(maxed ? t('maxTier') : t('tierOf', { a: idx + 1, b: arr.length })) + '</span>' +
    '</div>';

  h += '<div class="row"><div class="row-icon">' + icon + '</div><div class="row-body">' +
    '<div class="row-title">' + esc(cur.name) + '</div>' +
    '<div class="row-sub">' + esc(cur.spec) + ' · ' +
      (statKey === 'reach' ? t('reach') + ' ' + cur.reach.toFixed(2) + '×' : t('fidelity') + ' ' + cur.fid.toFixed(2) + '×') +
    '</div>' +
    '<div class="meter"><div class="meter-fill ' + (statKey === 'reach' ? 'magenta' : 'cyan') + '" style="width:' + ((idx + 1) / arr.length * 100) + '%"></div></div>' +
  '</div></div>';

  if (maxed) {
    h += '<div style="text-align:center;padding:10px"><span class="pill max">' + esc(t('maxTier')) + '</span></div>';
  } else {
    const gain = statKey === 'reach'
      ? t('boostReach', { n: Math.round((next.reach / cur.reach - 1) * 100) })
      : t('boostFid',   { n: Math.round((next.fid   / cur.fid   - 1) * 100) });
    h += '<div class="row" style="margin-top:8px">' +
      '<div class="row-icon">⬆️</div>' +
      '<div class="row-body">' +
        '<div class="row-title">' + esc(next.name) + '</div>' +
        '<div class="row-sub" style="color:var(--green)">' + esc(gain) + ' · ' + esc(next.spec) + '</div>' +
        (!repOk ? '<div class="row-sub" style="color:var(--red)">' + esc(t('needRep', { n: next.rep })) + '</div>' : '') +
      '</div>' +
      '<div class="row-act">' +
        '<button class="btn buy" data-buy="' + key + '"' + (affordable && repOk ? '' : ' disabled') + '>' +
          money(next.cost) +
        '</button>' +
      '</div>' +
    '</div>';
  }
  return h + '</div>';
}

  h += '<div class="card"><div class="card-head">' +

  if (!S.staff.length) {
    h += '<div class="empty">—</div>';

/* ---------------- modals & toasts ---------------- */

let modalActions = [];

function openModal(title, sub, bodyHtml, actions){
  modalActions = actions || [];
  $('modal').innerHTML =
    '<div class="modal-title">' + esc(title) + '</div>' +
    (sub ? '<div class="modal-sub">' + esc(sub) + '</div>' : '') +
    (bodyHtml || '') +
    '<div class="modal-btns">' + modalActions.map((a, i) =>
      '<button class="btn ' + (a.cls || '') + '" data-modal-act="' + i + '">' + esc(a.label) + '</button>'
    ).join('') + '</div>';
  $('modal-back').classList.add('open');
}
function closeModal(){ $('modal-back').classList.remove('open'); modalActions = []; }

function toast(msg, kind){
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3400);
}

/* ---------------- actions ---------------- */

function refreshCandidates(){
  const n = randInt(2, 3);
  candidates = [];
  const roles = ['dj', 'eng', 'sales'];
  for (let i = 0; i < n; i++) candidates.push(makePerson(pick(roles), S.rep));
  // Always keep a DJ available early — the game is unreadable without one.
  if (S.day < 12 && !candidates.some(c => c.role === 'dj')) candidates[0] = makePerson('dj', S.rep);
}

function buyGear(key){
  const arr = key === 'tx' ? TX : ANT;
  const idx = key === 'tx' ? S.tx : S.ant;
  const next = arr[idx + 1];
  if (!next || S.cash < next.cost || S.rep < next.rep) return;
  S.cash -= next.cost;
  if (key === 'tx') S.tx++; else S.ant++;
  addLog('Upgraded to ' + next.name + '.', 'big');
  toast('📡 ' + next.name + ' installed', 'good');
  saveGame(true);
  render();
}

function hirePerson(id){
  const p = candidates.find(c => c.id === id);
  if (!p) return;
  const fee = hireFee(p);
  if (S.cash < fee) return;
  S.cash -= fee;
  S.staff.push(p);
  candidates = candidates.filter(c => c.id !== id);
  addLog(t('hiredMsg', { name: p.name, role: roleName(p.role) }), 'good');
  toast(ROLES[p.role].icon + ' ' + t('hiredMsg', { name: p.name, role: roleName(p.role) }), 'good');
  saveGame(true);
  render();
}

function firePerson(id){
  const p = S.staff.find(x => x.id === id);
  if (!p) return;
  openModal(t('fireConfirm', { name: p.name }), t('fireConfirmSub'), '', [
    { label: t('cancel'), cls: 'ghost', act: closeModal },
    { label: t('fire'), cls: 'danger', act: () => {
        S.staff = S.staff.filter(x => x.id !== id);
        for (const k in S.schedule) if (S.schedule[k].dj === id) S.schedule[k].dj = null;
        addLog(t('firedMsg', { name: p.name }), 'bad');
        closeModal(); saveGame(true); render();
      } }
  ]);
}

function trainPerson(id){
  const p = S.staff.find(x => x.id === id);
  if (!p || p.skill >= 10) return;
  const cost = trainCostFor(p.skill);
  if (S.cash < cost) return;
  S.cash -= cost;
  p.skill++;
  p.salary = salaryFor(p.role, p.skill);
  addLog(t('trainedMsg', { name: p.name, n: p.skill }), 'good');
  toast('📈 ' + t('trainedMsg', { name: p.name, n: p.skill }), 'good');
  saveGame(true);
  render();
}

function openSlotEditor(partId){
  const part = DAYPARTS.find(p => p.id === partId);
  const partName = t('part' + partId.charAt(0).toUpperCase() + partId.slice(1));
  const slot = S.schedule[partId];

  let body = '<div style="margin-bottom:6px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-weight:700">Show</div>';
  for (const key in SHOWS) {
    const sh = SHOWS[key];
    const on = slot.show === key;
    body += '<div class="row" data-setshow="' + key + '" style="cursor:pointer' + (on ? ';border-color:var(--amber)' : '') + '">' +
      '<div class="row-icon">' + sh.icon + '</div>' +
      '<div class="row-body">' +
        '<div class="row-title">' + esc(t('show' + key.charAt(0).toUpperCase() + key.slice(1))) + (on ? ' ✓' : '') + '</div>' +
        '<div class="row-sub">' + esc(t('show' + key.charAt(0).toUpperCase() + key.slice(1) + 'Desc')) + '</div>' +
      '</div></div>';
  }

  const djs = staffOf('dj');
  body += '<div style="margin:14px 0 6px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-weight:700">DJ</div>';
  if (!djs.length) {
    body += '<div class="empty" style="padding:14px">' + esc(t('unstaffed')) + '</div>';
  } else {
    body += '<div class="row" data-setdj="" style="cursor:pointer' + (!slot.dj ? ';border-color:var(--amber)' : '') + '">' +
      '<div class="row-icon">🚫</div><div class="row-body"><div class="row-title">' + esc(t('noDj')) + (!slot.dj ? ' ✓' : '') + '</div>' +
      '<div class="row-sub">' + esc(t('unstaffed')) + '</div></div></div>';
    for (const p of djs) {
      const on = slot.dj === p.id;
      const elsewhere = Object.keys(S.schedule).filter(k => k !== partId && S.schedule[k].dj === p.id).length;
      body += '<div class="row" data-setdj="' + p.id + '" style="cursor:pointer' + (on ? ';border-color:var(--amber)' : '') + '">' +
        '<div class="row-icon">🎧</div><div class="row-body">' +
        '<div class="row-title">' + esc(p.name) + (on ? ' ✓' : '') + '</div>' +
        '<div class="row-sub">' + esc(t('skill', { n: p.skill })) + (elsewhere ? ' · on ' + elsewhere + ' other slot' + (elsewhere > 1 ? 's' : '') : '') + '</div>' +
        '</div></div>';
    }
  }

  openModal(partName, t('pickShowSub', { part: partName }), body, [
    { label: t('close'), cls: 'buy', act: () => { closeModal(); saveGame(true); render(); } }
  ]);
  $('modal').dataset.slot = partId;
}

/* ---------------- flows ---------------- */

function promptNewGame(){
  const start = () => {
    const input = document.querySelector('#modal input');
    let call = (input && input.value.trim().toUpperCase()) || randomCall();
    call = call.replace(/[^A-Z]/g, '').slice(0, 4) || randomCall();
    S = newState(call);
    refreshCandidates();
    addLog('You signed on the air as ' + call + '.', 'big');
    closeModal();
    enterGame();
  };

  const body = '<input id="call-input" maxlength="4" placeholder="' + randomCall() + '" ' +
    'style="width:100%;padding:14px;border-radius:10px;background:var(--panel2);border:1px solid var(--border-lit);' +
    'color:var(--text);font-size:22px;font-weight:900;letter-spacing:5px;text-align:center;text-transform:uppercase;font-family:inherit">';

  openModal(t('newStationTitle'), t('newStationSub'), body, [
    { label: t('randomize'), cls: 'ghost', act: () => { const i = document.querySelector('#modal input'); if (i) i.value = randomCall(); } },
    { label: t('start'), cls: 'buy', act: start }
  ]);
  setTimeout(() => { const i = document.querySelector('#modal input'); if (i) i.focus(); }, 60);
}

function enterGame(){
  if (!candidates.length) refreshCandidates();
  applyMotionPref();
  showScreen('game');
  activeTab = 'studio';
  buildTabs();
  setTab('studio');
  startTick();
}

function openPauseMenu(){
  pauseTick();
  openModal(t('paused'), S.call + ' · ' + t('day', { n: S.day }), '', [
    { label: t('resume'), cls: 'buy', act: () => { closeModal(); resumeTick(); } },
    { label: t('save'), cls: '', act: () => { saveGame(); } },
    { label: t('options'), cls: '', act: () => { closeModal(); openOptions('game'); } },
    { label: t('mainMenu'), cls: 'danger', act: () => {
        saveGame(true); closeModal(); stopTick(); showScreen('menu'); refreshMenu();
      } }
  ]);
}

/* ---------------- options ---------------- */

let optionsReturn = 'menu';

function openOptions(from){
  optionsReturn = from || 'menu';
  $('opt-title').textContent = t('optTitle');
  renderOptions();
  showScreen('options');
}

function renderOptions(){
  const o = S ? S.opts : loadOpts();
  let h = '';
  h += '<div class="opt-row"><div><div class="opt-lbl">' + esc(t('optSpeed')) + '</div><div class="opt-desc">' + esc(t('optSpeedDesc')) + '</div></div>' +
    '<div class="seg">' + [1,2,3].map(v =>
      '<button class="seg-btn' + (o.speed === v ? ' on' : '') + '" data-speed="' + v + '">' + v + '×</button>'
    ).join('') + '</div></div>';

  h += optToggle('autosave', o.autosave, t('optAutosave'), t('optAutosaveDesc'));
  h += optToggle('eventPopups', o.eventPopups, t('optEvents'), t('optEventsDesc'));
  h += optToggle('reducedMotion', o.reducedMotion, t('optMotion'), t('optMotionDesc'));

  h += '<div class="opt-row"><div><div class="opt-lbl">' + esc(t('optWipe')) + '</div><div class="opt-desc">' + esc(t('optWipeDesc')) + '</div></div>' +
    '<button class="btn danger" id="btn-wipe">' + esc(t('wipe')) + '</button></div>';

  $('options-body').innerHTML = h;
}

function optToggle(key, val, label, desc){
  return '<div class="opt-row"><div><div class="opt-lbl">' + esc(label) + '</div><div class="opt-desc">' + esc(desc) + '</div></div>' +
    '<button class="switch' + (val ? ' on' : '') + '" data-opt="' + key + '" aria-pressed="' + !!val + '"></button></div>';
}

function loadOpts(){
  const s = loadGame();
  return s ? s.opts : newState().opts;
}

function applyMotionPref(){
  if (!S) return;
  document.documentElement.style.setProperty('--motion', S.opts.reducedMotion ? 'none' : 'initial');
  document.body.classList.toggle('no-motion', !!S.opts.reducedMotion);
}

/* ---------------- menu ---------------- */

function refreshMenu(){
  $('menu-tagline').textContent = t('tagline');
  $('menu-badge').textContent = t('onair');
  $('menu-foot').textContent = t('foot');
  $('btn-new').textContent = t('newGame');
  $('btn-continue').textContent = t('continueGame');
  $('btn-options').textContent = t('options');
  $('btn-quit').textContent = t('quit');
  $('lbl-cash').textContent = t('cash');
  $('lbl-listeners').textContent = t('listeners');
  $('lbl-rep').textContent = t('rep');

  const save = hasSave();
  $('btn-continue').disabled = !save;
  if (save) {
    try {
      const d = JSON.parse(localStorage.getItem(SAVE_KEY));
      $('btn-continue').textContent = t('continueGame') + ' · ' + d.call + ' · ' + t('day', { n: d.day });
    } catch (e) {}
  }
}

/* ---------------- events ---------------- */

function wire(){
  $('btn-new').onclick = () => {
    if (hasSave()) {
      openModal(t('newGame'), 'Starting fresh overwrites your current station.', '', [
        { label: t('cancel'), cls: 'ghost', act: closeModal },
        { label: t('newGame'), cls: 'danger', act: () => { closeModal(); promptNewGame(); } }
      ]);
    } else promptNewGame();
  };
  $('btn-continue').onclick = () => {
    const s = loadGame();
    if (!s) { toast(t('loadFail'), 'bad'); return; }
    S = s; refreshCandidates(); enterGame();
  };
  $('btn-options').onclick = () => openOptions('menu');
  $('btn-quit').onclick = () => {
    if (S) saveGame(true);
    openModal(t('quit'), 'Your station is saved. You can close this tab.', '', [
      { label: t('close'), cls: 'buy', act: closeModal }
    ]);
  };
  $('btn-pause').onclick = openPauseMenu;
  $('btn-opt-back').onclick = () => {
    if (S) { saveGame(true); applyMotionPref(); }
    if (optionsReturn === 'game') { showScreen('game'); render(); resumeTick(); }
    else { showScreen('menu'); refreshMenu(); }
  };

  // Delegated clicks — the whole UI is re-rendered HTML, so nothing binds directly.
  document.addEventListener('click', e => {
    const tab = e.target.closest('[data-tab]');
    if (tab) return setTab(tab.dataset.tab);

    const act = e.target.closest('[data-modal-act]');
    if (act) { const a = modalActions[+act.dataset.modalAct]; if (a && a.act) a.act(); return; }

    const buy = e.target.closest('[data-buy]');
    if (buy && !buy.disabled) return buyGear(buy.dataset.buy);

    const hireB = e.target.closest('[data-hire]');
    if (hireB && !hireB.disabled) return hirePerson(hireB.dataset.hire);

    const fireB = e.target.closest('[data-fire]');
    if (fireB) return firePerson(fireB.dataset.fire);

    const trainB = e.target.closest('[data-train]');
    if (trainB && !trainB.disabled) return trainPerson(trainB.dataset.train);

    const slotEl = e.target.closest('[data-slot]');
    if (slotEl) return openSlotEditor(slotEl.dataset.slot);

    const setShow = e.target.closest('[data-setshow]');
    if (setShow) {
      const part = $('modal').dataset.slot;
      S.schedule[part].show = setShow.dataset.setshow;
      openSlotEditor(part);
      return;
    }
    const setDj = e.target.closest('[data-setdj]');
    if (setDj) {
      const part = $('modal').dataset.slot;
      S.schedule[part].dj = setDj.dataset.setdj || null;
      openSlotEditor(part);
      return;
    }

    const sp = e.target.closest('[data-speed]');
    if (sp) {
      const v = +sp.dataset.speed;
      if (S) { S.opts.speed = v; if (running) startTick(); }
      renderOptions();
      return;
    }
    const op = e.target.closest('[data-opt]');
    if (op) {
      if (S) { S.opts[op.dataset.opt] = !S.opts[op.dataset.opt]; applyMotionPref(); }
      renderOptions();
      return;
    }
    if (e.target.closest('#btn-wipe')) {
      openModal(t('wipeConfirm'), t('wipeConfirmSub'), '', [
        { label: t('cancel'), cls: 'ghost', act: closeModal },
        { label: t('wipe'), cls: 'danger', act: () => {
            wipeSave(); S = null; stopTick(); closeModal(); showScreen('menu'); refreshMenu();
          } }
      ]);
      return;
    }
    if (e.target === $('modal-back')) closeModal();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if ($('modal-back').classList.contains('open')) closeModal();
      else if ($('screen-game').classList.contains('active')) openPauseMenu();
    }
  });

  // Don't keep simulating in a hidden tab.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (running) { stopTick(); running = true; } }
    else if (running) startTick();
  });
  window.addEventListener('beforeunload', () => { if (S) saveGame(true); });
}

/* ---------------- gamepad (Xbox / standard mapping) ----------------
   The whole UI is DOM, so the pad drives a focus cursor rather than a
   character. Spatial nav (nearest element in the pressed direction) keeps
   the 2x2 schedule grid feeling right instead of a flat list walk.
   A=activate  B=back  X=pause/resume  Y=save  LB/RB=tabs  Start=menu     */

const PAD = { A:0, B:1, X:2, Y:3, LB:4, RB:5, BACK:8, START:9, UP:12, DOWN:13, LEFT:14, RIGHT:15 };
const FOCUS_SEL = '.mbtn:not(:disabled), .tab, .btn:not(:disabled), .slot, .switch, .seg-btn, .hud-btn, [data-setshow], [data-setdj]';

let padOn = false;
let padIdx = -1;
let prevBtn = {};
let repeatAt = 0;

function padScope(){
  if ($('modal-back').classList.contains('open')) return $('modal');
  if ($('screen-menu').classList.contains('active')) return $('screen-menu');
  if ($('screen-options').classList.contains('active')) return $('screen-options');
  return $('screen-game');
}
function focusables(){
  return Array.from(padScope().querySelectorAll(FOCUS_SEL))
    .filter(el => el.offsetParent !== null && !el.disabled);
}
function currentFocus(){
  const list = focusables();
  return { list, el: list[padIdx] || null };
}
function paintFocus(el){
  document.querySelectorAll('.gp-focus').forEach(n => n.classList.remove('gp-focus'));
  if (!el) return;
  el.classList.add('gp-focus');
  el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
function setFocus(i){
  const list = focusables();
  if (!list.length) { padIdx = -1; paintFocus(null); return; }
  padIdx = clamp(i, 0, list.length - 1);
  paintFocus(list[padIdx]);
}

/** Nearest focusable in a direction, weighting cross-axis drift heavily so
    "down" prefers the thing below rather than something far to the side. */
function moveFocus(dx, dy){
  const { list, el } = currentFocus();
  if (!list.length) return;
  if (!el) return setFocus(0);
  const a = el.getBoundingClientRect();
  const ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best = null, bestScore = Infinity;
  list.forEach((n, i) => {
    if (n === el) return;
    const r = n.getBoundingClientRect();
    const bx = r.left + r.width / 2, by = r.top + r.height / 2;
    const along = (bx - ax) * dx + (by - ay) * dy;
    if (along <= 4) return;                       // not in the pressed direction
    const cross = Math.abs((bx - ax) * dy - (by - ay) * dx);
    const score = along + cross * 3;
    if (score < bestScore) { bestScore = score; best = i; }
  });
  if (best !== null) setFocus(best);
}

function padActivate(){
  const { el } = currentFocus();
  if (!el) return setFocus(0);
  el.click();
  // The click almost always re-renders; re-anchor onto the same position.
  setTimeout(() => setFocus(padIdx), 30);
}
function padBack(){
  if ($('modal-back').classList.contains('open')) {
    // Prefer the modal's own cancel/close so its side effects still run.
    const btns = Array.from($('modal').querySelectorAll('[data-modal-act]'));
    const cancel = btns.find(b => /cancel|close|resume/i.test(b.textContent));
    if (cancel) cancel.click(); else closeModal();
  } else if ($('screen-options').classList.contains('active')) {
    $('btn-opt-back').click();
  } else if ($('screen-game').classList.contains('active')) {
    openPauseMenu();
  }
  setTimeout(() => setFocus(0), 40);
}
function cycleTab(dir){
  if (!$('screen-game').classList.contains('active')) return;
  if ($('modal-back').classList.contains('open')) return;
  const i = TABS.findIndex(x => x.id === activeTab);
  setTab(TABS[(i + dir + TABS.length) % TABS.length].id);
  setTimeout(() => setFocus(0), 40);
}

function pollPad(){
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  const gp = Array.from(pads).find(p => p && p.connected);
  if (gp) {
    if (!padOn) {
      padOn = true;
      document.body.classList.add('pad-on');
      toast('🎮 Controller connected — A select, B back, LB/RB tabs', 'good');
      setFocus(0);
    }
    const down = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
    const hit = i => { const d = down(i); const was = prevBtn[i]; prevBtn[i] = d; return d && !was; };

    // Stick + d-pad share a repeat timer so held input scrolls at a sane rate.
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    const DZ = 0.55;
    let dx = 0, dy = 0;
    if (down(PAD.LEFT) || ax < -DZ) dx = -1;
    else if (down(PAD.RIGHT) || ax > DZ) dx = 1;
    else if (down(PAD.UP) || ay < -DZ) dy = -1;
    else if (down(PAD.DOWN) || ay > DZ) dy = 1;

    const now = performance.now();
    if (dx || dy) {
      if (now >= repeatAt) { moveFocus(dx, dy); repeatAt = now + (repeatAt ? 140 : 340); }
    } else repeatAt = 0;

    if (hit(PAD.A)) padActivate();
    if (hit(PAD.B)) padBack();
    if (hit(PAD.LB)) cycleTab(-1);
    if (hit(PAD.RB)) cycleTab(1);
    if (hit(PAD.START)) { if ($('screen-game').classList.contains('active')) openPauseMenu(); }
    if (hit(PAD.X)) {
      if ($('screen-game').classList.contains('active') && !$('modal-back').classList.contains('open')) {
        running ? pauseTick() : resumeTick();
        toast(running ? '▶️ Running' : '⏸️ Paused');
      }
    }
    if (hit(PAD.Y)) { if (S) saveGame(); }
  } else if (padOn) {
    padOn = false;
    document.body.classList.remove('pad-on');
    paintFocus(null);
  }
  requestAnimationFrame(pollPad);
}

function initPad(){
  window.addEventListener('gamepadconnected', () => { padOn = false; });
  requestAnimationFrame(pollPad);
}

/* ---------------- boot ---------------- */

function boot(){
  if (typeof SCENE_CSS !== 'undefined' && SCENE_CSS) {
    const st = document.createElement('style');
    st.textContent = SCENE_CSS;
    document.head.appendChild(st);
  }
  wire();
  initPad();
  refreshMenu();
  showScreen('menu');
}
boot();

</script>
</body>
