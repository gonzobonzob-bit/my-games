<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0a0e27">
<title>Callsigns</title>
<style>
/* ============================================================
   CALLSIGNS — radio tycoon
   Palette shared with the station scene art:
   night #0a0e27/#1a1040 · amber #fbbf24 · magenta #ec4899 · cyan #22d3ee
   ============================================================ */
:root{
  --night:#0a0e27; --night2:#141a3a; --panel:#171d40; --panel2:#1e2550;
  --border:#2c3468; --border-lit:#3d4795;
  --amber:#fbbf24; --amber-dk:#f59e0b;
  --magenta:#ec4899; --cyan:#22d3ee; --green:#34d399; --red:#f87171;
  /* --dim used to be #5d6598, which measured ~3.0:1 on --panel and ~2.6:1 on
     --panel2 — under WCAG AA for the 9-12px labels it is used on, including
     the only "tap a slot" instruction in the game. This clears 4.5:1. */
  --text:#e8ecff; --muted:#8b93c4; --dim:#7b83b4;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  --r:14px; --r-sm:9px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--night); color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:15px; line-height:1.45; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 70% 50% at 15% 0%,rgba(236,72,153,.10),transparent 60%),
    radial-gradient(ellipse 70% 50% at 85% 100%,rgba(34,211,238,.09),transparent 60%);
}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;cursor:pointer;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- screen router ---------- */
.screen{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;}
.screen.active{display:flex;}

/* ---------- main menu ---------- */
#screen-menu{align-items:center;justify-content:center;padding:24px;overflow-y:auto;}
.menu-box{width:100%;max-width:420px;text-align:center;padding:20px 0;position:relative;z-index:1;}
/* The menu shows the game's own station art behind the logo — boot() injects
   the tier the save is sitting on (or the Broadcast Tower for a fresh start).
   Purely decorative, so it never takes a pointer event or a focus stop. */
.menu-scene{
  position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  z-index:0;pointer-events:none;
}
.menu-scene-art{opacity:.35;}
.menu-scene::after{
  content:'';position:absolute;inset:-2px;
  background:radial-gradient(ellipse 72% 82% at 50% 50%,rgba(10,14,39,0) 22%,var(--night) 84%);
}
.logo-mark{
  font-size:11px;letter-spacing:5px;color:var(--cyan);text-transform:uppercase;
  margin-bottom:6px;font-weight:700;
}
.logo{
  font-size:clamp(44px,13vw,68px);font-weight:900;letter-spacing:-2px;line-height:1;
  background:linear-gradient(135deg,var(--amber),var(--magenta) 55%,var(--cyan));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:10px;
}
.tagline{color:var(--muted);font-size:13px;margin-bottom:8px;}
.onair-badge{
  display:inline-flex;align-items:center;gap:7px;margin-bottom:28px;
  border:1px solid rgba(251,191,36,.4);background:rgba(251,191,36,.08);
  color:var(--amber);border-radius:20px;padding:5px 14px;
  font-size:10px;font-weight:800;letter-spacing:2px;
}
.onair-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);}
@media (prefers-reduced-motion:no-preference){
  .onair-dot{animation:pulseDot 1.8s ease-in-out infinite;}
  @keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
}
.menu-btns{display:flex;flex-direction:column;gap:11px;}
.mbtn{
  width:100%;padding:16px;border-radius:var(--r);font-weight:700;font-size:16px;
  background:var(--panel);border:1px solid var(--border);color:var(--text);
  transition:transform .12s,border-color .18s,background .18s;
  min-height:54px;
}
.mbtn:hover:not(:disabled),.mbtn:active:not(:disabled){background:var(--panel2);border-color:var(--border-lit);}
.mbtn:active:not(:disabled){transform:scale(.98);}
.mbtn:disabled{opacity:.35;cursor:not-allowed;}
.mbtn.primary{
  background:linear-gradient(135deg,var(--amber-dk),var(--magenta));
  border-color:transparent;color:#fff;
  box-shadow:0 6px 22px rgba(236,72,153,.28);
}
.mbtn.primary:hover,.mbtn.primary:active{filter:brightness(1.1);}
.menu-foot{margin-top:22px;font-size:11px;color:var(--dim);}

/* ---------- top HUD ---------- */
.hud{
  flex-shrink:0;background:rgba(10,14,39,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding-top:env(safe-area-inset-top,0px);
}
.hud-row{display:flex;align-items:center;gap:10px;padding:9px 12px;}
.hud-btn{
  flex-shrink:0;width:38px;height:38px;border-radius:10px;
  background:var(--panel);border:1px solid var(--border);
  display:grid;place-items:center;font-size:17px;
  transition:background .15s,border-color .15s;
}
.hud-btn:hover,.hud-btn:active{background:var(--panel2);border-color:var(--border-lit);}
.station-id{flex:1;min-width:0;}
.station-call{
  font-weight:900;font-size:17px;letter-spacing:1px;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.station-sub{font-size:10px;color:var(--muted);letter-spacing:.5px;}
.day-chip{
  flex-shrink:0;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--cyan);
  background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.3);
  border-radius:8px;padding:4px 9px;text-transform:uppercase;
}
.pause-chip{
  flex-shrink:0;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--amber);
  background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);
  border-radius:8px;padding:4px 9px;
}
.stats-strip{display:flex;border-top:1px solid var(--border);}
.stat{
  flex:1;min-width:0;padding:8px 6px;text-align:center;
  border-right:1px solid var(--border);
}
.stat:last-child{border-right:none;}
.stat-val{
  display:block;font-size:16px;font-weight:800;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:tabular-nums;
}
.stat-lbl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.9px;margin-top:1px;}
.stat.cash .stat-val{color:var(--green);}
.stat.listeners .stat-val{color:var(--cyan);}
.stat.rep .stat-val{color:var(--amber);}
.delta{font-size:9px;font-weight:700;margin-left:3px;}
.delta.up{color:var(--green);} .delta.down{color:var(--red);}

/* ---------- content area ---------- */
.content{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 12px 20px;}
.tabpane{display:none;} .tabpane.active{display:block;}
.wrap{max-width:940px;margin:0 auto;}

/* ---------- cards ---------- */
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r);
  padding:14px;margin-bottom:12px;
}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px;}
.card-title{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);}
.card-note{font-size:11px;color:var(--dim);}

/* ---------- scene banner ---------- */
.scene-wrap{margin-bottom:12px;position:relative;}
.scene-caption{
  position:absolute;left:10px;bottom:10px;z-index:5;
  background:rgba(10,14,39,.8);backdrop-filter:blur(6px);
  border:1px solid var(--border-lit);border-radius:8px;padding:5px 11px;
  font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--amber);
}
.scene-fallback{
  width:100%;aspect-ratio:16/5;border-radius:12px;
  background:linear-gradient(160deg,#0a0e27,#1a1040);
  border:1px solid var(--border);display:grid;place-items:center;
  color:var(--dim);font-size:12px;
}

/* ---------- schedule grid ---------- */
.sched{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
@media (max-width:560px){.sched{grid-template-columns:repeat(2,1fr);}}
/* .slot and .row are <button> elements so the schedule — the core mechanic —
   is reachable by keyboard; the font/width/align resets keep them looking
   exactly like the divs they used to be. */
.slot{
  background:var(--panel2);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:10px 8px;text-align:center;transition:border-color .18s,transform .12s;
  min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  width:100%;font:inherit;color:inherit;
}
.slot:hover,.slot:active{border-color:var(--border-lit);}
.slot:active{transform:scale(.98);}
.slot-part{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-weight:700;}
.slot-icon{font-size:26px;line-height:1;}
.slot-show{font-size:12px;font-weight:800;}
.slot-meta{font-size:9px;color:var(--muted);}
.slot-dj{font-size:9px;color:var(--cyan);}

/* ---------- generic list rows ---------- */
.row{
  display:flex;align-items:center;gap:11px;padding:11px;
  background:var(--panel2);border:1px solid var(--border);border-radius:var(--r-sm);
  margin-bottom:8px;
  width:100%;text-align:inherit;font:inherit;color:inherit;
}
.row:last-child{margin-bottom:0;}
.row-icon{
  flex-shrink:0;width:42px;height:42px;border-radius:10px;
  display:grid;place-items:center;font-size:20px;
  background:rgba(255,255,255,.05);border:1px solid var(--border);
}
.row-body{flex:1;min-width:0;}
.row-title{font-weight:700;font-size:14px;}
.row-sub{font-size:11px;color:var(--muted);}
/* 10px, not 5px: Train and the destructive Fire stack here, and a 5px gap
   between a 40px-tall pair is a mis-tap waiting to happen. */
.row-act{flex-shrink:0;display:flex;flex-direction:column;gap:10px;align-items:stretch;}

.btn{
  padding:8px 13px;border-radius:8px;font-size:12px;font-weight:700;
  background:var(--panel);border:1px solid var(--border-lit);color:var(--text);
  white-space:nowrap;transition:filter .15s,transform .1s;min-height:36px;
}
.btn:active:not(:disabled){transform:scale(.96);}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn.buy{background:linear-gradient(135deg,var(--amber-dk),var(--magenta));border-color:transparent;color:#fff;}
.btn.buy:hover:not(:disabled){filter:brightness(1.12);}
.btn.danger{border-color:rgba(248,113,113,.45);color:var(--red);}
.btn.ghost{background:transparent;}
.btn.sm{padding:5px 10px;font-size:11px;min-height:40px;}

/* ---------- meters ---------- */
.meter{height:6px;background:rgba(0,0,0,.35);border-radius:3px;overflow:hidden;margin-top:5px;}
.meter-fill{height:100%;border-radius:3px;transition:width .5s ease;}
.meter-fill.amber{background:linear-gradient(90deg,var(--amber-dk),var(--amber));}
.meter-fill.cyan{background:linear-gradient(90deg,#0891b2,var(--cyan));}
.meter-fill.magenta{background:linear-gradient(90deg,#be185d,var(--magenta));}

.pill{
  display:inline-block;font-size:9px;font-weight:800;letter-spacing:.8px;
  padding:2px 7px;border-radius:20px;text-transform:uppercase;
}
.pill.locked{background:rgba(248,113,113,.14);color:var(--red);border:1px solid rgba(248,113,113,.3);}
.pill.max{background:rgba(52,211,153,.14);color:var(--green);border:1px solid rgba(52,211,153,.3);}
.pill.new{background:rgba(34,211,238,.14);color:var(--cyan);border:1px solid rgba(34,211,238,.3);}

/* ---------- log ---------- */
.log-item{
  padding:9px 11px;border-left:2px solid var(--border-lit);
  background:var(--panel2);border-radius:0 var(--r-sm) var(--r-sm) 0;
  margin-bottom:7px;font-size:12px;
}
.log-item.good{border-left-color:var(--green);}
.log-item.bad{border-left-color:var(--red);}
.log-item.big{border-left-color:var(--amber);}
.log-day{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-weight:700;}

/* ---------- bottom tab bar ---------- */
.tabbar{
  flex-shrink:0;display:flex;background:rgba(10,14,39,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);padding-bottom:var(--safe-b);
}
.tab{
  flex:1;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--dim);transition:color .18s;position:relative;min-height:56px;justify-content:center;
}
.tab.active{color:var(--amber);}
.tab.active::before{
  content:'';position:absolute;top:0;left:22%;right:22%;height:2px;
  background:var(--amber);border-radius:0 0 3px 3px;
}
.tab-icon{font-size:19px;line-height:1;}
.tab-lbl{font-size:9px;font-weight:700;letter-spacing:.5px;}
/* The badge is a class toggle rather than an injected span, so render() can
   update the tab bar without rebuilding it (and restarting its transitions). */
.tab.has-badge::after{
  content:'';position:absolute;top:6px;right:50%;margin-right:-20px;
  width:7px;height:7px;border-radius:50%;background:var(--magenta);
}

/* ---------- modal ---------- */
.modal-back{
  position:fixed;inset:0;z-index:50;background:rgba(5,7,20,.78);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:18px;
}
.modal-back.open{display:flex;}
.modal{
  width:100%;max-width:440px;max-height:86vh;overflow-y:auto;
  background:var(--panel);border:1px solid var(--border-lit);border-radius:var(--r);
  padding:18px;
}
.modal-title{font-size:18px;font-weight:800;margin-bottom:5px;}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:15px;}
.modal-btns{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap;}
.modal-btns .btn{flex:1;min-width:110px;justify-content:center;}
@media (prefers-reduced-motion:no-preference){
  .modal-back.open .modal{animation:modalIn .22s cubic-bezier(.2,.9,.3,1.2);}
  @keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
}

/* ---------- toast ---------- */
/* The 74px lift exists to clear the tab bar, which only exists in-game — on
   the menu and Settings screens it left toasts floating in mid-air. */
.toasts{
  position:fixed;z-index:60;left:50%;transform:translateX(-50%);
  bottom:calc(20px + var(--safe-b));display:flex;flex-direction:column;gap:7px;
  pointer-events:none;width:calc(100% - 28px);max-width:400px;
}
body.in-game .toasts{bottom:calc(74px + var(--safe-b));}
.toast{
  background:var(--panel2);border:1px solid var(--border-lit);border-radius:10px;
  padding:9px 13px;font-size:12px;font-weight:600;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
}
.toast.good{border-color:rgba(52,211,153,.5);}
.toast.bad{border-color:rgba(248,113,113,.5);}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:toastIn .25s ease;}
  @keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
}

/* ---------- options ---------- */
.opt-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 0;border-bottom:1px solid var(--border);
}
.opt-row:last-child{border-bottom:none;}
.opt-lbl{font-size:14px;font-weight:600;}
.opt-desc{font-size:11px;color:var(--dim);margin-top:1px;}
/* 44px tall for the touch target, but the visible pill stays 28px: the
   transparent 8px padding is excluded from the painted area by
   background-clip:content-box. */
.switch{
  flex-shrink:0;width:48px;height:44px;border-radius:22px;border:none;
  padding:8px 0;background:var(--border-lit);background-clip:content-box;
  position:relative;transition:background .2s;
}
.switch.on{background:var(--amber-dk);background-clip:content-box;}
.switch::after{
  content:'';position:absolute;top:11px;left:3px;width:22px;height:22px;
  border-radius:50%;background:#fff;transition:transform .2s;
}
.switch.on::after{transform:translateX(20px);}
.seg{display:flex;gap:5px;flex-shrink:0;}
.seg-btn{
  padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;
  background:var(--panel2);border:1px solid var(--border);min-height:44px;
}
.seg-btn.on{background:var(--amber-dk);border-color:transparent;color:#fff;}

/* ---------- keyboard focus ----------
   The file shipped without a single :focus rule, so tabbing through the UI
   was invisible. :focus-visible keeps it off mouse/touch activation. */
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:8px;}

/* ---------- gamepad focus cursor ---------- */
.gp-focus{
  outline:2px solid var(--cyan) !important;
  outline-offset:2px;
  box-shadow:0 0 0 4px rgba(34,211,238,.18),0 0 18px rgba(34,211,238,.35) !important;
  border-radius:8px;
}
.pad-hint{
  display:none;gap:14px;justify-content:center;flex-wrap:wrap;
  padding:7px 10px;border-top:1px solid var(--border);
  background:rgba(34,211,238,.05);font-size:10px;color:var(--muted);
}
body.pad-on .pad-hint{display:flex;}
.pad-hint b{color:var(--cyan);font-weight:800;}

.empty{text-align:center;padding:26px 14px;color:var(--dim);font-size:12px;}
.hint{
  font-size:11px;color:var(--muted);background:rgba(34,211,238,.06);
  border:1px solid rgba(34,211,238,.18);border-radius:var(--r-sm);
  padding:9px 11px;margin-bottom:12px;
}
.locked-panel{text-align:center;padding:30px 16px;}
.locked-icon{font-size:40px;margin-bottom:10px;opacity:.5;}

/* ---------- desktop ---------- */
@media (min-width:900px){
  .content{padding:18px 20px 26px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;}
  .two-col .card{margin-bottom:0;}
}

/* ---------- reduced motion (in-game toggle) ----------
   The @media (prefers-reduced-motion) blocks above only answer to the OS.
   This class is what the Settings switch drives, and it has to out-rank the
   SCENE_CSS block that boot() injects into <head> after this stylesheet. */
body.no-motion *,
body.no-motion *::before,
body.no-motion *::after{
  animation:none !important;
  transition:none !important;
}
</style>
</head>
<body>

<!-- ============ MAIN MENU ============ -->
<div class="screen active" id="screen-menu">
  <div class="menu-box">
    <div class="logo-mark" id="menu-mark">ON THE DIAL</div>
    <h1 class="logo">CALLSIGNS</h1>
    <p class="tagline" id="menu-tagline"></p>
    <div class="onair-badge"><span class="onair-dot"></span><span id="menu-badge">ON AIR</span></div>
    <div class="menu-btns">
      <button class="mbtn primary" id="btn-new"></button>
      <button class="mbtn" id="btn-continue"></button>
      <button class="mbtn" id="btn-options"></button>
      <button class="mbtn" id="btn-quit"></button>
    </div>
    <p class="menu-foot" id="menu-foot"></p>
  </div>
</div>

<!-- ============ GAME ============ -->
<div class="screen" id="screen-game">
  <div class="hud">
    <div class="hud-row">
      <button class="hud-btn" id="btn-pause" aria-label="Menu">☰</button>
      <div class="station-id">
        <div class="station-call" id="hud-call">KXXX</div>
        <div class="station-sub" id="hud-sub"></div>
      </div>
      <span class="pause-chip" id="hud-paused" hidden>⏸ PAUSED</span>
      <div class="day-chip" id="hud-day">DAY 1</div>
    </div>
    <div class="stats-strip">
      <div class="stat cash"><span class="stat-val" id="stat-cash">$0</span><span class="stat-lbl" id="lbl-cash"></span></div>
      <div class="stat listeners"><span class="stat-val" id="stat-listeners">0</span><span class="stat-lbl" id="lbl-listeners"></span></div>
      <div class="stat rep"><span class="stat-val" id="stat-rep">0</span><span class="stat-lbl" id="lbl-rep"></span></div>
    </div>
  </div>

  <div class="content" id="game-content">
    <div class="wrap">
      <!-- The scene is its own host so render() can leave it alone: rebuilding
           it every tick restarted all twelve of its infinite animations. -->
      <div class="tabpane active" id="pane-studio"><div id="scene-host"></div><div id="studio-body"></div></div>
      <div class="tabpane" id="pane-gear"></div>
      <div class="tabpane" id="pane-staff"></div>
      <div class="tabpane" id="pane-empire"></div>
      <div class="tabpane" id="pane-log"></div>
    </div>
  </div>

  <div class="pad-hint">
    <span><b>A</b> Select</span><span><b>B</b> Back</span>
    <span><b>X</b> Pause</span><span><b>Y</b> Save</span>
    <span><b>LB/RB</b> Tabs</span><span><b>☰</b> Menu</span>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<!-- ============ OPTIONS ============ -->
<div class="screen" id="screen-options">
  <div class="hud">
    <div class="hud-row">
      <button class="hud-btn" id="btn-opt-back" aria-label="Back">←</button>
      <div class="station-id"><div class="station-call" id="opt-title"></div></div>

}

// hand back millions — the modal copy was describing a cap the code never had
// (OFFLINE_CAP_MS was unreachable behind OFFLINE_MAX_DAYS). 96 days of
// half-rate net IS the reward; it tops out after about eight minutes away, and
// no longer absence pays more. Derive the millisecond clamp from the day cap so
// the two can never disagree again, and quote the day figure to the player.
const OFFLINE_MS_PER_DAY = SPEEDS[1];
const OFFLINE_MAX_DAYS   = 96;
const OFFLINE_CAP_MS     = OFFLINE_MAX_DAYS * OFFLINE_MS_PER_DAY;
const OFFLINE_RATE       = 0.50;

/* ---------------- helpers ---------------- */

const $  = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const pick  = a => a[Math.floor(Math.random()*a.length)];
const randInt = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Buzz is a bounded multiplier, and every write to it has to respect the same
// bounds. Events used to write `s.buzz *= 0.85` raw, which parked it under the
// floor until the next simulateDay() re-clamped it — a whole broadcast day of
// out-of-range buzz, with the Daily Brief tile reporting 47% on a stat whose
// own floor is 55%. One helper so a new event can't reintroduce that.
const BUZZ_MIN = 0.55, BUZZ_MAX = 1.85;
const setBuzz = (s, v) => { s.buzz = clamp(v, BUZZ_MIN, BUZZ_MAX); };

/** Drop the decimal once the value would round up to `whole` or beyond, so the
    two sides of a unit boundary never disagree about how many digits to show. */
function unit(v, whole){
  return (+v.toFixed(1) >= whole) ? v.toFixed(0) : v.toFixed(1);
}
function money(n){
  // A partial save (or a stat a future field forgot to seed) must never
  // render as "$NaN" in the HUD.
  if (!Number.isFinite(n)) n = 0;
  const neg = n < 0; n = Math.abs(Math.round(n));
  let s;
  // The UNIT is chosen from the rounded figure, not the raw one, so a value that
  // rounds up out of its unit promotes instead of widening: $999,999 is under
  // 1e6, so testing the raw number printed a four-digit "$1000k" while
  // $1,000,000 one dollar later printed "$1.0M". Rounded thousands hitting 1000
  // is exactly the case the k branch cannot spell, so hand those to M — and no
  // sooner, or $950k would read as "$1.0M". unit() applies the same rule to the
  // decimals inside a branch (the $99,999 / $100,000 hand-off, and 1e7).
  if (Math.round(n / 1e3) >= 1e3) s = '$' + unit(n / 1e6, 10) + 'M';
  // One decimal below $100k: rounding to whole thousands made "$23k" mean
  // anything from $22,500 to $23,499, which is on both sides of the $23,500
  // Panel Array — the player couldn't tell whether the buy button was live.
  else if (n >= 1e4) s = '$' + unit(n / 1e3, 100) + 'k';
  else s = '$' + n.toLocaleString('en-US');
  return (neg ? '-' : '') + s;
}
function num(n){
  if (!Number.isFinite(n)) n = 0;
  n = Math.round(n);
  if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if (n >= 1e4) return (n/1e3).toFixed(1) + 'k';
  return n.toLocaleString('en-US');
}
function randomCall(){
  const L = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  return pick(['K','W']) + pick(L.split('')) + pick(L.split('')) + pick(L.split(''));
}
/** Salary must stay well under the revenue a hire unlocks, or hiring is a
    trap and the whole staff pillar is dead weight. Tuned against balance.js. */
function salaryFor(role, skill){
  return Math.round(ROLES[role].baseSalary * (0.50 + skill * 0.18));
}
function hireFee(p){ return p.salary * 8; }
/** Steeper than it looks: the 1->10 ladder runs about $39,600, so the late
    game still has something worth saving for. The first step stays cheap. */
function trainCostFor(skill){ return Math.round(200 * Math.pow(1.62, skill)); }

function makePerson(role, repLevel){
  const spread = 2 + Math.floor(repLevel / 22);
  const skill = clamp(randInt(1, 3 + spread), 1, 10);
  return {
    id: 'p' + Math.random().toString(36).slice(2, 9),
    name: pick(FIRST) + ' ' + pick(LAST),
    role, skill,
    salary: salaryFor(role, skill)
  };
}

/* ---------------- state ---------------- */

let S = null;
// CLAUDE.md "Interval hygiene": every setInterval handle lives here and is
// cleared by stopAllTimers(), so cycling Menu -> Start Game can never stack a
// second tick or autosave loop on top of the first.
let timer = null;
let autosaveTimer = null;
// Set once the first time localStorage refuses a write (private browsing,
// quota) so we warn the player once instead of every 30 seconds.
let saveBroken = false;

const DEFAULT_OPTS = { speed: 1, autosave: true, eventPopups: true, reducedMotion: false, sound: true };

/** Settings are their own localStorage entry, so the main-menu Settings screen
    is live with no station loaded. A running game keeps its own copy in
    S.opts (so it saves with the run); gOpts is the menu-side mirror. */
function readOpts(){
  try { return Object.assign({}, DEFAULT_OPTS, JSON.parse(localStorage.getItem(OPTS_KEY)) || {}); }
  catch (e) { return Object.assign({}, DEFAULT_OPTS); }
}
function writeOpts(o){ try { localStorage.setItem(OPTS_KEY, JSON.stringify(o)); } catch (e) {} }

let gOpts = readOpts();

function newState(call){
  return {
    v: SAVE_VER,
    call: call || randomCall(),
    // Commercial band only, on legal odd tenths: 88.1-91.9 is the reserved
    // non-commercial band a licensee like this could never hold.
    freq: (92.1 + randInt(0, 79) * 0.2).toFixed(1),
    day: 1,
    cash: 800,
    listeners: 40,
    rep: 5,
    // Audience momentum. Random events push this around; simulateDay() decays
    // it back toward 1.0 so a viral clip is a spike, not a permanent tier.
    buzz: 1,
    tx: 0, ant: 0,
    schedule: {
      morning: { show: 'music', dj: null },
      midday:  { show: 'music', dj: null },
      evening: { show: 'talk',  dj: null },
      night:   { show: 'music', dj: null }
    },
    staff: [],
    // The hiring pool is part of the run, not a free reroll: it used to be a
    // module global, so Pause -> Main Menu -> Continue re-rolled talent until
    // a 10-skill DJ turned up.
    candidates: [],
    nextHireDay: 7,
    log: [],
    unlockedExpansion: false,
    // Acknowledgement flags. Without seenExpansion the Empire tab badge stayed
    // lit forever, including long after the second station was founded; without
    // seenIntro, Continue would replay the onboarding modal every load.
    seenExpansion: false,
    seenIntro: false,
    secondStation: null,
    lastDay: { listeners: 0, revenue: 0, costs: 0, net: 0, quality: 0, network: 0, royalties: 0, repTarget: 0 },
    opts: Object.assign({}, gOpts),
    stats: { totalEarned: 0, totalCosts: 0, peakListeners: 40, daysOnAir: 0 },
    // Wall-clock stamp for offline catch-up (CLAUDE.md: idle/tycoon games).
    lastTick: Date.now()
  };
}

// More than TX[4] ($105,000), so the endgame is a real fork: raw reach on the
// flagship, or network income from a second callsign.
const SECOND_STATION_COST = 120000;
const BANKRUPTCY_FLOOR = -4000;

/* ---------------- simulation ---------------- */

function staffOf(role){ return S.staff.filter(p => p.role === role); }
function bestSkill(role){
  const list = staffOf(role);
  return list.length ? Math.max(...list.map(p => p.skill)) : 0;
}
/** Best hire leads; each additional one in the role adds sharply less.
    Without this, a second engineer is pure salary with zero benefit. */
function roleStrength(role){
  return staffOf(role)
    .map(p => p.skill).sort((a, b) => b - a)
    .reduce((sum, s, i) => sum + s * Math.pow(0.40, i), 0);
}
function engBonus(){ return Math.min(0.42, roleStrength('eng') * 0.035); }
/** A half-full log is the floor, not a third: the old 0.30 baseline made the
    first two weeks a dead zone, and the old ceiling made sales a ~5.5x
    multiplier that dwarfed the entire transmitter ladder. Now ~2.7x. */
function salesFill(){ return clamp(0.50 + roleStrength('sales') * 0.040, 0.50, 0.95); }
function salesPrice(){ return 1 + roleStrength('sales') * 0.030; }

/** How many slots a DJ is booked on — working the whole day wears them down. */
function djLoad(id){
  return DAYPARTS.reduce((n, p) => n + (S.schedule[p.id].dj === id ? 1 : 0), 0);
}
function djFatigue(id){ return clamp(1 - 0.18 * (djLoad(id) - 1), 0.40, 1); }

function reachValue(){ return TX[S.tx].reach * (1 + engBonus() * 0.5); }
// Engineers contribute at half weight here, matching reachValue(): at full
// weight a single good engineer pinned the retention clamp on ANT[3], which
// made the $88,000 top antenna worth exactly nothing.
function fidelityValue(){ return ANT[S.ant].fid * (1 + engBonus() * 0.5); }

function djFor(slot){
  if (!slot.dj) return null;
  return S.staff.find(p => p.id === slot.dj) || null;
}

/** One broadcast day. Returns a report object. */
function simulateDay(){
  const fid = fidelityValue();
  const reach = reachValue();
  // Headroom above the best reachable fidelity (2.00 * 1.21 = 2.42 -> 1.888),
  // so no antenna tier is ever clamped into being worthless. The old 0.5 floor
  // was unreachable dead code — minimum fid is 1.00.
  const retention = clamp(fid * 0.78, 0.60, 1.95);
  const fill = salesFill();
  const price = salesPrice();

  let totalListeners = 0, revenue = 0, qualitySum = 0, repPressure = 0;

  for (const part of DAYPARTS) {
    const slot = S.schedule[part.id];
    const show = SHOWS[slot.show];
    const dj = djFor(slot);
    // Fatigue makes four dedicated DJs beat one host pulling a double shift.
    const djSkill = dj ? dj.skill * djFatigue(dj.id) : 0;
    // No DJ is a real penalty, not a zero — automation still airs something.
    // The show's daypart multiplier is what makes the four slots four separate
    // decisions instead of the same argmax four times over.
    const quality = show.appeal * (dj ? 0.58 + djSkill * 0.052 : 0.32) *
      ((show.parts && show.parts[part.id]) || 1);

    const potential = LISTENER_BASE * reach * part.weight * (1 + S.rep / 62) * S.buzz;
    const slotListeners = potential * quality * retention;

    totalListeners += slotListeners;
    qualitySum += quality;
    repPressure += show.rep * (dj ? 1 + djSkill * 0.05 : 0.6);
    revenue += slotListeners * show.adRate * AD_VALUE * fill * price * (1 + S.rep / 140);
  }

  const avgListeners = totalListeners / DAYPARTS.length;
  const avgQuality = qualitySum / DAYPARTS.length;

  // Equipment hiccup — engineer both lowers the odds and can catch it.
  let breakdown = null;
  const breakRisk = clamp(0.055 - engBonus() * 0.09, 0.006, 0.055);
  if (Math.random() < breakRisk) {
    const caught = Math.random() < bestSkill('eng') * 0.07;
    if (caught) breakdown = { caught: true };
    else {
      breakdown = { caught: false, gear: Math.random() < 0.5 ? TX[S.tx].name : ANT[S.ant].name };
      revenue *= 0.7;
    }
  }

  // Performing-rights royalties: the recurring bill every music station pays,
  // and payroll's only company as a cost line. It scales with revenue and with
  // how much of the day is music, which is what finally gives Talk and News an
  // economic identity instead of a purely reputational one.
  const musicShare = DAYPARTS.filter(p => S.schedule[p.id].show === 'music').length / DAYPARTS.length;
  const royalties = revenue * 0.045 * musicShare;

  const costs = S.staff.reduce((a, p) => a + p.salary, 0) + royalties;
  let net = revenue - costs;

  // Second station (once founded) runs itself and wires a cut of its own
  // take back to headquarters — scaled by reputation so it's not free money
  // divorced from how well the flagship signal is actually doing.
  let network = 0;
  if (S.secondStation) {
    network = revenue * 0.32 * clamp(S.rep / 100, 0.3, 1);
    net += network;
    S.secondStation.totalEarned += network;
  }

  S.cash += net;
  S.listeners = Math.round(avgListeners * (breakdown && !breakdown.caught ? 0.82 : 1));
  // Reputation drifts toward what you actually put on air — no free upward
  // creep, or an unstaffed all-music station would coast into every rep gate.
  const avgPressure = repPressure / DAYPARTS.length;
  const repTarget = clamp(avgQuality * 78 + avgPressure * 14, 0, 100);
  S.rep = clamp(S.rep + (repTarget - S.rep) * 0.05, 0, 100);
  // Buzz bleeds back to neutral — roughly a six-day return from a viral spike.
  S.buzz = clamp(S.buzz + (1 - S.buzz) * 0.12, BUZZ_MIN, BUZZ_MAX);
  S.day++;
  S.stats.daysOnAir++;
  // Net, not gross: the Empire tab used to report millions "earned" on a
  // station that was quietly going broke.
  S.stats.totalEarned += net;
  S.stats.totalCosts = (S.stats.totalCosts || 0) + costs;
  S.stats.peakListeners = Math.max(S.stats.peakListeners, S.listeners);
  S.lastDay = { listeners: S.listeners, revenue, costs, net, quality: avgQuality, network, royalties, repTarget };

  return { breakdown, net, revenue, costs };
}

function rollEvent(){
  if (S.day < 4 || Math.random() > 0.17) return null;
  const pool = EVENTS.filter(e => S.day >= e.minDay);
  if (!pool.length) return null;
  const total = pool.reduce((a, e) => a + e.w, 0);
  let r = Math.random() * total;
  const ev = pool.find(e => (r -= e.w) <= 0) || pool[0];

  const djs = staffOf('dj');
  const vars = {
    // Short form: this lands mid-sentence, not in the schedule grid.
    part: partShort(pick(DAYPARTS).id),
    name: djs.length ? pick(djs).name : 'Your overnight host'
  };
  ev.apply(S);
  return { id: ev.id, type: ev.type, msg: t2(ev.msg, vars) };
}
// Event copy is inline (not in STR) so it stays adjacent to its effect;
// still routed through a formatter so a localization pass has one seam.
function t2(str, vars){
  for (const k in vars) str = str.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]);
  return str;
}

function addLog(msg, kind){
  S.log.unshift({ day: S.day, msg, kind: kind || '' });
  if (S.log.length > 60) S.log.length = 60;
}

function checkUnlock(){
  if (!S.unlockedExpansion && S.cash >= UNLOCK_CASH && S.rep >= UNLOCK_REP) {
    S.unlockedExpansion = true;
    addLog('Expansion unlocked — you can found a second station.', 'big');
    toast('🏆 ' + t('unlockedTitle'), 'good');
    sfxOnAir();
    // Honour the Event popups setting exactly like the random-event branch —
    // the log line, the sting and the Empire tab badge already tell a
    // popup-off player that the expansion landed.
    if (S.opts.eventPopups) {
      modalPause();
      openModal(
        t('unlockedTitle'),
        t('unlockedSub'),
        '<p style="font-size:13px;color:var(--muted);margin-top:10px">' + esc(t('foundStationNote', { amt: money(SECOND_STATION_COST) })) + '</p>',
        [{ label: t('close'), cls: 'buy', act: dismissAutoModal }]
      );
    }
    return true;
  }
  return false;
}

/* ---------------- game loop ---------------- */

let running = false;

function tick(){
  if (!S) return;
  // One bad day of arithmetic used to leave a dead interval firing forever.
  // Any throw in here stops the clock and tells the player, rather than
  // spamming the console and looking like a frozen station.
  try {
    const rep = simulateDay();

    // Hard cash floor — payroll outrunning revenue can no longer spiral into
    // arbitrary negative numbers forever. Check this before anything else this
    // tick so a bankrupting day can't also open an event/unlock modal under it.
    if (S.cash <= BANKRUPTCY_FLOOR) {
      render();
      triggerBankruptcy();
      return;
    }

    if (rep.breakdown) {
      if (rep.breakdown.caught) addLog(t('breakdownFixed'), 'good');
      else {
        addLog(t('breakdownMsg', { gear: rep.breakdown.gear }), 'bad');
        toast('⚠️ ' + t('breakdownMsg', { gear: rep.breakdown.gear }), 'bad');
        sfxDeadAir();
      }
    }

    const ev = rollEvent();
    if (ev) {
      addLog(ev.msg, ev.type);
      if (ev.type === 'good') sfxOnAir(); else sfxTrouble();
      // Only bad news (or anything in the tutorial stretch) is worth stopping
      // the clock for. Good news past day 30 toasts instead, so a long run
      // isn't a sequence of "click OK to continue earning".
      if (S.opts.eventPopups && (ev.type === 'bad' || S.day < 30)) {
        modalPause();
        openModal(
          ev.type === 'good' ? '📻 Good news' : '📻 Trouble',
          ev.msg, '',
          [{ label: t('resume'), cls: 'buy', act: dismissAutoModal }]
        );
      } else {
        toast((ev.type === 'good' ? '📈 ' : '📉 ') + ev.msg, ev.type);
      }
    }

    // Day-stamped rather than modulo-7, so an offline catch-up that jumps the
    // day counter past a multiple of 7 can't silently skip a talent refresh.
    if (S.day >= S.nextHireDay) { refreshCandidates(); S.nextHireDay = S.day + 7; }
    // Autosave is wall-clock now (see startAllTimers), not day-counted.
    // checkUnlock() may itself open a modal (queued behind the event modal
    // above, if one is already open — see openModal/dismissAutoModal).
    checkUnlock();
    // Snapshot yesterday's HUD numbers so render() can chip the change.
    noteHudDeltas();
    render();
    S.lastTick = Date.now();
  } catch (err) {
    console.error('Callsigns tick failed:', err);
    stopAllTimers();
    // Blocking, and it takes the screen: stopAllTimers() has just killed the
    // clock for good, so Escape or a backdrop click on a dismissable fault
    // modal left the player looking at a game screen that would never tick
    // again. Its one button is the only way out. `replace` (plus clearing the
    // queue) is what puts it in front of an event modal that was already up
    // when the tick threw, instead of behind it.
    modalQueue.length = 0;
    openModal('Broadcast fault', 'Something went wrong in the simulation.', '',
      [{ label: t('mainMenu'), cls: 'danger', act: () => {
          // Deliberately neither saves nor wipes — the last good autosave is
          // the player's way back in, and this state is the one that threw.
          returnToMenu();
        } }],
      { blocking: true, replace: true }
    );
  }
}

/** Cash has run dry for good. Ends the run: the save is cleared so a fresh
    station starts clean rather than reloading straight back into the same
    unrecoverable spiral. */
function triggerBankruptcy(){
  pauseTick();
  // The run is over: mark it dead so no autosave/unload path can write the
  // corpse back to disk, and clear anything queued so a stray event modal
  // can't pop up on top of the ending.
  S.dead = true;
  modalQueue.length = 0;
  sfxBankrupt();
  addLog(t('bankruptSub', { call: S.call }), 'bad');
  openModal(
    '📉 ' + t('bankruptTitle'),
    t('bankruptSub', { call: S.call }),
    '<p style="font-size:13px;color:var(--muted);margin-top:10px">' + esc(t('bankruptNote')) + '</p>',
    [{ label: t('mainMenu'), cls: 'danger', act: () => returnToMenu({ wipe: true }) }],
    { blocking: true }
  );
}

/* One dispatcher for the sim clock plus one for the 30s wall-clock autosave —
   both handles live at the top of the file and both are cleared together, per
   CLAUDE.md's interval-hygiene rule. pauseTick/resumeTick deliberately touch
   only the sim clock, so a modal being up never costs you an autosave. */
function stopAllTimers(){
  stopTick();
  if (autosaveTimer) clearInterval(autosaveTimer);
  autosaveTimer = null;
  running = false;
  setPausedUI();
}
/** The ONE way back to the main menu. Five call sites used to inline this
    sequence by hand — the tick-failure fault, bankruptcy, the capstone, the
    pause menu and Delete save — and the pause menu's copy had drifted: it
    forgot `S = null`. That left the abandoned run installed, so the Settings
    screen kept writing to the dead run's S.opts and then mirrored it over the
    persisted globals (toggling Sound silently flipped eventPopups on disk).
    opts: { save } writes the run out first, { wipe } deletes it instead. */
function returnToMenu(opts){
  const o = opts || {};
  if (o.save) saveGame(true);
  if (o.wipe) wipeSave();
  closeAllModals();
  stopAllTimers();
  S = null;
  showScreen('menu');
  refreshMenu();
}
function startAllTimers(){
  stopAllTimers();
  if (!S) return;
  running = true;
  timer = setInterval(tick, SPEEDS[S.opts.speed] || SPEEDS[1]);
  autosaveTimer = setInterval(() => { if (S && !S.dead && S.opts.autosave) saveGame(true); }, 30000);
  setPausedUI();
}

function startTick(){
  if (!S) return;
  // The sim starts advancing NOW, so the stretch that just ended — a modal, the
  // pause menu, a gamepad-X pause — is not offline time. Without this stamp a
  // game left paused in a *visible* tab kept its hours-old lastTick: closing the
  // tab before the first tick() could refresh it saved that stale stamp, and the
  // next Continue paid out for time the player spent staring at a paused screen.
  // (saveGame() covers the still-paused case; this covers the resumed one.)
  S.lastTick = Date.now();
  stopTick();
  running = true;
  timer = setInterval(tick, SPEEDS[S.opts.speed] || SPEEDS[1]);
  setPausedUI();
}
function stopTick(){ if (timer) clearInterval(timer); timer = null; }
function pauseTick(){ running = false; stopTick(); setPausedUI(); }
function resumeTick(){ if (!running) startTick(); setPausedUI(); }

/** Stop the clock for a modal, but only claim the resume if the clock was
    actually running: autoPaused means "this modal owes the sim a restart".
    Setting it unconditionally made every modal hand back a clock it never
    took — pause with gamepad X, open a slot editor or a confirm dialog, close
    it, and the game was quietly running again with the paused badge gone.

    RAISE the flag, never lower it. Two modals routinely land on one tick — a
    random event popup, then checkUnlock()'s expansion popup queued behind it —
    and the second call runs with the clock already stopped by the first, so
    wasRunning is false there. Assigning cleared the first modal's claim: the
    player drained the whole queue and closeModal saw autoPaused===false, so the
    station sat on the game screen with the ⏸ chip up and no clock, with no way
    back short of the main menu (the pause menu's own Resume captures the same
    already-false `running`). */
function modalPause(){
  const wasRunning = running;
  pauseTick();
  if (wasRunning) autoPaused = true;
}

/** The only paused indicator in the game — a stopped clock has to look
    stopped, or a frozen sim reads as a working one. */
function setPausedUI(){
  const el = $('hud-paused');
  if (el) el.hidden = !!running;
}

/* ---------------- save / load ---------------- */

function saveGame(silent){
  // A bankrupt station is a finished run — never let an autosave or an
  // unload handler write it back and reload the player into the corpse.
  if (!S || S.dead) return false;
  try {
    // S.lastTick means "when the SIM last advanced", never "when we last
    // saved". Stamping it here neutered offline catch-up entirely: the 30s
    // autosave keeps firing behind a hidden tab, so four hours backgrounded
    // plus one autosave granted $0 on return and only a hard tab close ever
    // paid out (CLAUDE.md line 16). tick() owns the stamp now.
    //
    // The one exception, and it is the same rule read the other way: a *paused*
    // game isn't accruing offline time either, so while the clock is stopped
    // under the player's control keep the stamp fresh. Otherwise sitting in the
    // pause menu for an hour and then hitting Main Menu would bank an hour of
    // unattended pay. Backgrounding deliberately leaves `running` true (see the
    // visibilitychange handler), so a hidden tab still accrues.
    if (!running) S.lastTick = Date.now();
    localStorage.setItem(SAVE_KEY, JSON.stringify(S));
    if (!silent) toast('💾 ' + t('saved'), 'good');
    return true;
  } catch (e) {
    // Private browsing / full quota: say it once. The old code raised a raw
    // QuotaExceededError toast every 30 seconds and again on every unload.
    if (!saveBroken) {
      saveBroken = true;
      toast("Progress can't be saved in this browser mode — your station will be lost when you close the tab.", 'bad');
    }
    return false;
  }
}
function loadGame(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || typeof data !== 'object') return null;
    return migrate(data);
  } catch (e) { return null; }
}
/** Fill anything a newer version added so old saves keep loading.
    The old version merged INTO base, which aliased base.opts to data.opts —
    every nested merge was a self-merge that backfilled nothing. Everything
    here now copies into fresh objects, and the result goes through
    sanitize() so a hand-edited or truncated save can't poison the sim. */
function migrate(data){
  const v = +data.v || 1;
  // A save from a newer build: degrade to "no save" rather than half-load it.
  if (v > SAVE_VER) return null;
  const base = newState(data.call);
  const merged = Object.assign({}, base, data);
  merged.opts    = Object.assign({}, base.opts,    data.opts    || {});
  merged.stats   = Object.assign({}, base.stats,   data.stats   || {});
  merged.lastDay = Object.assign({}, base.lastDay, data.lastDay || {});
  merged.schedule = {};
  for (const p of DAYPARTS) {
    const src = (data.schedule && data.schedule[p.id]) || {};
    merged.schedule[p.id] = {
      show: SHOWS[src.show] ? src.show : base.schedule[p.id].show,
      dj: typeof src.dj === 'string' ? src.dj : null
    };
  }
  merged.v = SAVE_VER;
  return sanitize(merged);
}

/** Coerce every field the sim divides, compares or renders. Runs on both the
    load path and the new-game path so there is exactly one shape of state. */
function sanitize(s){
  // null and '' both coerce to 0 through unary +, which would silently turn a
  // missing field into a real zero (a null cash became $0, not the default).
  const n = (x, d) => (x === null || x === '' || !Number.isFinite(+x)) ? d : +x;

  s.call      = String(s.call || randomCall()).replace(/[^A-Z]/g, '').slice(0, 4) || randomCall();
  s.cash      = n(s.cash, 800);
  s.listeners = Math.max(0, Math.round(n(s.listeners, 40)));
  s.rep       = clamp(n(s.rep, 5), 0, 100);
  s.buzz      = clamp(n(s.buzz, 1), BUZZ_MIN, BUZZ_MAX);
  s.day       = Math.max(1, Math.floor(n(s.day, 1)));
  // Never more than a week out, or a junk value could stall hiring forever.
  s.nextHireDay = clamp(Math.floor(n(s.nextHireDay, s.day + 7)), 1, s.day + 7);
  s.tx        = clamp(Math.floor(n(s.tx, 0)), 0, TX.length - 1);
  s.ant       = clamp(Math.floor(n(s.ant, 0)), 0, ANT.length - 1);
  s.opts.speed = SPEEDS[s.opts.speed] ? +s.opts.speed : 1;
  s.seenExpansion = !!s.seenExpansion;
  s.seenIntro     = !!s.seenIntro;
  // The gate flag every Empire branch and sceneTier()'s floor read. A truthy
  // string here used to survive as a string; harmless by accident, not by rule.
  s.unlockedExpansion = !!s.unlockedExpansion;
  // Forced false, not coerced: triggerBankruptcy() wipes the save and saveGame()
  // refuses to write a dead run, so `dead` can only reach a load path through
  // corruption or hand-editing — and a truthy one lands the player on the game
  // screen with no clock, no autosave and nothing that will ever resume it.
  s.dead = false;

  s.staff = Array.isArray(s.staff) ? s.staff.filter(p =>
      p && typeof p.id === 'string' && ROLES[p.role] && Number.isFinite(+p.skill)
    ).map(p => {
      const skill = clamp(Math.round(+p.skill), 1, 10);
      return Object.assign({}, p, {
        name: String(p.name || 'Unknown'),
        skill,
        salary: Number.isFinite(+p.salary) ? +p.salary : salaryFor(p.role, skill)
      });
    }) : [];

  s.log        = Array.isArray(s.log) ? s.log.slice(0, 60) : [];
  s.candidates = Array.isArray(s.candidates)
    ? s.candidates.filter(p => p && ROLES[p.role] && typeof p.id === 'string' && Number.isFinite(+p.skill))
    : [];

  s.stats.totalEarned   = n(s.stats.totalEarned, 0);
  s.stats.totalCosts    = Math.max(0, n(s.stats.totalCosts, 0));
  s.stats.daysOnAir     = Math.max(0, Math.floor(n(s.stats.daysOnAir, 0)));
  s.stats.peakListeners = Math.max(s.listeners, Math.round(n(s.stats.peakListeners, s.listeners)));

  // Every lastDay field is divided, compared or rendered somewhere, and one of
  // them decides money: catchUp() gates the whole offline payout on
  // `S.lastDay.net > 0` and then multiplies by it, so a string "120" from a
  // truncated save banked NaN cash and a NaN day counter. Rebuilt from a fixed
  // key list rather than coerced in place, so a junk key can't ride along.
  const ld = (s.lastDay && typeof s.lastDay === 'object') ? s.lastDay : {};
  s.lastDay = {};
  for (const k of ['listeners','revenue','costs','net','quality','network','royalties','repTarget']) {
    s.lastDay[k] = n(ld[k], 0);
  }

  if (s.secondStation) {
    s.secondStation = {
      call: String(s.secondStation.call || randomCall()),
      foundedDay: Math.max(1, Math.floor(n(s.secondStation.foundedDay, 1))),
      totalEarned: n(s.secondStation.totalEarned, 0)
    };
  }

  // A DJ id pointing at someone who is no longer on staff would make the slot
  // render blank while still counting as "assigned" in djLoad().
  const ids = new Set(s.staff.map(p => p.id));
  for (const p of DAYPARTS) {
    if (s.schedule[p.id].dj && !ids.has(s.schedule[p.id].dj)) s.schedule[p.id].dj = null;
  }

  // A clock stamp from the future (system time moved back) would make the
  // catch-up window negative; treat it as "just now".
  if (!Number.isFinite(s.lastTick) || s.lastTick > Date.now()) s.lastTick = Date.now();
  return s;
}

/** Truth-testing the raw string used to leave a corrupt entry enabling
    Continue forever with no way to clear it. */
function hasSave(){
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
  if (!raw) return false;
  let d;
  try { d = JSON.parse(raw); }
  catch (e) { wipeSave(); return false; }
  return !!d && typeof d === 'object' && Number.isFinite(+d.day) && typeof d.call === 'string';
}
function wipeSave(){ try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

/** Grant a capped lump sum for time the tab was closed (CLAUDE.md line 16).
    Deliberately NOT a simulateDay() loop: that would fire breakdown rolls,
    event modals and unlock modals against an unrendered UI, and could cross
    BANKRUPTCY_FLOOR with nothing on screen. A positive-only lump sum can't. */
function catchUp(){
  const now = Date.now();
  const dt = clamp(now - (S.lastTick || now), 0, OFFLINE_CAP_MS);
  S.lastTick = now;
  if (dt < 60000) return;
  const days = Math.min(Math.floor(dt / OFFLINE_MS_PER_DAY), OFFLINE_MAX_DAYS);
  if (days < 1 || !(S.lastDay.net > 0)) return;
  const gain = S.lastDay.net * days * OFFLINE_RATE;
  S.cash += gain;
  S.day += days;
  S.stats.daysOnAir += days;
  S.stats.totalEarned += gain;
  addLog('Automated broadcasting covered ' + days + ' days while you were away.', 'big');
  // Paint the lump sum before the dialog goes up, or the HUD sits on the
  // pre-absence numbers for as long as the player reads it.
  render();
  // This was the only modal in the game that left the clock running, so days
  // advanced (and event modals stacked up) behind "While you were away".
  modalPause();
  openModal('📻 While you were away',
    days + ' days of automated broadcasting',
    '<p style="font-size:13px;color:var(--muted);margin-top:10px">Unattended days pay half rate, and catch-up is capped at ' +
      OFFLINE_MAX_DAYS + ' broadcast days. Listeners and reputation pick up where the live schedule left them.</p>',
    [{ label: t('close'), cls: 'buy', act: dismissAutoModal }]);
}

/* ---------------- scene ---------------- */

/** `st` defaults to the running station; the main-menu backdrop passes a save
    it loaded without ever installing it as S. */
function sceneTier(st){
  const g = st || S;
  // Progression reads off the whole picture, not one stat.
  const invested = TX.slice(0, g.tx + 1).reduce((a,x)=>a+x.cost,0) + ANT.slice(0, g.ant + 1).reduce((a,x)=>a+x.cost,0);
  const score = (g.tx + g.ant) * 12 + g.rep * 0.9 + Math.log10(Math.max(10, g.listeners)) * 14 + Math.log10(Math.max(10, invested + 1)) * 5;
  // Unlocking expansion sets a floor, not the top tier — jumping straight to
  // the empire skyline the moment the gate opened left the $120k buildout with
  // no visual payoff, and pinned a collapsing station at tier 5 forever.
  const floor = g.unlockedExpansion ? 3 : 0;
  // Thresholds are calibrated against 600-day runs that drive the REAL tick(),
  // because the old 32/52/74/96/118 ladder predated the economy retune and
  // reached the final skyline around day 45-60 on one transmitter, one antenna
  // and 420 listeners — a third of the way in, with two thirds of the gear
  // ladder and the whole Empire pillar still ahead of it.
  // CALIBRATE ONLY AGAINST tick(). A sim that calls simulateDay() directly
  // never refreshes the candidate pool, so it plateaus at 2 staff / rep ~57 /
  // score ~200 and reports that expansion is unreachable. It isn't: measured
  // across four playstyles (all-music, talk-morning, news+talk mixed, ads-heavy)
  // the gate opens day 50-107 and the second station is founded day 65-125.
  // Every figure below is an ENVELOPE over 4 playstyles x 10 seeds (40 runs of
  // 600 days each), not one run — the spread is playstyle plus RNG, and the
  // slow edge of every band is the all-music style, which earns least early.
  //   day   2   ~35-42     nothing bought yet
  //   day  20   ~46-128    DJs on the slots, first antenna step
  //   day  40   ~77-182    transmitter + antenna underway, ~1-2k listeners
  //   day  60  ~142-235    mid gear ladder
  //   day 100  ~204-273    gear ladder finished, rep near 100
  //   day 140+ ~257-274    plateau — 8/8 gear, rep 100 and ~15k listeners is
  //                        the practical ceiling, so score cannot exceed ~275
  // These cuts put first arrivals at day 2 / 3-15 / 10-32 / 15-54 / 29-73 /
  // 51-102, so the top score tier lands with the endgame gear rather than the
  // tutorial, and founding the second station still forces it outright.
  const tier = (g.secondStation || score >= 215) ? 5
    : score >= 155 ? 4
    : score >= 100 ? 3
    : score >= 66 ? 2
    : score >= 44 ? 1 : 0;
  return Math.max(tier, floor);
}

function renderScene(){
  const tier = sceneTier();
  const have = typeof SCENE_TIERS !== 'undefined' && SCENE_TIERS && SCENE_TIERS[tier];
  if (!have) return '<div class="scene-wrap"><div class="scene-fallback">📡</div></div>';
  // The art ships with placeholder branding baked into the billboards and
  // vehicle wraps — swap in this station's identity so the city advertises YOU.
  const art = SCENE_TIERS[tier].html
    .replace(/CALLSIGNS/g, esc(S.call))
    .replace(/98\.6 FM/g, esc(S.freq + ' FM'))
    .replace(/98\.6/g, esc(S.freq));
  const name = t('scenes.' + SCENE_TIERS[tier].id);
  return '<div class="scene-wrap">' + art +
    '<div class="scene-caption">' + esc(name) + '</div></div>';
}

/* ---------------- UI: shell ---------------- */

const TABS = [
  { id: 'studio', icon: '🎚️', lbl: 'tabStudio' },
  { id: 'gear',   icon: '📡', lbl: 'tabGear' },
  { id: 'staff',  icon: '👥', lbl: 'tabStaff' },
  { id: 'empire', icon: '🏙️', lbl: 'tabEmpire' },
  { id: 'log',    icon: '📋', lbl: 'tabLog' }
];
let activeTab = 'studio';

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === 'screen-' + id));
  // Only the game screen has a tab bar for toasts to clear.
  document.body.classList.toggle('in-game', id === 'game');
}

/** Built exactly once per run, from enterGame(). render() only toggles classes
    on it — rebuilding the bar every tick threw away its :active/transition
    state and re-injected the badge span sixty times a minute. */
function buildTabs(){
  $('tabbar').innerHTML = TABS.map(tb =>
    '<button class="tab' + (tb.id === activeTab ? ' active' : '') + '" data-tab="' + tb.id + '">' +
      '<span class="tab-icon">' + tb.icon + '</span>' +
      '<span class="tab-lbl">' + esc(t(tb.lbl)) + '</span>' +
    '</button>'
  ).join('');
}

/** Class-only refresh of the already-built tab bar. */
function paintTabs(){
  document.querySelectorAll('#tabbar .tab').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === activeTab);
    if (b.dataset.tab === 'empire') {
      b.classList.toggle('has-badge',
        !!(S && S.unlockedExpansion && !S.seenExpansion && !S.secondStation));
    }
  });
}

function setTab(id){
  activeTab = id;
  // Visiting Empire is the acknowledgement — otherwise the badge stayed lit
  // for the rest of the run, second station or not.
  if (id === 'empire' && S) S.seenExpansion = true;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.tabpane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + id));
  $('game-content').scrollTop = 0;
  render();
}

/* ---------------- UI: render ---------------- */

/* The scene is ~40 nodes running twelve infinite CSS animations, and it used
   to be rebuilt on every tick — the 26s satellite never got past 19% of its
   orbit and the 4.2s wave rings never emitted a complete ring. It only ever
   changes when the tier, the callsign or the frequency does, so key it on
   exactly that and leave the DOM alone the rest of the time. */
let sceneKey = '';
function updateScene(){
  const k = sceneTier() + '|' + S.call + '|' + S.freq;
  if (k === sceneKey) return;
  sceneKey = k;
  $('scene-host').innerHTML = renderScene();
}

/* Day-over-day change chips on the three HUD stats. Stamped once per tick,
   wiped a couple of seconds later so the HUD isn't permanently noisy. */
let prevHud = null;
let hudDeltaHtml = { cash: '', listeners: '', rep: '' };
let hudDeltaTimer = null;

function hudDelta(cur, prev, fmt){
  const d = cur - prev;
  if (!Number.isFinite(d) || Math.abs(d) < 0.5) return '';
  return '<span class="delta ' + (d > 0 ? 'up' : 'down') + '">' +
    (d > 0 ? '+' : '−') + esc(fmt(Math.abs(d))) + '</span>';
}
function noteHudDeltas(){
  if (prevHud) hudDeltaHtml = {
    cash:      hudDelta(S.cash, prevHud.cash, money),
    listeners: hudDelta(S.listeners, prevHud.listeners, num),
    rep:       hudDelta(Math.round(S.rep), Math.round(prevHud.rep), n => String(Math.round(n)))
  };
  prevHud = { cash: S.cash, listeners: S.listeners, rep: S.rep };
  clearTimeout(hudDeltaTimer);
  hudDeltaTimer = setTimeout(() => {
    hudDeltaHtml = { cash: '', listeners: '', rep: '' };
    if (S) paintHudStats();
  }, 2500);
}
function resetHudDeltas(){
  clearTimeout(hudDeltaTimer);
  prevHud = null;
  hudDeltaHtml = { cash: '', listeners: '', rep: '' };
}
function paintHudStats(){
  $('stat-cash').innerHTML      = esc(money(S.cash)) + hudDeltaHtml.cash;
  $('stat-cash').style.color    = S.cash < 0 ? 'var(--red)' : '';
  $('stat-listeners').innerHTML = esc(num(S.listeners)) + hudDeltaHtml.listeners;
  $('stat-rep').innerHTML       = String(Math.round(S.rep)) + hudDeltaHtml.rep;
}

function render(){
  if (!S) return;
  $('hud-call').textContent = S.call;
  // Callsign plus frequency is a station's actual public identity; the gear
  // spec this used to repeat is the entire content of the Gear tab.
  $('hud-sub').textContent = S.freq + ' FM · ' + TX[S.tx].spec;
  $('hud-day').textContent = t('dayShort', { n: S.day });
  paintHudStats();

  if (activeTab === 'studio') { updateScene(); $('studio-body').innerHTML = viewStudio(); }
  if (activeTab === 'gear')   $('pane-gear').innerHTML   = viewGear();
  if (activeTab === 'staff')  $('pane-staff').innerHTML  = viewStaff();
  if (activeTab === 'empire') $('pane-empire').innerHTML = viewEmpire();
  if (activeTab === 'log')    $('pane-log').innerHTML    = viewLog();
  paintTabs();
  setPausedUI();
  // The pane we just replaced took the gamepad cursor's node with it —
  // paintFocus() was decorating an element render() discarded a tick later.
  if (padOn) setFocus(padIdx);
}

/** The first unmet item on an ordered checklist, as {text, tab}. This is the
    only thing in the game that ever tells a new player what to do next; null
    once the second station is signed on and there is nothing left to gate. */
function nextGoal(){
  if (!S.staff.length) return { text: t('goalHire'), tab: 'staff' };
  if (staffOf('dj').length && !DAYPARTS.some(p => S.schedule[p.id].dj)) {
    return { text: t('goalAssign'), tab: 'studio' };
  }
  const nexts = [TX[S.tx + 1], ANT[S.ant + 1]].filter(Boolean);
  for (const g of nexts) {
    if (S.cash >= g.cost && S.rep >= g.rep) return { text: t('goalBuy', { name: g.name }), tab: 'gear' };
  }
  const gated = nexts.filter(g => S.rep < g.rep);
  if (gated.length) {
    return { text: t('goalRep', { n: Math.min.apply(null, gated.map(g => g.rep)) }), tab: 'studio' };
  }
  if (S.unlockedExpansion && !S.secondStation) return { text: t('goalFound'), tab: 'empire' };
  return null;
}

function viewStudio(){
  const d = S.lastDay;
  const netCls = d.net >= 0 ? 'up' : 'down';
  let h = '';

  const goal = nextGoal();
  if (goal) {
    // A button, not a div: the whole row is a jump to the tab the goal lives on.
    h += '<button type="button" class="hint" data-tab="' + goal.tab + '" ' +
      'style="display:block;width:100%;text-align:left;cursor:pointer;' +
      'background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.34);' +
      'color:var(--amber);font-weight:700;min-height:40px">' +
      '▸ ' + esc(goal.text) + '</button>';
  }

  // Fires on runway, not on the sign of the balance: by the time cash is
  // already negative there is usually nothing left to do about it.
  if (S.cash < 0 || (d.costs > 0 && S.cash < d.costs * 5)) {
    h += '<div class="hint" style="background:rgba(248,113,113,.10);border-color:rgba(248,113,113,.32);color:var(--red)">⚠️ ' +
      esc(t('cashWarning')) + '</div>';
  }

  h += '<div class="two-col">';

  h += '<div class="card"><div class="card-head">' +
    '<span class="card-title">' + esc(t('dailyBrief')) + '</span>' +
    '<span class="card-note">' + esc(t('payroll', { amt: money(S.staff.reduce((a,p)=>a+p.salary,0)) })) + '</span>' +
    '</div><div class="sched">' +
      // Listeners lived here as an exact duplicate of the HUD (reading 0 under
      // a HUD reading 40 on day one). Quality and Buzz are the two numbers the
      // sim computes every day and never showed anyone.
      brief(t('briefQuality'), Math.round(d.quality * 100) + '%', 'cyan') +
      brief(t('reach'), reachValue().toFixed(1) + '×', 'magenta') +
      brief(t('fidelity'), fidelityValue().toFixed(2) + '×', 'amber') +
      brief(t('briefBuzz'), Math.round(S.buzz * 100) + '%', S.buzz >= 1 ? 'green' : 'red') +
    '</div>' +
    // Reputation drives three multipliers and two gate families, and nothing
    // in the game told the player which way it was heading.
    '<div style="margin-top:11px;text-align:center;font-size:12px;color:var(--muted)">' +
      esc(t('rep')) + ' <span style="color:var(--amber);font-weight:700">' +
      esc(t('repTrend', { now: Math.round(S.rep), target: Math.round(d.repTarget || 0) })) + '</span>' +
    '</div>' +
    '<div style="margin-top:7px;text-align:center;font-size:13px">';

  if (S.day > 1) {
    // "In" is everything that came in, not just the flagship's ad revenue:
    // simulateDay() folds the second station's contribution into net, so
    // printing bare revenue here made the brief read "196 in · 7 out · +239".
    // With one station network is 0 and this is exactly d.revenue.
    const network = d.network || 0;
    const takeIn = (d.revenue || 0) + network;
    h += '<span style="color:var(--muted)">Yesterday: </span>' +
      '<span style="color:var(--green);font-weight:700">' + money(takeIn) + '</span>' +
      '<span style="color:var(--muted)"> in · </span>' +
      '<span style="color:var(--red);font-weight:700">' + money(d.costs) + '</span>' +
      '<span style="color:var(--muted)"> out · </span>' +
      '<span class="delta ' + netCls + '" style="font-size:13px">' + (d.net >= 0 ? '+' : '') + money(d.net) + '</span>' +
      '<div style="margin-top:3px;font-size:11px;color:var(--dim)">' +
        esc(t('payroll', { amt: money(Math.max(0, (d.costs || 0) - (d.royalties || 0))) })) +
        ' · ' + esc(t('royaltiesLbl')) + ' ' + money(d.royalties || 0) + '/day' +
      '</div>';
    // Its own line once the second callsign is on the air: the network cut was
    // stored in lastDay from the day it was added and rendered nowhere.
    if (S.secondStation) {
      h += '<div style="margin-top:2px;font-size:11px;color:var(--green)">' +
        esc(t('networkLbl', { call: S.secondStation.call })) + ' +' + money(network) + '/day · ' +
        '<span style="color:var(--dim)">' + esc(t('onAirLbl')) + ' ' + money(d.revenue || 0) + '</span>' +
      '</div>';
    }
  } else {
    h += '<span style="color:var(--muted)">' + esc(t('firstDay')) + '</span>';
  }
  h += '</div></div>';

  h += '<div class="card"><div class="card-head">' +
    '<span class="card-title">' + esc(t('schedule')) + '</span>' +
    '<span class="card-note">' + esc(t('scheduleNote')) + '</span></div><div class="sched">';

  for (const part of DAYPARTS) {
    const slot = S.schedule[part.id];
    const show = SHOWS[slot.show];
    const dj = djFor(slot);
    const partName = partLabel(part.id);
    // <button>, not <div>: programming the schedule is the core mechanic and
    // it used to be unreachable without a mouse or a gamepad.
    h += '<button type="button" class="slot" data-openslot="' + part.id + '">' +
      '<span class="slot-part">' + part.icon + ' ' + esc(partName) + '</span>' +
      '<span class="slot-icon">' + show.icon + '</span>' +
      '<span class="slot-show">' + esc(t('show' + slot.show.charAt(0).toUpperCase() + slot.show.slice(1))) + '</span>' +
      '<span class="slot-' + (dj ? 'dj' : 'meta') + '">' + esc(dj ? '🎧 ' + dj.name.split(' ')[0] + ' · ' + dj.skill : t('noDj')) + '</span>' +
    '</button>';
  }
  h += '</div></div>';
  return h + '</div>';
}

function brief(label, val, color){
  return '<div style="text-align:center;padding:6px 2px">' +
    '<div style="font-size:17px;font-weight:800;color:var(--' + color + ')">' + esc(val) + '</div>' +
    '<div style="font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.9px">' + esc(label) + '</div>' +
  '</div>';
}

function viewGear(){
  return '<div class="two-col">' +
    gearCard('tx', TX, S.tx, t('transmitter'), '📡', 'reach') +
    gearCard('ant', ANT, S.ant, t('antenna'), '🗼', 'fid') +
  '</div>';
}

function gearCard(key, arr, idx, title, icon, statKey){
  const cur = arr[idx];
  const next = arr[idx + 1];
  const maxed = !next;
  const affordable = next && S.cash >= next.cost;
  const repOk = next && S.rep >= next.rep;

  let h = '<div class="card"><div class="card-head">' +
    '<span class="card-title">' + icon + ' ' + esc(title) + '</span>' +

/* ---------------- audio ----------------
   Tiny Web Audio synth — no asset files, nothing to vendor. Muted entirely
   when S.opts.sound is off (default on) or before any game state exists. */

let actx = null;
function audioOn(){ return S ? S.opts.sound !== false : true; }
function ensureAudioCtx(){
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
  return actx;
}
function tone(freq, dur, type, vol, delay){
  if (!audioOn()) return;
  const ctx = ensureAudioCtx();
  if (!ctx) return;
  const t0 = ctx.currentTime + (delay || 0);
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol || 0.1, t0 + 0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.03);
}
function sfxClick(){ tone(760, 0.045, 'square', 0.045); }
function sfxBuy(){ tone(520, 0.09, 'triangle', 0.08); tone(780, 0.12, 'triangle', 0.07, 0.06); }
/** On-air chime — ascending major triad, for good events / good news. */
function sfxOnAir(){
  tone(660, 0.14, 'sine', 0.09);
  tone(880, 0.18, 'sine', 0.09, 0.09);
  tone(1320, 0.22, 'sine', 0.08, 0.2);
}
/** Dead-air sting — a low, sour drop for equipment breakdowns. */
function sfxDeadAir(){
  tone(180, 0.3, 'sawtooth', 0.09);
  tone(120, 0.35, 'sawtooth', 0.08, 0.12);
}
function sfxTrouble(){
  tone(320, 0.12, 'square', 0.06);
  tone(230, 0.16, 'square', 0.055, 0.09);
}
function sfxBankrupt(){
  tone(220, 0.5, 'sawtooth', 0.1);
  tone(150, 0.6, 'sawtooth', 0.09, 0.16);
  tone(90, 0.9, 'sawtooth', 0.08, 0.34);
}

/* ---------------- modals & toasts ---------------- */

let modalActions = [];
// Modals queue instead of last-write-wins: if a random event's modal and the
// expansion-unlock modal (or any two modals) fire on the same tick, the
// second call queues behind the first rather than overwriting it before the
// player has read it.
let modalQueue = [];
// Options for the modal currently on screen: { replace, autoPause, blocking }.
let modalOpts = {};
// True while the sim was stopped *by* a modal rather than by the player, so
// closeModal() knows it owns the resume. Without this, dismissing an
// auto-paused modal with Esc or a backdrop click froze the station for good.
let autoPaused = false;

function openModal(title, sub, bodyHtml, actions, opts){
  // opts.replace redraws the open modal in place (the slot editor re-opens
  // itself on every pick) instead of queueing a duplicate behind itself.
  if (!opts || !opts.replace) {
    if ($('modal-back').classList.contains('open')) {
      modalQueue.push({ title, sub, bodyHtml, actions, opts });
      return;
    }
  }
  showModalNow(title, sub, bodyHtml, actions, opts);
}
function showModalNow(title, sub, bodyHtml, actions, opts){
  modalActions = actions || [];
  modalOpts = opts || {};
  $('modal').innerHTML =
    '<div class="modal-title">' + esc(title) + '</div>' +
    (sub ? '<div class="modal-sub">' + esc(sub) + '</div>' : '') +
    (bodyHtml || '') +
    '<div class="modal-btns">' + modalActions.map((a, i) =>
      '<button class="btn ' + (a.cls || '') + '" data-modal-act="' + i + '">' + esc(a.label) + '</button>'
    ).join('') + '</div>';
  $('modal-back').classList.add('open');
}
function closeModal(){
  // Read this BEFORE the shift below — once we've popped the next modal off,
  // the queue looks empty even though something is about to take the screen.
  const chaining = modalQueue.length > 0;
  $('modal-back').classList.remove('open');
  modalActions = [];
  modalOpts = {};
  if (chaining) {
    const next = modalQueue.shift();
    setTimeout(() => showModalNow(next.title, next.sub, next.bodyHtml, next.actions, next.opts), 30);
  }
  // Single convergence point for resuming: however the modal went away —
  // a button, Esc, or a backdrop click — the clock comes back, but only once
  // the whole queue is drained.
  if (!chaining && autoPaused) {
    autoPaused = false;
    if (S && !S.dead && $('screen-game').classList.contains('active')) resumeTick();
  }
}
/** Kept as a name because several modals reference it directly; the resume
    logic it used to own now lives in closeModal(). */
function dismissAutoModal(){ closeModal(); }
/** Hard teardown for returning to the main menu. Anything still queued would
    otherwise materialise 30ms later over the menu, holding closures that
    reference a state object we just nulled. */
function closeAllModals(){
  modalQueue.length = 0;
  modalActions = [];
  modalOpts = {};
  autoPaused = false;
  $('modal-back').classList.remove('open');
  $('modal').innerHTML = '';
}

function toast(msg, kind){
  const box = $('toasts');
  // Cap the stack — a bad day can queue a breakdown, an event and a save
  // failure at once, and four is already the whole screen on a phone.
  while (box.children.length >= 4) box.firstChild.remove();
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => el.remove(), 3400);
}

/* ---------------- actions ---------------- */

function refreshCandidates(){
  const n = randInt(2, 3);
  S.candidates = [];
  const roles = ['dj', 'eng', 'sales'];
  for (let i = 0; i < n; i++) S.candidates.push(makePerson(pick(roles), S.rep));
  // Always keep a DJ available early — the game is unreadable without one.
  if (S.day < 12 && !S.candidates.some(c => c.role === 'dj')) S.candidates[0] = makePerson('dj', S.rep);
}

function buyGear(key){
  const arr = key === 'tx' ? TX : ANT;
  const idx = key === 'tx' ? S.tx : S.ant;
  const next = arr[idx + 1];
  if (!next || S.cash < next.cost || S.rep < next.rep) return;
  S.cash -= next.cost;
  if (key === 'tx') S.tx++; else S.ant++;
  addLog('Upgraded to ' + next.name + '.', 'big');
  toast('📡 ' + next.name + ' installed', 'good');
  sfxBuy();
  saveGame(true);
  render();
}

function hirePerson(id){
  const p = S.candidates.find(c => c.id === id);
  if (!p) return;
  const fee = hireFee(p);
  if (S.cash < fee) return;
  S.cash -= fee;
  S.staff.push(p);
  S.candidates = S.candidates.filter(c => c.id !== id);
  addLog(t('hiredMsg', { name: p.name, role: roleName(p.role) }), 'good');
  toast(ROLES[p.role].icon + ' ' + t('hiredMsg', { name: p.name, role: roleName(p.role) }), 'good');
  sfxBuy();
  saveGame(true);
  render();
}

function firePerson(id){
  const p = S.staff.find(x => x.id === id);
  if (!p) return;
  // Stop the clock while the player decides — days shouldn't tick by (and
  // event modals shouldn't stack up) behind a confirmation dialog.
  modalPause();
  openModal(t('fireConfirm', { name: p.name }), t('fireConfirmSub'), '', [
    { label: t('cancel'), cls: 'ghost', act: closeModal },
    { label: t('fire'), cls: 'danger', act: () => {
        S.staff = S.staff.filter(x => x.id !== id);
        for (const k in S.schedule) if (S.schedule[k].dj === id) S.schedule[k].dj = null;
        addLog(t('firedMsg', { name: p.name }), 'bad');
        closeModal(); saveGame(true); render();
      } }
  ]);
}

function trainPerson(id){
  const p = S.staff.find(x => x.id === id);
  if (!p || p.skill >= 10) return;
  const cost = trainCostFor(p.skill);
  if (S.cash < cost) return;
  S.cash -= cost;
  p.skill++;
  p.salary = salaryFor(p.role, p.skill);
  addLog(t('trainedMsg', { name: p.name, n: p.skill }), 'good');
  toast('📈 ' + t('trainedMsg', { name: p.name, n: p.skill }), 'good');
  sfxBuy();
  saveGame(true);
  render();
}

/** Firing a $33/day DJ already asks for confirmation; a $120,000 buildout
    fired by one unconfirmed click was the biggest unguarded spend in the game. */
function foundSecondStation(){
  if (!S.unlockedExpansion || S.secondStation || S.cash < SECOND_STATION_COST) return;
  modalPause();
  openModal(t('foundConfirm'), t('foundConfirmSub', { amt: money(SECOND_STATION_COST) }),
    '<p style="font-size:13px;color:var(--muted);margin-top:10px">' +
      esc(t('foundStationNote', { amt: money(SECOND_STATION_COST) })) + '</p>',
    [
      { label: t('cancel'), cls: 'ghost', act: closeModal },
      { label: t('foundStation'), cls: 'buy', act: () => { closeModal(); doFoundSecondStation(); } }
    ]);
}

function doFoundSecondStation(){
  // Re-check: days can pass behind the confirm modal only if the player
  // un-paused, but the guard is free and the spend is not.
  if (!S.unlockedExpansion || S.secondStation || S.cash < SECOND_STATION_COST) return;
  S.cash -= SECOND_STATION_COST;
  const call2 = randomCall();
  S.secondStation = { call: call2, foundedDay: S.day, totalEarned: 0 };
