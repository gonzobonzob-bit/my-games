<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Grimoire Siege</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#04030e;--panel:#07050c;--card:#0d0b18;--border:#1a1030;--purple:#7c3aed;--gold:#d97706;--red:#dc2626;--green:#16a34a;--blue:#2563eb;--text:#e2d9f3;--muted:#4a3d6a;}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Nunito',sans-serif;color:var(--text);}
#splash{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,#14082a,#030108);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;gap:14px;padding:30px;text-align:center;}
.sp-ico{font-size:72px;filter:drop-shadow(0 0 30px #7c3aedcc);animation:wizFloat 2s ease-in-out infinite;}
@keyframes wizFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
.sp-title{font-family:'Cinzel',serif;font-size:26px;font-weight:900;background:linear-gradient(135deg,#c4b5fd,#f0abfc,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sp-sub{font-size:10px;color:var(--muted);letter-spacing:2px;}
.sp-desc{font-size:11px;color:var(--text);line-height:1.7;max-width:270px;}
.sp-btn{background:linear-gradient(135deg,#5b21b6,#7c3aed);border:none;border-radius:14px;padding:14px 40px;font-family:'Cinzel',serif;font-size:18px;color:#e9d5ff;cursor:pointer;box-shadow:0 6px 24px rgba(124,58,237,0.5);}
.sp-btn.continue{background:linear-gradient(135deg,#166534,#16a34a);box-shadow:0 6px 24px rgba(22,163,74,0.5);}
#splash-stats{display:none;font-size:11px;color:var(--muted);font-weight:700;}
#splash-stats b{color:#fbbf24;}
#hud{background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:5px 10px;flex-shrink:0;gap:6px;}
.hud-stat{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:700;}
.hud-stat .icon{font-size:14px;}
.hud-lives{color:#ef4444;}
.hud-gold{color:#fbbf24;}
.hud-wave{color:#a78bfa;font-family:'Cinzel',serif;}
.hud-controls{display:flex;gap:5px;margin-left:auto;}
.hud-icon-btn{background:var(--card);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:12px;font-weight:800;padding:4px 9px;cursor:pointer;}
.hud-icon-btn:active{transform:scale(0.93);}
#game-wrap{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;}
#main-canvas{display:block;flex:1;}
#tower-panel{background:var(--panel);border-top:1px solid var(--border);padding:6px 8px;display:flex;gap:5px;overflow-x:auto;flex-shrink:0;}
#tower-panel::-webkit-scrollbar{display:none;}
.tower-btn{flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 8px;cursor:pointer;text-align:center;min-width:58px;transition:border-color 0.2s;}
.tower-btn:active{transform:scale(0.93);}
.tower-btn.selected{border-color:var(--purple);}
.tower-btn.cant{opacity:0.45;}
.tb-icon{font-size:20px;display:block;margin-bottom:1px;}
.tb-name{font-size:7px;font-weight:700;color:var(--text);display:block;text-transform:uppercase;letter-spacing:0.3px;}
.tb-cost{font-size:8px;color:#fbbf24;}
#msg-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:50;}
.wave-msg{font-family:'Cinzel',serif;font-size:22px;font-weight:900;color:#f0abfc;text-shadow:0 0 30px #7c3aed;animation:waveMsgAn 2s ease forwards;}
@keyframes waveMsgAn{0%{opacity:0;transform:scale(0.7)}30%{opacity:1;transform:scale(1.1)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(0.9)}}
#tower-action-panel{position:absolute;z-index:60;display:none;background:var(--card);border:1px solid var(--purple);border-radius:12px;padding:10px 12px;min-width:150px;box-shadow:0 8px 28px rgba(0,0,0,0.55);}
#tower-action-panel.show{display:block;}
.tap-name{font-family:'Cinzel',serif;font-weight:900;font-size:13px;margin-bottom:3px;}
.tap-stats{font-size:9px;color:var(--muted);font-weight:700;margin-bottom:8px;line-height:1.5;}
.tap-btns{display:flex;gap:6px;}
.tap-btns button{flex:1;background:linear-gradient(135deg,#5b21b6,#7c3aed);border:none;border-radius:8px;padding:6px 4px;font-size:10px;font-weight:800;color:#e9d5ff;cursor:pointer;}
.tap-btns button:disabled{opacity:0.4;cursor:not-allowed;}
.tap-btns button.sell-btn{background:linear-gradient(135deg,#7f1d1d,#dc2626);}
.tap-close{position:absolute;top:4px;right:6px;background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:2px;}
#pause-overlay,#gameover{position:fixed;inset:0;background:rgba(0,0,0,0.88);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:200;gap:14px;}
#pause-overlay.show,#gameover.show{display:flex;}
.go-title{font-family:'Cinzel',serif;font-size:32px;}
#pause-overlay .go-title{font-size:26px;}
.go-score{font-family:'Cinzel',serif;font-size:13px;color:#fbbf24;text-align:center;max-width:280px;}
.go-btn{background:linear-gradient(135deg,#5b21b6,#7c3aed);border:none;border-radius:12px;padding:12px 36px;font-family:'Cinzel',serif;font-size:16px;color:#e9d5ff;cursor:pointer;margin-top:6px;}
.go-btn.secondary{background:linear-gradient(135deg,#1f2937,#374151);font-size:13px;padding:9px 26px;}
</style>
</head>
<body>
<div id="splash">
  <div class="sp-ico">🧙‍♂️</div>
  <div class="sp-title">GRIMOIRE SIEGE</div>
  <div class="sp-sub">TOWER DEFENSE</div>
  <div class="sp-desc">Your tower is under siege. Place magical defenses, upgrade your arsenal, and hold the line through 12 waves of darkness. Do not let them reach the crystal.</div>
  <div id="splash-stats">Best Wave <b id="best-wave-disp">0</b>/12 &nbsp;·&nbsp; High Score <b id="high-score-disp">0</b></div>
  <button class="sp-btn continue" id="continue-btn" style="display:none;" onclick="startGame(true)">Continue Siege</button>
  <button class="sp-btn" onclick="startGame(false)">New Siege</button>
</div>
<div id="app" style="display:none;flex-direction:column;height:100%;">
  <div id="hud">
    <div class="hud-stat hud-lives"><span class="icon">❤️</span><span id="hud-lives">20</span></div>
    <div class="hud-stat hud-gold"><span class="icon">🪙</span><span id="hud-gold">150</span></div>
    <div class="hud-stat hud-wave"><span>WAVE </span><span id="hud-wave">0</span><span>/12</span></div>
    <div class="hud-stat" style="color:#a78bfa"><span id="hud-kills">0</span><span style="font-size:9px;margin-left:2px;color:var(--muted)">kills</span></div>
    <div class="hud-controls">
      <button class="hud-icon-btn" id="speed-btn" onclick="toggleSpeed()" title="Toggle speed">1x</button>
      <button class="hud-icon-btn" onclick="pauseGame()" title="Pause">⏸️</button>
    </div>
  </div>
  <div id="game-wrap">
    <canvas id="main-canvas"></canvas>
    <div id="msg-overlay"></div>
    <div id="tower-action-panel">
      <button class="tap-close" onclick="closeTowerActionPanel()">✕</button>
      <div class="tap-name" id="tap-name"></div>
      <div class="tap-stats" id="tap-stats"></div>
      <div class="tap-btns">
        <button id="tap-upgrade-btn" onclick="upgradeSelectedTower()">Upgrade</button>
        <button class="sell-btn" onclick="sellSelectedTower()">Sell</button>
      </div>
    </div>
  </div>
  <div id="tower-panel"></div>
</div>
<div id="pause-overlay">
  <div class="go-title">⏸️ PAUSED</div>
  <button class="go-btn" onclick="resumeGame()">Resume</button>
  <button class="go-btn secondary" onclick="saveAndExit()">Save &amp; Main Menu</button>
  <button class="go-btn secondary" onclick="exitNoSave()">Main Menu (No Save)</button>
</div>
<div id="gameover">
  <div class="go-title" id="go-title">☠️ DEFEATED</div>
  <div class="go-score" id="go-score"></div>
  <button class="go-btn" onclick="location.reload()">Play Again</button>
</div>
<script>
const TOWERS=[
  {id:'arrow',name:'Archer',icon:'🏹',cost:50,dmg:25,range:120,rate:60,color:'#22c55e',proj:'arrow'},
  {id:'fire',name:'Pyromage',icon:'🔥',cost:80,dmg:40,range:100,rate:80,color:'#ef4444',proj:'fire',aoe:30},
  {id:'ice',name:'Frost',icon:'❄️',cost:70,dmg:20,range:110,rate:70,color:'#38bdf8',proj:'ice',slow:0.5},
  {id:'lightning',name:'Storm',icon:'⚡',cost:100,dmg:60,range:130,rate:100,color:'#fbbf24',proj:'lightning',chain:2},
  {id:'poison',name:'Venom',icon:'☠️',cost:90,dmg:15,range:95,rate:50,color:'#84cc16',proj:'poison',dot:5},
  {id:'cannon',name:'Cannon',icon:'💣',cost:120,dmg:100,range:90,rate:120,color:'#6b7280',proj:'cannon',aoe:50},
  {id:'magic',name:'Arcane',icon:'🔮',cost:150,dmg:80,range:150,rate:90,color:'#a855f7',proj:'magic'},
  {id:'dark',name:'Shadow',icon:'🌑',cost:200,dmg:150,range:140,rate:130,color:'#4b5563',proj:'dark',aoe:40},
  {id:'holy',name:'Divine',icon:'✨',cost:180,dmg:120,range:160,rate:100,color:'#fde047',proj:'holy'},
  {id:'dragon',name:'Dragon',icon:'🐉',cost:300,dmg:200,range:180,rate:150,color:'#f97316',proj:'dragon',aoe:60},
];

const WAVE_DEFS=[
  {count:8,hp:60,spd:1.2},{count:12,hp:80,spd:1.3},{count:10,hp:100,spd:1.4,boss:1},
  {count:15,hp:90,spd:1.5},{count:12,hp:130,spd:1.4,fast:3},{count:18,hp:120,spd:1.6,boss:1},
  {count:20,hp:150,spd:1.5},{count:15,hp:200,spd:1.7,fast:5},{count:22,hp:180,spd:1.6,boss:2},
  {count:25,hp:220,spd:1.8},{count:20,hp:300,spd:1.7,boss:2},{count:30,hp:400,spd:2.0,boss:3},
];

const SAVE_KEY='grimoireSiege_save_v1';
const MAX_TOWER_LEVEL=3;

let canvas,ctx,W,H,gameWrapEl;
let towers=[],enemies=[],projectiles=[],particles=[];
let gold=150,lives=20,wave=0,kills=0,waveActive=false;
let selectedTower=null,selectedPlacedTower=null,frame=0;
let path=[],pathCum=[];
let paused=false,gameSpeed=1;
let waveState=null;
let hoverX=null,hoverY=null;
let autosaveIntervalId=null;
let gameStarted=false;

function buildPath(W,H){
  return [
    {x:0,y:H*0.25},{x:W*0.2,y:H*0.25},{x:W*0.2,y:H*0.6},
    {x:W*0.5,y:H*0.6},{x:W*0.5,y:H*0.2},{x:W*0.75,y:H*0.2},
    {x:W*0.75,y:H*0.75},{x:W,y:H*0.75}
  ];
}

function computePathCum(){
  pathCum=[0];
  for(let i=1;i<path.length;i++){
    pathCum.push(pathCum[i-1]+Math.hypot(path[i].x-path[i-1].x,path[i].y-path[i-1].y));
  }
}

// Distance already travelled along the path — used to target the enemy
// that is furthest along (closest to the crystal) instead of array order.
function enemyProgress(e){
  const idx=Math.min(e.pathIdx,pathCum.length-1);
  return pathCum[idx]+Math.hypot(e.x-path[idx].x,e.y-path[idx].y);
}

// ---------------- Save / persistence ----------------
function loadSave(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return {version:1,bestWave:0,highScore:0,checkpoint:null};
    const data=JSON.parse(raw);
    if(!data||typeof data!=='object')throw new Error('malformed save');
    return {
      version:1,
      bestWave:Number(data.bestWave)||0,
      highScore:Number(data.highScore)||0,
      checkpoint:(data.checkpoint&&typeof data.checkpoint==='object')?data.checkpoint:null
    };
  }catch(e){
    console.warn('Grimoire Siege: save load failed, starting fresh',e);
    return {version:1,bestWave:0,highScore:0,checkpoint:null};
  }
}

function writeSave(patch){
  try{
    const current=loadSave();
    const merged=Object.assign({},current,patch,{version:1});
    localStorage.setItem(SAVE_KEY,JSON.stringify(merged));
  }catch(e){
    console.warn('Grimoire Siege: save write failed',e);
  }
}

// Checkpoints capture the run at the last wave boundary (not mid-wave):
// resuming always restarts the in-progress wave fresh rather than trying
// to reconstruct exact enemy/projectile state.
function saveCheckpoint(){
  if(!gameStarted||lives<=0)return;
  try{
    const resumeWave=Math.min(waveActive?wave:wave+1,12);
    const checkpoint={
      gold,lives,kills,wave:resumeWave,
      towers:towers.map(t=>({id:t.id,x:t.x,y:t.y,level:t.level||0,invested:t.invested||t.cost}))
    };
    writeSave({checkpoint});
  }catch(e){
    console.warn('Grimoire Siege: autosave failed',e);
  }
}

function clearCheckpoint(){ writeSave({checkpoint:null}); }

function recordRunEnd(){
  const save=loadSave();
  const bestWave=Math.max(save.bestWave,wave);
  const score=kills*10+wave*50+gold;
  const highScore=Math.max(save.highScore,score);
  writeSave({bestWave,highScore,checkpoint:null});
  return {bestWave,highScore};
}

(function initSplash(){
  try{
    const save=loadSave();
    const bwEl=document.getElementById('best-wave-disp');
    const hsEl=document.getElementById('high-score-disp');
    if(bwEl)bwEl.textContent=save.bestWave;
    if(hsEl)hsEl.textContent=save.highScore;
    const statsEl=document.getElementById('splash-stats');
    if(statsEl&&(save.bestWave>0||save.highScore>0))statsEl.style.display='block';
    const contBtn=document.getElementById('continue-btn');
    if(contBtn&&save.checkpoint)contBtn.style.display='inline-block';
  }catch(e){ console.warn('Grimoire Siege: splash init failed',e); }
})();

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'&&gameStarted)saveCheckpoint();
});
window.addEventListener('pagehide',()=>{ if(gameStarted)saveCheckpoint(); });
document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape'&&gameStarted&&lives>0){
    if(paused)resumeGame();else pauseGame();
  }
});

function startGame(continueRun){
  document.getElementById('splash').style.display='none';
  const app=document.getElementById('app');
  app.style.display='flex';
  canvas=document.getElementById('main-canvas');
  gameWrapEl=document.getElementById('game-wrap');
  W=canvas.width=gameWrapEl.offsetWidth;
  H=canvas.height=gameWrapEl.offsetHeight;
  ctx=canvas.getContext('2d');
  path=buildPath(W,H);
  computePathCum();

  gold=150;lives=20;wave=0;kills=0;waveActive=false;
  towers=[];enemies=[];projectiles=[];particles=[];
  selectedTower=null;selectedPlacedTower=null;waveState=null;
  gameSpeed=1;
  const speedBtn=document.getElementById('speed-btn');
  if(speedBtn)speedBtn.textContent='1x';

  let resumeWave=0;
  if(continueRun){
    try{
      const save=loadSave();
      if(save.checkpoint){
        const cp=save.checkpoint;
        if(typeof cp.gold==='number')gold=cp.gold;
        if(typeof cp.lives==='number')lives=cp.lives;
        if(typeof cp.kills==='number')kills=cp.kills;
        resumeWave=Math.max(0,(cp.wave||1)-1);
        if(Array.isArray(cp.towers)){
          towers=cp.towers.map(ct=>{
            const base=TOWERS.find(t=>t.id===ct.id);
            if(!base)return null;
            return {...base,x:ct.x,y:ct.y,cd:0,level:ct.level||0,invested:ct.invested||base.cost};
          }).filter(Boolean);
        }
      }
    }catch(e){ console.warn('Grimoire Siege: continue load failed, starting fresh',e); }
  }
  wave=resumeWave;

  buildTowerPanel();
  canvas.addEventListener('click',onCanvasClick);
  canvas.addEventListener('mousemove',onCanvasHover);
  canvas.addEventListener('touchstart',onCanvasTouchHover,{passive:true});
  canvas.addEventListener('touchmove',onCanvasTouchHover,{passive:true});

  gameStarted=true;
  paused=false;
  lastT=performance.now();
  requestAnimationFrame(gameLoop);
  setTimeout(startWave,2000);

  if(autosaveIntervalId)clearInterval(autosaveIntervalId);
  autosaveIntervalId=setInterval(saveCheckpoint,30000);

  updateHUD();
}

// ---------------- Pause / speed ----------------
function pauseGame(){
  if(paused||!gameStarted||lives<=0)return;
  paused=true;
  if(waveState&&waveState.intervalId){
    clearInterval(waveState.intervalId);
    waveState.intervalId=null;
    waveState.pausedSpawning=true;
  }
  document.getElementById('pause-overlay').classList.add('show');
}

function resumeGame(){
  if(!paused)return;
  paused=false;
  document.getElementById('pause-overlay').classList.remove('show');
  if(waveState&&waveState.pausedSpawning){
    waveState.pausedSpawning=false;
    startSpawning();
  }
  lastT=performance.now();
  requestAnimationFrame(gameLoop);
}

function saveAndExit(){
  saveCheckpoint();
  location.reload();
}
function exitNoSave(){
  location.reload();
}

function toggleSpeed(){
  gameSpeed=gameSpeed===1?2:1;
  document.getElementById('speed-btn').textContent=gameSpeed+'x';
}

// ---------------- Tower panel / placement ----------------
function buildTowerPanel(){
  const panel=document.getElementById('tower-panel');
  panel.innerHTML=TOWERS.map((t)=>`
    <div class="tower-btn ${gold<t.cost?'cant':''} ${selectedTower&&selectedTower.id===t.id?'selected':''}" id="tbtn-${t.id}" onclick="selectTower('${t.id}')">
      <span class="tb-icon">${t.icon}</span>
      <span class="tb-name">${t.name}</span>
      <span class="tb-cost">${t.cost}🪙</span>
    </div>`).join('');
}

function refreshGoldUI(){
  buildTowerPanel();
  if(selectedPlacedTower)openTowerActionPanel(selectedPlacedTower);
}

function selectTower(id){
  closeTowerActionPanel();
  selectedTower=TOWERS.find(t=>t.id===id);
  document.querySelectorAll('.tower-btn').forEach(b=>b.classList.remove('selected'));
  const btn=document.getElementById('tbtn-'+id);
  if(btn)btn.classList.add('selected');
}

function isBlockedByPath(x,y){
  for(let i=0;i<path.length-1;i++){
    const A=path[i],B=path[i+1];
    const dx=B.x-A.x,dy=B.y-A.y;
    const len=Math.sqrt(dx*dx+dy*dy);
    if(len===0)continue;
    const nx=-dy/len,ny=dx/len;
    const px=x-A.x,py=y-A.y;
    const proj=(px*dx+py*dy)/(dx*dx+dy*dy);
    if(proj>=0&&proj<=1){
      const perpDist=Math.abs(px*nx+py*ny);
      if(perpDist<28)return true;
    }
  }
  return false;
}

function isValidPlacement(x,y){
  if(isBlockedByPath(x,y))return false;
  if(towers.some(t=>Math.hypot(t.x-x,t.y-y)<35))return false;
  return true;
}

function onCanvasHover(e){
  if(paused)return;
  const rect=canvas.getBoundingClientRect();
  hoverX=e.clientX-rect.left;hoverY=e.clientY-rect.top;
}
function onCanvasTouchHover(e){
  if(paused||!e.touches||!e.touches[0])return;
  const rect=canvas.getBoundingClientRect();
  hoverX=e.touches[0].clientX-rect.left;hoverY=e.touches[0].clientY-rect.top;
}

function onCanvasClick(e){
  if(paused)return;
  const rect=canvas.getBoundingClientRect();
  const x=e.clientX-rect.left,y=e.clientY-rect.top;
  hoverX=x;hoverY=y;

  // Tap on an existing tower selects it for upgrade/sell instead of placing.
  const tapped=towers.find(t=>Math.hypot(t.x-x,t.y-y)<24);
  if(tapped){
    selectedTower=null;
    document.querySelectorAll('.tower-btn').forEach(b=>b.classList.remove('selected'));
    openTowerActionPanel(tapped);
    return;
  }
  closeTowerActionPanel();

  if(!selectedTower||gold<selectedTower.cost)return;
  if(!isValidPlacement(x,y))return;
  towers.push({...selectedTower,x,y,cd:0,level:0,invested:selectedTower.cost});
  gold-=selectedTower.cost;
  sfx('place');
  updateHUD();
  refreshGoldUI();
}

// ---------------- Tower upgrade / sell ----------------
function towerStats(t){
  const lvl=t.level||0;
  return {
    dmg:Math.round(t.dmg*(1+0.45*lvl)),
    range:Math.round(t.range*(1+0.12*lvl)),
    rate:Math.max(20,Math.round(t.rate*(1-0.15*lvl)))
  };
}
function upgradeCost(t){ return Math.floor(t.cost*0.55*((t.level||0)+1)); }
function sellValue(t){ return Math.floor((t.invested||t.cost)*0.6); }

function openTowerActionPanel(t){
  selectedPlacedTower=t;
  const panel=document.getElementById('tower-action-panel');
  const stats=towerStats(t);
  const maxed=(t.level||0)>=MAX_TOWER_LEVEL;
  document.getElementById('tap-name').textContent=`${t.icon} ${t.name} Lv.${(t.level||0)+1}`;
  document.getElementById('tap-stats').textContent=`DMG ${stats.dmg} · RNG ${stats.range} · Sell ${sellValue(t)}🪙`;
  const upBtn=document.getElementById('tap-upgrade-btn');
  if(maxed){
    upBtn.textContent='MAX LEVEL';
    upBtn.disabled=true;
  }else{
    const cost=upgradeCost(t);
    upBtn.textContent=`Upgrade (${cost}🪙)`;
    upBtn.disabled=gold<cost;
  }
  const maxLeft=Math.max(6,(gameWrapEl?gameWrapEl.offsetWidth:W)-160);
  const maxTop=Math.max(6,(gameWrapEl?gameWrapEl.offsetHeight:H)-120);
  panel.style.left=Math.max(6,Math.min(t.x-70,maxLeft))+'px';
  panel.style.top=Math.max(6,Math.min(t.y+18,maxTop))+'px';
  panel.classList.add('show');
}

function closeTowerActionPanel(){
  selectedPlacedTower=null;
  const panel=document.getElementById('tower-action-panel');
  if(panel)panel.classList.remove('show');
}

function upgradeSelectedTower(){
  const t=selectedPlacedTower;
  if(!t||(t.level||0)>=MAX_TOWER_LEVEL)return;
  const cost=upgradeCost(t);
  if(gold<cost)return;
  gold-=cost;
  t.level=(t.level||0)+1;
  t.invested=(t.invested||t.cost)+cost;
  sfx('place');
  updateHUD();
  refreshGoldUI();
}

function sellSelectedTower(){
  const t=selectedPlacedTower;
  if(!t)return;
  gold+=sellValue(t);
  towers=towers.filter(x=>x!==t);
  closeTowerActionPanel();
  sfx('sell');
  updateHUD();
  refreshGoldUI();
}

// ---------------- Waves ----------------
// Wave state tracks spawn progress explicitly: a wave is only "complete"
// once every enemy for it has been spawned (spawned>=total) AND the
// board is clear (enemies.length===0). The spawn setInterval handle is
// always stored and cleared before a new one is created, so waves can
// never overlap or stack spawn timers.
function startWave(){
  if(paused)return;
  if(wave>=12){showGameOver(true);return;}
  wave++;
  waveActive=true;
  const def=WAVE_DEFS[wave-1];
  sfx('wave');
  showMsg('⚔️ WAVE '+wave);
  const total=def.count+(def.boss||0)+(def.fast||0);
  waveState={def,total,spawned:0,intervalId:null,pausedSpawning:false};
  startSpawning();
  updateHUD();
}

function startSpawning(){
  if(!waveState)return;
  if(waveState.intervalId){clearInterval(waveState.intervalId);waveState.intervalId=null;}
  waveState.intervalId=setInterval(()=>{
    if(!waveState||waveState.spawned>=waveState.total){
      if(waveState&&waveState.intervalId){clearInterval(waveState.intervalId);waveState.intervalId=null;}
      return;
    }
    const def=waveState.def;
    const spawned=waveState.spawned;
    const isBoss=def.boss&&spawned<(def.boss||0);
    const isFast=def.fast&&spawned>=(def.boss||0)&&spawned<(def.boss||0)+(def.fast||0);
    const hp=isBoss?def.hp*5:def.hp;
    const spd=isFast?def.spd*1.8:def.spd;
    enemies.push({x:path[0].x,y:path[0].y,hp,maxHp:hp,spd,pathIdx:0,pct:0,
      color:isBoss?'#d97706':isFast?'#a855f7':'#dc2626',size:isBoss?22:isFast?14:18,
      slow:0,dot:0,id:Math.random()});
    waveState.spawned++;
    if(waveState.spawned>=waveState.total){
      clearInterval(waveState.intervalId);
      waveState.intervalId=null;
    }
  },600);
}

function onWaveCleared(){
  const bonus=20+wave*5;
  gold+=bonus;
  showMsg(`✅ Wave ${wave} Cleared! +${bonus}🪙`);
  updateHUD();
  refreshGoldUI();
  saveCheckpoint();
}

function showMsg(txt){
  const el=document.getElementById('msg-overlay');
  el.innerHTML=`<div class="wave-msg">${txt}</div>`;
  setTimeout(()=>el.innerHTML='',2000);
}

function fmt(n){if(n>=1000)return(n/1000).toFixed(1)+'K';return Math.floor(n);}

let _audioCtx;
function sfx(name){
  if(!_audioCtx) try{_audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  const o=_audioCtx.createOscillator(),g=_audioCtx.createGain();
  o.connect(g);g.connect(_audioCtx.destination);
  const now=_audioCtx.currentTime; g.gain.setValueAtTime(0.07,now);
  if(name==='place'){o.type='sine';o.frequency.setValueAtTime(440,now);o.frequency.setValueAtTime(660,now+0.06);g.gain.exponentialRampToValueAtTime(0.001,now+0.12);o.start(now);o.stop(now+0.12);}
  else if(name==='kill'){o.type='square';o.frequency.setValueAtTime(300,now);o.frequency.setValueAtTime(150,now+0.08);g.gain.exponentialRampToValueAtTime(0.001,now+0.1);o.start(now);o.stop(now+0.1);}
  else if(name==='wave'){o.type='sine';o.frequency.setValueAtTime(330,now);o.frequency.setValueAtTime(440,now+0.15);o.frequency.setValueAtTime(660,now+0.3);g.gain.exponentialRampToValueAtTime(0.001,now+0.45);o.start(now);o.stop(now+0.45);}
  else if(name==='hit'){o.type='sawtooth';o.frequency.setValueAtTime(100,now);g.gain.setValueAtTime(0.04,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.06);o.start(now);o.stop(now+0.06);}
  else if(name==='sell'){o.type='triangle';o.frequency.setValueAtTime(500,now);o.frequency.setValueAtTime(320,now+0.08);g.gain.exponentialRampToValueAtTime(0.001,now+0.14);o.start(now);o.stop(now+0.14);}
  else if(name==='lose'){o.type='sawtooth';o.frequency.setValueAtTime(300,now);o.frequency.setValueAtTime(100,now+0.3);g.gain.exponentialRampToValueAtTime(0.001,now+0.5);o.start(now);o.stop(now+0.5);}
  else{o.disconnect();}
}

let lastT=0;
// gameSpeed runs update() multiple times per rendered frame so every
// subsystem (movement, cooldowns, projectiles, dot ticks) scales together
// instead of hand-tuning a dt multiplier per system.
function gameLoop(t){
  if(paused)return;
  const dt=Math.min((t-lastT)/1000,0.05);
  lastT=t;
  for(let i=0;i<gameSpeed;i++){
    update(dt);
  }
  render();
  if(lives>0)requestAnimationFrame(gameLoop);
}

function update(dt){
  frame++;
  // Move enemies
  enemies=enemies.filter(e=>{
    const spd=e.spd*(e.slow>0?0.4:1);
    e.slow=Math.max(0,e.slow-dt);
    e.dot=Math.max(0,e.dot-dt);
    if(e.dot>0&&frame%30===0){e.hp-=5;if(e.hp<=0){killEnemy(e);return false;}}
    // Move along path
    const target=path[e.pathIdx+1];
    if(!target){lives=Math.max(0,lives-1);sfx('hit');if(lives<=0)showGameOver(false);return false;}
    const dx=target.x-e.x,dy=target.y-e.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const move=spd*dt*120;
    if(move>=dist){e.x=target.x;e.y=target.y;e.pathIdx++;}
    else{e.x+=dx/dist*move;e.y+=dy/dist*move;}
    return true;
  });

  // Tower shooting — targets the enemy furthest along the path (closest
  // to the crystal) among those in range, not simply array order.
  towers.forEach(t=>{
    t.cd=Math.max(0,(t.cd||0)-1);
    if(t.cd>0)return;
    const stats=towerStats(t);
    let target=null,bestProgress=-Infinity;
    for(const e of enemies){
      if(Math.hypot(e.x-t.x,e.y-t.y)<=stats.range){
        const p=enemyProgress(e);
        if(p>bestProgress){bestProgress=p;target=e;}
      }
    }
    if(!target)return;
    t.cd=stats.rate;
    const ang=Math.atan2(target.y-t.y,target.x-t.x);
    projectiles.push({x:t.x,y:t.y,vx:Math.cos(ang)*7,vy:Math.sin(ang)*7,
      dmg:stats.dmg,color:t.color,r:5,aoe:t.aoe||0,slow:t.slow||0,dot:t.dot||0,chain:t.chain||0,
      targetId:target.id,proj:t.proj});
  });

  // Move projectiles
  projectiles=projectiles.filter(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<-50||p.x>W+50||p.y<-50||p.y>H+50)return false;
    for(let e of enemies){
      if(Math.hypot(e.x-p.x,e.y-p.y)<e.size+4){
        // Hit
        if(p.aoe>0){enemies.forEach(e2=>{if(Math.hypot(e2.x-e.x,e2.y-e.y)<p.aoe){hitEnemy(e2,p.dmg,p);}});}
        else hitEnemy(e,p.dmg,p);
        // Particle burst
        for(let i=0;i<6;i++)particles.push({x:p.x,y:p.y,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3,life:1,col:p.color,r:3});
        if(p.aoe>0)particles.push({type:'aoe',x:e.x,y:e.y,r:0,maxR:p.aoe,life:1,col:p.color});
        return false;
      }
    }
    return true;
  });
  // Particles
  particles=particles.filter(p=>{
    if(p.type==='aoe'){p.r+=p.maxR*0.1;p.life-=0.06;return p.life>0;}
    p.x+=p.vx;p.y+=p.vy;p.life-=0.05;p.r*=0.93;return p.life>0&&p.r>0.5;
  });
  // Wave end — only once spawning has finished AND the board is clear.
  if(waveActive&&waveState&&waveState.spawned>=waveState.total&&!waveState.intervalId&&enemies.length===0){
    waveActive=false;
    onWaveCleared();
    setTimeout(startWave,3000);
  }
  updateHUD();
}

function hitEnemy(e,dmg,p){
  e.hp-=dmg;
  if(p.slow)e.slow=2;
  if(p.dot)e.dot=3;
  if(e.hp<=0)killEnemy(e);
  // Lightning chain: jump to up to p.chain additional nearby enemies
  if(p.chain>0){
    let chainDmg=dmg*0.6;
    let hit=[e];
    let src=e;
    for(let c=0;c<p.chain;c++){
      let next=null,bestDist=Infinity;
      for(let en of enemies){
        if(hit.includes(en))continue;
        const d=Math.hypot(en.x-src.x,en.y-src.y);
        if(d<80&&d<bestDist){bestDist=d;next=en;}
      }
      if(!next)break;
      hit.push(next);
      next.hp-=chainDmg;
      if(p.slow)next.slow=2;
      if(p.dot)next.dot=3;
      // Spark particle between src and next
      for(let i=0;i<4;i++)particles.push({x:src.x+(next.x-src.x)*Math.random(),y:src.y+(next.y-src.y)*Math.random(),vx:(Math.random()-0.5)*2,vy:(Math.random()-0.5)*2,life:0.8,col:'#fbbf24',r:2});
      if(next.hp<=0)killEnemy(next);
      src=next;
      chainDmg*=0.6;
    }
  }
}

function killEnemy(e){
  enemies=enemies.filter(x=>x!==e);
  gold+=Math.floor(10+e.maxHp/20);kills++;
  sfx('kill');
  for(let i=0;i<10;i++)particles.push({x:e.x,y:e.y,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5,life:1,col:e.color,r:4});
  refreshGoldUI();
}

function render(){
  ctx.clearRect(0,0,W,H);
  // Background
  ctx.fillStyle='#0a0816';ctx.fillRect(0,0,W,H);
  // Grid
  ctx.strokeStyle='rgba(124,58,237,0.04)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // Path
  ctx.strokeStyle='rgba(124,58,237,0.2)';ctx.lineWidth=26;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);
  path.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();
  ctx.strokeStyle='rgba(124,58,237,0.08)';ctx.lineWidth=24;
  ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);
  path.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();
  // End crystal
  ctx.font='20px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('💎',path[path.length-1].x,path[path.length-1].y);
  // Particles
  particles.forEach(p=>{
    if(p.type==='aoe'){ctx.strokeStyle=p.col;ctx.lineWidth=2;ctx.globalAlpha=p.life*0.6;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;}
    else{ctx.fillStyle=p.col;ctx.globalAlpha=p.life;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
  });
  // Enemies
  enemies.forEach(e=>{
    ctx.font=e.size+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    if(e.slow>0){ctx.shadowColor='#38bdf8';ctx.shadowBlur=8;}
    ctx.fillText(e.slow>0?'🧊':e.color==='#d97706'?'👹':'👺',e.x,e.y);
    ctx.shadowBlur=0;
    // HP bar
    ctx.fillStyle='#1f2937';ctx.fillRect(e.x-e.size,e.y-e.size-8,e.size*2,4);
    ctx.fillStyle=e.color;ctx.fillRect(e.x-e.size,e.y-e.size-8,e.size*2*(e.hp/e.maxHp),4);
  });
  // Towers
  towers.forEach(t=>{
    ctx.shadowColor=t.color;ctx.shadowBlur=12;
    ctx.font='22px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(t.icon,t.x,t.y);
    ctx.shadowBlur=0;
    if((t.level||0)>0){
      ctx.font='9px sans-serif';ctx.fillStyle='#fbbf24';
      ctx.fillText('Lv'+((t.level||0)+1),t.x,t.y+18);
    }
  });
  // Projectiles
  projectiles.forEach(p=>{
    ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=6;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  });
  // Range ring for a tapped, already-placed tower
  if(selectedPlacedTower){
    const stats=towerStats(selectedPlacedTower);
    ctx.strokeStyle='rgba(251,191,36,0.55)';ctx.lineWidth=2;ctx.setLineDash([]);
    ctx.beginPath();ctx.arc(selectedPlacedTower.x,selectedPlacedTower.y,stats.range,0,Math.PI*2);ctx.stroke();
  }
  // Range preview circle for placement mode, following the pointer
  if(selectedTower&&hoverX!==null&&hoverY!==null){
    const valid=isValidPlacement(hoverX,hoverY);
    ctx.setLineDash([5,5]);
    ctx.lineWidth=2;
    ctx.strokeStyle=valid?'rgba(74,222,128,0.6)':'rgba(248,113,113,0.65)';
    ctx.beginPath();ctx.arc(hoverX,hoverY,selectedTower.range,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=valid?'rgba(74,222,128,0.1)':'rgba(248,113,113,0.1)';
    ctx.beginPath();ctx.arc(hoverX,hoverY,selectedTower.range,0,Math.PI*2);ctx.fill();
  }
}

function updateHUD(){
  document.getElementById('hud-lives').textContent=lives;
  document.getElementById('hud-gold').textContent=gold;
  document.getElementById('hud-wave').textContent=wave;
  document.getElementById('hud-kills').textContent=kills;
}

function showGameOver(win){
  sfx('lose');
  waveActive=false;
  if(waveState&&waveState.intervalId){clearInterval(waveState.intervalId);waveState.intervalId=null;}
  if(autosaveIntervalId){clearInterval(autosaveIntervalId);autosaveIntervalId=null;}
  gameStarted=false;
  const {bestWave,highScore}=recordRunEnd();
  const go=document.getElementById('gameover');
  go.classList.add('show');
  document.getElementById('go-title').textContent=win?'🏆 VICTORY!':'☠️ DEFEATED';
  document.getElementById('go-score').textContent=`Wave ${wave}/12 | ${kills} kills | ${gold}🪙  —  Best Wave ${bestWave} | High Score ${highScore}`;
}
</script>
