<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Grimoire Siege</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#04030e;--panel:#08060f;--card:#0d0b18;--border:#1d1238;--purple:#7c3aed;--gold:#d97706;--red:#dc2626;--green:#16a34a;--blue:#2563eb;--text:#e2d9f3;--muted:#4a3d6a;}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Nunito',sans-serif;color:var(--text);}

/* ---------------- Splash ---------------- */
#splash{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 25%,#1b0a3c 0%,#0a0420 45%,#030108 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;gap:14px;padding:30px;text-align:center;overflow:hidden;}
#splash::before{content:'';position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0%,rgba(124,58,237,0.10) 12%,transparent 26%,transparent 50%,rgba(240,171,252,0.07) 62%,transparent 76%);animation:swirl 26s linear infinite;pointer-events:none;}
@keyframes swirl{to{transform:rotate(360deg)}}
#splash::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 35%,rgba(0,0,0,0.75) 100%);pointer-events:none;}
.sp-runes{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.sp-runes i{position:absolute;bottom:-30px;font-size:13px;color:#a78bfa;opacity:0;font-style:normal;font-family:'Cinzel',serif;animation:riseRune linear infinite;text-shadow:0 0 12px #7c3aed;}
@keyframes riseRune{0%{opacity:0;transform:translateY(0) rotate(0deg)}12%{opacity:0.55}88%{opacity:0.4}100%{opacity:0;transform:translateY(-105vh) rotate(220deg)}}
.sp-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;}
.sp-ico{font-size:74px;filter:drop-shadow(0 0 34px #7c3aedee);animation:wizFloat 3.2s ease-in-out infinite;}
@keyframes wizFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-13px) rotate(3deg)}}
.sp-title{font-family:'Cinzel',serif;font-size:30px;font-weight:900;letter-spacing:1px;background:linear-gradient(135deg,#c4b5fd 0%,#f0abfc 45%,#fbbf24 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 18px rgba(168,85,247,0.5));}
.sp-rule{width:150px;height:1px;background:linear-gradient(90deg,transparent,#7c3aed,transparent);}
.sp-sub{font-size:10px;color:#8b7bb8;letter-spacing:4px;}
.sp-desc{font-size:11.5px;color:#bfb2dd;line-height:1.75;max-width:280px;}
.sp-btn{position:relative;background:linear-gradient(135deg,#5b21b6,#7c3aed);border:1px solid #a78bfa55;border-radius:14px;padding:14px 42px;font-family:'Cinzel',serif;font-size:18px;font-weight:700;color:#f3e8ff;cursor:pointer;box-shadow:0 6px 26px rgba(124,58,237,0.55),inset 0 1px 0 rgba(255,255,255,0.18);transition:transform 0.15s,box-shadow 0.15s;}
.sp-btn:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(124,58,237,0.7),inset 0 1px 0 rgba(255,255,255,0.25);}
.sp-btn:active{transform:translateY(0) scale(0.97);}
.sp-btn.continue{background:linear-gradient(135deg,#166534,#16a34a);border-color:#4ade8055;box-shadow:0 6px 26px rgba(22,163,74,0.55),inset 0 1px 0 rgba(255,255,255,0.18);}
.sp-btn.continue:hover{box-shadow:0 10px 32px rgba(22,163,74,0.7),inset 0 1px 0 rgba(255,255,255,0.25);}
#splash-stats{display:none;font-size:11px;color:#6d5f92;font-weight:700;}
#splash-stats b{color:#fbbf24;}

/* ---------------- HUD ---------------- */
#hud{position:relative;background:linear-gradient(180deg,#100a24,#08060f);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:6px 10px;flex-shrink:0;gap:6px;box-shadow:0 2px 14px rgba(0,0,0,0.6);}
.hud-stat{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:800;background:rgba(255,255,255,0.035);border:1px solid rgba(255,255,255,0.05);border-radius:8px;padding:3px 8px;}
.hud-stat .icon{font-size:13px;filter:drop-shadow(0 0 5px currentColor);}
.hud-lives{color:#f87171;}
.hud-lives.critical{animation:lowPulse 0.8s ease-in-out infinite;}
@keyframes lowPulse{0%,100%{box-shadow:0 0 0 rgba(239,68,68,0)}50%{box-shadow:0 0 14px rgba(239,68,68,0.7)}}
.hud-gold{color:#fbbf24;}
.hud-wave{color:#c4b5fd;font-family:'Cinzel',serif;letter-spacing:0.5px;}
.hud-kills{color:#a78bfa;}
.hud-controls{display:flex;gap:5px;margin-left:auto;}
.hud-icon-btn{background:linear-gradient(180deg,#1a1130,#0d0918);border:1px solid #2a1c4d;border-radius:8px;color:var(--text);font-size:12px;font-weight:800;padding:5px 10px;cursor:pointer;transition:border-color 0.15s;}
.hud-icon-btn:hover{border-color:var(--purple);}
.hud-icon-btn:active{transform:scale(0.93);}
#wave-bar{height:3px;background:#150d2b;flex-shrink:0;overflow:hidden;}
#wave-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#7c3aed,#f0abfc,#fbbf24);box-shadow:0 0 10px #a855f7;transition:width 0.25s linear;}

#game-wrap{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;}
#main-canvas{display:block;flex:1;touch-action:none;}

/* ---------------- Tower shop ---------------- */
#tower-panel{background:linear-gradient(0deg,#100a24,#08060f);border-top:1px solid var(--border);padding:7px 8px;display:flex;gap:6px;overflow-x:auto;flex-shrink:0;box-shadow:0 -2px 14px rgba(0,0,0,0.6);}
#tower-panel::-webkit-scrollbar{display:none;}
.tower-btn{position:relative;flex-shrink:0;background:linear-gradient(180deg,#141026,#0a0714);border:1px solid #241844;border-radius:11px;padding:6px 8px 5px;cursor:pointer;text-align:center;min-width:62px;transition:transform 0.12s,border-color 0.15s,box-shadow 0.15s;overflow:hidden;}
.tower-btn::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--tcol);opacity:0.75;}
.tower-btn::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,var(--tcol),transparent 68%);opacity:0.11;pointer-events:none;}
.tower-btn:hover{transform:translateY(-2px);border-color:var(--tcol);}
.tower-btn:active{transform:scale(0.94);}
.tower-btn.selected{border-color:var(--tcol);box-shadow:0 0 0 1px var(--tcol),0 0 16px -2px var(--tcol);}
.tower-btn.selected::after{opacity:0.26;}
.tower-btn.cant{opacity:0.4;filter:grayscale(0.6);}
.tb-icon{font-size:21px;display:block;line-height:1.1;filter:drop-shadow(0 0 7px var(--tcol));}
.tb-name{font-size:7px;font-weight:800;color:#d6cced;display:block;text-transform:uppercase;letter-spacing:0.4px;}
.tb-stats{font-size:6.5px;color:#6d5f92;font-weight:700;display:block;letter-spacing:0.2px;}
.tb-cost{font-size:8.5px;color:#fbbf24;font-weight:800;display:block;margin-top:1px;}

#msg-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:50;}
.wave-msg{font-family:'Cinzel',serif;font-size:24px;font-weight:900;color:#f0abfc;text-shadow:0 0 34px #7c3aed,0 2px 6px #000;animation:waveMsgAn 2s ease forwards;letter-spacing:1px;}
@keyframes waveMsgAn{0%{opacity:0;transform:scale(0.65) translateY(14px)}28%{opacity:1;transform:scale(1.1) translateY(0)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(0.94) translateY(-10px)}}

/* ---------------- Tower action popover ---------------- */
#tower-action-panel{position:absolute;z-index:60;display:none;background:linear-gradient(180deg,#191033,#0c0818);border:1px solid var(--purple);border-radius:12px;padding:10px 12px;min-width:156px;box-shadow:0 10px 34px rgba(0,0,0,0.7),0 0 22px -6px #7c3aed;}
#tower-action-panel.show{display:block;animation:popIn 0.16s ease;}
@keyframes popIn{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}
.tap-name{font-family:'Cinzel',serif;font-weight:900;font-size:13px;margin-bottom:4px;}
.tap-stats{font-size:9px;color:#8b7bb8;font-weight:700;margin-bottom:8px;line-height:1.6;}
.tap-stats b{color:#e2d9f3;}
.tap-btns{display:flex;gap:6px;}
.tap-btns button{flex:1;background:linear-gradient(135deg,#5b21b6,#7c3aed);border:none;border-radius:8px;padding:7px 4px;font-size:10px;font-weight:800;color:#f3e8ff;cursor:pointer;}
.tap-btns button:disabled{opacity:0.35;cursor:not-allowed;}
.tap-btns button.sell-btn{background:linear-gradient(135deg,#7f1d1d,#dc2626);}
.tap-close{position:absolute;top:3px;right:6px;background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:2px;}

/* ---------------- Overlays ---------------- */
#pause-overlay,#gameover{position:fixed;inset:0;background:rgba(3,1,10,0.9);backdrop-filter:blur(4px);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:200;gap:14px;padding:24px;text-align:center;}
#pause-overlay.show,#gameover.show{display:flex;}
.go-title{font-family:'Cinzel',serif;font-size:32px;font-weight:900;text-shadow:0 0 30px rgba(168,85,247,0.6);}
#pause-overlay .go-title{font-size:26px;}
.go-score{font-family:'Cinzel',serif;font-size:13px;color:#fbbf24;max-width:290px;line-height:1.8;}
.go-btn{background:linear-gradient(135deg,#5b21b6,#7c3aed);border:1px solid #a78bfa44;border-radius:12px;padding:12px 36px;font-family:'Cinzel',serif;font-size:16px;color:#f3e8ff;cursor:pointer;margin-top:6px;box-shadow:0 5px 20px rgba(124,58,237,0.45);}
.go-btn:active{transform:scale(0.96);}
.go-btn.secondary{background:linear-gradient(135deg,#1f2937,#374151);border-color:#4b556344;font-size:13px;padding:9px 26px;box-shadow:none;}
</style>
</head>
<body>
<div id="splash">
  <div class="sp-runes" id="sp-runes"></div>
  <div class="sp-inner">
    <div class="sp-ico">🧙‍♂️</div>
    <div class="sp-title">GRIMOIRE SIEGE</div>
    <div class="sp-rule"></div>
    <div class="sp-sub">TOWER DEFENSE</div>
    <div class="sp-desc">Your tower is under siege. Place magical defenses, upgrade your arsenal, and hold the line through 12 waves of darkness. Do not let them reach the crystal.</div>
    <div id="splash-stats">Best Wave <b id="best-wave-disp">0</b>/12 &nbsp;·&nbsp; High Score <b id="high-score-disp">0</b></div>
    <button class="sp-btn continue" id="continue-btn" style="display:none;" onclick="startGame(true)">Continue Siege</button>
    <button class="sp-btn" onclick="startGame(false)">New Siege</button>
  </div>
</div>
<div id="app" style="display:none;flex-direction:column;height:100%;">
  <div id="hud">
    <div class="hud-stat hud-lives" id="hud-lives-box"><span class="icon">❤️</span><span id="hud-lives">20</span></div>
    <div class="hud-stat hud-gold"><span class="icon">🪙</span><span id="hud-gold">240</span></div>
    <div class="hud-stat hud-wave"><span>WAVE&nbsp;</span><span id="hud-wave">0</span><span>/12</span></div>
    <div class="hud-stat hud-kills"><span id="hud-kills">0</span><span style="font-size:9px;margin-left:2px;color:var(--muted)">kills</span></div>
    <div class="hud-controls">
      <button class="hud-icon-btn" id="speed-btn" onclick="toggleSpeed()" title="Toggle speed">1x</button>
      <button class="hud-icon-btn" onclick="pauseGame()" title="Pause">⏸️</button>
    </div>
  </div>
  <div id="wave-bar"><div id="wave-bar-fill"></div></div>
  <div id="game-wrap">
    <canvas id="main-canvas"></canvas>
    <div id="msg-overlay"></div>
    <div id="tower-action-panel">
      <button class="tap-close" onclick="closeTowerActionPanel()">✕</button>
      <div class="tap-name" id="tap-name"></div>
      <div class="tap-stats" id="tap-stats"></div>
      <div class="tap-btns">
        <button id="tap-upgrade-btn" onclick="upgradeSelectedTower()">Upgrade</button>
        <button class="sell-btn" onclick="sellSelectedTower()">Sell</button>
      </div>
    </div>
  </div>
  <div id="tower-panel"></div>
</div>
<div id="pause-overlay">
  <div class="go-title">⏸️ PAUSED</div>
  <button class="go-btn" onclick="resumeGame()">Resume</button>
  <button class="go-btn secondary" onclick="saveAndExit()">Save &amp; Main Menu</button>
  <button class="go-btn secondary" onclick="exitNoSave()">Main Menu (No Save)</button>
</div>
<div id="gameover">
  <div class="go-title" id="go-title">☠️ DEFEATED</div>
  <div class="go-score" id="go-score"></div>
  <button class="go-btn" onclick="location.reload()">Play Again</button>
</div>
<script>
const TOWERS=[
  {id:'arrow',name:'Archer',icon:'🏹',cost:50,dmg:25,range:120,rate:60,color:'#22c55e',proj:'arrow'},
  {id:'fire',name:'Pyromage',icon:'🔥',cost:80,dmg:40,range:100,rate:80,color:'#ef4444',proj:'fire',aoe:30},
  {id:'ice',name:'Frost',icon:'❄️',cost:70,dmg:20,range:110,rate:70,color:'#38bdf8',proj:'ice',slow:0.5},
  {id:'lightning',name:'Storm',icon:'⚡',cost:100,dmg:60,range:130,rate:100,color:'#fbbf24',proj:'lightning',chain:2},
  {id:'poison',name:'Venom',icon:'☠️',cost:90,dmg:15,range:95,rate:50,color:'#84cc16',proj:'poison',dot:5},
  {id:'cannon',name:'Cannon',icon:'💣',cost:120,dmg:100,range:90,rate:120,color:'#9ca3af',proj:'cannon',aoe:50},
  {id:'magic',name:'Arcane',icon:'🔮',cost:150,dmg:80,range:150,rate:90,color:'#a855f7',proj:'magic'},
  {id:'dark',name:'Shadow',icon:'🌑',cost:200,dmg:150,range:140,rate:130,color:'#6b7280',proj:'dark',aoe:40},
  {id:'holy',name:'Divine',icon:'✨',cost:180,dmg:120,range:160,rate:100,color:'#fde047',proj:'holy'},
  {id:'dragon',name:'Dragon',icon:'🐉',cost:300,dmg:200,range:180,rate:150,color:'#f97316',proj:'dragon',aoe:60},
];

// Wave speeds are multipliers on ENEMY_BASE_SPEED (px/sec). The curve is
// deliberately shallow: difficulty comes from HP and count, not from enemies
// outrunning every projectile in the game.
const WAVE_DEFS=[
  {count:8,hp:60,spd:1.00},{count:12,hp:80,spd:1.05},{count:10,hp:100,spd:1.10,boss:1},
  {count:15,hp:90,spd:1.15},{count:12,hp:130,spd:1.15,fast:3},{count:18,hp:120,spd:1.20,boss:1},
  {count:20,hp:150,spd:1.25},{count:15,hp:200,spd:1.30,fast:5},{count:22,hp:180,spd:1.30,boss:2},
  {count:25,hp:220,spd:1.35},{count:20,hp:300,spd:1.40,boss:2},{count:30,hp:400,spd:1.50,boss:3},
];

const SAVE_KEY='grimoireSiege_save_v1';
const MAX_TOWER_LEVEL=3;

// ---- Tuning constants (all time-based, in seconds / pixels-per-second) ----
const ENEMY_BASE_SPEED=72;   // px/sec at spd multiplier 1.0
const FAST_MULT=1.45;        // "fast" variant speed multiplier
const BOSS_MULT=0.75;        // bosses are tanky, not swift
const BOSS_HP_MULT=4.5;
const SLOW_FACTOR=0.45;      // frost slow
const SLOW_DURATION=2.2;
const DOT_DURATION=3.5;
const DOT_INTERVAL=0.5;
const DOT_DAMAGE=5;
const START_GOLD=240;
const START_LIVES=20;
const PREP_TIME=6000;        // ms before wave 1 — time to actually build
const WAVE_GAP=5000;         // ms between waves
const SPAWN_INTERVAL=750;    // ms between spawns within a wave
const MAX_PARTICLES=420;

// Projectile speeds (px/sec) and steering (radians/sec) per projectile type.
const PROJ_TUNE={
  arrow:{speed:520,turn:5},   fire:{speed:330,turn:6},    ice:{speed:400,turn:6},
  lightning:{speed:780,turn:9},poison:{speed:340,turn:7},  cannon:{speed:290,turn:2.2},
  magic:{speed:430,turn:8},   dark:{speed:360,turn:7},     holy:{speed:480,turn:8},
  dragon:{speed:360,turn:5},
};

let canvas,ctx,W,H,gameWrapEl,dpr=1;
let bgCanvas,bgCtx;
let towers=[],enemies=[],projectiles=[],particles=[],floaters=[],embers=[];
let gold=START_GOLD,lives=START_LIVES,wave=0,kills=0,waveActive=false;
let selectedTower=null,selectedPlacedTower=null,frame=0,now=0;
let path=[],pathCum=[],pathTotal=0;
let paused=false,gameSpeed=1;
let waveState=null;
let hoverX=null,hoverY=null;
let autosaveIntervalId=null;
let gameStarted=false;
let shake=0,damageFlash=0,crystalHit=0;
let resizeTimer=null;

// The first and last waypoints are inset from the canvas edge so the spawn
// portal and the crystal are drawn whole rather than clipped in half.
function buildPath(W,H){
  return [
    {x:20,y:H*0.25},{x:W*0.2,y:H*0.25},{x:W*0.2,y:H*0.6},
    {x:W*0.5,y:H*0.6},{x:W*0.5,y:H*0.2},{x:W*0.75,y:H*0.2},
    {x:W*0.75,y:H*0.75},{x:W-26,y:H*0.75}
  ];
}

function computePathCum(){
  pathCum=[0];
  for(let i=1;i<path.length;i++){
    pathCum.push(pathCum[i-1]+Math.hypot(path[i].x-path[i-1].x,path[i].y-path[i-1].y));
  }
  pathTotal=pathCum[pathCum.length-1]||1;
}

// Distance already travelled along the path — used to target the enemy
// that is furthest along (closest to the crystal) instead of array order.
function enemyProgress(e){
  const idx=Math.min(e.pathIdx,pathCum.length-1);
  return pathCum[idx]+Math.hypot(e.x-path[idx].x,e.y-path[idx].y);
}

// Deterministic PRNG so the pre-rendered scenery is identical every redraw
// (a resize must not reshuffle the cobblestones underfoot).
function mulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}

// ---------------- Sprite caches ----------------
// Radial-gradient glow sprites are pre-rendered once per (colour,radius) and
// blitted, because per-draw shadowBlur is the single most expensive thing you
// can ask a 2D canvas for and this game draws a lot of glowing things.
const glowCache=new Map();
function glowSprite(color,radius){
  const key=color+'|'+radius;
  let c=glowCache.get(key);
  if(c)return c;
  c=document.createElement('canvas');
  const s=radius*2;
  c.width=c.height=s;
  const g=c.getContext('2d');
  const grd=g.createRadialGradient(radius,radius,0,radius,radius,radius);
  grd.addColorStop(0,hexA(color,0.85));
  grd.addColorStop(0.4,hexA(color,0.32));
  grd.addColorStop(1,hexA(color,0));
  g.fillStyle=grd;g.fillRect(0,0,s,s);
  glowCache.set(key,c);
  return c;
}
function drawGlow(color,x,y,radius,alpha){
  const s=glowSprite(color,Math.round(radius));
  ctx.globalAlpha=alpha===undefined?1:alpha;
  ctx.drawImage(s,x-s.width/2,y-s.height/2);
  ctx.globalAlpha=1;
}
function hexA(hex,a){
  const h=hex.replace('#','');
  const full=h.length===3?h.split('').map(c=>c+c).join(''):h;
  const n=parseInt(full,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function shade(hex,amt){
  const h=hex.replace('#','');
  const full=h.length===3?h.split('').map(c=>c+c).join(''):h;
  const n=parseInt(full,16);
  const cl=v=>Math.max(0,Math.min(255,Math.round(v)));
  const r=cl(((n>>16)&255)*(1+amt)),g=cl(((n>>8)&255)*(1+amt)),b=cl((n&255)*(1+amt));
  return `rgb(${r},${g},${b})`;
}

// ---------------- Save / persistence ----------------
function loadSave(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return {version:1,bestWave:0,highScore:0,checkpoint:null};
    const data=JSON.parse(raw);
    if(!data||typeof data!=='object')throw new Error('malformed save');
    return {
      version:1,
      bestWave:Number(data.bestWave)||0,
      highScore:Number(data.highScore)||0,
      checkpoint:(data.checkpoint&&typeof data.checkpoint==='object')?data.checkpoint:null
    };
  }catch(e){
    console.warn('Grimoire Siege: save load failed, starting fresh',e);
    return {version:1,bestWave:0,highScore:0,checkpoint:null};
  }
}

function writeSave(patch){
  try{
    const current=loadSave();
    const merged=Object.assign({},current,patch,{version:1});
    localStorage.setItem(SAVE_KEY,JSON.stringify(merged));
  }catch(e){
    console.warn('Grimoire Siege: save write failed',e);
  }
}

// Checkpoints capture the run at the last wave boundary (not mid-wave):
// resuming always restarts the in-progress wave fresh rather than trying
// to reconstruct exact enemy/projectile state. Tower positions are stored
// normalised (0-1) so a checkpoint survives a different window size.
function saveCheckpoint(){
  if(!gameStarted||lives<=0)return;
  try{
    const resumeWave=Math.min(waveActive?wave:wave+1,12);
    const checkpoint={
      gold,lives,kills,wave:resumeWave,
      towers:towers.map(t=>({id:t.id,nx:t.x/W,ny:t.y/H,level:t.level||0,invested:t.invested||t.cost}))
    };
    writeSave({checkpoint});
  }catch(e){
    console.warn('Grimoire Siege: autosave failed',e);
  }
}

function clearCheckpoint(){ writeSave({checkpoint:null}); }

function recordRunEnd(){
  const save=loadSave();
  const bestWave=Math.max(save.bestWave,wave);
  const score=kills*10+wave*50+gold;
  const highScore=Math.max(save.highScore,score);
  writeSave({bestWave,highScore,checkpoint:null});
  return {bestWave,highScore};
}

// Backgrounding the tab stops requestAnimationFrame but NOT the spawn
// setInterval, so without this the wave keeps spawning into a frozen world
// and you return to a heap of enemies stacked on the portal. Auto-pausing
// halts the spawn timer too.
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'&&gameStarted){
    saveCheckpoint();
    pauseGame();
  }
});
window.addEventListener('pagehide',()=>{ if(gameStarted)saveCheckpoint(); });
document.addEventListener('keydown',(e)=>{
  if(!gameStarted||lives<=0)return;
  if(e.key==='Escape'){ if(paused)resumeGame();else pauseGame(); return; }
  if(paused)return;
  // 1-9 then 0 select the shop slots in order.
  if(e.key>='0'&&e.key<='9'){
    const idx=e.key==='0'?9:parseInt(e.key,10)-1;
    if(TOWERS[idx])selectTower(TOWERS[idx].id);
  }
});

// ---------------- Canvas sizing ----------------
function resizeCanvas(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=gameWrapEl.offsetWidth;
  H=gameWrapEl.offsetHeight;
  canvas.width=Math.round(W*dpr);
  canvas.height=Math.round(H*dpr);
  canvas.style.width=W+'px';
  canvas.style.height=H+'px';
  ctx=canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

function onResize(){
  if(!gameStarted)return;
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{
    const oldW=W,oldH=H;
    resizeCanvas();
    if(oldW>0&&oldH>0){
      const sx=W/oldW,sy=H/oldH;
      towers.forEach(t=>{t.x*=sx;t.y*=sy;});
      enemies.forEach(e=>{e.x*=sx;e.y*=sy;});
      projectiles.forEach(p=>{p.x*=sx;p.y*=sy;p.trail.forEach(pt=>{pt.x*=sx;pt.y*=sy;});});
    }
    path=buildPath(W,H);
    computePathCum();
    buildBackground();
    seedEmbers();
    if(selectedPlacedTower)openTowerActionPanel(selectedPlacedTower);
  },150);
}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',onResize);

function startGame(continueRun){
  document.getElementById('splash').style.display='none';
  const app=document.getElementById('app');
  app.style.display='flex';
  canvas=document.getElementById('main-canvas');
  gameWrapEl=document.getElementById('game-wrap');
  resizeCanvas();
  path=buildPath(W,H);
  computePathCum();

  gold=START_GOLD;lives=START_LIVES;wave=0;kills=0;waveActive=false;
  towers=[];enemies=[];projectiles=[];particles=[];floaters=[];
  selectedTower=null;selectedPlacedTower=null;waveState=null;
  shake=0;damageFlash=0;crystalHit=0;
  gameSpeed=1;
  const speedBtn=document.getElementById('speed-btn');
  if(speedBtn)speedBtn.textContent='1x';

  let resumeWave=0;
  if(continueRun){
    try{
      const save=loadSave();
      if(save.checkpoint){
        const cp=save.checkpoint;
        if(typeof cp.gold==='number')gold=cp.gold;
        if(typeof cp.lives==='number')lives=cp.lives;
        if(typeof cp.kills==='number')kills=cp.kills;
        resumeWave=Math.max(0,(cp.wave||1)-1);
        if(Array.isArray(cp.towers)){
          towers=cp.towers.map(ct=>{
            const base=TOWERS.find(t=>t.id===ct.id);
            if(!base)return null;
            // Older saves stored absolute pixels; newer ones store 0-1 fractions.
            const x=typeof ct.nx==='number'?ct.nx*W:ct.x;
            const y=typeof ct.ny==='number'?ct.ny*H:ct.y;
            if(typeof x!=='number'||typeof y!=='number')return null;
            return {...base,x,y,cd:0,level:ct.level||0,invested:ct.invested||base.cost,
              aim:-Math.PI/2,aimTo:-Math.PI/2,recoil:0,flash:0,phase:Math.random()*Math.PI*2};
          }).filter(Boolean);
        }
      }
    }catch(e){ console.warn('Grimoire Siege: continue load failed, starting fresh',e); }
  }
  wave=resumeWave;

  buildBackground();
  seedEmbers();
  buildTowerPanel();
  canvas.addEventListener('click',onCanvasClick);
  canvas.addEventListener('mousemove',onCanvasHover);
  canvas.addEventListener('mouseleave',()=>{hoverX=hoverY=null;});
  canvas.addEventListener('touchstart',onCanvasTouchHover,{passive:true});
  canvas.addEventListener('touchmove',onCanvasTouchHover,{passive:true});

  gameStarted=true;
  paused=false;
  lastT=performance.now();
  requestAnimationFrame(gameLoop);
  scheduleWave(PREP_TIME);
  showMsg('🛡️ FORTIFY');

  if(autosaveIntervalId)clearInterval(autosaveIntervalId);
  autosaveIntervalId=setInterval(saveCheckpoint,30000);

  updateHUD();
}

// ---------------- Pause / speed ----------------
function pauseGame(){
  if(paused||!gameStarted||lives<=0)return;
  paused=true;
  if(waveState&&waveState.intervalId){
    clearInterval(waveState.intervalId);
    waveState.intervalId=null;
    waveState.pausedSpawning=true;
  }
  if(pendingWaveTimer){clearTimeout(pendingWaveTimer);pendingWaveTimer=null;wavePendingOnResume=true;}
  document.getElementById('pause-overlay').classList.add('show');
}

function resumeGame(){
  if(!paused)return;
  paused=false;
  document.getElementById('pause-overlay').classList.remove('show');
  if(waveState&&waveState.pausedSpawning){
    waveState.pausedSpawning=false;
    startSpawning();
  }
  if(wavePendingOnResume){wavePendingOnResume=false;scheduleWave(WAVE_GAP);}
  lastT=performance.now();
  requestAnimationFrame(gameLoop);
}

function saveAndExit(){
  saveCheckpoint();
  location.reload();
}
function exitNoSave(){
  location.reload();
}

function toggleSpeed(){
  gameSpeed=gameSpeed>=3?1:gameSpeed+1;
  document.getElementById('speed-btn').textContent=gameSpeed+'x';
}

// ---------------- Tower panel / placement ----------------
function buildTowerPanel(){
  const panel=document.getElementById('tower-panel');
  panel.innerHTML=TOWERS.map((t)=>`
    <div class="tower-btn ${gold<t.cost?'cant':''} ${selectedTower&&selectedTower.id===t.id?'selected':''}" id="tbtn-${t.id}" style="--tcol:${t.color}" onclick="selectTower('${t.id}')">
      <span class="tb-icon">${t.icon}</span>
      <span class="tb-name">${t.name}</span>
      <span class="tb-stats">${t.dmg}dmg · ${t.range}r</span>
      <span class="tb-cost">${t.cost}🪙</span>
    </div>`).join('');
}

function refreshGoldUI(){
  buildTowerPanel();
  if(selectedPlacedTower)openTowerActionPanel(selectedPlacedTower);
}

// Kills arrive in bursts, and each one changes the gold total. Rebuilding the
// shop's DOM per kill thrashes layout for no benefit, so kills just raise a
// flag and the panel is rebuilt at most once per rendered frame.
let uiDirty=false;
function flushGoldUI(){
  if(!uiDirty)return;
  uiDirty=false;
  refreshGoldUI();
}

function selectTower(id){
  closeTowerActionPanel();
  selectedTower=TOWERS.find(t=>t.id===id);
  document.querySelectorAll('.tower-btn').forEach(b=>b.classList.remove('selected'));
  const btn=document.getElementById('tbtn-'+id);
  if(btn)btn.classList.add('selected');
}

function isBlockedByPath(x,y){
  for(let i=0;i<path.length-1;i++){
    const A=path[i],B=path[i+1];
    const dx=B.x-A.x,dy=B.y-A.y;
    const len=Math.sqrt(dx*dx+dy*dy);
    if(len===0)continue;
    const nx=-dy/len,ny=dx/len;
    const px=x-A.x,py=y-A.y;
    const proj=(px*dx+py*dy)/(dx*dx+dy*dy);
    if(proj>=0&&proj<=1){
      const perpDist=Math.abs(px*nx+py*ny);
      if(perpDist<28)return true;
    }
  }
  return false;
}

function isValidPlacement(x,y){
  if(x<16||y<16||x>W-16||y>H-16)return false;
  if(isBlockedByPath(x,y))return false;
  if(towers.some(t=>Math.hypot(t.x-x,t.y-y)<35))return false;
  return true;
}

function onCanvasHover(e){
  if(paused)return;
  const rect=canvas.getBoundingClientRect();
  hoverX=e.clientX-rect.left;hoverY=e.clientY-rect.top;
}
function onCanvasTouchHover(e){
  if(paused||!e.touches||!e.touches[0])return;
  const rect=canvas.getBoundingClientRect();
  hoverX=e.touches[0].clientX-rect.left;hoverY=e.touches[0].clientY-rect.top;
}

function onCanvasClick(e){
  if(paused)return;
  const rect=canvas.getBoundingClientRect();
  const x=e.clientX-rect.left,y=e.clientY-rect.top;
  hoverX=x;hoverY=y;

  // Tap on an existing tower selects it for upgrade/sell instead of placing.
  const tapped=towers.find(t=>Math.hypot(t.x-x,t.y-y)<24);
  if(tapped){
    selectedTower=null;
    document.querySelectorAll('.tower-btn').forEach(b=>b.classList.remove('selected'));
    openTowerActionPanel(tapped);
    return;
  }
  closeTowerActionPanel();

  if(!selectedTower||gold<selectedTower.cost)return;
  if(!isValidPlacement(x,y))return;
  towers.push({...selectedTower,x,y,cd:0,level:0,invested:selectedTower.cost,
    aim:-Math.PI/2,aimTo:-Math.PI/2,recoil:0,flash:0,phase:Math.random()*Math.PI*2});
  gold-=selectedTower.cost;
  sfx('place');
  ring(x,y,selectedTower.color,46,0.55);
  updateHUD();
  refreshGoldUI();
}

// ---------------- Tower upgrade / sell ----------------
function towerStats(t){
  const lvl=t.level||0;
  return {
    dmg:Math.round(t.dmg*(1+0.45*lvl)),
    range:Math.round(t.range*(1+0.12*lvl)),
    rate:Math.max(20,Math.round(t.rate*(1-0.15*lvl)))
  };
}
// `rate` is authored in 60ths of a second; convert to real seconds so fire
// rate no longer depends on the display's refresh rate.
function fireCooldown(t){ return towerStats(t).rate/60; }
function upgradeCost(t){ return Math.floor(t.cost*0.55*((t.level||0)+1)); }
function sellValue(t){ return Math.floor((t.invested||t.cost)*0.6); }

function openTowerActionPanel(t){
  selectedPlacedTower=t;
  const panel=document.getElementById('tower-action-panel');
  const stats=towerStats(t);
  const maxed=(t.level||0)>=MAX_TOWER_LEVEL;
  document.getElementById('tap-name').textContent=`${t.icon} ${t.name} Lv.${(t.level||0)+1}`;
  document.getElementById('tap-stats').innerHTML=
    `DMG <b>${stats.dmg}</b> · RNG <b>${stats.range}</b><br>Rate <b>${(60/stats.rate).toFixed(1)}/s</b> · Sell <b>${sellValue(t)}🪙</b>`;
  const upBtn=document.getElementById('tap-upgrade-btn');
  if(maxed){
    upBtn.textContent='MAX LEVEL';
    upBtn.disabled=true;
  }else{
    const cost=upgradeCost(t);
    upBtn.textContent=`Upgrade (${cost}🪙)`;
    upBtn.disabled=gold<cost;
  }
  const maxLeft=Math.max(6,(gameWrapEl?gameWrapEl.offsetWidth:W)-166);
  const maxTop=Math.max(6,(gameWrapEl?gameWrapEl.offsetHeight:H)-124);
  panel.style.left=Math.max(6,Math.min(t.x-78,maxLeft))+'px';
  panel.style.top=Math.max(6,Math.min(t.y+20,maxTop))+'px';
  panel.classList.add('show');
}

function closeTowerActionPanel(){
  selectedPlacedTower=null;
  const panel=document.getElementById('tower-action-panel');
  if(panel)panel.classList.remove('show');
}

function upgradeSelectedTower(){
  const t=selectedPlacedTower;
  if(!t||(t.level||0)>=MAX_TOWER_LEVEL)return;
  const cost=upgradeCost(t);
  if(gold<cost)return;
  gold-=cost;
  t.level=(t.level||0)+1;
  t.invested=(t.invested||t.cost)+cost;
  sfx('place');
  ring(t.x,t.y,'#fbbf24',52,0.7);
  for(let i=0;i<14;i++)spark(t.x,t.y,'#fbbf24',3.2);
  floater(t.x,t.y-24,'LV '+(t.level+1),'#fbbf24');
  updateHUD();
  refreshGoldUI();
}

function sellSelectedTower(){
  const t=selectedPlacedTower;
  if(!t)return;
  const val=sellValue(t);
  gold+=val;
  towers=towers.filter(x=>x!==t);
  for(let i=0;i<12;i++)spark(t.x,t.y,'#6b7280',2.6);
  floater(t.x,t.y-20,'+'+val+'🪙','#fbbf24');
  closeTowerActionPanel();
  sfx('sell');
  updateHUD();
  refreshGoldUI();
}

// ---------------- Waves ----------------
// Wave state tracks spawn progress explicitly: a wave is only "complete"
// once every enemy for it has been spawned (spawned>=total) AND the
// board is clear (enemies.length===0). The spawn setInterval handle is
// always stored and cleared before a new one is created, so waves can
// never overlap or stack spawn timers.
// The between-wave timer must be pause-aware: an untracked setTimeout(startWave)
// that fired while paused was swallowed by the guard and nothing rescheduled it —
// pausing (or alt-tabbing, which auto-pauses) during prep or a wave gap wedged
// the run permanently.
let pendingWaveTimer=null,wavePendingOnResume=false;
function scheduleWave(delay){
  clearTimeout(pendingWaveTimer);
  pendingWaveTimer=setTimeout(()=>{pendingWaveTimer=null;startWave();},delay);
}
function startWave(){
  if(!gameStarted)return;
  if(paused){wavePendingOnResume=true;return;}
  if(wave>=12){showGameOver(true);return;}
  wave++;
  waveActive=true;
  const def=WAVE_DEFS[wave-1];
  sfx('wave');
  showMsg('⚔️ WAVE '+wave);
  const total=def.count+(def.boss||0)+(def.fast||0);
  waveState={def,total,spawned:0,intervalId:null,pausedSpawning:false};
  startSpawning();
  updateHUD();
}

function startSpawning(){
  if(!waveState)return;
  if(waveState.intervalId){clearInterval(waveState.intervalId);waveState.intervalId=null;}
  waveState.intervalId=setInterval(()=>{
    if(!waveState||waveState.spawned>=waveState.total){
      if(waveState&&waveState.intervalId){clearInterval(waveState.intervalId);waveState.intervalId=null;}
      return;
    }
    const def=waveState.def;
    const spawned=waveState.spawned;
    const isBoss=def.boss&&spawned<(def.boss||0);
    const isFast=def.fast&&spawned>=(def.boss||0)&&spawned<(def.boss||0)+(def.fast||0);
    const hp=isBoss?def.hp*BOSS_HP_MULT:def.hp;
    const spd=def.spd*(isBoss?BOSS_MULT:isFast?FAST_MULT:1);
    const kind=isBoss?'boss':isFast?'fast':'grunt';
    enemies.push({
      x:path[0].x,y:path[0].y,hp,maxHp:hp,spd,pathIdx:0,kind,
      color:isBoss?'#d97706':isFast?'#a855f7':'#dc2626',
      size:isBoss?22:isFast?13:17,
      slow:0,dot:0,dotT:0,flash:0,phase:Math.random()*Math.PI*2,
      id:(frame<<8)^Math.floor(Math.random()*1e6)
    });
    portalBurst();
    waveState.spawned++;
    if(waveState.spawned>=waveState.total){
      clearInterval(waveState.intervalId);
      waveState.intervalId=null;
    }
  },SPAWN_INTERVAL);
}

function onWaveCleared(){
  const bonus=35+wave*10;
  gold+=bonus;
  showMsg(`✅ Wave ${wave} Cleared! +${bonus}🪙`);
  updateHUD();
  refreshGoldUI();
  saveCheckpoint();
}

function showMsg(txt){
  const el=document.getElementById('msg-overlay');
  el.innerHTML=`<div class="wave-msg">${txt}</div>`;
  setTimeout(()=>el.innerHTML='',2000);
}

let _audioCtx;
function sfx(name){
  if(!_audioCtx) try{_audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  const o=_audioCtx.createOscillator(),g=_audioCtx.createGain();
  o.connect(g);g.connect(_audioCtx.destination);
  const t=_audioCtx.currentTime; g.gain.setValueAtTime(0.07,t);
  if(name==='place'){o.type='sine';o.frequency.setValueAtTime(440,t);o.frequency.setValueAtTime(660,t+0.06);g.gain.exponentialRampToValueAtTime(0.001,t+0.12);o.start(t);o.stop(t+0.12);}
  else if(name==='kill'){o.type='square';o.frequency.setValueAtTime(300,t);o.frequency.setValueAtTime(150,t+0.08);g.gain.exponentialRampToValueAtTime(0.001,t+0.1);o.start(t);o.stop(t+0.1);}
  else if(name==='wave'){o.type='sine';o.frequency.setValueAtTime(330,t);o.frequency.setValueAtTime(440,t+0.15);o.frequency.setValueAtTime(660,t+0.3);g.gain.exponentialRampToValueAtTime(0.001,t+0.45);o.start(t);o.stop(t+0.45);}
  else if(name==='hit'){o.type='sawtooth';o.frequency.setValueAtTime(100,t);g.gain.setValueAtTime(0.05,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.06);o.start(t);o.stop(t+0.06);}
  else if(name==='sell'){o.type='triangle';o.frequency.setValueAtTime(500,t);o.frequency.setValueAtTime(320,t+0.08);g.gain.exponentialRampToValueAtTime(0.001,t+0.14);o.start(t);o.stop(t+0.14);}
  else if(name==='lose'){o.type='sawtooth';o.frequency.setValueAtTime(300,t);o.frequency.setValueAtTime(100,t+0.3);g.gain.exponentialRampToValueAtTime(0.001,t+0.5);o.start(t);o.stop(t+0.5);}
  else if(name==='win'){o.type='sine';o.frequency.setValueAtTime(523,t);o.frequency.setValueAtTime(659,t+0.12);o.frequency.setValueAtTime(784,t+0.24);o.frequency.setValueAtTime(1047,t+0.36);g.gain.exponentialRampToValueAtTime(0.001,t+0.7);o.start(t);o.stop(t+0.7);}
  else{o.disconnect();}
}

// ---------------- Effect helpers ----------------
function spark(x,y,col,spread){
  if(particles.length>MAX_PARTICLES)return;
  const a=Math.random()*Math.PI*2,s=Math.random()*(spread||3);
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:0.045+Math.random()*0.03,col,r:1.6+Math.random()*2.4});
}
function ring(x,y,col,maxR,strength){
  particles.push({type:'ring',x,y,r:2,maxR,life:1,decay:0.055,col,w:2.5*(strength||1)});
}
function floater(x,y,text,col){
  floaters.push({x,y,text,col,life:1});
}
function portalBurst(){
  for(let i=0;i<5;i++)spark(path[0].x,path[0].y,'#a855f7',2.2);
}
function seedEmbers(){
  embers=[];
  const n=Math.round(Math.min(46,(W*H)/16000));
  for(let i=0;i<n;i++){
    embers.push({x:Math.random()*W,y:Math.random()*H,r:0.6+Math.random()*1.6,
      vy:-(4+Math.random()*11),vx:(Math.random()-0.5)*7,
      a:0.12+Math.random()*0.4,ph:Math.random()*Math.PI*2});
  }
}

// ---------------- Static scenery pre-render ----------------
// The ground, the road and every fixed decoration are painted once into an
// offscreen canvas and blitted each frame. Only living things are redrawn.
function buildBackground(){
  if(!bgCanvas){bgCanvas=document.createElement('canvas');}
  bgCanvas.width=Math.round(W*dpr);
  bgCanvas.height=Math.round(H*dpr);
  bgCtx=bgCanvas.getContext('2d');
  const g=bgCtx;
  g.setTransform(dpr,0,0,dpr,0,0);
  const rnd=mulberry32(1337);

  // Base ground
  const base=g.createLinearGradient(0,0,0,H);
  base.addColorStop(0,'#120a26');
  base.addColorStop(0.55,'#0b0719');
  base.addColorStop(1,'#06040f');
  g.fillStyle=base;g.fillRect(0,0,W,H);

  // Distant moon-glow from the upper left
  const moon=g.createRadialGradient(W*0.18,-H*0.15,0,W*0.18,-H*0.15,Math.max(W,H)*0.85);
  moon.addColorStop(0,'rgba(139,92,246,0.16)');
  moon.addColorStop(0.5,'rgba(88,28,187,0.06)');
  moon.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=moon;g.fillRect(0,0,W,H);

  // Mossy ground blotches
  for(let i=0;i<70;i++){
    const x=rnd()*W,y=rnd()*H,r=14+rnd()*60;
    g.fillStyle=rnd()>0.5?'rgba(56,30,110,0.055)':'rgba(20,55,45,0.05)';
    g.beginPath();g.ellipse(x,y,r,r*(0.45+rnd()*0.35),rnd()*Math.PI,0,Math.PI*2);g.fill();
  }

  // Faint arcane grid
  g.strokeStyle='rgba(124,58,237,0.045)';g.lineWidth=1;
  for(let x=0;x<W;x+=44){g.beginPath();g.moveTo(x+0.5,0);g.lineTo(x+0.5,H);g.stroke();}
  for(let y=0;y<H;y+=44){g.beginPath();g.moveTo(0,y+0.5);g.lineTo(W,y+0.5);g.stroke();}

  // Scattered rocks and dead brush off-path
  for(let i=0;i<44;i++){
    const x=rnd()*W,y=rnd()*H;
    if(isBlockedByPath(x,y))continue;
    if(rnd()>0.45){
      const r=2.5+rnd()*5;
      g.fillStyle='rgba(90,80,120,0.22)';
      g.beginPath();g.ellipse(x,y,r,r*0.72,rnd()*3,0,Math.PI*2);g.fill();
      g.fillStyle='rgba(150,140,190,0.10)';
      g.beginPath();g.ellipse(x-r*0.2,y-r*0.25,r*0.55,r*0.36,0,0,Math.PI*2);g.fill();
    }else{
      g.strokeStyle='rgba(70,55,40,0.28)';g.lineWidth=1.1;
      for(let b=0;b<3;b++){
        const a=-Math.PI/2+(rnd()-0.5)*1.5,len=4+rnd()*8;
        g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*len,y+Math.sin(a)*len);g.stroke();
      }
    }
  }

  drawRoad(g,rnd);

  // Vignette
  const vg=g.createRadialGradient(W/2,H/2,Math.min(W,H)*0.32,W/2,H/2,Math.max(W,H)*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.62)');
  g.fillStyle=vg;g.fillRect(0,0,W,H);
}

function drawRoad(g,rnd){
  const trace=()=>{g.beginPath();g.moveTo(path[0].x,path[0].y);for(let i=1;i<path.length;i++)g.lineTo(path[i].x,path[i].y);};
  g.lineCap='round';g.lineJoin='round';

  // Soft ground shadow under the road
  trace();g.strokeStyle='rgba(0,0,0,0.5)';g.lineWidth=42;g.stroke();
  // Earth verge
  trace();g.strokeStyle='#181128';g.lineWidth=36;g.stroke();
  // Road bed
  trace();g.strokeStyle='#241a3d';g.lineWidth=28;g.stroke();
  // Inner darker rut
  trace();g.strokeStyle='#1b1330';g.lineWidth=22;g.stroke();

  // Cobblestones laid along the polyline
  for(let i=0;i<path.length-1;i++){
    const A=path[i],B=path[i+1];
    const dx=B.x-A.x,dy=B.y-A.y;
    const len=Math.hypot(dx,dy);
    if(len===0)continue;
    const ux=dx/len,uy=dy/len,nx=-uy,ny=ux;
    for(let d=6;d<len-4;d+=11){
      for(let lane=-1;lane<=1;lane++){
        const off=lane*7.5+(rnd()-0.5)*2.4;
        const jitter=(rnd()-0.5)*3;
        const cx=A.x+ux*(d+jitter)+nx*off;
        const cy=A.y+uy*(d+jitter)+ny*off;
        const w=3.6+rnd()*2.2,h=3.0+rnd()*1.8;
        const lum=rnd();
        g.save();
        g.translate(cx,cy);
        g.rotate(Math.atan2(uy,ux)+(rnd()-0.5)*0.5);
        g.fillStyle=lum>0.82?'rgba(126,106,175,0.34)':lum>0.5?'rgba(88,72,132,0.28)':'rgba(56,44,90,0.3)';
        g.beginPath();
        if(g.roundRect)g.roundRect(-w/2,-h/2,w,h,1.4);
        else g.rect(-w/2,-h/2,w,h);
        g.fill();
        g.restore();
      }
    }
  }

  // Glowing rune kerbstones on both edges
  for(let i=0;i<path.length-1;i++){
    const A=path[i],B=path[i+1];
    const dx=B.x-A.x,dy=B.y-A.y;
    const len=Math.hypot(dx,dy);
    if(len===0)continue;
    const ux=dx/len,uy=dy/len,nx=-uy,ny=ux;
    for(let d=10;d<len-6;d+=34){
      for(const side of [-1,1]){
        const cx=A.x+ux*d+nx*side*14.5;
        const cy=A.y+uy*d+ny*side*14.5;
        g.fillStyle='rgba(167,139,250,0.30)';
        g.beginPath();g.arc(cx,cy,1.7,0,Math.PI*2);g.fill();
        g.fillStyle='rgba(167,139,250,0.09)';
        g.beginPath();g.arc(cx,cy,4.4,0,Math.PI*2);g.fill();
      }
    }
  }

  // Road edge lines
  g.strokeStyle='rgba(167,139,250,0.13)';g.lineWidth=1.2;
  for(const side of [-1,1]){
    g.beginPath();
    for(let i=0;i<path.length;i++){
      const prev=path[Math.max(0,i-1)],next=path[Math.min(path.length-1,i+1)];
      const dx=next.x-prev.x,dy=next.y-prev.y;
      const l=Math.hypot(dx,dy)||1;
      const nx=-dy/l*13.5*side,ny=dx/l*13.5*side;
      if(i===0)g.moveTo(path[i].x+nx,path[i].y+ny);
      else g.lineTo(path[i].x+nx,path[i].y+ny);
    }
    g.stroke();
  }
}

// ---------------- Main loop ----------------
let lastT=0;
// gameSpeed runs update() multiple times per rendered frame so every
// subsystem (movement, cooldowns, projectiles, dot ticks) scales together
// instead of hand-tuning a dt multiplier per system.
function gameLoop(t){
  if(paused)return;
  const dt=Math.min((t-lastT)/1000,0.05);
  lastT=t;
  now=t/1000;
  for(let i=0;i<gameSpeed;i++){
    update(dt);
  }
  flushGoldUI();
  render(dt);
  // gameStarted goes false in showGameOver — without checking it the loop kept
  // rendering (and burning CPU) behind the victory overlay forever.
  if(gameStarted&&lives>0)requestAnimationFrame(gameLoop);
}

function update(dt){
  frame++;
  // Move enemies
  enemies=enemies.filter(e=>{
    const spd=e.spd*(e.slow>0?SLOW_FACTOR:1)*ENEMY_BASE_SPEED;
    e.slow=Math.max(0,e.slow-dt);
    e.flash=Math.max(0,e.flash-dt*4);
    if(e.dot>0){
      e.dot=Math.max(0,e.dot-dt);
      e.dotT+=dt;
      if(e.dotT>=DOT_INTERVAL){
        e.dotT-=DOT_INTERVAL;
        e.hp-=DOT_DAMAGE;
        if(particles.length<MAX_PARTICLES)particles.push({x:e.x+(Math.random()-0.5)*e.size,y:e.y,vx:0,vy:-0.7,life:1,decay:0.05,col:'#84cc16',r:1.8});
        if(e.hp<=0){killEnemy(e);return false;}
      }
    }
    // Move along path
    const target=path[e.pathIdx+1];
    if(!target){
      lives=Math.max(0,lives-1);
      sfx('hit');
      shake=Math.max(shake,9);
      damageFlash=1;
      crystalHit=1;
      for(let i=0;i<16;i++)spark(e.x,e.y,'#ef4444',4);
      if(lives<=0)showGameOver(false);
      return false;
    }
    const dx=target.x-e.x,dy=target.y-e.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const move=spd*dt;
    if(move>=dist){e.x=target.x;e.y=target.y;e.pathIdx++;}
    else{e.x+=dx/dist*move;e.y+=dy/dist*move;e.dir=Math.atan2(dy,dx);}
    return true;
  });

  // Tower shooting — targets the enemy furthest along the path (closest
  // to the crystal) among those in range, not simply array order.
  towers.forEach(t=>{
    t.cd=Math.max(0,(t.cd||0)-dt);
    t.recoil=Math.max(0,(t.recoil||0)-dt*5);
    t.flash=Math.max(0,(t.flash||0)-dt*7);
    const stats=towerStats(t);
    let target=null,bestProgress=-Infinity;
    for(const e of enemies){
      if(Math.hypot(e.x-t.x,e.y-t.y)<=stats.range){
        const p=enemyProgress(e);
        if(p>bestProgress){bestProgress=p;target=e;}
      }
    }
    if(target){
      // Smoothly swing the turret toward whatever it is tracking.
      t.aimTo=Math.atan2(target.y-t.y,target.x-t.x);
      let diff=((t.aimTo-t.aim+Math.PI*3)%(Math.PI*2))-Math.PI;
      t.aim+=diff*Math.min(1,dt*11);
    }
    if(t.cd>0||!target)return;
    t.cd=fireCooldown(t);
    t.recoil=1;t.flash=1;
    const tune=PROJ_TUNE[t.proj]||{speed:400,turn:6};
    const ang=t.aim;
    const muzzle=16;
    projectiles.push({
      x:t.x+Math.cos(ang)*muzzle,y:t.y+Math.sin(ang)*muzzle,
      vx:Math.cos(ang)*tune.speed,vy:Math.sin(ang)*tune.speed,
      speed:tune.speed,turn:tune.turn,
      dmg:stats.dmg,color:t.color,r:4.5,aoe:t.aoe||0,slow:t.slow||0,dot:t.dot||0,chain:t.chain||0,
      targetId:target.id,proj:t.proj,life:2.6,spin:0,trail:[]
    });
    for(let i=0;i<3;i++)spark(t.x+Math.cos(ang)*muzzle,t.y+Math.sin(ang)*muzzle,t.color,1.8);
  });

  // Move projectiles — they now steer toward the enemy they were fired at,
  // which is what `targetId` was always for.
  projectiles=projectiles.filter(p=>{
    p.life-=dt;
    if(p.life<=0)return false;
    p.spin+=dt*9;
    const tgt=p.targetId!==undefined?enemies.find(e=>e.id===p.targetId):null;
    if(tgt){
      const desired=Math.atan2(tgt.y-p.y,tgt.x-p.x);
      let cur=Math.atan2(p.vy,p.vx);
      let diff=((desired-cur+Math.PI*3)%(Math.PI*2))-Math.PI;
      const maxTurn=p.turn*dt;
      cur+=Math.max(-maxTurn,Math.min(maxTurn,diff));
      p.vx=Math.cos(cur)*p.speed;p.vy=Math.sin(cur)*p.speed;
    }
    p.trail.push({x:p.x,y:p.y});
    if(p.trail.length>7)p.trail.shift();
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.x<-60||p.x>W+60||p.y<-60||p.y>H+60)return false;
    for(let e of enemies){
      if(Math.hypot(e.x-p.x,e.y-p.y)<e.size+5){
        if(p.aoe>0){
          enemies.slice().forEach(e2=>{if(Math.hypot(e2.x-e.x,e2.y-e.y)<p.aoe){hitEnemy(e2,p.dmg,p);}});
          ring(e.x,e.y,p.color,p.aoe,1);
          if(p.aoe>=45)shake=Math.max(shake,3);
        }
        else hitEnemy(e,p.dmg,p);
        for(let i=0;i<7;i++)spark(p.x,p.y,p.color,3.2);
        return false;
      }
    }
    return true;
  });

  // Particles
  particles=particles.filter(p=>{
    if(p.type==='ring'){p.r+=(p.maxR-p.r)*0.22;p.life-=p.decay;return p.life>0;}
    p.x+=p.vx;p.y+=p.vy;
    p.vy+=0.06;              // a touch of gravity so debris settles
    p.vx*=0.96;p.vy*=0.96;
    p.life-=p.decay;p.r*=0.965;
    return p.life>0&&p.r>0.4;
  });
  floaters=floaters.filter(f=>{f.y-=0.55;f.life-=0.016;return f.life>0;});

  // Ambient embers drifting across the battlefield
  for(const em of embers){
    em.x+=em.vx*dt;em.y+=em.vy*dt;
    if(em.y<-8){em.y=H+8;em.x=Math.random()*W;}
    if(em.x<-8)em.x=W+8; else if(em.x>W+8)em.x=-8;
  }

  shake=Math.max(0,shake-dt*22);
  damageFlash=Math.max(0,damageFlash-dt*2.2);
  crystalHit=Math.max(0,crystalHit-dt*1.6);

  // Wave end — only once spawning has finished AND the board is clear.
  if(waveActive&&waveState&&waveState.spawned>=waveState.total&&!waveState.intervalId&&enemies.length===0){
    waveActive=false;
    onWaveCleared();
    scheduleWave(WAVE_GAP);
  }
  updateHUD();
}

function hitEnemy(e,dmg,p){
  e.hp-=dmg;
  e.flash=1;
  if(p.slow)e.slow=SLOW_DURATION;
  if(p.dot){e.dot=DOT_DURATION;}
  // Check for the kill but chain FIRST — the old early-return here meant a
  // killing blow never chained, so Storm underperformed exactly when clearing.
  const killed=e.hp<=0;
  // Lightning chain: jump to up to p.chain additional nearby enemies
  if(p.chain>0){
    let chainDmg=dmg*0.6;
    let hit=[e];
    let src=e;
    for(let c=0;c<p.chain;c++){
      let next=null,bestDist=Infinity;
      for(let en of enemies){
        if(hit.includes(en))continue;
        const d=Math.hypot(en.x-src.x,en.y-src.y);
        if(d<90&&d<bestDist){bestDist=d;next=en;}
      }
      if(!next)break;
      hit.push(next);
      next.hp-=chainDmg;
      next.flash=1;
      if(p.slow)next.slow=SLOW_DURATION;
      if(p.dot)next.dot=DOT_DURATION;
      particles.push({type:'bolt',x:src.x,y:src.y,x2:next.x,y2:next.y,life:1,decay:0.12,col:'#fde047',seed:Math.random()*99});
      if(next.hp<=0)killEnemy(next);
      src=next;
      chainDmg*=0.6;
    }
  }
  if(killed)killEnemy(e);
}

function killEnemy(e){
  if(e.dead)return;
  e.dead=true;
  enemies=enemies.filter(x=>x!==e);
  const reward=Math.floor(12+e.maxHp/16);
  gold+=reward;kills++;
  sfx('kill');
  const n=e.kind==='boss'?26:12;
  for(let i=0;i<n;i++)spark(e.x,e.y,e.color,e.kind==='boss'?5.5:3.6);
  ring(e.x,e.y,e.color,e.kind==='boss'?60:26,e.kind==='boss'?1.2:0.6);
  floater(e.x,e.y-e.size-4,'+'+reward,'#fbbf24');
  if(e.kind==='boss')shake=Math.max(shake,7);
  uiDirty=true;
}

// ---------------- Rendering ----------------
function render(dt){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0.05){
    ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  }

  // Static scenery
  if(bgCanvas)ctx.drawImage(bgCanvas,0,0,W,H);

  drawEmbers();
  drawPathFlow();
  drawPortal();
  drawCrystal();

  // Ground-level effects first so units read on top of them
  particles.forEach(p=>{if(p.type==='ring')drawRingParticle(p);});

  // Range rings sit under the units
  if(selectedPlacedTower&&towers.includes(selectedPlacedTower)){
    const stats=towerStats(selectedPlacedTower);
    drawRangeRing(selectedPlacedTower.x,selectedPlacedTower.y,stats.range,'#fbbf24',0.5);
  }
  if(selectedTower&&hoverX!==null&&hoverY!==null){
    const valid=isValidPlacement(hoverX,hoverY);
    drawPlacementPreview(hoverX,hoverY,valid);
  }

  // Depth sort so nearer (lower) sprites overlap farther ones
  const units=towers.map(t=>({y:t.y,kind:'t',o:t})).concat(enemies.map(e=>({y:e.y,kind:'e',o:e})));
  units.sort((a,b)=>a.y-b.y);
  units.forEach(u=>{u.kind==='t'?drawTower(u.o):drawEnemy(u.o);});

  projectiles.forEach(drawProjectile);
  particles.forEach(p=>{
    if(p.type==='ring')return;
    if(p.type==='bolt')drawBolt(p);
    else{
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.col;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
    }
  });
  drawFloaters();

  ctx.restore();

  // Full-screen damage flash when the crystal is struck
  if(damageFlash>0.01){
    const gd=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.25,W/2,H/2,Math.max(W,H)*0.7);
    gd.addColorStop(0,'rgba(220,38,38,0)');
    gd.addColorStop(1,`rgba(220,38,38,${(damageFlash*0.42).toFixed(3)})`);
    ctx.fillStyle=gd;ctx.fillRect(0,0,W,H);
  }
}

function drawEmbers(){
  for(const em of embers){
    const tw=0.6+0.4*Math.sin(now*2+em.ph);
    ctx.globalAlpha=em.a*tw;
    ctx.fillStyle='#c4b5fd';
    ctx.beginPath();ctx.arc(em.x,em.y,em.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

// Motes of energy streaming along the road toward the crystal.
function drawPathFlow(){
  const COUNT=13;
  for(let i=0;i<COUNT;i++){
    const d=((now*46+i*(pathTotal/COUNT))%pathTotal);
    const pt=pointAtDistance(d);
    if(!pt)continue;
    const fade=0.25+0.25*Math.sin(now*3+i);
    ctx.globalAlpha=fade;
    ctx.fillStyle='#a78bfa';
    ctx.beginPath();ctx.arc(pt.x,pt.y,1.9,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=fade*0.35;
    ctx.beginPath();ctx.arc(pt.x,pt.y,5.5,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function pointAtDistance(d){
  for(let i=1;i<pathCum.length;i++){
    if(d<=pathCum[i]){
      const seg=pathCum[i]-pathCum[i-1];
      const t=seg===0?0:(d-pathCum[i-1])/seg;
      return {x:path[i-1].x+(path[i].x-path[i-1].x)*t,y:path[i-1].y+(path[i].y-path[i-1].y)*t};
    }
  }
  return path[path.length-1];
}

// Spawn portal at the road's mouth.
function drawPortal(){
  const p=path[0];
  ctx.save();
  ctx.translate(p.x,p.y);
  drawGlow('#7c3aed',0,0,34,0.5);
  for(let i=0;i<3;i++){
    const rot=now*(0.8+i*0.45)*(i%2?-1:1);
    const rx=8+i*5.5,ry=15+i*7;
    ctx.strokeStyle=hexA('#a855f7',0.42-i*0.1);
    ctx.lineWidth=2-i*0.4;
    ctx.save();ctx.rotate(rot);
    ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle='rgba(10,2,26,0.85)';
  ctx.beginPath();ctx.ellipse(0,0,7,14,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// The crystal you are defending — pulses, spins, and reddens as lives drop.
function drawCrystal(){
  const p=path[path.length-1];
  const health=Math.max(0,Math.min(1,lives/START_LIVES));
  const hue=health;   // 1 = healthy cyan/violet, 0 = angry red
  const core=hue>0.5?'#a78bfa':hue>0.25?'#f0abfc':'#f87171';
  const edge=hue>0.5?'#c4b5fd':hue>0.25?'#f5d0fe':'#fca5a5';
  const pulse=1+0.07*Math.sin(now*2.6)+crystalHit*0.28;

  ctx.save();
  ctx.translate(p.x,p.y);

  // Ground halo
  drawGlow(core,0,0,46*pulse,0.55+crystalHit*0.35);

  // Orbiting shards
  for(let i=0;i<3;i++){
    const a=now*0.9+i*(Math.PI*2/3);
    const ox=Math.cos(a)*24,oy=Math.sin(a)*10;
    ctx.globalAlpha=0.55;
    ctx.fillStyle=edge;
    ctx.save();ctx.translate(ox,oy);ctx.rotate(a*2);
    ctx.beginPath();ctx.moveTo(0,-4);ctx.lineTo(2.4,0);ctx.lineTo(0,4);ctx.lineTo(-2.4,0);ctx.closePath();ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha=1;

  // Pedestal
  ctx.fillStyle='rgba(0,0,0,0.45)';
  ctx.beginPath();ctx.ellipse(0,15,17,6,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#2a2044';
  ctx.beginPath();ctx.moveTo(-14,14);ctx.lineTo(14,14);ctx.lineTo(10,7);ctx.lineTo(-10,7);ctx.closePath();ctx.fill();
  ctx.fillStyle='#3b2d60';
  ctx.beginPath();ctx.ellipse(0,7,10,3.4,0,0,Math.PI*2);ctx.fill();

  // Crystal body (facetted hexagon)
  ctx.save();
  ctx.scale(pulse,pulse);
  const grd=ctx.createLinearGradient(-10,-20,10,10);
  grd.addColorStop(0,edge);
  grd.addColorStop(0.5,core);
  grd.addColorStop(1,shade(core,-0.55));
  ctx.fillStyle=grd;
  ctx.beginPath();
  ctx.moveTo(0,-22);ctx.lineTo(10,-8);ctx.lineTo(7,8);ctx.lineTo(0,14);
  ctx.lineTo(-7,8);ctx.lineTo(-10,-8);ctx.closePath();
  ctx.fill();
  // Facet highlight
  ctx.fillStyle=hexA('#ffffff',0.3);
  ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(10,-8);ctx.lineTo(0,-2);ctx.closePath();ctx.fill();
  ctx.fillStyle=hexA('#000000',0.22);
  ctx.beginPath();ctx.moveTo(0,-2);ctx.lineTo(7,8);ctx.lineTo(0,14);ctx.closePath();ctx.fill();
  ctx.strokeStyle=hexA(edge,0.75);ctx.lineWidth=1.1;
  ctx.beginPath();
  ctx.moveTo(0,-22);ctx.lineTo(10,-8);ctx.lineTo(7,8);ctx.lineTo(0,14);
  ctx.lineTo(-7,8);ctx.lineTo(-10,-8);ctx.closePath();
  ctx.stroke();
  ctx.restore();
  ctx.restore();
}

function drawRangeRing(x,y,r,col,alpha){
  ctx.strokeStyle=hexA(col,alpha);
  ctx.lineWidth=1.6;
  ctx.setLineDash([]);
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle=hexA(col,0.05);
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  // Rotating tick marks so the ring reads as active
  ctx.strokeStyle=hexA(col,alpha*0.8);
  ctx.lineWidth=2;
  for(let i=0;i<8;i++){
    const a=now*0.5+i*Math.PI/4;
    ctx.beginPath();
    ctx.arc(x,y,r,a,a+0.09);
    ctx.stroke();
  }
}

function drawPlacementPreview(x,y,valid){
  const col=valid?'#4ade80':'#f87171';
  ctx.setLineDash([6,6]);
  ctx.lineDashOffset=-now*18;
  ctx.lineWidth=2;
  ctx.strokeStyle=hexA(col,0.65);
  ctx.beginPath();ctx.arc(x,y,selectedTower.range,0,Math.PI*2);ctx.stroke();
  ctx.setLineDash([]);
  ctx.lineDashOffset=0;
  ctx.fillStyle=hexA(col,0.08);
  ctx.beginPath();ctx.arc(x,y,selectedTower.range,0,Math.PI*2);ctx.fill();
  // Footprint
  ctx.fillStyle=hexA(col,0.22);
  ctx.beginPath();ctx.ellipse(x,y+6,16,7,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=hexA(col,0.8);ctx.lineWidth=1.4;
  ctx.beginPath();ctx.ellipse(x,y+6,16,7,0,0,Math.PI*2);ctx.stroke();
  if(!valid){
    ctx.strokeStyle=hexA(col,0.9);ctx.lineWidth=2.4;
    ctx.beginPath();ctx.moveTo(x-8,y-8);ctx.lineTo(x+8,y+8);ctx.moveTo(x+8,y-8);ctx.lineTo(x-8,y+8);ctx.stroke();
  }
}

// ---------------- Tower art ----------------
function drawTower(t){
  const lvl=t.level||0;
  const bob=Math.sin(now*1.8+t.phase)*1.1;
  const recoil=(t.recoil||0)*4;
  ctx.save();
  ctx.translate(t.x,t.y);

  // Cast shadow
  ctx.fillStyle='rgba(0,0,0,0.42)';
  ctx.beginPath();ctx.ellipse(2,14,15,6,0,0,Math.PI*2);ctx.fill();

  // Stone plinth
  ctx.fillStyle='#221a38';
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(-14,4,28,11,3.5);else ctx.rect(-14,4,28,11);
  ctx.fill();
  ctx.fillStyle='#332853';
  ctx.beginPath();ctx.ellipse(0,4.5,13.5,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#191230';
  ctx.beginPath();ctx.ellipse(0,4.5,9.5,3.4,0,0,Math.PI*2);ctx.fill();

  // Elemental rune ring on the plinth, colour-keyed to the tower
  ctx.strokeStyle=hexA(t.color,0.45+0.2*Math.sin(now*3+t.phase));
  ctx.lineWidth=1.4;
  ctx.beginPath();ctx.ellipse(0,4.5,11.5,4.2,0,0,Math.PI*2);ctx.stroke();

  // Tower shaft
  const shaft=ctx.createLinearGradient(-9,-14,9,6);
  shaft.addColorStop(0,'#463a6e');
  shaft.addColorStop(0.5,'#2e2450');
  shaft.addColorStop(1,'#1b1436');
  ctx.fillStyle=shaft;
  ctx.beginPath();
  ctx.moveTo(-8.5,5);ctx.lineTo(-6.5,-9+bob);ctx.lineTo(6.5,-9+bob);ctx.lineTo(8.5,5);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle=hexA(t.color,0.22);ctx.lineWidth=1;ctx.stroke();

  // Battlement lip
  ctx.fillStyle='#3d3161';
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(-9.5,-13+bob,19,5,1.8);else ctx.rect(-9.5,-13+bob,19,5);
  ctx.fill();

  // Level pips
  for(let i=0;i<MAX_TOWER_LEVEL;i++){
    ctx.fillStyle=i<lvl?'#fbbf24':'rgba(255,255,255,0.13)';
    ctx.beginPath();
    ctx.arc(-6+i*6,10.5,1.7,0,Math.PI*2);
    ctx.fill();
  }

  // Floating focus orb (channels the element) — glow sprite instead of blur
  const orbY=-20+bob-recoil*0.5;
  const orbR=6+lvl*0.7;
  drawGlow(t.color,0,orbY,20+lvl*3,0.75);
  const og=ctx.createRadialGradient(-orbR*0.35,orbY-orbR*0.4,orbR*0.15,0,orbY,orbR);
  og.addColorStop(0,'#ffffff');
  og.addColorStop(0.35,shade(t.color,0.35));
  og.addColorStop(1,shade(t.color,-0.4));
  ctx.fillStyle=og;
  ctx.beginPath();ctx.arc(0,orbY,orbR,0,Math.PI*2);ctx.fill();

  // Orbiting motes, one per upgrade level
  for(let i=0;i<lvl;i++){
    const a=now*2.2+i*(Math.PI*2/Math.max(1,lvl));
    ctx.fillStyle=hexA('#fde68a',0.85);
    ctx.beginPath();ctx.arc(Math.cos(a)*(orbR+5),orbY+Math.sin(a)*(orbR+5)*0.6,1.5,0,Math.PI*2);ctx.fill();
  }

  // Emitter barrel, swung to face the current target
  ctx.save();
  ctx.rotate(t.aim||0);
  ctx.translate(-recoil,0);
  ctx.fillStyle='#4a3d72';
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(2,-3,14,6,2.4);else ctx.rect(2,-3,14,6);
  ctx.fill();
  ctx.fillStyle=hexA(t.color,0.85);
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(12,-2.2,4.5,4.4,1.6);else ctx.rect(12,-2.2,4.5,4.4);
  ctx.fill();
  if((t.flash||0)>0.02){
    ctx.globalAlpha=t.flash;
    drawGlow(t.color,18,0,15,1);
    ctx.globalAlpha=1;
  }
  ctx.restore();

  // Element sigil rides on the orb
  ctx.font='11px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.globalAlpha=0.95;
  ctx.fillText(t.icon,0,orbY);
  ctx.globalAlpha=1;

  ctx.restore();
}

// ---------------- Enemy art ----------------
function drawEnemy(e){
  const s=e.size;
  const walk=now*(e.kind==='fast'?11:6)+e.phase;
  const bob=Math.sin(walk)*(e.kind==='boss'?1.4:2.1);
  const lean=Math.sin(walk*0.5)*0.07;
  ctx.save();
  ctx.translate(e.x,e.y+bob);

  // Shadow stays on the ground while the body bobs
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.beginPath();ctx.ellipse(0,s*0.82-bob,s*0.7,s*0.26,0,0,Math.PI*2);ctx.fill();

  // Speed streaks behind fast runners
  if(e.kind==='fast'&&e.dir!==undefined){
    ctx.strokeStyle=hexA('#c084fc',0.35);
    ctx.lineWidth=1.6;
    for(let i=1;i<=3;i++){
      const d=i*6;
      ctx.beginPath();
      ctx.moveTo(-Math.cos(e.dir)*d,-Math.sin(e.dir)*d);
      ctx.lineTo(-Math.cos(e.dir)*(d+5),-Math.sin(e.dir)*(d+5));
      ctx.stroke();
    }
  }

  ctx.rotate(lean);

  const body=e.kind==='boss'?'#8b3a0c':e.kind==='fast'?'#5b21b6':'#7f1d1d';
  const bodyLit=e.kind==='boss'?'#f59e0b':e.kind==='fast'?'#c084fc':'#ef4444';

  // Legs
  ctx.strokeStyle=shade(body,-0.3);
  ctx.lineWidth=e.kind==='boss'?3.4:2.3;
  ctx.lineCap='round';
  for(const side of [-1,1]){
    const swing=Math.sin(walk+(side>0?0:Math.PI))*s*0.28;
    ctx.beginPath();
    ctx.moveTo(side*s*0.3,s*0.45);
    ctx.lineTo(side*s*0.34+swing,s*0.85);
    ctx.stroke();
  }

  // Cloaked body
  const bg=ctx.createLinearGradient(0,-s,0,s*0.9);
  bg.addColorStop(0,bodyLit);
  bg.addColorStop(0.45,body);
  bg.addColorStop(1,shade(body,-0.45));
  ctx.fillStyle=bg;
  const flare=s*0.62+Math.sin(walk*2)*s*0.06;
  ctx.beginPath();
  ctx.moveTo(0,-s*0.98);
  ctx.quadraticCurveTo(s*0.88,-s*0.42,flare,s*0.62);
  ctx.quadraticCurveTo(0,s*0.34,-flare,s*0.62);
  ctx.quadraticCurveTo(-s*0.88,-s*0.42,0,-s*0.98);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle=hexA(bodyLit,0.55);ctx.lineWidth=1.1;ctx.stroke();

  // Ragged hem
  ctx.fillStyle=shade(body,-0.5);
  ctx.beginPath();
  ctx.moveTo(-flare,s*0.6);
  for(let i=0;i<=6;i++){
    const fx=-flare+(flare*2)*(i/6);
    ctx.lineTo(fx,s*0.6+(i%2?s*0.16:0));
  }
  ctx.lineTo(flare,s*0.6);
  ctx.closePath();ctx.fill();

  // Hood void
  ctx.fillStyle='rgba(6,2,12,0.82)';
  ctx.beginPath();ctx.ellipse(0,-s*0.42,s*0.46,s*0.4,0,0,Math.PI*2);ctx.fill();

  // Eyes
  const eyeCol=e.kind==='boss'?'#fde047':e.kind==='fast'?'#e9d5ff':'#fca5a5';
  drawGlow(eyeCol,0,-s*0.42,s*0.75,0.55);
  ctx.fillStyle=eyeCol;
  for(const side of [-1,1]){
    ctx.beginPath();
    ctx.ellipse(side*s*0.19,-s*0.44,s*0.1,s*0.13,side*0.3,0,Math.PI*2);
    ctx.fill();
  }

  // Boss crown of horns
  if(e.kind==='boss'){
    ctx.fillStyle='#fbbf24';
    for(const side of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(side*s*0.36,-s*0.7);
      ctx.quadraticCurveTo(side*s*0.72,-s*1.16,side*s*0.44,-s*1.34);
      ctx.quadraticCurveTo(side*s*0.42,-s*0.94,side*s*0.24,-s*0.78);
      ctx.closePath();ctx.fill();
    }
    // Aura
    ctx.strokeStyle=hexA('#f59e0b',0.3+0.16*Math.sin(now*4));
    ctx.lineWidth=1.6;
    ctx.beginPath();ctx.arc(0,-s*0.15,s*1.18,0,Math.PI*2);ctx.stroke();
  }

  // Status overlays
  if(e.slow>0){
    ctx.fillStyle='rgba(56,189,248,0.28)';
    ctx.beginPath();ctx.arc(0,-s*0.15,s*0.98,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=hexA('#7dd3fc',0.8);ctx.lineWidth=1.2;
    for(let i=0;i<5;i++){
      const a=now*0.6+i*(Math.PI*2/5);
      const rx=Math.cos(a)*s*0.85,ry=Math.sin(a)*s*0.85-s*0.15;
      ctx.beginPath();
      ctx.moveTo(rx,ry-2.6);ctx.lineTo(rx+2.2,ry);ctx.lineTo(rx,ry+2.6);ctx.lineTo(rx-2.2,ry);
      ctx.closePath();ctx.stroke();
    }
  }
  if(e.dot>0){
    ctx.fillStyle=hexA('#84cc16',0.5);
    for(let i=0;i<3;i++){
      const a=now*2.4+i*2.1;
      ctx.beginPath();
      ctx.arc(Math.sin(a)*s*0.5,-s*0.5-((now*22+i*13)%26),1.5+Math.sin(a)*0.6,0,Math.PI*2);
      ctx.fill();
    }
  }
  // White flash on impact
  if(e.flash>0.02){
    ctx.globalAlpha=e.flash*0.65;
    ctx.fillStyle='#ffffff';
    ctx.beginPath();
    ctx.moveTo(0,-s*0.98);
    ctx.quadraticCurveTo(s*0.88,-s*0.42,flare,s*0.62);
    ctx.quadraticCurveTo(0,s*0.34,-flare,s*0.62);
    ctx.quadraticCurveTo(-s*0.88,-s*0.42,0,-s*0.98);
    ctx.closePath();ctx.fill();
    ctx.globalAlpha=1;
  }

  ctx.restore();

  // Health bar (only once wounded — keeps the board clean)
  if(e.hp<e.maxHp){
    const ratio=Math.max(0,e.hp/e.maxHp);
    const bw=s*2.1,bh=e.kind==='boss'?5:3.5;
    const bx=e.x-bw/2,by=e.y-s-11;
    ctx.fillStyle='rgba(0,0,0,0.65)';
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(bx-1,by-1,bw+2,bh+2,2.5);else ctx.rect(bx-1,by-1,bw+2,bh+2);
    ctx.fill();
    const hg=ctx.createLinearGradient(bx,0,bx+bw,0);
    const hcol=ratio>0.55?'#22c55e':ratio>0.28?'#fbbf24':'#ef4444';
    hg.addColorStop(0,shade(hcol,-0.2));
    hg.addColorStop(1,shade(hcol,0.3));
    ctx.fillStyle=hg;
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(bx,by,bw*ratio,bh,1.8);else ctx.rect(bx,by,bw*ratio,bh);
    ctx.fill();
    if(e.kind==='boss'){
      ctx.strokeStyle=hexA('#fbbf24',0.75);ctx.lineWidth=1;
      ctx.beginPath();
      if(ctx.roundRect)ctx.roundRect(bx-1,by-1,bw+2,bh+2,2.5);else ctx.rect(bx-1,by-1,bw+2,bh+2);
      ctx.stroke();
    }
  }
}

// ---------------- Projectile art ----------------
function drawProjectile(p){
  const ang=Math.atan2(p.vy,p.vx);
  // Tapered trail shared by every projectile type
  if(p.trail.length>1){
    for(let i=1;i<p.trail.length;i++){
      const a=(i/p.trail.length);
      ctx.strokeStyle=hexA(p.color,a*0.42);
      ctx.lineWidth=p.r*a*1.5;
      ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(p.trail[i-1].x,p.trail[i-1].y);
      ctx.lineTo(p.trail[i].x,p.trail[i].y);
      ctx.stroke();
    }
  }
  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.rotate(ang);
  switch(p.proj){
    case 'arrow':
      ctx.fillStyle='#d9f99d';
      ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(-1,2.4);ctx.lineTo(-1,-2.4);ctx.closePath();ctx.fill();
      ctx.strokeStyle='#65a30d';ctx.lineWidth=1.8;
      ctx.beginPath();ctx.moveTo(-1,0);ctx.lineTo(-10,0);ctx.stroke();
      ctx.strokeStyle='#a3e635';ctx.lineWidth=1.2;
      ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(-13,2.6);ctx.moveTo(-10,0);ctx.lineTo(-13,-2.6);ctx.stroke();
      break;
    case 'fire':{
      drawGlow('#f97316',0,0,15,0.85);
      const flick=1+Math.sin(p.spin*3)*0.16;
      ctx.fillStyle='#f97316';
      ctx.beginPath();ctx.ellipse(0,0,6.5*flick,4.6,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fde047';
      ctx.beginPath();ctx.ellipse(1.4,0,3.4*flick,2.4,0,0,Math.PI*2);ctx.fill();
      break;
    }
    case 'ice':
      ctx.rotate(p.spin);
      drawGlow('#38bdf8',0,0,13,0.6);
      ctx.fillStyle='#e0f2fe';
      ctx.beginPath();ctx.moveTo(0,-6.5);ctx.lineTo(3.4,0);ctx.lineTo(0,6.5);ctx.lineTo(-3.4,0);ctx.closePath();ctx.fill();
      ctx.strokeStyle='#38bdf8';ctx.lineWidth=1;ctx.stroke();
      break;
    case 'lightning':{
      drawGlow('#fde047',0,0,15,0.75);
      ctx.strokeStyle='#fef9c3';ctx.lineWidth=2.2;ctx.lineJoin='round';
      ctx.beginPath();ctx.moveTo(-9,0);
      for(let i=-6;i<=9;i+=3.5)ctx.lineTo(i,(Math.random()-0.5)*5);
      ctx.stroke();
      break;
    }
    case 'poison':
      drawGlow('#84cc16',0,0,12,0.6);
      ctx.fillStyle='#4d7c0f';
      ctx.beginPath();ctx.arc(0,0,5.2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#a3e635';
      ctx.beginPath();ctx.arc(-1.4,-1.4,2.4,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(2,1.6,1.4,0,Math.PI*2);ctx.fill();
      break;
    case 'cannon':
      ctx.fillStyle='#111827';
      ctx.beginPath();ctx.arc(0,0,6.2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(209,213,219,0.6)';
      ctx.beginPath();ctx.arc(-2,-2.2,2.1,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(156,163,175,0.35)';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(0,0,6.2,0,Math.PI*2);ctx.stroke();
      break;
    case 'magic':
      drawGlow('#a855f7',0,0,16,0.8);
      ctx.fillStyle='#e9d5ff';
      ctx.beginPath();ctx.arc(0,0,4.4,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=hexA('#c084fc',0.85);ctx.lineWidth=1.3;
      ctx.save();ctx.rotate(p.spin);
      ctx.beginPath();ctx.ellipse(0,0,8.5,3.2,0,0,Math.PI*2);ctx.stroke();
      ctx.restore();
      break;
    case 'dark':
      drawGlow('#7c3aed',0,0,16,0.55);
      ctx.fillStyle='#0b0714';
      ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=hexA('#a78bfa',0.9);ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(0,0,6,p.spin,p.spin+Math.PI*1.4);ctx.stroke();
      break;
    case 'holy':
      drawGlow('#fde047',0,0,18,0.85);
      ctx.rotate(p.spin*0.5);
      ctx.fillStyle='#fffbeb';
      ctx.beginPath();
      for(let i=0;i<8;i++){
        const a=i*Math.PI/4,r=i%2===0?8:3;
        i===0?ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r):ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
      }
      ctx.closePath();ctx.fill();
      break;
    case 'dragon':{
      drawGlow('#f97316',0,0,20,0.9);
      const fl=1+Math.sin(p.spin*4)*0.2;
      ctx.fillStyle='#7c2d12';
      ctx.beginPath();ctx.ellipse(0,0,8.5*fl,5.5,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#f97316';
      ctx.beginPath();ctx.ellipse(1,0,6*fl,3.8,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fef08a';
      ctx.beginPath();ctx.ellipse(2.6,0,3*fl,2,0,0,Math.PI*2);ctx.fill();
      break;
    }
    default:
      drawGlow(p.color,0,0,12,0.7);
      ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function drawRingParticle(p){
  ctx.globalAlpha=Math.max(0,p.life)*0.7;
  ctx.strokeStyle=p.col;
  ctx.lineWidth=p.w*p.life;
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.stroke();
  ctx.globalAlpha=Math.max(0,p.life)*0.14;
  ctx.fillStyle=p.col;
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
}

function drawBolt(p){
  ctx.globalAlpha=Math.max(0,p.life);
  ctx.strokeStyle=p.col;
  ctx.lineWidth=2.2;
  ctx.lineJoin='round';
  const segs=6;
  ctx.beginPath();
  ctx.moveTo(p.x,p.y);
  for(let i=1;i<segs;i++){
    const t=i/segs;
    const jx=Math.sin(p.seed+i*2.7)*7*(1-Math.abs(t-0.5)*2);
    const jy=Math.cos(p.seed+i*1.9)*7*(1-Math.abs(t-0.5)*2);
    ctx.lineTo(p.x+(p.x2-p.x)*t+jx,p.y+(p.y2-p.y)*t+jy);
  }
  ctx.lineTo(p.x2,p.y2);
  ctx.stroke();
  ctx.globalAlpha=Math.max(0,p.life)*0.35;
  ctx.lineWidth=5;
  ctx.stroke();
  ctx.globalAlpha=1;
}

function drawFloaters(){
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='800 11px Nunito, sans-serif';
  floaters.forEach(f=>{
    ctx.globalAlpha=Math.max(0,Math.min(1,f.life*1.4));
    ctx.fillStyle='rgba(0,0,0,0.65)';
    ctx.fillText(f.text,f.x+1,f.y+1);
    ctx.fillStyle=f.col;
    ctx.fillText(f.text,f.x,f.y);
  });
  ctx.globalAlpha=1;
}

// ---------------- HUD ----------------
function updateHUD(){
  document.getElementById('hud-lives').textContent=lives;
  document.getElementById('hud-gold').textContent=gold;
  document.getElementById('hud-wave').textContent=wave;
  document.getElementById('hud-kills').textContent=kills;
  const lb=document.getElementById('hud-lives-box');
  if(lb)lb.classList.toggle('critical',lives<=5);
  const fill=document.getElementById('wave-bar-fill');
  if(fill){
    if(waveState&&waveState.total>0){
      const remaining=(waveState.total-waveState.spawned)+enemies.length;
      fill.style.width=Math.max(0,Math.min(100,(1-remaining/waveState.total)*100))+'%';
    }else{
      fill.style.width='0%';
    }
  }
}

function showGameOver(win){
  sfx(win?'win':'lose');
  waveActive=false;
  clearTimeout(pendingWaveTimer);pendingWaveTimer=null;wavePendingOnResume=false;
  if(waveState&&waveState.intervalId){clearInterval(waveState.intervalId);waveState.intervalId=null;}
  if(autosaveIntervalId){clearInterval(autosaveIntervalId);autosaveIntervalId=null;}
  gameStarted=false;
  const {bestWave,highScore}=recordRunEnd();
  const go=document.getElementById('gameover');
  go.classList.add('show');
  document.getElementById('go-title').textContent=win?'🏆 VICTORY!':'☠️ DEFEATED';
  document.getElementById('go-score').innerHTML=
    `Wave ${wave}/12 &nbsp;|&nbsp; ${kills} kills &nbsp;|&nbsp; ${gold}🪙<br>Best Wave ${bestWave} &nbsp;|&nbsp; High Score ${highScore}`;
}
