function save(){
  if(!S||S.bankrupt)return;
  try{ S.lastTs=Date.now(); localStorage.setItem(SK,JSON.stringify(S)); }catch(e){}
}
function loadRaw(){
  try{
    const r=localStorage.getItem(SK); if(!r)return null;
    const p=JSON.parse(r);
    // `{}`, `[]` and `42` all parse fine and used to light up the Continue
    // button with "Year undefined undefined, $NaN", then silently hand the
    // player a brand-new company dressed up as their old one.
    if(!p||typeof p!=='object'||Array.isArray(p))return null;
    if(p.v!==SAVE_V)return null;
    return p;
  }catch(e){ return null; }
}

// ── save sanitising ──────────────────────────────────────────
// Saves are untrusted input: hand-edited, schema-drifted, or planted by any
// other page on the same origin (the whole vault ships from one GitHub Pages
// origin). Every field is validated individually and NEVER Object.assign'd —
// a JSON-parsed own `__proto__` passes through [[Set]] and reparents S, which
// is enough to make every hire free. Well-typed but out-of-range numbers are
// just as dangerous: marketing:-500000 turns the marketing line into income.
const num=(v,d,lo,hi)=>{
  const n=typeof v==='number'&&Number.isFinite(v)?v:d;
  return Math.min(hi===undefined?Infinity:hi, Math.max(lo===undefined?-Infinity:lo, n));
};
const arr=v=>Array.isArray(v)?v:[];
function numMap(src,keys,lo,hi){
  const o={}; for(const k of keys) o[k]=num(src&&src[k],0,lo,hi); return o;
}
function sanitize(d){
  const S2=blankState();
  let seq=1; const sid=()=>seq++;   // uid() reads S, which is null in here
  S2.day  =num(d.day,1,1,30);
  S2.month=num(d.month,0,0,11)|0;
  S2.year =num(d.year,1,1,999)|0;
  S2.speed=num(d.speed,1,0,3)|0;
  S2.cash =num(d.cash,0,-1e12,1e12);
  S2.rep  =num(d.rep,50,0,100);
  S2.morale=num(d.morale,70,5,100);
  S2.trucks=num(d.trucks,1,0,50)|0;
  S2.office=num(d.office,0,0,OFFICES.length-1)|0;
  S2.marketing=num(d.marketing,800,0,12000);
  // Sales desk policy. Validated field by field like every other persisted
  // number: a floor of -900 would have the desk bidding below cost forever,
  // and a negative keepFree would let it bid past jobCap() into guaranteed
  // late penalties. A v1 save has no `sales` at all and gets the defaults,
  // which is the desk switched off — identical to the old behaviour.
  {
    const sd=(d&&typeof d.sales==='object'&&d.sales)||{};
    S2.sales={ auto:!!sd.auto, floor:num(sd.floor,22,0,90), keepFree:num(sd.keepFree,1,0,20)|0 };
  }
  S2.loan =num(d.loan,0,0,1e9);
  S2.loanRate=num(d.loanRate,0.11,0,1);
  S2.wageIndex=num(d.wageIndex,1,0.1,100);
  S2.nextId=num(d.nextId,1,1,1e9)|0;
  S2.jobsDone=num(d.jobsDone,0,0,1e6)|0;
  S2.jobsLate=num(d.jobsLate,0,0,1e6)|0;
  S2.callbacks=num(d.callbacks,0,0,15)|0;
  S2.totalRevenue=num(d.totalRevenue,0,0,1e12);
  S2.insolventMonths=num(d.insolventMonths,0,0,999)|0;
  S2.pendingLeads=num(d.pendingLeads,0,0,50)|0;
  S2.moraleDrift=num(d.moraleDrift,0,-5,5);
  S2.autoBuy=d.autoBuy!==false;
  S2.bankrupt=false;

  S2.inv=numMap(d.inv,['panel','opt','rail','inv'],0,1e6);
  S2.ledger=numMap(d.ledger,Object.keys(blankLedger()),-1e12,1e12);

  S2.invest={};
  for(const it of INVEST) if(d.invest&&d.invest[it.id]===true)S2.invest[it.id]=true;

  S2.mod={}; for(const k of ['survey','design','permit','mats','install','elec','inspect','pto','market'])
    if(d.mod&&typeof d.mod[k]==='number'&&Number.isFinite(d.mod[k]))S2.mod[k]=num(d.mod[k],1,0.1,5);
  S2.priceMod={}; for(const k of Object.keys(MATS))
    if(d.priceMod&&typeof d.priceMod[k]==='number'&&Number.isFinite(d.priceMod[k]))S2.priceMod[k]=num(d.priceMod[k],1,0.1,10);

  S2.event = EVENTS.some(e=>e.id===d.event) ? d.event : null;
  S2.eventName = S2.event ? (EVENTS.find(e=>e.id===S2.event).t) : '';

  S2.staff=arr(d.staff).filter(s=>s&&ROLES[s.role]).slice(0,40).map(s=>({
    id:num(s.id,sid(),1,1e9)|0, role:s.role,
    name:String(s.name==null?'Crew':s.name).slice(0,40),
    wage:num(s.wage,ROLES[s.role].wage,0,1e6),
  }));
  S2.cats=arr(d.cats).slice(0,12).map(c=>({name:String(c&&c.name!=null?c.name:'Cat').slice(0,24)}));
  S2.jobs=arr(d.jobs).filter(j=>j&&Number.isFinite(j.panels)).slice(0,60).map(j=>({
    id:num(j.id,sid(),1,1e9)|0,
    client:String(j.client==null?'Client':j.client).slice(0,60),
    type:String(j.type==null?'Residential':j.type).slice(0,30),
    icon:String(j.icon==null?'🏠':j.icon).slice(0,4),
    panels:num(j.panels,10,1,5000)|0,
    value:num(j.value,0,0,1e9), deposit:num(j.deposit,0,0,1e9),
    matBudget:num(j.matBudget,0,0,1e9),
    stage:num(j.stage,0,0,STAGES.length-1)|0,
    left:num(j.left,1,0,999), elapsed:num(j.elapsed,0,0,9999),
    promised:num(j.promised,40,1,9999),
    installTotal:num(j.installTotal,0,0,999),
    blocked:null, matsPaid:!!j.matsPaid,
  }));
  S2.bids=arr(d.bids).filter(b=>b&&Number.isFinite(b.panels)).slice(0,30).map(b=>({
    leadId:num(b.leadId,0,0,1e9)|0,
    client:String(b.client==null?'Client':b.client).slice(0,60),
    type:String(b.type==null?'Residential':b.type).slice(0,30),
    icon:String(b.icon==null?'🏠':b.icon).slice(0,4),
    panels:num(b.panels,10,1,5000)|0, price:num(b.price,0,0,1e9),
    chance:num(b.chance,0.5,0,1), wait:num(b.wait,1,0,60)|0,
  }));
  S2.leads=arr(d.leads).filter(l=>l&&Number.isFinite(l.panels)).slice(0,20).map(l=>({
    id:num(l.id,sid(),1,1e9)|0,
    client:String(l.client==null?'Client':l.client).slice(0,60),
    type:String(l.type==null?'Residential':l.type).slice(0,30),
    icon:String(l.icon==null?'🏠':l.icon).slice(0,4),
    panels:num(l.panels,10,1,5000)|0,
    quality:['hot','warm','cold'].includes(l.quality)?l.quality:'warm',
    mkt:num(l.mkt,1.4,1,3), days:num(l.days,8,0,60),
  }));
  S2.done=arr(d.done).filter(x=>x&&typeof x==='object').slice(0,25).map(x=>({
    client:String(x.client==null?'Client':x.client).slice(0,60),
    value:num(x.value,0,0,1e9), late:!!x.late,
    day:num(x.day,1,1,30)|0, month:num(x.month,0,0,11)|0, year:num(x.year,1,1,999)|0,
  }));
  S2.history=arr(d.history).filter(x=>x&&typeof x==='object').slice(0,18).map(x=>({
    label:String(x.label==null?'—':x.label).slice(0,20),
    rev:num(x.rev,0,-1e12,1e12), exp:num(x.exp,0,-1e12,1e12),
    net:num(x.net,0,-1e12,1e12), cash:num(x.cash,0,-1e12,1e12),
    capex:num(x.capex,0,-1e12,1e12),
  }));
  S2.cashHist=arr(d.cashHist).map(v=>num(v,0,-1e12,1e12)).slice(-24);
  S2.lastTs=num(d.lastTs,Date.now(),0,Date.now()+1);
  // ids must not collide with anything restored above
  S2.nextId=Math.max(S2.nextId,1+Math.max(0,...S2.staff.map(x=>x.id),
    ...S2.jobs.map(x=>x.id),...S2.leads.map(x=>x.id)));
  return S2;
}
function hasOldSave(){
  try{ return OLD_KEYS.some(k=>localStorage.getItem(k)); }catch(e){ return false; }
}
function refreshMenu(){
  const d=loadRaw();
  const btn=document.getElementById('btn-continue');
  const noteEl=document.getElementById('menu-note');
  if(d){
    const y=Number.isFinite(d.year)?d.year:1;
    const m=MONTHS[Number.isFinite(d.month)?Math.min(11,Math.max(0,d.month|0)):0];
    const c=Number.isFinite(d.cash)?d.cash:0;
    btn.disabled=false;
    btn.textContent='▶ Continue — Year '+y+' '+m+', '+money(c);
    noteEl.textContent='';
  } else {
    btn.disabled=true; btn.textContent='▶ Continue';
    noteEl.textContent = hasOldSave()
      ? 'An older Purr & Power save was found. This build rebuilt the simulation from the ground up, so it starts a fresh company.'
      : '';
  }
}
function continueGame(){
  const d=loadRaw(); if(!d){refreshMenu();return;}
  try{ S=sanitize(d); }
  catch(e){ S=null; note('⚠️ That save could not be read','bad'); refreshMenu(); return; }
  begin(true);
}

// Overwriting a multi-year company is not something to do on a mis-tap, and
// the two menu buttons sit adjacent and identically styled on a touch layout.
function newGame(){
  if(loadRaw()){
    html('msg-card',
      '<div class="mo-t ff">Start over?</div>'+
      '<div class="mo-s">You have a company in progress. Starting a new one replaces it permanently.</div>'+
      '<div class="mo-btns">'+
        '<button class="btn r ff" onclick="closeOv(\'ov-msg\');reallyNewGame()">Replace it</button>'+
        '<button class="btn ff" onclick="closeOv(\'ov-msg\')">Keep it</button>'+
      '</div>');
    document.getElementById('msg-card').className='mo red';
    openOv('ov-msg');
    return;
  }
  reallyNewGame();
}
function reallyNewGame(){
  S=blankState();
  // Starting company: one full crew plus the licensed electrician every job
  // legally needs. Without the electrician a job can never clear AC hookup, so
  // the opening roster has to include one — the scarcity has to come from
  // scaling past one, not from being unable to finish a single install.
  // You cover design, permitting and sales yourself until you can hire.
  S.staff.push({id:uid(),role:'lead',     name:pick(FIRST)+' '+pick(LAST),wage:ROLES.lead.wage});
  S.staff.push({id:uid(),role:'installer',name:pick(FIRST)+' '+pick(LAST),wage:ROLES.installer.wage});
  S.staff.push({id:uid(),role:'installer',name:pick(FIRST)+' '+pick(LAST),wage:ROLES.installer.wage});
  S.staff.push({id:uid(),role:'electric', name:pick(FIRST)+' '+pick(LAST),wage:ROLES.electric.wage});
  S.cats.push({name:'Whiskers'},{name:'Amperage'});
  S.inv={panel:60,opt:60,rail:60,inv:3};
  for(let i=0;i<3;i++)addLead();
  begin(false);
  helpTimer=setTimeout(openHelp,400);
}
function begin(resumed){
  document.getElementById('menu').classList.add('gone');
  document.getElementById('app').classList.add('show');
  closeOv('ov-msg'); closeOv('ov-quote'); closeOv('ov-pause');
  sceneBuilt=false;
  // startClock() calls stopClock(), which clears catTimers — so it has to run
  // BEFORE the scene is built or the cats' wander timers are killed
  // microseconds after creation and they never move again.
  startClock();
  setSpeed(1);
  showTab('office');            // renderOffice() builds the scene itself
  if(resumed){
    // offline time advances the SIMULATION rather than minting cash:
    // jobs progress, payroll accrues, and you may come back to a mess.
    const gone=Date.now()-(S.lastTs||Date.now());
    const days=Math.min(Math.floor(gone/45000),45);
    if(days>0){
      const c0=S.cash;
      catchingUp=true;
      try{ for(let i=0;i<days&&!S.bankrupt;i++)advanceDay(); }
      finally{ catchingUp=false; save(); }
      const delta=S.cash-c0;
      note('💤 '+days+' day'+(days>1?'s':'')+' passed while you were away ('+
           (delta>=0?'+':'')+money0(delta)+')', delta>=0?'good':'warn');
    } else note('☀️ Trucks are loaded. Nothing broke while you were out.','good');
  }
  renderAll();
}

// ════════════════════════════════════════════════════════════
// BOOT
// ════════════════════════════════════════════════════════════
document.addEventListener('keydown',e=>{
  if(!S)return;
  if(e.key==='Escape'){
    if(!document.getElementById('ov-quote').classList.contains('gone')){closeQuote();return;}
    if(!document.getElementById('ov-msg').classList.contains('gone'))return;
    const p=document.getElementById('ov-pause');
    if(p.classList.contains('gone'))openPause(); else closePause();
  }
  // Ctrl+1/Cmd+2 are browser tab switches, and Space behind an open report
  // used to restart the sim underneath it.
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const modalUp=['ov-quote','ov-msg','ov-pause'].some(i=>!document.getElementById(i).classList.contains('gone'));
  if(modalUp)return;
  if(e.key===' '){e.preventDefault();setSpeed(S.speed===0?(S._prevSpeed||1):0);}
  if(e.key>='1'&&e.key<='3')setSpeed(+e.key);
});
window.addEventListener('resize',()=>{ if(S){ sceneBuilt=false; renderAll(); if(tab==='office')buildOfficeScene(); }});
document.addEventListener('visibilitychange',()=>{ if(document.hidden)save(); });
window.addEventListener('pagehide',save);

refreshMenu();
</script>
