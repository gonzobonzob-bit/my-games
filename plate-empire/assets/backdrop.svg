<?xml version="1.0" encoding="UTF-8"?>
<!--
  Plate Empire — isometric establishing-shot backdrop (PLACEHOLDER ART)
  This is a hand-built SVG standing in for the mandated Adobe commercial
  generative render. Warm/cinematic dusk scene, food-truck tier, tuned to
  the game palette (charcoal #1C1A18, brass #C08A3E, cream #EFE6D8, sage,
  alert). No external refs, no live generation — safe to bake as a static file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241c16"/>
      <stop offset="0.45" stop-color="#3a2a1c"/>
      <stop offset="0.7" stop-color="#5a3a22"/>
      <stop offset="1" stop-color="#1C1A18"/>
    </linearGradient>
    <radialGradient id="sunset" cx="0.7" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#e8a14a" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#C08A3E" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#C08A3E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a241e"/>
      <stop offset="1" stop-color="#161310"/>
    </linearGradient>
    <linearGradient id="truckBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFE6D8"/>
      <stop offset="1" stop-color="#cdbfa3"/>
    </linearGradient>
    <linearGradient id="truckSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8ccb8"/>
      <stop offset="1" stop-color="#a8967c"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#e8a14a"/>
    </linearGradient>
    <radialGradient id="windowGlow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#ffe6ad" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe6ad" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- sky + sunset wash -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#sunset)"/>

  <!-- distant skyline silhouette (El Paso-ish dusk) -->
  <g fill="#171311" opacity="0.85">
    <rect x="60" y="430" width="90" height="160"/>
    <rect x="150" y="400" width="70" height="190"/>
    <rect x="230" y="455" width="110" height="135"/>
    <rect x="1180" y="420" width="80" height="170"/>
    <rect x="1260" y="395" width="64" height="195"/>
    <rect x="1324" y="448" width="120" height="142"/>
    <rect x="1444" y="415" width="90" height="175"/>
  </g>
  <!-- a few warm lit windows -->
  <g fill="#C08A3E" opacity="0.5">
    <rect x="78" y="455" width="10" height="14"/><rect x="104" y="485" width="10" height="14"/>
    <rect x="168" y="430" width="9" height="13"/><rect x="192" y="470" width="9" height="13"/>
    <rect x="1280" y="425" width="9" height="13"/><rect x="1300" y="465" width="9" height="13"/>
    <rect x="1360" y="475" width="10" height="14"/><rect x="1470" y="445" width="10" height="14"/>
  </g>

  <!-- isometric ground plane -->
  <polygon points="800,520 1600,760 800,900 0,760" fill="url(#ground)"/>
  <polygon points="800,520 1600,760 800,900 0,760" fill="none" stroke="#3a2f24" stroke-width="2" opacity="0.4"/>
  <!-- ground sheen from the truck glow -->
  <ellipse cx="760" cy="720" rx="360" ry="110" fill="#e8a14a" opacity="0.10" filter="url(#soft)"/>

  <!-- ===== FOOD TRUCK (isometric) ===== -->
  <g>
    <!-- shadow -->
    <ellipse cx="780" cy="700" rx="330" ry="70" fill="#000" opacity="0.35" filter="url(#soft)"/>

    <!-- truck top -->
    <polygon points="560,360 1000,360 1120,430 680,430" fill="#e3d7c2"/>
    <!-- truck front-right face (serving side) -->
    <polygon points="680,430 1120,430 1120,650 680,650" fill="url(#truckBody)"/>
    <!-- truck left face -->
    <polygon points="560,360 680,430 680,650 560,580" fill="url(#truckSide)"/>

    <!-- brass trim along roofline -->
    <polygon points="680,430 1120,430 1120,446 680,446" fill="#C08A3E"/>
    <polygon points="560,360 680,430 680,446 560,376" fill="#9c6e30"/>

    <!-- serving window glow -->
    <rect x="740" y="476" width="320" height="120" rx="6" fill="url(#windowGlow)" opacity="0.9"/>
    <!-- serving window -->
    <rect x="752" y="486" width="300" height="104" rx="6" fill="url(#window)"/>
    <rect x="752" y="486" width="300" height="104" rx="6" fill="none" stroke="#8a5a22" stroke-width="3"/>
    <!-- counter ledge -->
    <polygon points="740,596 1072,596 1096,612 716,612" fill="#8a5a22"/>
    <!-- silhouettes of cook + utensils in the window -->
    <g fill="#3a2412" opacity="0.6">
      <circle cx="830" cy="520" r="18"/>
      <rect x="812" y="536" width="36" height="48" rx="8"/>
      <rect x="960" y="540" width="60" height="40" rx="6"/>
    </g>
    <!-- rising steam -->
    <g fill="#EFE6D8" opacity="0.18" filter="url(#soft)">
      <ellipse cx="980" cy="470" rx="14" ry="26"/>
      <ellipse cx="998" cy="440" rx="12" ry="22"/>
      <ellipse cx="985" cy="410" rx="10" ry="20"/>
    </g>

    <!-- awning over the window -->
    <polygon points="700,452 1100,452 1140,492 740,492" fill="#B5453A"/>
    <g fill="#EFE6D8" opacity="0.85">
      <polygon points="740,492 770,492 762,512 732,512"/>
      <polygon points="810,492 840,492 832,512 802,512"/>
      <polygon points="880,492 910,492 902,512 872,512"/>
      <polygon points="950,492 980,492 972,512 942,512"/>
      <polygon points="1020,492 1050,492 1042,512 1012,512"/>
    </g>

    <!-- wheels (iso ellipses) -->
    <ellipse cx="770" cy="660" rx="44" ry="22" fill="#1a1512"/>
    <ellipse cx="770" cy="656" rx="26" ry="13" fill="#3a2f24"/>
    <ellipse cx="1010" cy="660" rx="44" ry="22" fill="#1a1512"/>
    <ellipse cx="1010" cy="656" rx="26" ry="13" fill="#3a2f24"/>

    <!-- side menu board on left face -->
    <polygon points="586,420 660,464 660,560 586,516" fill="#262320"/>
    <g fill="#C08A3E" opacity="0.8">
      <polygon points="598,438 648,468 648,476 598,446"/>
      <polygon points="598,460 648,490 648,498 598,468"/>
      <polygon points="598,482 640,506 640,514 598,490"/>
    </g>
  </g>

  <!-- string lights across the scene -->
  <path d="M120,300 Q500,360 800,330 T1480,300" fill="none" stroke="#3a2f24" stroke-width="3"/>
  <g>
    <circle cx="260" cy="340" r="9" fill="#ffd98a"/><circle cx="260" cy="340" r="20" fill="#ffd98a" opacity="0.18"/>
    <circle cx="420" cy="350" r="9" fill="#ffd98a"/><circle cx="420" cy="350" r="20" fill="#ffd98a" opacity="0.18"/>
    <circle cx="600" cy="343" r="9" fill="#ffd98a"/><circle cx="600" cy="343" r="20" fill="#ffd98a" opacity="0.18"/>
    <circle cx="980" cy="338" r="9" fill="#ffd98a"/><circle cx="980" cy="338" r="20" fill="#ffd98a" opacity="0.18"/>
    <circle cx="1160" cy="330" r="9" fill="#ffd98a"/><circle cx="1160" cy="330" r="20" fill="#ffd98a" opacity="0.18"/>
    <circle cx="1340" cy="318" r="9" fill="#ffd98a"/><circle cx="1340" cy="318" r="20" fill="#ffd98a" opacity="0.18"/>
  </g>

  <!-- a couple of stools / patrons silhouettes near the counter -->
  <g fill="#171311" opacity="0.8">
    <rect x="1150" y="600" width="14" height="70"/><ellipse cx="1157" cy="596" rx="22" ry="10"/>
    <rect x="1230" y="610" width="14" height="70"/><ellipse cx="1237" cy="606" rx="22" ry="10"/>
    <circle cx="1300" cy="585" r="22"/><rect x="1284" y="600" width="32" height="60" rx="12"/>
  </g>

  <!-- vignette -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sunset)" opacity="0"/>
  <rect x="0" y="0" width="1600" height="900" fill="#000" opacity="0.0"/>
  <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
  </radialGradient>
  <rect x="0" y="0" width="1600" height="900" fill="url(#vig)"/>
</svg>
