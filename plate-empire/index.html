<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#1C1A18">
<title>Plate Empire — Food Truck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =================================================================
   PLATE EMPIRE — v1 (food-truck tier)
   Single-file build. Sections below:
     1. Tokens / theme        2. Layout shell
     3. Backdrop + ticket rail 4. Sidebar + HUD
     5. Panels                 6. Overlays (menu/pause/settings)
     7. Toasts                 8. Responsive
   ================================================================= */

/* ---------- 1. Tokens / theme ---------- */
:root{
  --bg:#1C1A18;          /* app background */
  --panel:#262320;       /* panel surface  */
  --panel-2:#2f2b27;     /* raised surface */
  --brass:#C08A3E;       /* primary accent */
  --brass-dim:#8a6330;
  --cream:#EFE6D8;       /* ticket cream / text on dark */
  --sage:#6B8E5A;        /* success */
  --alert:#B5453A;       /* miss / danger */
  --line:#3a342d;        /* hairline borders */
  --muted:#9c907d;       /* secondary text */
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --disp:'Big Shoulders Display','Arial Narrow',sans-serif;
  --body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);color:var(--cream);font-family:var(--body);
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
button{font-family:var(--body);cursor:pointer;}
.hidden{display:none !important;}

/* ---------- 2. Layout shell ---------- */
#game{position:fixed;inset:0;display:grid;
  grid-template-columns:220px 1fr;
  grid-template-rows:auto 1fr;
  grid-template-areas:"rail rail" "side main";
}
/* ---------- 3. Backdrop + ticket rail ---------- */
#backdrop{position:fixed;inset:0;z-index:0;
  background:#1C1A18 url('assets/backdrop.png') center/cover no-repeat;
}
#backdrop::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(28,26,24,0.35),rgba(28,26,24,0.78));}

#rail{grid-area:rail;position:relative;z-index:5;
  height:96px;background:rgba(20,18,16,0.92);
  border-bottom:2px solid var(--brass-dim);
  display:flex;align-items:stretch;gap:0;overflow:hidden;backdrop-filter:blur(2px);}
.rail-label{flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;
  padding:0 16px;border-right:1px solid var(--line);background:rgba(0,0,0,0.25);}
.rail-label b{font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:0.5px;color:var(--brass);text-transform:uppercase;}
.rail-label span{font-family:var(--mono);font-size:10px;color:var(--muted);}
#rail-track{position:relative;flex:1;overflow:hidden;}
.rail-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:1px;}

/* ticket card */
.ticket{position:absolute;top:10px;width:140px;height:76px;
  background:var(--cream);color:#241f18;border-radius:4px;
  box-shadow:0 6px 16px rgba(0,0,0,0.5);cursor:pointer;
  display:flex;flex-direction:column;overflow:hidden;
  border-top:4px solid var(--brass);
  transition:left .3s ease, transform .12s ease, box-shadow .12s ease;
  animation:ticketSlideIn .3s ease;
  font-family:var(--mono);
  /* serrated bottom edge like a kitchen ticket */
  -webkit-mask:radial-gradient(4px 4px at 8px 100%,transparent 98%,#000) repeat-x bottom/16px 8px;
  mask:radial-gradient(4px 4px at 8px 100%,transparent 98%,#000) repeat-x bottom/16px 8px;
}
.ticket:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 10px 22px rgba(0,0,0,0.6);}
.ticket .t-head{display:flex;align-items:center;gap:6px;padding:4px 7px 2px;}
.ticket .t-icon{width:26px;height:26px;flex:0 0 auto;}
.ticket .t-name{font-size:10px;font-weight:600;line-height:1.05;letter-spacing:-0.2px;}
.ticket .t-price{margin-left:auto;font-size:11px;font-weight:600;color:var(--brass-dim);}
.ticket .t-bar-wrap{height:6px;margin:3px 7px 0;background:rgba(0,0,0,0.12);border-radius:3px;overflow:hidden;}
.ticket .t-bar{height:100%;width:100%;background:var(--sage);border-radius:3px;}
.ticket .t-foot{font-size:9px;color:#7a6f5c;padding:2px 7px;display:flex;justify-content:space-between;}
.ticket.urgent .t-bar{background:var(--alert);}
.ticket.warn .t-bar{background:var(--brass);}
.ticket.fulfilled{animation:pop .35s ease forwards;pointer-events:none;}
.ticket.missed{animation:miss .4s ease forwards;pointer-events:none;}
@keyframes ticketSlideIn{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12);box-shadow:0 0 0 3px var(--sage)}100%{transform:scale(0.6);opacity:0}}
@keyframes miss{0%{transform:translateY(0)}100%{transform:translateY(40px) rotate(6deg);opacity:0}}

/* ---------- 4. Sidebar + HUD ---------- */
#side{grid-area:side;position:relative;z-index:4;
  background:rgba(20,18,16,0.92);border-right:1px solid var(--line);
  display:flex;flex-direction:column;backdrop-filter:blur(2px);}
.brand{padding:16px 16px 12px;border-bottom:1px solid var(--line);}
.brand h1{font-family:var(--disp);font-weight:900;font-size:26px;line-height:0.92;color:var(--cream);text-transform:uppercase;letter-spacing:0.5px;}
.brand h1 em{color:var(--brass);font-style:normal;}
.brand .tier{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:1px;}
nav{flex:1;padding:10px 0;}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;
  background:none;border:none;color:var(--muted);
  padding:11px 16px;font-size:13px;font-weight:600;text-align:left;
  border-left:3px solid transparent;transition:all .12s;}
.nav-item .ic{width:18px;text-align:center;font-size:15px;}
.nav-item:hover{color:var(--cream);background:rgba(192,138,62,0.07);}
.nav-item.active{color:var(--cream);background:rgba(192,138,62,0.12);border-left-color:var(--brass);}
.nav-item .soon{margin-left:auto;font-family:var(--mono);font-size:8px;color:var(--brass-dim);
  border:1px solid var(--brass-dim);border-radius:3px;padding:1px 4px;letter-spacing:0.5px;}
.side-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;}
.side-foot button{flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--cream);
  border-radius:5px;padding:8px;font-size:11px;font-weight:600;}
.side-foot button:hover{border-color:var(--brass);color:var(--brass);}

/* main column */
#main{grid-area:main;position:relative;z-index:3;overflow:auto;padding:16px 18px 28px;}

/* HUD stat strip */
#hud{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.stat{background:rgba(38,35,32,0.86);border:1px solid var(--line);border-radius:7px;
  padding:10px 14px;min-width:120px;backdrop-filter:blur(2px);}
.stat .k{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.stat .v{font-family:var(--disp);font-weight:800;font-size:26px;line-height:1;margin-top:3px;}
.stat.cash .v{color:var(--sage);}
.stat.rep .v{color:var(--brass);}
.stat.rep.danger{animation:repPulse 1s ease infinite;}
.stat.rep.danger .v{color:var(--alert);}
@keyframes repPulse{0%,100%{border-color:var(--line)}50%{border-color:var(--alert)}}
.stat.day .v{color:var(--cream);}
.rep-bar{height:6px;margin-top:7px;background:rgba(0,0,0,0.3);border-radius:3px;overflow:hidden;}
.rep-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--alert),var(--brass),var(--sage));border-radius:3px;}
.pause-btn{margin-left:auto;align-self:center;background:var(--panel-2);border:1px solid var(--line);
  color:var(--cream);border-radius:7px;padding:11px 18px;font-weight:700;font-size:13px;}
.pause-btn:hover{border-color:var(--brass);color:var(--brass);}

/* ---------- 5. Panels ---------- */
.panel{background:rgba(38,35,32,0.9);border:1px solid var(--line);border-radius:9px;
  padding:16px 18px;margin-bottom:14px;backdrop-filter:blur(2px);}
.panel h2{font-family:var(--disp);font-weight:800;font-size:20px;text-transform:uppercase;
  letter-spacing:0.5px;color:var(--cream);margin-bottom:3px;}
.panel h2 .accent{color:var(--brass);}
.panel .sub{font-size:12px;color:var(--muted);margin-bottom:14px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.metric{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:12px;}
.metric .k{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.metric .v{font-family:var(--disp);font-weight:800;font-size:24px;margin-top:4px;}
.metric .v small{font-size:13px;color:var(--muted);font-family:var(--mono);font-weight:400;}

/* menu list (dishes) */
.dish-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
.dish-row:last-child{border-bottom:none;}
.dish-row img{width:46px;height:46px;flex:0 0 auto;border-radius:8px;}
.dish-row .dn{font-weight:700;font-size:14px;}
.dish-row .dd{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px;}
.dish-row .dp{margin-left:auto;text-align:right;}
.dish-row .dp .price{font-family:var(--disp);font-weight:800;font-size:20px;color:var(--sage);}
.dish-row .dp .rep{font-family:var(--mono);font-size:10px;color:var(--brass);}

/* event log */
.log{font-family:var(--mono);font-size:11px;max-height:150px;overflow:auto;}
.log div{padding:3px 0;border-bottom:1px dashed var(--line);color:var(--muted);}
.log .good{color:var(--sage);}
.log .bad{color:var(--alert);}

/* coming-soon stub */
.stub{text-align:center;padding:48px 20px;color:var(--muted);}
.stub .big{font-family:var(--disp);font-weight:800;font-size:40px;color:var(--brass-dim);text-transform:uppercase;letter-spacing:2px;}
.stub p{font-size:13px;margin-top:8px;}

/* ---------- 6. Overlays ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:rgba(15,13,11,0.86);backdrop-filter:blur(4px);}
.overlay .card{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--brass);
  border-radius:12px;padding:30px 34px;width:min(440px,92vw);box-shadow:0 24px 60px rgba(0,0,0,0.6);}
.menu-logo{font-family:var(--disp);font-weight:900;font-size:54px;line-height:0.9;text-transform:uppercase;letter-spacing:1px;text-align:center;}
.menu-logo em{color:var(--brass);font-style:normal;}
.menu-tag{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;margin:6px 0 26px;letter-spacing:2px;}
.menu-btn{display:block;width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--cream);
  border-radius:8px;padding:14px;font-size:15px;font-weight:700;margin-bottom:10px;transition:all .12s;}
.menu-btn:hover:not(:disabled){border-color:var(--brass);color:var(--brass);transform:translateY(-1px);}
.menu-btn.primary{background:var(--brass);color:#1c1a18;border-color:var(--brass);}
.menu-btn.primary:hover{background:#d6a052;}
.menu-btn:disabled{opacity:0.4;cursor:not-allowed;}
.overlay h3{font-family:var(--disp);font-weight:800;font-size:30px;text-transform:uppercase;text-align:center;margin-bottom:18px;}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;}
.set-row:last-of-type{border-bottom:none;}
.toggle{width:48px;height:26px;border-radius:13px;background:var(--line);border:none;position:relative;transition:background .15s;}
.toggle.on{background:var(--sage);}
.toggle i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--cream);transition:left .15s;}
.toggle.on i{left:25px;}
.back-link{display:block;text-align:center;margin-top:18px;color:var(--muted);font-size:12px;background:none;border:none;width:100%;}
.back-link:hover{color:var(--brass);}

/* ---------- 7. Toasts ---------- */
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
.toast{background:rgba(20,18,16,0.95);border:1px solid var(--line);border-left:3px solid var(--brass);
  border-radius:6px;padding:9px 16px;font-family:var(--mono);font-size:12px;color:var(--cream);
  box-shadow:0 8px 20px rgba(0,0,0,0.5);animation:toastIn .25s ease, toastOut .3s ease 2.1s forwards;}
.toast.good{border-left-color:var(--sage);}
.toast.bad{border-left-color:var(--alert);}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-8px)}}

/* ---------- 8. Responsive (mobile = secondary) ---------- */
@media (max-width:760px){
  #game{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;
    grid-template-areas:"rail" "side" "main";}
  #side{flex-direction:row;flex-wrap:wrap;align-items:center;}
  .brand{flex:1 1 100%;}
  nav{display:flex;flex:1 1 100%;overflow-x:auto;padding:6px;}
  .nav-item{border-left:none;border-bottom:3px solid transparent;white-space:nowrap;padding:9px 12px;}
  .nav-item.active{border-left:none;border-bottom-color:var(--brass);}
  .nav-item .soon{display:none;}
  .side-foot{flex:1 1 100%;}
  .grid-2{grid-template-columns:1fr;}
  .menu-logo{font-size:40px;}
}

/* staff panel */
.staff-card{display:flex;align-items:center;gap:12px;padding:12px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:8px;margin-bottom:10px;}
.staff-card .s-icon{font-size:28px;flex:0 0 auto;}
.staff-card .s-info{flex:1;}
.staff-card .s-name{font-weight:700;font-size:14px;}
.staff-card .s-role{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px;}
.staff-card .s-effect{font-family:var(--mono);font-size:10px;color:var(--sage);margin-top:2px;}
.staff-card .s-cost{font-family:var(--mono);font-size:10px;color:var(--brass-dim);}
.hire-btn{background:var(--brass);color:#1c1a18;border:none;border-radius:6px;padding:8px 16px;
  font-weight:700;font-size:12px;cursor:pointer;transition:background .12s;}
.hire-btn:hover{background:#d6a052;}
.hire-btn:disabled{opacity:0.4;cursor:not-allowed;background:var(--brass-dim);}

/* finance panel */
.fin-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:12px;}
.fin-row:last-child{border-bottom:none;}
.fin-row .pos{color:var(--sage);}
.fin-row .neg{color:var(--alert);}

/* community milestones */
.ms-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
.ms-row:last-child{border-bottom:none;}
.ms-row .ms-icon{font-size:18px;width:24px;text-align:center;}
.ms-row .ms-name{font-weight:700;}
.ms-row .ms-req{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto;}
.ms-row.achieved .ms-name{color:var(--sage);}
.ms-row.current{border-left:3px solid var(--brass);padding-left:8px;background:rgba(192,138,62,0.06);border-radius:4px;}

/* reduce-motion: honor the Settings toggle */
body.reduce-motion *,body.reduce-motion *::before,body.reduce-motion *::after{
  animation-duration:0.001s !important;transition-duration:0.001s !important;}

.stat.streak .v{color:var(--brass);}
.stat.streak.hot .v{color:var(--sage);text-shadow:0 0 10px rgba(107,142,90,0.5);}
.run-stats{font-family:var(--mono);font-size:13px;color:var(--cream);margin:6px 0 22px;}
.run-stats div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);}
.run-stats div:last-child{border-bottom:none;}
.run-stats b{color:var(--brass);}
</style>
</head>
<body>

<!-- ============ BACKDROP (atmospheric, behind everything) ============ -->
<div id="backdrop"></div>

<!-- ============ MAIN MENU ============ -->
<div id="main-menu" class="overlay">
  <div class="card">
    <div class="menu-logo">Plate<br><em>Empire</em></div>
    <div class="menu-tag">FOOD-TRUCK TIER · v1</div>
    <button class="menu-btn primary" id="btn-new">New Game</button>
    <button class="menu-btn" id="btn-continue"><span id="cont-label">Continue</span></button>
    <button class="menu-btn" id="btn-settings">Settings</button>
  </div>
</div>

<!-- ============ SETTINGS ============ -->
<div id="settings" class="overlay hidden">
  <div class="card">
    <h3>Settings</h3>
    <div class="set-row"><span>Sound effects</span><button class="toggle on" data-set="sfx"><i></i></button></div>
    <div class="set-row"><span>Reduce motion</span><button class="toggle" data-set="reduceMotion"><i></i></button></div>
    <div class="set-row"><span>Ticket pace</span>
      <select id="set-pace" style="background:var(--panel-2);color:var(--cream);border:1px solid var(--line);border-radius:5px;padding:6px 8px;font-family:var(--mono);font-size:12px;">
        <option value="relaxed">Relaxed</option>
        <option value="normal" selected>Normal</option>
        <option value="rush">Rush</option>
      </select>
    </div>
    <button class="back-link" id="settings-back">← Back</button>
  </div>
</div>

<!-- ============ GAME ============ -->
<div id="game" class="hidden">

  <!-- order-ticket rail -->
  <div id="rail">
    <div class="rail-label"><b>Orders</b><span id="rail-count">0 active</span></div>
    <div id="rail-track"><div class="rail-empty" id="rail-empty">Waiting for customers…</div></div>
  </div>

  <!-- sidebar -->
  <aside id="side">
    <div class="brand">
      <h1>Plate<em> Empire</em></h1>
      <div class="tier">▸ El Paso Food Truck</div>
    </div>
    <nav id="nav">
      <button class="nav-item active" data-view="overview"><span class="ic">▦</span>Overview</button>
      <button class="nav-item" data-view="menu"><span class="ic">🍽</span>Menu</button>
      <button class="nav-item" data-view="staff"><span class="ic">👤</span>Staff</button>
      <button class="nav-item" data-view="finance"><span class="ic">$</span>Finance</button>
      <button class="nav-item" data-view="community"><span class="ic">♥</span>Community</button>
    </nav>
    <div class="side-foot">
      <button id="btn-save">Save</button>
      <button id="btn-pause-side">Pause</button>
      <button id="btn-main-menu">Menu</button>
    </div>
  </aside>

  <!-- main column -->
  <main id="main">
    <div id="hud">
      <div class="stat cash"><div class="k">Cash</div><div class="v" id="hud-cash">$0</div></div>
      <div class="stat rep"><div class="k">Reputation</div><div class="v" id="hud-rep">0</div>
        <div class="rep-bar"><i id="hud-rep-bar" style="width:0%"></i></div></div>
      <div class="stat day"><div class="k">Day</div><div class="v" id="hud-day">1</div></div>
      <div class="stat streak"><div class="k">Streak</div><div class="v" id="hud-streak">0</div></div>
      <button class="pause-btn" id="btn-pause">⏸ Pause</button>
    </div>
    <div id="view"><!-- active view rendered here --></div>
  </main>
</div>

<!-- ============ PAUSE ============ -->
<div id="pause" class="overlay hidden">
  <div class="card">
    <h3>Paused</h3>
    <button class="menu-btn primary" id="pause-resume">Resume</button>
    <button class="menu-btn" id="pause-save">Save Game</button>
    <button class="menu-btn" id="pause-menu">Main Menu</button>
  </div>
</div>

<!-- ============ DAY SUMMARY ============ -->
<div id="day-summary" class="overlay hidden">
  <div class="card">
    <h3 id="ds-title">Day Complete</h3>
    <div class="run-stats" id="ds-stats"></div>
    <button class="menu-btn primary" id="ds-continue">Start Next Day</button>
  </div>
</div>

<!-- ============ GAME OVER ============ -->
<div id="game-over" class="overlay hidden">
  <div class="card">
    <h3>Game Over</h3>
    <p style="text-align:center;color:var(--muted);margin-bottom:18px;">Your reputation hit zero. The health inspector shut you down.</p>
    <div class="run-stats" id="go-stats"></div>
    <button class="menu-btn primary" id="go-new">Try Again</button>
    <button class="menu-btn" id="go-menu">Main Menu</button>
  </div>
</div>

<div id="toasts"></div>

<script>
/* =================================================================
   PLATE EMPIRE — game logic
   Sections:
     A. Config / constants     B. State + persistence
     C. Boot / menu flow        D. Views (render)
     E. Ticket system           F. Economy + day cycle
     G. Game loop               H. Pause / settings / toasts
     I. Wiring
   ================================================================= */

/* ---------- A. Config / constants ---------- */
const SAVE_KEY = 'plate-empire-save-v1';
const AUTOSAVE_MS = 30000;

/* Hardcoded food-truck menu (3-5 dishes for v1). */
const DISHES = [
  { id:'burger',  name:'Green Chile Burger', icon:'assets/dish-green-chile-burger.png',  price:9,  rep:2, life:12000 },
  { id:'tacos',   name:'Street Tacos',        icon:'assets/dish-street-tacos.png',        price:7,  rep:2, life:11000 },
  { id:'fries',   name:'Loaded Fries',        icon:'assets/dish-loaded-fries.png',        price:6,  rep:1, life:10000 },
  { id:'burrito', name:'Carne Asada Burrito', icon:'assets/dish-carne-asada-burrito.png', price:10, rep:3, life:13000 },
  { id:'elote',   name:'Elote',               icon:'assets/dish-elote.png',               price:5,  rep:1, life:9000  },
];
const dishById = id => DISHES.find(d => d.id === id);

/* Ticket pacing presets (ms between spawns). */
const PACE = { relaxed:5200, normal:3600, rush:2400 };

const MISS_REP = -3;          // reputation lost on an expired ticket
const DAY_LENGTH_MS = 90000;  // length of one service day
const RAIL_SLOT = 152;        // px horizontal spacing per ticket

/* ---------- B. State + persistence ---------- */
const STAFF_DEFS = [
  { id:'cook2', name:'Maria', role:'Assistant Cook', icon:'👩‍🍳', cost:100, salary:5, effect:'+2s ticket time', ticketBonus:2000 },
  { id:'cook3', name:'Carlos', role:'Line Cook',     icon:'👨‍🍳', cost:200, salary:8, effect:'+1 rail capacity', railBonus:2 },
];
const REP_MILESTONES = [
  { rep:0,  name:'Unknown',           icon:'❓' },
  { rep:20, name:'Local Spot',        icon:'📍' },
  { rep:40, name:'Neighborhood Fave', icon:'⭐' },
  { rep:60, name:'City Buzz',         icon:'🔥' },
  { rep:80, name:'Legendary',         icon:'👑' },
];

const defaultState = () => ({
  cash: 50,
  rep: 70,
  day: 1,
  served: 0,
  missed: 0,
  dayMsLeft: DAY_LENGTH_MS,
  log: [],
  settings: { sfx:true, reduceMotion:false, pace:'normal' },
  staff: [],
  finances: { totalEarnings:0, totalTips:0, totalBonuses:0, staffCost:0, history:[] },
  bestDay: { served:0, earnings:0, tips:0, streak:0 },
});

let S = defaultState();      // persisted game state
let view = 'overview';       // active sidebar view
let running = false;         // is a game session active (vs menu)
let paused = false;          // is the pause overlay up

/* live (non-persisted) runtime */
const RT = { tickets:[], nextId:1, spawnAcc:0, lastT:0, raf:0, autosaveTimer:0,
  streak:0, bestStreak:0, dayServed:0, dayMissed:0, dayEarnings:0, dayTips:0 };

function save(reason){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({ ...S, _ts:Date.now() }));
    if(reason) toast('Game saved', 'good');
    return true;
  }catch(e){
    console.error('save failed', e);
    if(reason) toast('Save failed — storage blocked', 'bad');
    return false;
  }
}
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const data = JSON.parse(raw);
    if(typeof data.cash !== 'number') return null;
    return data;
  }catch(e){ console.error('load failed', e); return null; }
}
function hasSave(){ return !!loadSave(); }

/* ---------- C. Boot / menu flow ---------- */
function showMenu(){
  running = false; paused = false;
  cancelAnimationFrame(RT.raf);
  clearInterval(RT.autosaveTimer);
  el('#game').classList.add('hidden');
  el('#pause').classList.add('hidden');
  el('#settings').classList.add('hidden');
  el('#day-summary').classList.add('hidden');
  el('#main-menu').classList.remove('hidden');
  const sv = loadSave();
  el('#btn-continue').disabled = !sv;
  el('#cont-label').textContent = sv ? `Continue — Day ${sv.day} · $${sv.cash}` : 'Continue';
}

function newGame(){
  S = defaultState();
  startSession();
  save();
  pushLog('Opened for business. Day 1.', 'good');
}

function continueGame(){
  const data = loadSave();
  if(!data){ toast('No save found', 'bad'); return; }
  S = { ...defaultState(), ...data };
  startSession();
  pushLog('Resumed service.', '');
}

function startSession(){
  running = true; paused = false;
  RT.tickets = []; RT.nextId = 1; RT.spawnAcc = 0; RT.lastT = performance.now();
  el('#main-menu').classList.add('hidden');
  el('#settings').classList.add('hidden');
  el('#pause').classList.add('hidden');
  el('#game').classList.remove('hidden');
  el('#rail-track').querySelectorAll('.ticket').forEach(n=>n.remove());
  setView('overview');
  syncSettingsUI();
  document.body.classList.toggle('reduce-motion', !!S.settings.reduceMotion);
  renderHUD();
  startLoop();
  clearInterval(RT.autosaveTimer);
  RT.autosaveTimer = setInterval(()=>{ if(running) save(); }, AUTOSAVE_MS);
}

/* ---------- D. Views ---------- */
function setView(v){
  view = v;
  els('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  renderView();
}

function renderView(){
  const host = el('#view');
  if(view==='overview') host.innerHTML = tplOverview();
  else if(view==='menu') host.innerHTML = tplMenu();
  else if(view==='staff') host.innerHTML = tplStaff();
  else if(view==='finance') host.innerHTML = tplFinance();
  else if(view==='community') host.innerHTML = tplCommunity();
  if(view==='overview') renderLog();
  if(view==='staff') wireHire();
}

  return `
  <div class="panel">
    <h2>Service <span class="accent">Overview</span></h2>
    <div class="sub">Click tickets on the rail above before their timer runs out. Each fill pays out and nudges your reputation.</div>
    <div class="grid-2">
      <div class="metric"><div class="k">Orders served</div><div class="v" id="m-served">${S.served}</div></div>
      <div class="metric"><div class="k">Orders missed</div><div class="v" id="m-missed">${S.missed}</div></div>
      <div class="metric"><div class="k">Cash on hand</div><div class="v">$<span id="m-cash">${S.cash}</span></div></div>
      <div class="metric"><div class="k">Day timer</div><div class="v"><span id="m-day-timer">${Math.ceil(S.dayMsLeft/1000)}</span><small>s left</small></div></div>
      <div class="metric"><div class="k">Streak</div><div class="v" id="m-streak">${RT.streak}</div></div>
      <div class="metric"><div class="k">Tips today</div><div class="v">$<span id="m-tips">${RT.dayTips}</span></div></div>
    </div>
  </div>
  <div class="panel">
    <h2>Service <span class="accent">Log</span></h2>
    <div class="log" id="log"></div>

}

function tplMenu(){
  const rows = DISHES.map(d=>`
    <div class="dish-row">
      <img src="${d.icon}" alt="${d.name}">
      <div>
        <div class="dn">${d.name}</div>
        <div class="dd">timer ${Math.round(d.life/1000)}s</div>
      </div>
      <div class="dp"><div class="price">$${d.price}</div><div class="rep">+${d.rep} rep</div></div>
    </div>`).join('');
  return `
  <div class="panel">

    <div class="sub">Your hardcoded food-truck lineup for this tier. Tickets are drawn from these dishes.</div>
    ${rows}
  </div>`;
}

function tplStaff(){
  const you = `<div class="staff-card">
    <div class="s-icon">🧑‍🍳</div>
    <div class="s-info"><div class="s-name">You</div><div class="s-role">Head Cook · Owner</div>
    <div class="s-effect">Always on duty</div></div></div>`;
  const hires = STAFF_DEFS.map(s=>{
    const hired = S.staff.includes(s.id);
    if(hired) return `<div class="staff-card">
      <div class="s-icon">${s.icon}</div>
      <div class="s-info"><div class="s-name">${s.name}</div><div class="s-role">${s.role}</div>
      <div class="s-effect">${s.effect}</div><div class="s-cost">$${s.salary}/day salary</div></div></div>`;
    return `<div class="staff-card">
      <div class="s-icon" style="opacity:0.4">${s.icon}</div>
      <div class="s-info"><div class="s-name">${s.name}</div><div class="s-role">${s.role}</div>
      <div class="s-effect">${s.effect} · $${s.salary}/day</div></div>
      <button class="hire-btn" data-hire="${s.id}" ${S.cash<s.cost?'disabled':''}>Hire $${s.cost}</button></div>`;
  }).join('');
  return `<div class="panel">
    <h2>Truck <span class="accent">Staff</span></h2>
    <div class="sub">Your food-truck crew. Hire help to handle the rush.</div>
    ${you}${hires}

}

function tplFinance(){
  const f = S.finances;
  const net = f.totalEarnings + f.totalTips + f.totalBonuses - f.staffCost;
  const hist = (f.history||[]).slice(-10).reverse().map(h=>
    `<div class="fin-row"><span>Day ${h.day}</span><span class="pos">+$${h.earned}</span>
    <span class="pos">+$${h.tips} tips</span><span class="neg">-$${h.staff} staff</span></div>`
  ).join('') || '<div class="fin-row" style="color:var(--muted)">No history yet</div>';
  return `<div class="panel">
    <h2>Truck <span class="accent">Finance</span></h2>
    <div class="sub">Cash flow at a glance.</div>
    <div class="grid-2">
      <div class="metric"><div class="k">Total earnings</div><div class="v" style="color:var(--sage)">$${f.totalEarnings}</div></div>
      <div class="metric"><div class="k">Total tips</div><div class="v" style="color:var(--sage)">$${f.totalTips}</div></div>
      <div class="metric"><div class="k">Streak bonuses</div><div class="v" style="color:var(--brass)">$${f.totalBonuses}</div></div>
      <div class="metric"><div class="k">Staff costs</div><div class="v" style="color:var(--alert)">$${f.staffCost}</div></div>
    </div>
    <div style="margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--muted)">Net profit: <b style="color:var(--${net>=0?'sage':'alert'})">$${net}</b></div>
  </div>
  <div class="panel">
    <h2>Daily <span class="accent">History</span></h2>
    ${hist}
  </div>`;
}

function tplCommunity(){
  const curMs = REP_MILESTONES.slice().reverse().find(m=>S.rep>=m.rep) || REP_MILESTONES[0];
  const nextMs = REP_MILESTONES.find(m=>m.rep>S.rep);
  const rows = REP_MILESTONES.map(m=>{
    const achieved = S.rep >= m.rep;
    const current = m === curMs;
    return `<div class="ms-row ${achieved?'achieved':''} ${current?'current':''}">
      <div class="ms-icon">${achieved?'✓':m.icon}</div>
      <div class="ms-name">${m.name}</div>
      <div class="ms-req">${m.rep} rep</div></div>`;
  }).join('');
  const best = S.bestDay;
  return `<div class="panel">
    <h2>Community <span class="accent">Standing</span></h2>
    <div class="sub">Your reputation in the neighborhood.</div>
    <div class="grid-2">
      <div class="metric"><div class="k">Current standing</div><div class="v" style="font-size:18px">${curMs.icon} ${curMs.name}</div></div>
      <div class="metric"><div class="k">${nextMs?'Next milestone':'Max reached'}</div>
        <div class="v" style="font-size:18px">${nextMs?nextMs.icon+' '+nextMs.name+' ('+nextMs.rep+')':'👑 Legendary'}</div></div>
    </div>
  </div>
  <div class="panel">
    <h2><span class="accent">Milestones</span></h2>
    ${rows}
  </div>
  <div class="panel">
    <h2>Best <span class="accent">Day</span></h2>
    <div class="sub">Your personal records.</div>
    <div class="grid-2">
      <div class="metric"><div class="k">Most served</div><div class="v">${best.served}</div></div>
      <div class="metric"><div class="k">Best earnings</div><div class="v" style="color:var(--sage)">$${best.earnings}</div></div>
      <div class="metric"><div class="k">Best tips</div><div class="v" style="color:var(--sage)">$${best.tips}</div></div>
      <div class="metric"><div class="k">Longest streak</div><div class="v" style="color:var(--brass)">${best.streak}x</div></div>
    </div>
  </div>`;
}

/* ---------- E. Staff helpers ---------- */
function staffBonus(key){
  return (S.staff||[]).reduce((sum,id)=>{
    const def = STAFF_DEFS.find(s=>s.id===id);
    return sum + (def && def[key] ? def[key] : 0);
  }, 0);
}
function dailySalary(){
  return (S.staff||[]).reduce((sum,id)=>{
    const def = STAFF_DEFS.find(s=>s.id===id);
    return sum + (def ? def.salary : 0);
  }, 0);
}
function wireHire(){
  els('[data-hire]').forEach(b=>b.addEventListener('click', ()=>{
    const def = STAFF_DEFS.find(s=>s.id===b.dataset.hire);
    if(!def || S.cash < def.cost || S.staff.includes(def.id)) return;
    S.cash -= def.cost;
    S.staff.push(def.id);
    renderHUD();
    renderView();
    pushLog(`Hired ${def.name} (${def.role})`, 'good');
    toast(`${def.name} joined the crew!`, 'good');
    sfx('hire');
    save();
  }));
}

/* ---------- F. Ticket system ---------- */
function spawnTicket(){
  const maxCap = 6 + staffBonus('railBonus');
  if(RT.tickets.length >= maxCap) return;
  const dish = DISHES[Math.floor(Math.random()*DISHES.length)];
  const bonus = staffBonus('ticketBonus');
  const t = { id:RT.nextId++, dishId:dish.id, life:dish.life+bonus, left:dish.life+bonus };
  RT.tickets.push(t);
  const track = el('#rail-track');
  const node = document.createElement('div');
  node.className = 'ticket';
  node.dataset.id = t.id;
  node.style.left = '100%';
  node.innerHTML = `
    <div class="t-head">
      <img class="t-icon" src="${dish.icon}" alt="">
      <span class="t-name">${dish.name}</span>
      <span class="t-price">$${dish.price}</span>
    </div>
    <div class="t-bar-wrap"><div class="t-bar"></div></div>
    <div class="t-foot"><span>#${String(t.id).padStart(3,'0')}</span><span class="t-time">${Math.ceil(t.left/1000)}s</span></div>`;
  node.addEventListener('click', ()=>fulfill(t.id));
  track.appendChild(node);
  el('#rail-empty').style.display = 'none';
  layoutTickets();
}

function layoutTickets(){
  RT.tickets.forEach((t,i)=>{
    const node = ticketNode(t.id);
    if(node) node.style.left = (i*RAIL_SLOT + 12) + 'px';
  });
  el('#rail-count').textContent = RT.tickets.length + ' active';
  el('#rail-empty').style.display = RT.tickets.length ? 'none' : 'flex';
}

function ticketNode(id){ return el(`.ticket[data-id="${id}"]`); }

function fulfill(id){
  const idx = RT.tickets.findIndex(t=>t.id===id);
  if(idx<0) return;
  const t = RT.tickets[idx];
  const dish = dishById(t.dishId);
  const tipChance = S.rep / 100;
  const tip = Math.random() < tipChance ? Math.ceil(dish.price * 0.2) : 0;
  S.cash += dish.price + tip;
  S.rep = clamp(S.rep + dish.rep, 0, 100);
  S.served++;
  RT.streak++;
  if(RT.streak > RT.bestStreak) RT.bestStreak = RT.streak;
  RT.dayServed++;
  RT.dayEarnings += dish.price;
  RT.dayTips += tip;
  const node = ticketNode(id);
  if(node){ node.classList.add('fulfilled'); setTimeout(()=>node.remove(), 360); }
  RT.tickets.splice(idx,1);
  layoutTickets();
  renderHUD();
  let streakBonus = 0;
  if(RT.streak === 5){ streakBonus = 10; }
  else if(RT.streak === 10){ streakBonus = 25; }
  else if(RT.streak > 0 && RT.streak % 10 === 0){ streakBonus = 25; }
  if(streakBonus){ S.cash += streakBonus; RT.dayEarnings += streakBonus; }
  S.finances.totalEarnings += dish.price;
  S.finances.totalTips += tip;
  S.finances.totalBonuses += streakBonus;
  const tipMsg = tip ? ` · +$${tip} tip` : '';
  pushLog(`Served ${dish.name} · +$${dish.price}${tipMsg} · +${dish.rep} rep`, 'good');
  if(streakBonus) toast(`${RT.streak}x streak! +$${streakBonus} bonus!`, 'good');
  else if(RT.streak >= 3) toast(`${RT.streak}x streak!`, 'good');
  sfx('serve');
}

function expire(id){
  const idx = RT.tickets.findIndex(t=>t.id===id);
  if(idx<0) return;
  const t = RT.tickets[idx];
  const dish = dishById(t.dishId);
  S.rep = clamp(S.rep + MISS_REP, 0, 100);
  S.missed++;
  RT.streak = 0;
  RT.dayMissed++;
  const node = ticketNode(id);
  if(node){ node.classList.add('missed'); setTimeout(()=>node.remove(), 420); }
  RT.tickets.splice(idx,1);
  layoutTickets();
  renderHUD();
  pushLog(`Missed ${dish.name} · ${MISS_REP} rep`, 'bad');
  sfx('miss');
  if(S.rep <= 0) gameOver();
}

/* ---------- G. Economy + day cycle ---------- */
function endDay(){
  paused = true;
  const perfect = RT.dayMissed === 0 && RT.dayServed > 0;
  if(perfect){ S.rep = clamp(S.rep + 5, 0, 100); }
  const sal = dailySalary();
  S.cash -= sal;
  S.finances.staffCost += sal;
  if(!S.finances.history) S.finances.history = [];
  S.finances.history.push({ day:S.day, earned:RT.dayEarnings, tips:RT.dayTips, staff:sal });
  if(S.finances.history.length > 30) S.finances.history.shift();
  if(RT.dayServed > S.bestDay.served) S.bestDay.served = RT.dayServed;
  if(RT.dayEarnings > S.bestDay.earnings) S.bestDay.earnings = RT.dayEarnings;
  if(RT.dayTips > S.bestDay.tips) S.bestDay.tips = RT.dayTips;
  if(RT.bestStreak > S.bestDay.streak) S.bestDay.streak = RT.bestStreak;
  el('#ds-title').textContent = perfect ? `Day ${S.day} — Perfect Service!` : `Day ${S.day} Complete`;
  el('#ds-stats').innerHTML = `
    <div><span>Orders served</span><b>${RT.dayServed}</b></div>
    <div><span>Orders missed</span><b>${RT.dayMissed}</b></div>
    <div><span>Earnings</span><b>$${RT.dayEarnings}</b></div>
    <div><span>Tips earned</span><b>$${RT.dayTips}</b></div>
    ${sal?'<div><span>Staff salary</span><b style="color:var(--alert)">-$'+sal+'</b></div>':''}
    <div><span>Best streak</span><b>${RT.bestStreak}x</b></div>
    <div><span>Reputation</span><b>${S.rep}/100</b></div>
    ${perfect ? '<div><span>Perfect service bonus</span><b>+5 rep</b></div>' : ''}`;
  el('#day-summary').classList.remove('hidden');
  S.day++;
  S.dayMsLeft = DAY_LENGTH_MS;
  RT.dayServed = 0; RT.dayMissed = 0; RT.dayEarnings = 0; RT.dayTips = 0;
  RT.streak = 0; RT.bestStreak = 0;
  RT.tickets.forEach(t=>{ const n=ticketNode(t.id); if(n) n.remove(); });
  RT.tickets = [];
  layoutTickets();
  renderHUD();
  sfx('dayEnd');
  save();
}

function gameOver(){
  running = false;
  cancelAnimationFrame(RT.raf);
  clearInterval(RT.autosaveTimer);
  el('#go-stats').innerHTML = `
    <div><span>Days survived</span><b>${S.day}</b></div>
    <div><span>Total served</span><b>${S.served}</b></div>
    <div><span>Total missed</span><b>${S.missed}</b></div>
    <div><span>Final cash</span><b>$${S.cash}</b></div>`;
  el('#game-over').classList.remove('hidden');
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
}

/* ---------- G. Game loop ---------- */
function startLoop(){
  cancelAnimationFrame(RT.raf);
  RT.lastT = performance.now();
  const step = (now)=>{
    const dt = Math.min(now - RT.lastT, 250); // clamp big gaps (tab switch)
    RT.lastT = now;
    if(running && !paused){
      tick(dt);
    }
    RT.raf = requestAnimationFrame(step);
  };
  RT.raf = requestAnimationFrame(step);
}

function tick(dt){
  // spawn cadence — gets tighter as days progress, capped at rush pace
  RT.spawnAcc += dt;
  const base = PACE[S.settings.pace] || PACE.normal;
  const dayScale = Math.max(0.6, 1 - (S.day - 1) * 0.04);
  const interval = Math.max(PACE.rush, base * dayScale);
  if(RT.spawnAcc >= interval){ RT.spawnAcc = 0; spawnTicket(); }

  // ticket countdowns
  for(let i=RT.tickets.length-1;i>=0;i--){
    const t = RT.tickets[i];
    t.left -= dt;
    const node = ticketNode(t.id);
    if(node){
      const frac = Math.max(0, t.left/t.life);
      const bar = node.querySelector('.t-bar');
      if(bar) bar.style.width = (frac*100)+'%';
      node.classList.toggle('warn', frac<=0.5 && frac>0.25);
      node.classList.toggle('urgent', frac<=0.25);
      const tm = node.querySelector('.t-time');
      if(tm) tm.textContent = Math.ceil(Math.max(0,t.left)/1000)+'s';
    }
    if(t.left<=0) expire(t.id);
  }

  // day clock
  S.dayMsLeft -= dt;
  if(S.dayMsLeft<=0) endDay();
  if(view==='overview'){
    const dtv = el('#m-day-timer'); if(dtv) dtv.textContent = Math.ceil(Math.max(0,S.dayMsLeft)/1000);
  }
}

/* ---------- H. Pause / settings / toasts / render ---------- */
function renderHUD(){
  el('#hud-cash').textContent = '$'+S.cash;
  el('#hud-rep').textContent = S.rep;
  el('#hud-rep-bar').style.width = S.rep+'%';
  el('#hud-day').textContent = S.day;
  const repStat = el('.stat.rep');
  if(repStat) repStat.classList.toggle('danger', S.rep <= 20 && S.rep > 0);
  const streakEl = el('#hud-streak');
  if(streakEl){
    streakEl.textContent = RT.streak;
    streakEl.closest('.stat').classList.toggle('hot', RT.streak >= 3);
  }
  if(view==='overview'){
    setText('#m-served', S.served); setText('#m-missed', S.missed);
    setText('#m-cash', S.cash); setText('#m-streak', RT.streak);
    setText('#m-tips', RT.dayTips);
  }
}

function pushLog(msg, kind){
  S.log.unshift({ msg, kind, t:Date.now() });
  if(S.log.length>40) S.log.length = 40;
  renderLog();
}
function renderLog(){
  const box = el('#log'); if(!box) return;
  box.innerHTML = S.log.map(e=>`<div class="${e.kind||''}">${e.msg}</div>`).join('');
}

function openPause(){ if(!running) return; paused = true; el('#pause').classList.remove('hidden'); }
function closePause(){ paused = false; el('#pause').classList.add('hidden'); RT.lastT = performance.now(); }

function syncSettingsUI(){
  els('.toggle').forEach(t=>{
    const key = t.dataset.set;
    t.classList.toggle('on', !!S.settings[key]);
  });
  const pace = el('#set-pace'); if(pace) pace.value = S.settings.pace;
}

function toast(msg, kind){
  const box = el('#toasts');
  const n = document.createElement('div');
  n.className = 'toast '+(kind||'');
  n.textContent = msg;
  box.appendChild(n);
  setTimeout(()=>n.remove(), 2500);
}

/* ---------- SFX (Web Audio beeps) ---------- */
let audioCtx;
function sfx(name){
  if(!S.settings.sfx) return;
  if(!audioCtx) try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  g.gain.setValueAtTime(0.08, now);
  if(name==='serve'){
    o.type='sine'; o.frequency.setValueAtTime(660,now); o.frequency.setValueAtTime(880,now+0.06);
    g.gain.exponentialRampToValueAtTime(0.001,now+0.15); o.start(now); o.stop(now+0.15);
  } else if(name==='miss'){
    o.type='sawtooth'; o.frequency.setValueAtTime(220,now); o.frequency.setValueAtTime(140,now+0.15);
    g.gain.exponentialRampToValueAtTime(0.001,now+0.2); o.start(now); o.stop(now+0.2);
  } else if(name==='hire'){
    o.type='sine'; o.frequency.setValueAtTime(440,now); o.frequency.setValueAtTime(660,now+0.08); o.frequency.setValueAtTime(880,now+0.16);
    g.gain.exponentialRampToValueAtTime(0.001,now+0.25); o.start(now); o.stop(now+0.25);
  } else if(name==='dayEnd'){
    o.type='triangle'; o.frequency.setValueAtTime(523,now); o.frequency.setValueAtTime(659,now+0.12); o.frequency.setValueAtTime(784,now+0.24);
    g.gain.exponentialRampToValueAtTime(0.001,now+0.4); o.start(now); o.stop(now+0.4);
  } else { o.disconnect(); return; }
}

/* ---------- helpers ---------- */
function el(s){ return document.querySelector(s); }
function els(s){ return Array.from(document.querySelectorAll(s)); }
function setText(s,v){ const n=el(s); if(n) n.textContent=v; }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

/* ---------- I. Wiring ---------- */
function wire(){
  // main menu
  el('#btn-new').addEventListener('click', newGame);
  el('#btn-continue').addEventListener('click', continueGame);
  el('#btn-settings').addEventListener('click', ()=>{ el('#main-menu').classList.add('hidden'); el('#settings').classList.remove('hidden'); });
  // Settings is reachable from the main menu only in v1 → always return there.
  el('#settings-back').addEventListener('click', ()=>{
    el('#settings').classList.add('hidden');
    el('#main-menu').classList.remove('hidden');
  });

  // settings controls
  els('.toggle').forEach(t=>t.addEventListener('click', ()=>{
    const key = t.dataset.set;
    S.settings[key] = !S.settings[key];
    t.classList.toggle('on', S.settings[key]);
    if(key==='reduceMotion') document.body.classList.toggle('reduce-motion', S.settings.reduceMotion);
  }));
  el('#set-pace').addEventListener('change', e=>{ S.settings.pace = e.target.value; });

  // sidebar nav
  els('.nav-item').forEach(b=>b.addEventListener('click', ()=>setView(b.dataset.view)));

  // save + pause
  el('#btn-save').addEventListener('click', ()=>save(true));
  el('#btn-pause').addEventListener('click', openPause);
  el('#btn-pause-side').addEventListener('click', openPause);
  el('#pause-resume').addEventListener('click', closePause);
  el('#pause-save').addEventListener('click', ()=>save(true));
  el('#pause-menu').addEventListener('click', ()=>{ save(); showMenu(); });
  el('#btn-main-menu').addEventListener('click', ()=>{ save(); showMenu(); });

  // keyboard: Esc toggles pause during play
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape' && running){
      if(paused) closePause(); else openPause();
    }
  });

  // day summary continue
  el('#ds-continue').addEventListener('click', ()=>{
    el('#day-summary').classList.add('hidden');
    paused = false;
    RT.lastT = performance.now();
    pushLog(`Day ${S.day} — fresh service!`, 'good');
    toast(`Day ${S.day} — let's go!`, 'good');
  });

  // game over
  el('#go-new').addEventListener('click', ()=>{ el('#game-over').classList.add('hidden'); newGame(); });
  el('#go-menu').addEventListener('click', ()=>{ el('#game-over').classList.add('hidden'); showMenu(); });

  // save on tab hide
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden && running) save(); });

  showMenu();
}

document.addEventListener('DOMContentLoaded', wire);
</script>
