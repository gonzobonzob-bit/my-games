<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Veil Legends</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#05030f;--dark:#08050a;--border:#1a0f2a;--purple:#7c3aed;--gold:#d97706;--red:#dc2626;--blue:#2563eb;--green:#16a34a;--text:#e2d9f3;--muted:#6b5e8a;}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Nunito',sans-serif;color:var(--text);}
canvas{display:block;touch-action:none;}
#splash{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#14082a,#030108);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;gap:14px;padding:30px;text-align:center;}
.sp-icon{font-size:72px;filter:drop-shadow(0 0 30px #7c3aedaa);animation:heroFloat 2s ease-in-out infinite;}
@keyframes heroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.sp-title{font-family:'Cinzel',serif;font-size:32px;font-weight:900;color:#a78bfa;letter-spacing:2px;text-shadow:0 0 30px #7c3aed88;}
.sp-sub{font-size:11px;color:var(--muted);letter-spacing:3px;}
.hero-select{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0;}
.hero-card{background:rgba(124,58,237,0.1);border:1px solid rgba(124,58,237,0.3);border-radius:10px;padding:10px 14px;cursor:pointer;text-align:center;transition:all 0.2s;min-width:70px;}
.hero-card.selected{background:rgba(124,58,237,0.3);border-color:#7c3aed;box-shadow:0 0 12px rgba(124,58,237,0.4);}
.hero-icon{font-size:28px;display:block;margin-bottom:3px;}
.hero-name{font-size:9px;font-weight:700;color:#c4b5fd;text-transform:uppercase;letter-spacing:0.5px;}
.hero-stat{font-size:8px;color:var(--muted);margin-top:2px;}
.sp-btn{background:linear-gradient(135deg,#7c3aed,#a855f7);border:none;border-radius:14px;padding:14px 40px;font-family:'Cinzel',serif;font-size:18px;color:white;cursor:pointer;box-shadow:0 6px 24px rgba(124,58,237,0.5);}
#game-ui{position:fixed;inset:0;display:none;flex-direction:column;z-index:1;}
#game-ui.show{display:flex;}
#hud-top{background:rgba(5,3,15,0.95);border-bottom:1px solid var(--border);padding:5px 12px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.hero-hud{display:flex;align-items:center;gap:8px;}
.hud-icon{font-size:20px;}
.hud-bars{display:flex;flex-direction:column;gap:2px;}
.bar{height:5px;border-radius:3px;overflow:hidden;width:80px;background:rgba(255,255,255,0.1);}
.bar-fill{height:100%;border-radius:3px;transition:width 0.3s;}
.hp-fill{background:var(--green);}
.mp-fill{background:var(--blue);}
.hud-stat{font-size:9px;color:var(--muted);}
.wave-info{text-align:center;}
.wave-num{font-family:'Cinzel',serif;font-size:13px;color:var(--gold);}
.wave-sub{font-size:9px;color:var(--muted);}
.gold-display{font-family:'Cinzel',serif;font-size:14px;color:var(--gold);}
#canvas-wrap{flex:1;position:relative;overflow:hidden;}
#game-canvas{width:100%;height:100%;}
#hud-bottom{background:rgba(5,3,15,0.95);border-top:1px solid var(--border);padding:6px 10px;display:flex;gap:6px;align-items:center;flex-shrink:0;}
.ability-btn{flex:1;background:rgba(124,58,237,0.15);border:1px solid rgba(124,58,237,0.4);border-radius:10px;padding:7px 4px;text-align:center;cursor:pointer;transition:all 0.15s;position:relative;}
.ability-btn:active{transform:scale(0.93);}
.ability-btn.cooldown{opacity:0.5;cursor:default;}
.ab-icon{font-size:20px;display:block;}
.ab-name{font-size:7px;font-weight:700;color:#a78bfa;display:block;margin-top:1px;text-transform:uppercase;letter-spacing:0.3px;}
.ab-cd{font-size:7px;color:var(--muted);}
.cd-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.6);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:14px;color:white;pointer-events:none;}
.joystick-zone{position:absolute;bottom:15px;left:15px;width:90px;height:90px;background:rgba(124,58,237,0.1);border:1px solid rgba(124,58,237,0.2);border-radius:50%;}
.joystick-knob{position:absolute;width:36px;height:36px;background:rgba(124,58,237,0.6);border:2px solid #a78bfa;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;}
#gameover{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:200;gap:12px;}
#gameover.show{display:flex;}
.go-title{font-family:'Cinzel',serif;font-size:28px;color:var(--red);}
.go-score{font-family:'Cinzel',serif;font-size:16px;color:var(--gold);}
.go-btn{background:linear-gradient(135deg,#7c3aed,#a855f7);border:none;border-radius:12px;padding:12px 36px;font-family:'Cinzel',serif;font-size:16px;color:white;cursor:pointer;margin-top:6px;}
.float-dmg{position:absolute;pointer-events:none;font-family:'Cinzel',serif;font-size:13px;font-weight:700;animation:floatDmg 0.8s ease-out forwards;}
@keyframes floatDmg{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-50px)}}
#shop-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:300;gap:14px;padding:20px;}
#shop-modal.show{display:flex;}
.shop-title{font-family:'Cinzel',serif;font-size:22px;color:#fbbf24;letter-spacing:2px;}
.shop-gold{font-size:13px;color:var(--gold);}
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:320px;}
.shop-item{background:rgba(124,58,237,0.15);border:1px solid rgba(124,58,237,0.4);border-radius:12px;padding:12px;text-align:center;cursor:pointer;transition:all 0.15s;}
.shop-item:active{transform:scale(0.95);background:rgba(124,58,237,0.35);}
.shop-item-icon{font-size:28px;display:block;margin-bottom:4px;}
.shop-item-name{font-size:10px;font-weight:700;color:#c4b5fd;display:block;text-transform:uppercase;letter-spacing:0.5px;}
.shop-item-cost{font-family:'Cinzel',serif;font-size:13px;color:#fbbf24;margin-top:3px;}
.shop-close{background:transparent;border:1px solid rgba(124,58,237,0.5);border-radius:10px;padding:10px 30px;font-family:'Cinzel',serif;font-size:14px;color:#a78bfa;cursor:pointer;}
.menu-btn{background:rgba(124,58,237,0.2);border:1px solid rgba(124,58,237,0.4);border-radius:6px;padding:3px 8px;font-family:'Cinzel',serif;font-size:9px;color:#a78bfa;cursor:pointer;letter-spacing:0.5px;}
.menu-btn:active{background:rgba(124,58,237,0.4);}
.sp-btn.continue-btn{background:linear-gradient(135deg,#d97706,#f59e0b);margin-top:4px;}
</style>
</head>
<body>
<div id="splash">
  <div class="sp-icon">⚔️</div>
  <div class="sp-title">VEIL LEGENDS</div>
  <div class="sp-sub">CHOOSE YOUR CHAMPION</div>
  <div class="hero-select" id="hero-select"></div>
  <button class="sp-btn" onclick="startBattle()">ENTER THE VEIL</button>
  <button class="sp-btn continue-btn" id="continue-btn" style="display:none;" onclick="continueSave()">CONTINUE</button>
</div>

<div id="game-ui">
  <div id="hud-top">
    <div class="hero-hud">
      <div class="hud-icon" id="hud-hero-icon">⚔️</div>
      <div class="hud-bars">
        <div class="bar"><div class="bar-fill hp-fill" id="hp-bar" style="width:100%"></div></div>
        <div class="bar"><div class="bar-fill mp-fill" id="mp-bar" style="width:100%"></div></div>
      </div>
      <div class="hud-stat">LV<span id="hud-lv">1</span></div>
    </div>
    <div class="wave-info">
      <div class="wave-num">WAVE <span id="wave-num">1</span></div>
      <div class="wave-sub"><span id="enemies-left">0</span> enemies</div>
    </div>
    <div class="gold-display">⚡<span id="gold-display">0</span></div>
    <button class="menu-btn" onclick="backToMenu()">MENU</button>
  </div>
  <div id="canvas-wrap">
    <canvas id="game-canvas"></canvas>
    <div class="joystick-zone" id="joystick-zone">
      <div class="joystick-knob" id="joystick-knob"></div>
    </div>
  </div>
  <div id="hud-bottom">
    <div class="ability-btn" id="ab-0" onclick="useAbility(0)">
      <span class="ab-icon" id="ab-icon-0">⚔️</span>
      <span class="ab-name" id="ab-name-0">Strike</span>
      <span class="ab-cd" id="ab-cd-0">Ready</span>
    </div>
    <div class="ability-btn" id="ab-1" onclick="useAbility(1)">
      <span class="ab-icon" id="ab-icon-1">🌀</span>
      <span class="ab-name" id="ab-name-1">Spin</span>
      <span class="ab-cd" id="ab-cd-1">Ready</span>
    </div>
    <div class="ability-btn" id="ab-2" onclick="useAbility(2)">
      <span class="ab-icon" id="ab-icon-2">💫</span>
      <span class="ab-name" id="ab-name-2">Ultimate</span>
      <span class="ab-cd" id="ab-cd-2">Ready</span>
    </div>
    <div class="ability-btn" id="ab-3" onclick="useAbility(3)" style="background:rgba(212,119,6,0.15);border-color:rgba(212,119,6,0.4);">
      <span class="ab-icon">🏪</span>
      <span class="ab-name" style="color:#fbbf24;">Shop</span>
      <span class="ab-cd" id="gold-shop">0G</span>
    </div>
  </div>
</div>

<div id="gameover">
  <div class="go-title" id="go-title">DEFEATED</div>
  <div class="go-score" id="go-score"></div>
  <button class="go-btn" onclick="restartGame()">PLAY AGAIN</button>
  <button class="go-btn" style="background:transparent;border:1px solid #7c3aed;margin-top:4px;" onclick="goSplash()">Change Hero</button>
</div>

<div id="shop-modal">
  <div class="shop-title">🏪 SHOP</div>
  <div class="shop-gold">Gold: <span id="shop-gold-display">0</span>G</div>
  <div class="shop-grid" id="shop-grid"></div>
  <button class="shop-close" onclick="closeShop()">CLOSE</button>
</div>

<script>
const HEROES=[
  {id:'warrior',name:'Warrior',icon:'⚔️',hp:1200,mp:400,atk:80,spd:2.5,color:'#ef4444',
    abilities:[
      {name:'Power Strike',icon:'⚔️',damage:120,range:60,cd:0,maxCd:0,mpCost:0,aoe:false},
      {name:'Whirlwind',icon:'🌀',damage:80,range:80,cd:0,maxCd:3,mpCost:30,aoe:true},
      {name:'BERSERKER',icon:'💢',damage:300,range:100,cd:0,maxCd:12,mpCost:80,aoe:true},
    ]},
  {id:'mage',name:'Mage',icon:'🔮',hp:700,mp:1000,atk:40,spd:2.2,color:'#8b5cf6',
    abilities:[
      {name:'Fireball',icon:'🔥',damage:150,range:180,cd:0,maxCd:1,mpCost:20,aoe:false},
      {name:'Blizzard',icon:'❄️',damage:100,range:120,cd:0,maxCd:5,mpCost:50,aoe:true},
      {name:'METEOR',icon:'☄️',damage:500,range:150,cd:0,maxCd:15,mpCost:150,aoe:true},
    ]},
  {id:'assassin',name:'Assassin',icon:'🗡️',hp:850,mp:600,atk:60,spd:3.5,color:'#10b981',
    abilities:[
      {name:'Quick Strike',icon:'🗡️',damage:200,range:50,cd:0,maxCd:0.5,mpCost:10,aoe:false},
      {name:'Shadow Dash',icon:'💨',damage:150,range:200,cd:0,maxCd:4,mpCost:30,aoe:false},
      {name:'DEATH MARK',icon:'💀',damage:800,range:80,cd:0,maxCd:20,mpCost:100,aoe:false},
    ]},
  {id:'ranger',name:'Ranger',icon:'🏹',hp:900,mp:700,atk:70,spd:2.8,color:'#f59e0b',
    abilities:[
      {name:'Arrow',icon:'🏹',damage:100,range:250,cd:0,maxCd:0.5,mpCost:5,aoe:false},
      {name:'Rain of Arrows',icon:'🌧️',damage:60,range:200,cd:0,maxCd:6,mpCost:40,aoe:true},
      {name:'SNIPER',icon:'🎯',damage:600,range:400,cd:0,maxCd:18,mpCost:120,aoe:false},
    ]},
];

const MAX_WAVE=10;
const SHOP_ITEMS=[
  {name:'Health Potion',icon:'❤️',cost:30,effect:()=>player.hp=Math.min(player.maxHp,player.hp+200)},
  {name:'Mana Crystal',icon:'💎',cost:25,effect:()=>player.mp=Math.min(player.maxMp,player.mp+150)},
  {name:'Attack Boost',icon:'⚔️',cost:50,effect:()=>player.atk+=20},
  {name:'Speed Boost',icon:'💨',cost:40,effect:()=>player.spd+=0.5},
];

function lightenColor(hex, amount) {
  const r = Math.min(255, parseInt(hex.slice(1,3),16) + amount);
  const g = Math.min(255, parseInt(hex.slice(3,5),16) + amount);
  const b = Math.min(255, parseInt(hex.slice(5,7),16) + amount);
  return `rgb(${r},${g},${b})`;
}

let _audioCtx;
function sfx(name){
  if(!_audioCtx) try{_audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  const o=_audioCtx.createOscillator(),g=_audioCtx.createGain();
  o.connect(g);g.connect(_audioCtx.destination);
  const now=_audioCtx.currentTime; g.gain.setValueAtTime(0.06,now);
  if(name==='attack'){o.type='square';o.frequency.setValueAtTime(200,now);o.frequency.setValueAtTime(120,now+0.04);g.gain.exponentialRampToValueAtTime(0.001,now+0.07);o.start(now);o.stop(now+0.07);}
  else if(name==='ability'){o.type='sine';o.frequency.setValueAtTime(440,now);o.frequency.setValueAtTime(880,now+0.08);g.gain.exponentialRampToValueAtTime(0.001,now+0.15);o.start(now);o.stop(now+0.15);}
  else if(name==='kill'){o.type='sine';o.frequency.setValueAtTime(523,now);o.frequency.setValueAtTime(784,now+0.06);g.gain.exponentialRampToValueAtTime(0.001,now+0.1);o.start(now);o.stop(now+0.1);}
  else if(name==='levelup'){o.type='sine';o.frequency.setValueAtTime(523,now);o.frequency.setValueAtTime(659,now+0.1);o.frequency.setValueAtTime(784,now+0.2);o.frequency.setValueAtTime(1047,now+0.3);g.gain.exponentialRampToValueAtTime(0.001,now+0.4);o.start(now);o.stop(now+0.4);}
  else if(name==='hit'){o.type='sawtooth';o.frequency.setValueAtTime(150,now);g.gain.setValueAtTime(0.04,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.05);o.start(now);o.stop(now+0.05);}
  else if(name==='buy'){o.type='sine';o.frequency.setValueAtTime(440,now);o.frequency.setValueAtTime(660,now+0.06);g.gain.exponentialRampToValueAtTime(0.001,now+0.12);o.start(now);o.stop(now+0.12);}
  else{o.disconnect();}
}

let heroData=null,player=null,enemies=[],projectiles=[],particles=[];
let wave=1,gold=0,kills=0,frame=0;
let canvas,ctx,W,H;
let joystickActive=false,joyX=0,joyY=0;
const keys={};
window.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Digit1') useAbility(0);
  else if(e.code==='Digit2') useAbility(1);
  else if(e.code==='Digit3') useAbility(2);
  else if(e.code==='Digit4'||e.code==='KeyB') openShop();
  else if(e.code==='Escape'&&document.getElementById('shop-modal').classList.contains('show')) closeShop();
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
let abilities=[];

function goSplash(){
  stopAutosave();
  document.getElementById('game-ui').classList.remove('show');
  document.getElementById('gameover').classList.remove('show');
  document.getElementById('splash').style.display='flex';
  checkContinueButton();
}

function initHeroSelect(){
  const el=document.getElementById('hero-select');
  el.innerHTML=HEROES.map((h,i)=>`
    <div class="hero-card ${i===0?'selected':''}" id="hcard-${h.id}" onclick="selectHero('${h.id}')">
      <span class="hero-icon">${h.icon}</span>
      <span class="hero-name">${h.name}</span>
      <span class="hero-stat">HP:${h.hp} | ATK:${h.atk}</span>
    </div>`).join('');
  heroData=HEROES[0];
}

function selectHero(id){
  heroData=HEROES.find(h=>h.id===id);
  document.querySelectorAll('.hero-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('hcard-'+id).classList.add('selected');
}

function startBattle(){
  deleteSave();
  document.getElementById('splash').style.display='none';
  document.getElementById('game-ui').classList.add('show');
  initCanvas();
  initPlayer();
  enemies=[];projectiles=[];particles=[];wave=1;gold=0;kills=0;frame=0;
  abilities=heroData.abilities.map(a=>({...a,cd:0}));
  spawnWave();
  setupJoystick();
  updateAbilityUI();
  startAutosave();
  requestAnimationFrame(gameLoop);
}

function initCanvas(){
  canvas=document.getElementById('game-canvas');
  const wrap=document.getElementById('canvas-wrap');
  W=canvas.width=wrap.offsetWidth;
  H=canvas.height=wrap.offsetHeight;
  ctx=canvas.getContext('2d');
}

function initPlayer(){
  player={
    x:W/2,y:H/2,
    hp:heroData.hp,maxHp:heroData.hp,
    mp:heroData.mp,maxMp:heroData.mp,
    atk:heroData.atk,spd:heroData.spd,
    lv:1,xp:0,xpMax:100,
    icon:heroData.icon,color:heroData.color,
    vx:0,vy:0,
    invulnerable:0
  };
}

const ENEMY_TYPES=[
  {name:'Minion',icon:'👺',hp:80,atk:10,spd:1.2,xp:10,gold:5,color:'#dc2626',size:18},
  {name:'Brute',icon:'🗿',hp:300,atk:25,spd:0.7,xp:30,gold:15,color:'#7c3aed',size:26},
  {name:'Mage',icon:'🧙',hp:150,atk:20,spd:1.0,xp:20,gold:12,color:'#2563eb',size:20},
  {name:'Boss',icon:'👹',hp:1000,atk:50,spd:0.8,xp:100,gold:50,color:'#d97706',size:36},
];

function spawnWave(){
  enemies=[];
  const count=5+wave*3;
  for(let i=0;i<count;i++){
    const isBoss=wave%5===0&&i===0;
    const t=isBoss?ENEMY_TYPES[3]:ENEMY_TYPES[Math.floor(Math.random()*(wave>3?3:2))];
    const side=Math.floor(Math.random()*4);
    let ex,ey;
    if(side===0){ex=Math.random()*W;ey=-30;}
    else if(side===1){ex=W+30;ey=Math.random()*H;}
    else if(side===2){ex=Math.random()*W;ey=H+30;}
    else{ex=-30;ey=Math.random()*H;}
    enemies.push({
      x:ex,y:ey,
      hp:t.hp*(1+wave*0.2),maxHp:t.hp*(1+wave*0.2),
      atk:t.atk*(1+wave*0.1),spd:t.spd,
      xp:t.xp,gold:t.gold,color:t.color,
      icon:t.icon,size:t.size,
      cooldown:0,id:Math.random()
    });
  }
  document.getElementById('wave-num').textContent=wave;
  document.getElementById('enemies-left').textContent=enemies.length;
}

function setupJoystick(){
  const zone=document.getElementById('joystick-zone');
  const knob=document.getElementById('joystick-knob');
  const zRect=()=>zone.getBoundingClientRect();
  function startJoy(e){
    e.preventDefault();
    joystickActive=true;
    moveJoy(e);
  }
  function moveJoy(e){
    if(!joystickActive)return;
    e.preventDefault();
    const r=zRect();
    const cx=r.left+r.width/2,cy=r.top+r.height/2;
    const touch=e.touches?e.touches[0]:e;
    const dx=touch.clientX-cx,dy=touch.clientY-cy;
    const dist=Math.min(35,Math.sqrt(dx*dx+dy*dy));
    const ang=Math.atan2(dy,dx);
    joyX=Math.cos(ang)*dist/35;
    joyY=Math.sin(ang)*dist/35;
    knob.style.transform=`translate(calc(-50% + ${Math.cos(ang)*dist}px), calc(-50% + ${Math.sin(ang)*dist}px))`;
  }
  function endJoy(){
    joystickActive=false;joyX=0;joyY=0;
    knob.style.transform='translate(-50%,-50%)';
  }
  zone.addEventListener('touchstart',startJoy,{passive:false});
  zone.addEventListener('touchmove',moveJoy,{passive:false});
  zone.addEventListener('touchend',endJoy);
  zone.addEventListener('mousedown',startJoy);
  document.addEventListener('mousemove',moveJoy);
  document.addEventListener('mouseup',endJoy);
}

function useAbility(idx){
  if(idx===3){openShop();return;}
  if(!abilities[idx])return;
  const a=abilities[idx];
  if(a.cd>0){return;}
  if(player.mp<a.mpCost){spawnDmgFloat(player.x,player.y,'No MP!','#60a5fa');return;}
  player.mp-=a.mpCost;
  a.cd=a.maxCd;
  sfx('ability');
  if(a.aoe){
    // Hit all in range
    enemies.forEach(e=>{
      const dx=e.x-player.x,dy=e.y-player.y;
      if(Math.sqrt(dx*dx+dy*dy)<a.range){
        dealDamage(e,a.damage+player.atk);
      }
    });
    spawnAoeEffect(player.x,player.y,a.range,a.icon==='❄️'?'#bfdbfe':a.icon==='☄️'?'#fca5a5':'#c4b5fd');
  } else {
    // Target nearest enemy
    const near=nearestEnemy();
    if(near){
      const dx=near.x-player.x,dy=near.y-player.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<=a.range+50){dealDamage(near,a.damage+player.atk);}
      else{
        // Projectile
        const spd=8,ang=Math.atan2(dy,dx);
        projectiles.push({x:player.x,y:player.y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,dmg:a.damage+player.atk,owner:'player',col:player.color,r:6,target:near.id});
      }
    }
  }
  updateAbilityUI();
}

function openShop(){
  document.getElementById('shop-gold-display').textContent=gold;
  const grid=document.getElementById('shop-grid');
  grid.innerHTML=SHOP_ITEMS.map((it,i)=>`
    <div class="shop-item" onclick="buyShopItem(${i})">
      <span class="shop-item-icon">${it.icon}</span>
      <span class="shop-item-name">${it.name}</span>
      <div class="shop-item-cost">${it.cost}G</div>
    </div>`).join('');
  document.getElementById('shop-modal').classList.add('show');
}

function buyShopItem(idx){
  const it=SHOP_ITEMS[idx];
  if(gold>=it.cost){
    gold-=it.cost;
    it.effect();
    sfx('buy');
    spawnDmgFloat(player.x,player.y,it.icon,'#fbbf24');
    document.getElementById('shop-gold-display').textContent=gold;
  } else {
    spawnDmgFloat(player.x,player.y,'Need more gold!','#f59e0b');
  }
}

let wavePaused=false;
function showWaveShop(){
  wavePaused=true;
  openShop();
}
function closeShop(){
  document.getElementById('shop-modal').classList.remove('show');
  if(wavePaused){
    wavePaused=false;
    spawnWave();
  }
}

function dealDamage(enemy,dmg){
  const actual=Math.floor(dmg*(0.8+Math.random()*0.4));
  enemy.hp-=actual;
  spawnDmgFloat(enemy.x,enemy.y-enemy.size,'-'+actual,'#fca5a5');
  if(enemy.hp<=0)killEnemy(enemy);
}

function killEnemy(e){
  enemies=enemies.filter(x=>x!==e);
  gold+=e.gold;kills++;
  sfx('kill');
  player.xp+=e.xp;
  if(player.xp>=player.xpMax){
    player.lv++;player.xp-=player.xpMax;player.xpMax=Math.floor(player.xpMax*1.4);
    player.atk+=10;player.maxHp+=50;player.hp=Math.min(player.maxHp,player.hp+50);
    sfx('levelup');
    spawnDmgFloat(player.x,player.y,'LEVEL UP! ⬆️','#fbbf24');
  }
  for(let i=0;i<8;i++)particles.push({x:e.x,y:e.y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,life:1,col:e.color,r:3});
  if(enemies.length===0){
    if(wave>=MAX_WAVE){showVictory();return;}
    setTimeout(()=>{wave++;showWaveShop();},1000);
  }
  document.getElementById('enemies-left').textContent=enemies.length;
}

function nearestEnemy(){
  let best=null,bd=Infinity;
  enemies.forEach(e=>{const d=Math.hypot(e.x-player.x,e.y-player.y);if(d<bd){bd=d;best=e;}});
  return best;
}

function spawnDmgFloat(x,y,txt,col){
  const el=document.createElement('div');el.className='float-dmg';
  el.style.left=x+'px';el.style.top=y+'px';el.style.color=col||'white';
  el.textContent=txt;
  document.getElementById('canvas-wrap').appendChild(el);
  setTimeout(()=>el.remove(),800);
}

function spawnAoeEffect(x,y,r,col){
  particles.push({type:'aoe',x,y,r:0,maxR:r,life:1,col});
}

function updateAbilityUI(){
  abilities.forEach((a,i)=>{
    const btn=document.getElementById('ab-'+i);
    const cd=document.getElementById('ab-cd-'+i);
    if(!btn||!cd)return;
    if(a.cd>0){btn.classList.add('cooldown');cd.textContent=a.cd.toFixed(1)+'s';}
    else{btn.classList.remove('cooldown');cd.textContent=a.mpCost?a.mpCost+'mp':'Ready';}
  });
  document.getElementById('gold-shop').textContent=gold+'G';
}

let lastT=0;
function gameLoop(t){
  const dt=Math.min((t-lastT)/1000,0.05);lastT=t;
  if(!wavePaused){update(dt);}
  render();
  requestAnimationFrame(gameLoop);
}

function update(dt){
  frame++;
  // Move player — keyboard (arrow/WASD) or joystick
  let mx=joyX,my=joyY;
  if(keys['ArrowLeft']||keys['KeyA']) mx=-1;
  if(keys['ArrowRight']||keys['KeyD']) mx=1;
  if(keys['ArrowUp']||keys['KeyW']) my=-1;
  if(keys['ArrowDown']||keys['KeyS']) my=1;
  if(mx||my){
    const len=Math.sqrt(mx*mx+my*my);
    if(len>1){mx/=len;my/=len;}
    player.x=Math.max(20,Math.min(W-20,player.x+mx*player.spd*2.5));
    player.y=Math.max(20,Math.min(H-20,player.y+my*player.spd*2.5));
  }
  // Auto-attack
  if(frame%20===0){
    const near=nearestEnemy();
    if(near&&Math.hypot(near.x-player.x,near.y-player.y)<200){
      const ang=Math.atan2(near.y-player.y,near.x-player.x);
      projectiles.push({x:player.x,y:player.y,vx:Math.cos(ang)*7,vy:Math.sin(ang)*7,dmg:player.atk,owner:'player',col:player.color,r:5,target:near.id});
      sfx('attack');
    }
  }
  // MP regen
  player.mp=Math.min(player.maxMp,player.mp+dt*20);
  // Cooldowns
  abilities.forEach(a=>{if(a.cd>0)a.cd=Math.max(0,a.cd-dt);});
  // Invulnerability
  if(player.invulnerable>0)player.invulnerable-=dt;
  // Enemy move & attack
  enemies.forEach(e=>{
    const dx=player.x-e.x,dy=player.y-e.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>e.size+20){
      e.x+=dx/dist*e.spd*2;
      e.y+=dy/dist*e.spd*2;
    } else if(player.invulnerable<=0){
      // Attack
      e.cooldown=(e.cooldown||0)+dt;
      if(e.cooldown>1){
        e.cooldown=0;
        player.hp-=e.atk;
        player.invulnerable=0.3;
        sfx('hit');
        if(player.hp<=0)gameOver();
      }
    }
  });
  // Projectiles
  projectiles=projectiles.filter(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<-50||p.x>W+50||p.y<-50||p.y>H+50)return false;
    if(p.owner==='player'){
      for(let e of enemies){
        if(Math.hypot(e.x-p.x,e.y-p.y)<e.size){
          dealDamage(e,p.dmg);return false;
        }
      }
    }
    return true;
  });
  // Particles
  particles=particles.filter(p=>{
    if(p.type==='aoe'){p.r+=p.maxR*0.08;p.life-=0.05;return p.life>0;}
    p.x+=p.vx;p.y+=p.vy;p.life-=0.04;p.r*=0.95;return p.life>0;
  });
  updateAbilityUI();
  updateHUD();
}

function updateHUD(){
  document.getElementById('hp-bar').style.width=(player.hp/player.maxHp*100)+'%';
  document.getElementById('mp-bar').style.width=(player.mp/player.maxMp*100)+'%';
  document.getElementById('hud-lv').textContent=player.lv;
  document.getElementById('gold-display').textContent=gold;
}

function render(){
  ctx.clearRect(0,0,W,H);
  // Deep space background with radial arena glow
  const bgGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.7);
  bgGrad.addColorStop(0, '#0d0525');
  bgGrad.addColorStop(0.5, '#080318');
  bgGrad.addColorStop(1, '#030110');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  // Hex grid overlay (subtle)
  ctx.strokeStyle = 'rgba(124,58,237,0.07)';
  ctx.lineWidth = 1;
  const hexSize = 30;
  for(let row = -1; row < H/hexSize + 2; row++) {
    for(let col = -1; col < W/(hexSize*1.732) + 2; col++) {
      const hx = col * hexSize * 1.732 + (row % 2 === 0 ? 0 : hexSize * 0.866);
      const hy = row * hexSize * 1.5;
      ctx.beginPath();
      for(let i = 0; i < 6; i++) {
        const angle = (Math.PI / 3) * i - Math.PI/6;
        const px = hx + hexSize * 0.9 * Math.cos(angle);
        const py = hy + hexSize * 0.9 * Math.sin(angle);
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();
    }
  }
  // Arena edge vignette
  const vignette = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.35, W/2, H/2, Math.max(W,H)*0.7);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);
  // Particles
  particles.forEach(p=>{
    if(p.type==='aoe'){
      ctx.strokeStyle=p.col;ctx.lineWidth=2;ctx.globalAlpha=p.life;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=1;
    } else {
      ctx.fillStyle=p.col;ctx.globalAlpha=p.life;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
    }
  });
  // Enemies
  enemies.forEach(e=>{
    const s = e.size;
    // Drop shadow
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(e.x, e.y + s*0.8, s*0.7, s*0.2, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.shadowColor = e.color;
    ctx.shadowBlur = 12;

    if(e.icon === '👺') {
      // Minion — red diamond
      const eGrad = ctx.createRadialGradient(e.x - s*0.2, e.y - s*0.2, 1, e.x, e.y, s);
      eGrad.addColorStop(0, lightenColor(e.color, 60));
      eGrad.addColorStop(1, e.color);
      ctx.beginPath();
      ctx.moveTo(e.x, e.y - s);
      ctx.lineTo(e.x + s*0.7, e.y);
      ctx.lineTo(e.x, e.y + s);
      ctx.lineTo(e.x - s*0.7, e.y);
      ctx.closePath();
      ctx.fillStyle = eGrad;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 1;
      ctx.stroke();
    } else if(e.icon === '🗿') {
      // Brute — heavy rounded rectangle
      const eGrad = ctx.createRadialGradient(e.x, e.y - s*0.3, 2, e.x, e.y, s*1.1);
      eGrad.addColorStop(0, lightenColor(e.color, 50));
      eGrad.addColorStop(1, e.color);
      ctx.beginPath();
      const bw = s*1.2, bh = s*1.5, br = s*0.3;
      const bx = e.x - bw/2, by = e.y - bh/2;
      ctx.moveTo(bx + br, by);
      ctx.lineTo(bx + bw - br, by);
      ctx.quadraticCurveTo(bx + bw, by, bx + bw, by + br);
      ctx.lineTo(bx + bw, by + bh - br);
      ctx.quadraticCurveTo(bx + bw, by + bh, bx + bw - br, by + bh);
      ctx.lineTo(bx + br, by + bh);
      ctx.quadraticCurveTo(bx, by + bh, bx, by + bh - br);
      ctx.lineTo(bx, by + br);
      ctx.quadraticCurveTo(bx, by, bx + br, by);
      ctx.closePath();
      ctx.fillStyle = eGrad;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    } else if(e.icon === '🧙') {
      // Mage — hexagon with orbiting dot
      const eGrad = ctx.createRadialGradient(e.x, e.y, 1, e.x, e.y, s);
      eGrad.addColorStop(0, lightenColor(e.color, 70));
      eGrad.addColorStop(1, e.color);
      ctx.beginPath();
      for(let i = 0; i < 6; i++) {
        const ang = (Math.PI/3)*i - Math.PI/6;
        const hpx = e.x + s * Math.cos(ang);
        const hpy = e.y + s * Math.sin(ang);
        i === 0 ? ctx.moveTo(hpx, hpy) : ctx.lineTo(hpx, hpy);
      }
      ctx.closePath();
      ctx.fillStyle = eGrad;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 1;
      ctx.stroke();
      // Orbiting dot
      const orbitAngle = frame * 0.07;
      const orbitR = s * 1.3;
      const odx = e.x + orbitR * Math.cos(orbitAngle);
      const ody = e.y + orbitR * Math.sin(orbitAngle);
      ctx.beginPath();
      ctx.arc(odx, ody, s*0.18, 0, Math.PI*2);
      ctx.fillStyle = lightenColor(e.color, 80);
      ctx.fill();
    } else if(e.icon === '👹') {
      // Boss — 8-pointed star
      const eGrad = ctx.createRadialGradient(e.x, e.y, 2, e.x, e.y, s*1.2);
      eGrad.addColorStop(0, lightenColor(e.color, 80));
      eGrad.addColorStop(0.5, e.color);
      eGrad.addColorStop(1, '#7c2d00');
      ctx.shadowBlur = 24;
      ctx.beginPath();
      const outerR = s, innerR = s * 0.45, points = 8;
      for(let i = 0; i < points * 2; i++) {
        const ang = (Math.PI / points) * i - Math.PI/2;
        const r = i % 2 === 0 ? outerR : innerR;
        const spx = e.x + r * Math.cos(ang);
        const spy = e.y + r * Math.sin(ang);
        i === 0 ? ctx.moveTo(spx, spy) : ctx.lineTo(spx, spy);
      }
      ctx.closePath();
      ctx.fillStyle = eGrad;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,200,0,0.4)';
      ctx.lineWidth = 2;
      ctx.stroke();
    } else {
      // Fallback — circle
      const eGrad = ctx.createRadialGradient(e.x - s*0.2, e.y - s*0.2, 1, e.x, e.y, s);
      eGrad.addColorStop(0, lightenColor(e.color, 60));
      eGrad.addColorStop(1, e.color);
      ctx.beginPath();
      ctx.arc(e.x, e.y, s, 0, Math.PI*2);
      ctx.fillStyle = eGrad;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    ctx.shadowBlur = 0;
    // HP bar
    ctx.fillStyle='#1f2937';ctx.fillRect(e.x-20,e.y-e.size-10,40,4);
    ctx.fillStyle=e.color;ctx.fillRect(e.x-20,e.y-e.size-10,40*(e.hp/e.maxHp),4);
  });
  // Projectiles
  projectiles.forEach(p=>{
    const speed = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
    const angle = Math.atan2(p.vy, p.vx);
    const len = Math.min(speed * 2.5, 20);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(angle);
    // Trail
    const trailGrad = ctx.createLinearGradient(-len, 0, p.r, 0);
    trailGrad.addColorStop(0, 'rgba(0,0,0,0)');
    trailGrad.addColorStop(1, p.col);
    ctx.fillStyle = trailGrad;
    ctx.beginPath();
    ctx.ellipse(0, 0, len, p.r * 0.5, 0, 0, Math.PI*2);
    ctx.fill();
    // Core dot
    ctx.shadowColor = p.col;
    ctx.shadowBlur = 10;
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(0, 0, p.r * 0.7, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  });
  // Player
  if(player.invulnerable>0&&frame%4<2)return;
  const px = player.x, py = player.y;
  // Outer aura ring (pulsing)
  const auraAlpha = 0.15 + 0.1 * Math.sin(frame * 0.1);
  ctx.beginPath();
  ctx.arc(px, py, 26, 0, Math.PI*2);
  ctx.strokeStyle = player.color;
  ctx.lineWidth = 2;
  ctx.globalAlpha = auraAlpha;
  ctx.stroke();
  ctx.globalAlpha = 1;
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(px, py + 22, 16, 5, 0, 0, Math.PI*2);
  ctx.fill();
  // Body glow
  ctx.shadowColor = player.color;
  ctx.shadowBlur = 20;
  // Main body circle
  const pGrad = ctx.createRadialGradient(px - 5, py - 5, 2, px, py, 18);
  pGrad.addColorStop(0, lightenColor(player.color, 80));
  pGrad.addColorStop(0.5, player.color);
  pGrad.addColorStop(1, '#1a0030');
  ctx.beginPath();
  ctx.arc(px, py, 18, 0, Math.PI*2);
  ctx.fillStyle = pGrad;
  ctx.fill();
  // Armor ring
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // Class icon (small, centered)
  ctx.shadowBlur = 0;
  ctx.font = '14px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(player.icon, px, py);
}

function gameOver(){
  stopAutosave();
  deleteSave();
  const el=document.getElementById('go-title');
  el.style.color='';
  el.textContent='DEFEATED';
  document.getElementById('go-score').textContent=`Wave ${wave} | ${kills} kills | ${gold} gold | Level ${player.lv}`;
  document.getElementById('gameover').classList.add('show');
}

function showVictory(){
  stopAutosave();
  deleteSave();
  const el=document.getElementById('go-title');
  el.style.color='#d97706';
  el.textContent='VICTORY!';
  document.getElementById('go-score').textContent=`All ${MAX_WAVE} waves cleared! | ${kills} kills | ${gold} gold | Level ${player.lv}`;
  document.getElementById('gameover').classList.add('show');
}

function restartGame(){
  document.getElementById('gameover').classList.remove('show');
  enemies=[];projectiles=[];particles=[];wave=1;gold=0;kills=0;frame=0;
  abilities=heroData.abilities.map(a=>({...a,cd:0}));
  initPlayer();spawnWave();
  startAutosave();
}

const SAVE_KEY='veilLegendsSave';
let autosaveInterval=null;

function saveGame(){
  if(!player||!heroData)return;
  const data={
    saveVersion:1,
    heroId:heroData.id,
    wave:wave,
    gold:gold,
    kills:kills,
    player:{
      hp:player.hp,maxHp:player.maxHp,
      mp:player.mp,maxMp:player.maxMp,
      atk:player.atk,spd:player.spd,
      lv:player.lv,xp:player.xp,xpMax:player.xpMax
    }
  };
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(data));}catch(e){}
}

function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return null;
    const data=JSON.parse(raw);
    if(!data||data.saveVersion!==1)return null;
    return data;
  }catch(e){return null;}
}

function deleteSave(){
  try{localStorage.removeItem(SAVE_KEY);}catch(e){}
}

function startAutosave(){
  stopAutosave();
  autosaveInterval=setInterval(saveGame,30000);
}

function stopAutosave(){
  if(autosaveInterval){clearInterval(autosaveInterval);autosaveInterval=null;}
}

function continueSave(){
  const data=loadGame();
  if(!data)return;
  heroData=HEROES.find(h=>h.id===data.heroId)||HEROES[0];
  document.getElementById('splash').style.display='none';
  document.getElementById('game-ui').classList.add('show');
  initCanvas();
  initPlayer();
  // Restore saved player stats
  player.hp=data.player.hp;player.maxHp=data.player.maxHp;
  player.mp=data.player.mp;player.maxMp=data.player.maxMp;
  player.atk=data.player.atk;player.spd=data.player.spd;
  player.lv=data.player.lv;player.xp=data.player.xp;player.xpMax=data.player.xpMax;
  wave=data.wave;gold=data.gold;kills=data.kills;
  abilities=heroData.abilities.map(a=>({...a,cd:0}));
  spawnWave();
  setupJoystick();
  updateAbilityUI();
  startAutosave();
  requestAnimationFrame(gameLoop);
}

function backToMenu(){
  saveGame();
  stopAutosave();
  enemies=[];projectiles=[];particles=[];
  document.getElementById('game-ui').classList.remove('show');
  document.getElementById('gameover').classList.remove('show');
  document.getElementById('shop-modal').classList.remove('show');
  document.getElementById('splash').style.display='flex';
  checkContinueButton();
}

function checkContinueButton(){
  const data=loadGame();
  const btn=document.getElementById('continue-btn');
  if(data&&btn){
    btn.style.display='';
    btn.textContent='CONTINUE (Wave '+data.wave+', Lv'+data.player.lv+')';
  } else if(btn){
    btn.style.display='none';
  }
}

initHeroSelect();
checkContinueButton();
</script>
